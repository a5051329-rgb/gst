<dialog id="noteDialog"><h2>修改意見</h2><p id="noteLocation" class="small"></p><blockquote id="noteQuote" class="quote"></blockquote><label for="noteText">備註</label><textarea id="noteText" placeholder="例如：這句台詞改得更自然，減少曖昧感。"></textarea><div class="note-actions"><button id="noteSave">儲存備註</button><button id="noteDelete">刪除</button><button id="noteCancel">取消</button></div></dialog><script id="noteData" type="application/json">[]</script><script id="bookData" type="application/json">[{"n": 1, "title": "消失的第七節車廂", "body": "入秋以後，北山接連下了好幾場雨。\n\n這一夜尤其大。\n\n山間的樹木被風吹得東倒西歪，雨水沿著山壁淌下，兩道鐵軌在夜色中泛著幽幽的冷光。\n\n鐵路守衛老周將一張舊報紙蓋在膝上，往火爐裡添了兩塊煤。\n\n爐子裡的火不旺，屋內還是冷得厲害。他在這座警衛亭守了快二十年，每逢這種天氣，兩條腿便酸得不像自己的。\n\n牆上的掛鐘走得有些慢。\n\n老周摸出懷錶瞧了一眼，將擱在桌上的信號燈提了起來。\n\n軍列快到了。\n\n這條鐵路白日還算熱鬧，到了深夜，除了偶爾經過的軍用列車，幾乎見不到半個人影。\n\n再往前便是北山隧道。\n\n隧道修建之初，曾因山體坍塌死過不少工人。附近村民嫌這地方陰氣重，入夜後寧可繞上十幾里山路，也不願從此處經過。\n\n老周卻不信這些。\n\n活人尚且要為一口飯吃奔波，死人若是有本事，倒不如替他守上幾夜，讓他好好睡個覺。\n\n遠處傳來一聲汽笛。\n\n他推開門，一股夾著雨水的冷風迎面灌了進來。\n\n山谷另一頭，一道昏黃的光逐漸逼近。\n\n蒸汽火車拖著滾滾白煙，沿著山腰駛來。車輪碾過鐵軌接縫，沉重的聲響在山谷間迴盪，連腳下的碎石都跟著微微顫動。\n\n老周舉起信號燈，退到鐵軌旁。\n\n車頭從他面前呼嘯而過，熱氣混著煤煙撲了他一臉。\n\n緊接著是貨廂。\n\n一、二、三、四、五、六、七。\n\n七節貨廂，全數到齊。\n\n最後一節車廂尾端的平台上站著兩名押運士兵。其中一人認得老周，見他在雨中縮著脖子，還笑著朝他揮了揮手。\n\n老周也舉起燈晃了兩下。\n\n「這鬼天氣，還得勞煩你們跑一趟！」\n\n士兵似乎回了句什麼，可惜火車的聲音太大，老周沒有聽清。\n\n轉眼間，整列火車便沒入了隧道。\n\n老周望著最後一點紅色尾燈消失在黑暗中，正打算回屋，隧道深處忽然傳來一聲巨響。\n\n轟！\n\n那動靜大得不像尋常的火車聲。\n\n警衛亭的玻璃窗劇烈震動，屋簷上積蓄的雨水一下子全落了下來。\n\n老周嚇了一跳，趕忙回頭。\n\n隧道裡的車輪聲變了。\n\n原本規律的聲響突然亂成一團，像是有什麼極其沉重的東西被火車拖在後頭，正不斷撞擊兩側的山壁。\n\n一陣刺耳的摩擦聲隨之響起。\n\n老周聽得牙根發酸。\n\n他在鐵路上幹了二十多年，從來沒聽過這樣的聲音。\n\n「停車！」\n\n隧道裡有人大喊。\n\n「快停車啊！」\n\n那聲音淒厲至極，甚至蓋過了火車的轟鳴。\n\n老周心知不妙，提著信號燈便往隧道口跑去。\n\n「怎麼回事？有人受傷了？」\n\n沒有人回答。\n\n火車的聲音漸漸遠去。\n\n奇怪的是，那陣摩擦聲卻沒有消失。\n\n它依舊在隧道裡。\n\n一下，又一下。\n\n像有人拖著一件沉重的東西，正朝著隧道口緩慢移動。\n\n老周站住了。\n\n雨水順著他的帽簷往下滴，他伸長脖子，想看清裡頭的情形。\n\n隧道深處，忽然亮起了一點紅光。\n\n那光芒很暗，離地約莫三尺，搖搖晃晃地向他靠近。\n\n「誰在那兒？」\n\n紅光停住了。\n\n老周將信號燈舉高。\n\n「是不是車上的弟兄？出了什麼事？」\n\n黑暗中傳來一個聲音。\n\n「老周。」\n\n老周渾身一僵。\n\n那聲音他太熟悉了。\n\n熟悉到他甚至不必看清對方的模樣，就知道那是誰。\n\n可也正因如此，他才覺得一股寒意從腳底直竄上來。\n\n那是他自己的聲音。\n\n他站在雨裡，半天沒能說出話來。\n\n隧道中的東西似乎也不著急。\n\n片刻之後，它又開口了。\n\n「老周，這鬼天氣，還得勞煩你們跑一趟！」\n\n老周的手猛地抖了一下。\n\n那是他方才對火車上的士兵說過的話。\n\n連語氣都一模一樣。\n\n紅光重新移動起來。\n\n這次更近了些。\n\n老周終於看見，那似乎是一盞鐵製信號燈，燈罩上有一道斜斜的裂痕。\n\n他下意識低頭。\n\n自己手裡的燈，也有一道裂痕。\n\n那是去年冬天不慎摔在石階上留下的。\n\n老周開始往後退。\n\n「哪個王八蛋裝神弄鬼……」\n\n他罵了一句，聲音卻虛得厲害。\n\n隧道裡立刻傳來同樣的罵聲。\n\n「哪個王八蛋裝神弄鬼……」\n\n這一次，那聲音近得彷彿就在隧道口。\n\n老周再也顧不上其他，轉身便跑。\n\n身後突然響起腳步聲。\n\n啪嗒、啪嗒、啪嗒。\n\n有什麼東西跟著他跑了起來。\n\n他跑得越快，身後的腳步聲便越快。\n\n老周一把撞開警衛亭的門，連滾帶爬地衝了進去，反手將門關上，死死扣住門閂。\n\n外頭的腳步聲停了。\n\n他背靠著門板，大口喘氣。\n\n屋裡的火爐還燒著，桌上的熱茶也還冒著白煙。\n\n一切都與他離開時沒有兩樣。\n\n老周顫抖著手，拿起牆上的電話。\n\n「喂！喂！北山站！」\n\n聽筒裡只有一陣沙沙聲。\n\n「北山站！聽得見嗎？」\n\n他用力搖動電話把手。\n\n忽然，聽筒另一端傳來了呼吸聲。\n\n很輕，很慢。\n\n老周急忙喊道：\n\n「隧道出事了！快派人過來！」\n\n對面沉默了一會兒。\n\n「老周。」\n\n他猛地將聽筒扔了出去。\n\n電話線扯著聽筒，在牆壁上撞了兩下。\n\n與此同時，門外響起了敲門聲。\n\n篤、篤、篤。\n\n「開門。」\n\n老周雙手摀住嘴，拼命不讓自己發出聲音。\n\n「是我啊。」\n\n門外那東西依然用著他的聲音。\n\n「外頭冷得很，讓我進去烤烤火。」\n\n敲門聲持續了片刻，忽然停了。\n\n老周死死盯著門閂，額頭上全是冷汗。\n\n就在他以為那東西已經離開時，右側窗戶傳來了一聲輕響。\n\n有人在敲玻璃。\n\n他僵硬地轉過頭。\n\n窗戶外，貼著一張人臉。\n\n隔著沾滿雨水的玻璃，他看見了那張臉上的皺紋、花白的眉毛，以及左眼下方那顆伴隨了自己大半輩子的黑痣。\n\n是他自己。\n\n窗外的老周戴著和他一模一樣的帽子，穿著一模一樣的衣服，嘴角還掛著笑容。\n\n那東西抬起手，指了指窗戶。\n\n「開門啊。」\n\n老周嚇得一屁股跌坐在地。\n\n窗外那張臉卻沒有離開。\n\n它維持著笑容，緩緩歪過腦袋。\n\n越歪越低。\n\n直到整張臉幾乎橫了過來。\n\n老周這才發現一件更可怕的事情。\n\n警衛亭的窗戶離地足有五尺，外頭又是一道斜坡。\n\n那東西的臉能出現在這個位置，身子理應站在窗外的石階上。\n\n可窗戶下方，分明什麼也沒有。\n\n只有一顆人頭，懸在雨裡。\n\n「老周。」\n\n那東西咧開嘴。\n\n「你不出來，我可要進去了。」\n\n屋內的火爐猛然熄滅。\n\n老周眼前一黑。\n\n他聽見窗框發出嘎吱嘎吱的聲音，像是有什麼東西正在從外頭往裡擠。\n\n他再也忍不住，扯開嗓子慘叫起來。\n\n那一夜，北山上的雨始終沒有停。\n\n直到天亮，都沒有人知道這間小小的警衛亭裡究竟發生了什麼。\n\n天亮之後，北山車站亂成了一鍋粥。\n\n原本應當繼續北行的軍列停在月台上，站務人員聚在候車室外，七嘴八舌地議論著昨夜的怪事。\n\n隧道東口的兩名守衛雙雙身亡，西口的老周則被人發現昏倒在警衛亭的桌子底下。\n\n救他出來時，他十根手指死死抓著桌腳，幾個人費了好大的力氣才將他拉出來。\n\n醒來以後，他見誰都問同一句話。\n\n「你瞧瞧，我這張臉還是不是我的？」\n\n除此之外，什麼也問不出來。\n\n站長已經急得焦頭爛額。\n\n「又不是一箱貨！那麼大一節車廂，怎麼可能說沒就沒了？」\n\n「站長，沿途都找過了，山坡底下也派人去瞧了，確實什麼都沒有啊！」\n\n「那就再找！」\n\n「可山上那兩個當兵的都死了，弟兄們哪還敢往裡走？」\n\n站長氣得正要開罵，車站外忽然傳來一陣汽車聲。\n\n兩輛黑色汽車停在站前，後方還跟著幾輛軍車。\n\n車門相繼打開，數十名全副武裝的士兵迅速下車。一名年輕軍官手戴白色手套，從前頭的汽車走了下來，向幾名帶隊的士兵交代了幾句。\n\n不過片刻，車站各處出入口便有了軍方的人把守。\n\n緊接著，後座車門被人打開。\n\n一雙擦得發亮的黑色軍靴踏上了石階。\n\n來人身材高挑，深色軍服外披著一件長及膝蓋的軍大衣，棕黑色的短髮整齊地向後梳起，濃眉俊目，鼻梁高挺，左耳還戴著一枚銀色耳飾。\n\n他看上去不過三十出頭，眉宇間卻有股久居上位的威嚴。\n\n方才還在月台上高聲爭執的幾名軍官，見到他，立即收了聲。\n\n「上校！」\n\n周圍士兵齊刷刷地立正敬禮。\n\n男人微微頷首，摘下手套，目光徑直投向停在月台上的軍列。\n\n站長一見來人，連煙也顧不上抽了，慌忙將煙頭扔到地上踩熄，整了整帽子，快步迎了上去。\n\n人群中，一名新來的年輕工人悄悄碰了碰身旁的老工人。\n\n「這是哪位長官？怎麼這麼大的陣仗？」\n\n老工人連忙將他往後拉了拉。\n\n「小聲點！那是北城警備司令部的魏上校。」\n\n「魏上校？」\n\n「魏戌俞！你連他都不認得？」\n\n老工人壓低了聲音。\n\n「前年南山那夥山匪鬧得多厲害，劫軍糧、搶火車，連咱們站上的兩個弟兄都給扣去了。後來魏上校親自帶兵進山，沒幾日便把人全救了回來。自打那以後，北邊這幾條鐵路就沒再出過什麼大亂子。」\n\n年輕工人恍然大悟。\n\n「原來就是他！我還以為是個上了年紀的長官。」\n\n「你可別瞧人家年輕。去年有個軍官私吞撫卹金，仗著自己在軍部有靠山，誰也不敢動他。魏上校知道後，連上頭派來說情的人都給轟了出去。」\n\n「那後來呢？」\n\n「後來？人都給送上軍事法庭了，你說呢？」\n\n老工人朝魏戌俞身旁的年輕軍官抬了抬下巴。\n\n「瞧見旁邊那位沒有？梁副官，魏上校的親信。這兩人平日形影不離，都是不好糊弄的主兒。」\n\n年輕工人還想再問，卻被老工人一巴掌拍在胳膊上。\n\n「行了，趕緊幹活，少在這兒看熱鬧。」\n\n另一頭，站長已經迎到了魏戌俞面前。\n\n「魏上校，您可算來了！您是不知道，昨夜這事把全站的人都嚇壞了，我們在這兒守了一宿，實在是——」\n\n「少廢話，帶路。」\n\n站長當即閉上了嘴。\n\n「是、是！您這邊請！」\n\n梁副官將手中的資料交給身後的士兵，跟了上去。\n\n魏戌俞在北城任職多年，出了名的不喜歡聽人推諉責任。尤其是遇上人命關天的事情，若有人在他面前繞圈子，說上半天還不見重點，他是半點情面也不會留的。\n\n偏偏他又不是那種只會坐在辦公室裡發號施令的長官。\n\n越是棘手的事情，他越要親自去看。\n\n有時連跟隨他多年的梁副官，都得費些功夫才能跟上他的腳步。\n\n軍列的前五節車廂看不出什麼異樣。\n\n車輪、底盤以及車身都十分完整，除了昨夜大雨留下的泥水，與平日往來於北山的貨運列車沒什麼兩樣。\n\n然而走到第六節車廂時，梁副官忽然停下了腳步。\n\n「上校，這地方有股怪味。」\n\n魏戌俞也聞見了。\n\n那是一種混雜著腐木與潮濕泥土的氣味，當中還帶著一絲若有似無的香氣。\n\n站長用袖子捂住口鼻。\n\n「就是這股味道！昨夜火車一停下來便有了，起初我們還以為是什麼東西爛在車底，找了半天也沒找著。」\n\n魏戌俞沿著車身走了幾步。\n\n「不只是腐爛的味道。」\n\n他微微側過頭，又聞了聞。\n\n「有香灰，還有陳年的桐油。這兩樣東西混在一塊兒，倒像是老棺木上的氣味。」\n\n站長一聽見棺木二字，臉色頓時變了。\n\n「棺、棺木？」\n\n魏戌俞沒理會他，走下月台，繞到車廂後方。\n\n梁副官已經蹲在鐵軌旁，仔細查看原本與第七節車廂相連的位置。\n\n「上校，您來看看。」\n\n他用手托起車尾的連接鐵件。\n\n「這東西沒斷，連半點變形也沒有。若是昨夜行車途中出了事故，第七節車廂被硬生生扯掉，這裡不可能這麼完整。」\n\n魏戌俞俯身瞧了一眼。\n\n「你的意思是，有人將車廂卸下來了？」\n\n「只看這裡的話，確實像是正常分離的。」\n\n梁副官站起身，環顧四周。\n\n「不過，北山隧道沒有岔路。一節車廂就算被卸下來，也總得有個地方去。」\n\n「所以問題不在它怎麼脫開，而在它去了哪兒。」\n\n魏戌俞抬手拍了拍車尾的鐵板。\n\n一層灰白色的粉末隨著他的動作落了下來。\n\n「副官，把燈拿來。」\n\n梁副官接過士兵遞來的提燈，將光線移向車尾。\n\n那些粉末覆蓋了大半片鐵皮，遠看像是一層乾涸的泥漿。魏戌俞用手指抹開其中一小塊，露出底下幾道深深的刮痕。\n\n梁副官順著痕跡將燈往上移。\n\n五道抓痕從車尾上方一直延伸到下方，彼此相隔不遠。其中一道甚至將鐵皮向外掀起，露出了底下的木板。\n\n「像是有東西攀在車尾，最後又被拖了下去。」梁副官說。\n\n站長伸長脖子看了一眼。\n\n「莫非是山裡的熊瞎子？」\n\n魏戌俞伸出右手，將五指張開，與鐵皮上的痕跡比對了一下。\n\n「你見過手這麼小的熊？」\n\n站長愣了愣。\n\n梁副官也伸手比了一下。\n\n那五道抓痕之間的距離，竟與尋常成年男子張開的手掌相差無幾。\n\n他皺起眉頭。\n\n「若真是人留下的，這力氣未免也太大了。」\n\n「還不止如此。」\n\n魏戌俞指向抓痕的末端。\n\n「瞧這裡。鐵皮是往下翻的，說明那東西當時一直抓著車尾，直到最後一刻都沒有鬆手。」\n\n梁副官順著他的指示看去。\n\n「它不想跟第七節車廂一起離開？」\n\n「有這個可能。」\n\n魏戌俞收回手。\n\n「也可能是有人想從第七節爬過來，沒能成功。」\n\n他繞到車廂側面，望著那扇緊閉的貨廂門。\n\n「打開。」\n\n站長卻遲遲沒有動作。\n\n「上校，這節車廂……恐怕不大乾淨。方才有兩個工人進去看過，出來後連話都說不利索了。」\n\n魏戌俞轉頭看他。\n\n「我帶這麼多人來，不是陪你站在外頭拜神的。」\n\n站長嚇得連忙取下鑰匙。\n\n「是！我這就開！」\n\n梁副官伸手接過。\n\n「我來吧。你們往後站。」\n\n鐵鎖落下，梁副官握住門上的把手，用力一拉。\n\n沉重的木門沿著滑軌緩緩移開。\n\n一股陰冷的氣息迎面湧了出來。\n\n站長打了個寒顫，連退數步。\n\n車廂內漆黑一片。\n\n雖然天色陰沉，外頭畢竟已是白日，這麼大一道車門敞開，理應有光線照進去才對。\n\n可眼前的黑暗卻濃得異常，連離門口不遠的地方都看不清楚。\n\n梁副官提起風燈，探身往裡照去。\n\n火光照亮了地面。\n\n他怔了一下。\n\n「上校，您看。」\n\n魏戌俞踩著鐵梯登上車廂，軍靴落地時，腳下竟傳來鬆軟的觸感。\n\n整節車廂的木質地板上，赫然鋪著一層厚厚的黃土。\n\n梁副官跟著登上車廂，蹲下身，用手指撥開表面的泥土。\n\n泥土中夾雜著細碎的石粒、腐朽的枯根，以及一些早已辨認不出形狀的碎片。\n\n「上校，這不像是山路上的土。」\n\n他從中挑出一小塊灰白色的硬物。\n\n「這裡頭有燒過的石灰，還有碎炭。」\n\n魏戌俞接過那塊硬物，在手中捻了捻。\n\n「像是封墓土。」\n\n梁副官抬起頭。\n\n「您是說，這些土是從墓裡來的？」\n\n「古人修築大型陵墓時，會在封填的土層裡混入石灰、木炭一類的東西，用來隔潮。有些地方的做法更講究，連土都得經過篩選。」\n\n魏戌俞將手中的碎塊丟回地面。\n\n「北山下了這麼多日的雨，外頭的泥早就泡爛了。這裡的土卻只是表面有些潮氣，底下還是乾的，不像是昨夜從山上沖進來的。」\n\n梁副官站起身，看向車廂深處。\n\n「一節軍用貨車，怎麼會憑空多出這麼多墓土？」\n\n「進去看看就知道了。」\n\n第六節車廂中堆放著大大小小的木箱，中間留有一道僅供一人通過的走道。\n\n兩人沿著走道往裡走。\n\n越靠近車尾，空氣中那股腐木的氣味便越濃。\n\n梁副官經過一只木箱時，忽然伸手攔住了魏戌俞。\n\n「上校，您瞧這個。」\n\n那只木箱的下半部分已經變成了深褐色，上面爬滿細小的白色菌絲。箱角的木板微微翹起，梁副官用指尖輕輕一碰，竟掉下來一大片腐朽的木屑。\n\n他又查看了旁邊兩只木箱。\n\n情況一模一樣。\n\n「奇怪。這些箱子的上半部還很新，底下卻像是在潮濕的地方放了好幾年。」\n\n魏戌俞拿起一塊掉落的木片。\n\n木片的一端仍可看出清晰的木紋，另一端則已腐爛得如同泥土。\n\n「不是單純受潮。」\n\n他將木片翻了個面。\n\n「你看，連木頭裡面都爛透了。這一夜之間發生的變化，恐怕不只是多了些泥土那麼簡單。」\n\n梁副官拿著燈沿木箱下方照過去。\n\n忽然，他發現了什麼，伸手從角落裡取出一只銅鈴。\n\n銅鈴只有兩指大小，外表布滿綠色銅鏽，鈴身鑄有一圈極細的紋飾。\n\n他輕輕晃了晃。\n\n沒有聲音。\n\n「裡頭的鈴舌沒了。」\n\n魏戌俞接過銅鈴，看了一眼。\n\n「不，是根本沒裝過鈴舌。」\n\n他將銅鈴倒轉過來，指著內側。\n\n「裡面沒有懸掛鈴舌的地方。這東西從鑄造出來，就沒打算讓它響。」\n\n梁副官有些不解。\n\n「不響的鈴，造來做什麼？」\n\n「給死人用的。」\n\n魏戌俞將銅鈴放在掌心。\n\n「有些古墓裡的陪葬器物，只求形似，不求實用。死人用不著真正的刀劍，也用不著會響的鈴。」\n\n他頓了頓，又補了一句。\n\n「不過，也有些地方的風俗認為，活人聽得見的聲音，死人未必聽得見。給死人造的鈴，自然也不必讓活人聽見。」\n\n梁副官看了看那只銅鈴。\n\n「這說法倒是有意思。」\n\n「我幼時在一本古籍上見過類似的記載。」\n\n魏戌俞將銅鈴遞還給他。\n\n「書上說，這類鈴若是無故作響，便不能再碰了。」\n\n「為何？」\n\n「據說，那是死人在應聲。」\n\n梁副官聞言，重新打量了銅鈴一番。\n\n「但願它只是件尋常陪葬品。」\n\n魏戌俞點頭。\n\n「先收起來吧。」\n\n梁副官從口袋中取出手帕，將銅鈴包好，交給門外的士兵保管。\n\n跟隨魏戌俞多年，他早已見識過這位長官異於常人的學識。\n\n除了軍事方面的事務，魏戌俞對古籍、歷史、星象乃至各地流傳的民間習俗，似乎都有一定程度的了解。有些連年過半百的古董商也未必認得的物件，到了他手裡，往往看上幾眼便能說出來歷。\n\n至於這些本事究竟從何而來，梁副官倒也不曾特意打聽。\n\n魏戌俞極少談及自己的私事，更不喜歡在人前提起家族往事。既然長官不願說，他便不問。\n\n兩人繼續往前。\n\n木箱之間還散落著不少奇怪的東西，幾枚銅錢、一截暗紅色的繩結，以及數塊碎裂的陶片。\n\n在靠近車壁的角落裡，魏戌俞發現了一尊巴掌大的陶製人像。\n\n人像身穿寬袖長袍，雙手交疊於胸前，下襬繪有暗紅色的曲線。最奇怪的是，它沒有頭，頸部平整，像是製作時便刻意留下的。\n\n魏戌俞蹲下身，將陶人拾了起來。\n\n梁副官湊近看了看。\n\n「也是陪葬品？」\n\n「嗯。你看這衣服，腰間沒有佩帶，雙腳併攏，手也不能分開。這不像是尋常供人賞玩的陶人。」\n\n魏戌俞將人像翻過來。\n\n底部刻著兩個小字。\n\n第一個字已經殘缺，第二個字卻還看得清楚。\n\n殉。\n\n梁副官低聲念了一遍。\n\n「殉葬？」\n\n「多半是。」\n\n魏戌俞仔細端詳著人像頸部。\n\n「不過，尋常陪葬陶俑大多有完整的面容。主人生前是什麼地位，死後要有多少侍從，這些都十分講究。像這種刻意不做頭部的，我倒是很少見。」\n\n梁副官接過陶人，注意到了它的雙手。\n\n「上校，您看它手上。」\n\n那陶人的十指並非自然交疊，而是向內彎曲，彷彿正死死抓著胸前的衣襟。\n\n魏戌俞重新將燈移近。\n\n陶人的衣襟上，竟刻著一道細長的裂口。\n\n裂口自胸前延伸至腹部，兩側各有幾道極淺的指痕。\n\n看起來不像衣服上的裝飾。\n\n倒像是有人正試圖將自己的胸膛扒開。\n\n梁副官皺了皺眉。\n\n「若是陪葬用的侍從，何必做成這副模樣？」\n\n魏戌俞將陶人拿得更近了些。\n\n「也許它原本就不是侍從。」\n\n「那是什麼？」\n\n「古人將陶俑放入墓中，有時是為了代替活人殉葬。但若這個『殉』字指的不是身分，而是它曾經遭受的事情……」\n\n魏戌俞停了下來。\n\n梁副官望著陶人那雙僵硬的手，似乎明白了他的意思。\n\n「有人將殉葬者臨死前的模樣，做成了陶俑？」\n\n「只是猜測。」\n\n魏戌俞將陶人放回地面。\n\n「先別動其他東西。這些古物不像是尋常貨物，散落的位置也有些蹊蹺。」\n\n梁副官環視四周。\n\n「都集中在靠近車尾的地方。」\n\n「不錯。前頭的貨物完好無損，到了這裡，卻是墓土、陪葬品，連木箱都爛了。」\n\n魏戌俞望向車廂最後方那扇緊閉的門。\n\n「就像這節車廂的後半截，曾經到過一個我們不知道的地方。」\n\n梁副官剛想說話，目光忽然落在地面上。\n\n「上校，這裡還有腳印。」\n\n黃土之中，一串赤裸的腳印自車尾延伸而來。\n\n腳印十分細長，五根腳趾清晰可辨。從大小來看，像是某個成年男子留下的。\n\n但走到一排木箱旁時，那串腳印突然拐了個彎，朝著右側車壁而去。\n\n到了牆邊，腳印並沒有停止。\n\n梁副官抬高風燈。\n\n木質車壁上赫然又出現了幾個腳印。\n\n第一個離地約有一尺，第二個更高，第三個已經接近車頂。\n\n魏戌俞接過風燈，往上照去。\n\n兩人同時看見了極為詭異的一幕。\n\n車廂頂部密密麻麻，全是赤腳印。\n\n有大有小，有深有淺，彼此交疊，有些甚至帶著已經乾涸的暗紅色血跡。\n\n彷彿昨夜曾有數不清的人，倒懸在車廂頂部來回行走。\n\n梁副官仰著頭，看了好一會兒。\n\n「這可不像是有人拿泥往上印的。」\n\n他指著其中幾個較為清晰的腳印。\n\n「您看，前腳掌的痕跡較深，後腳跟則比較淺。與人在地上行走留下的痕跡一樣。」\n\n魏戌俞沿著車頂慢慢移動風燈。\n\n「再看看方向。」\n\n梁副官順著燈光看去。\n\n片刻後，他的神情變了。\n\n「全都朝著車頭。」\n\n「對。」\n\n魏戌俞將風燈移向車尾。\n\n「這些腳印都是從同一個地方過來的。數量這麼多，地上卻只有一串，說明大部分東西根本沒碰過地面。」\n\n梁副官低頭看了看自己的腳下，又抬頭望向頭頂。\n\n「那昨夜待在第七節車廂裡的，究竟是什麼？」\n\n魏戌俞沒有立刻回答。\n\n他沿著腳印的方向往回走了幾步，發現靠近車尾的頂板上，有一處極為集中的泥痕。\n\n那裡的腳印幾乎疊成了一團。\n\n其中還夾雜著幾道細長的指痕。\n\n「副官，把燈往這兒照。」\n\n梁副官依言將風燈舉高。\n\n魏戌俞伸手摸了摸頭頂的木板。\n\n「這地方的泥比別處厚，抓痕也多。若昨夜真有東西從第七節過來，這裡應當就是它們聚集的地方。」\n\n「它們在躲什麼？」\n\n「未必是躲。」\n\n魏戌俞的視線沿著車頂掃向前方。\n\n「也可能是在等什麼。」\n\n梁副官下意識看了一眼車門。\n\n從進入這節車廂到現在，除了他們幾人，始終沒見過其他活物。\n\n可看著頭頂這些密密麻麻的腳印，他心裡竟生出一種極為不舒服的感覺。\n\n彷彿昨夜聚集在這裡的那些東西，其實並沒有離開。\n\n魏戌俞走到車尾，望著那扇連接兩節車廂的窄門。\n\n「我現在更想知道，這些東西從第七節過來以後，又去了哪裡。」\n\n話音剛落，身後忽然傳來一聲輕響。\n\n叮。\n\n聲音很輕。\n\n卻清脆得出奇。\n\n兩人同時回頭。\n\n車門外，一名士兵正低頭望著手裡的東西，神情有些茫然。\n\n那只銅鈴，響了。\n\n「放下！」\n\n魏戌俞驟然開口。\n\n那士兵嚇了一跳，慌忙將銅鈴連同手帕放在月台上。\n\n銅鈴靜靜地躺在那裡，再無半點聲響。\n\n梁副官走到車門旁。\n\n「方才你動過它？」\n\n「報告長官，沒有！我一直拿在手裡，沒碰過！」\n\n梁副官蹲下身，隔著手帕仔細看了看。\n\n鈴口朝上，裡頭空空如也。\n\n他親手檢查過這東西，自然知道它根本沒有鈴舌。\n\n更何況士兵方才站在原地，沒有與任何硬物發生碰撞。\n\n「上校，確實是那只鈴的聲音。」\n\n魏戌俞盯著月台上的銅鈴。\n\n「把人都帶遠些，別靠近車門。」\n\n梁副官立即向外頭的士兵打了個手勢。\n\n就在此時，車廂深處又傳來一聲響動。\n\n咚。\n\n這次不是銅鈴。\n\n像是有人用拳頭敲了一下木板。\n\n魏戌俞轉過身。\n\n咚、咚。\n\n聲音來自靠近車尾的一排木箱。\n\n梁副官拔出手槍，提燈沿著木箱之間的縫隙逐一照去。\n\n「上校，在這兒。」\n\n發出聲音的是一只約莫三尺長的木箱，箱蓋上覆著厚厚一層黃土，四周的鐵釘都還完好。\n\n梁副官俯身查看箱底。\n\n「箱子沒破，底下也沒有洞。若是老鼠，進不去這麼嚴實的地方。」\n\n魏戌俞蹲到木箱另一側，用指節敲了兩下。\n\n篤、篤。\n\n箱內立刻傳來同樣的聲音。\n\n篤、篤。\n\n兩人互望一眼。\n\n梁副官問道：「裡頭有人？」\n\n過了片刻，箱子又響了一下。\n\n魏戌俞沒有立即動手。\n\n他沿著木箱的邊緣查看了一遍，發現箱蓋與箱身之間的縫隙極窄，周圍的泥土也沒有翻動的跡象。\n\n「箱子才三尺長，若裡頭真有個成年人，恐怕連身子都伸不直。」\n\n梁副官道：「會不會是昨夜出了事，有人被困在裡面？」\n\n「先打開看看。」\n\n魏戌俞站起身。\n\n「副官，小心些。」\n\n梁副官喚來兩名士兵，讓他們從外頭取來鐵撬。\n\n鐵釘一根接著一根被撬開，腐朽的木板發出令人牙酸的吱嘎聲。\n\n幾人都不由自主地放輕了呼吸。\n\n最後一根鐵釘脫落時，箱子裡突然沒了聲音。\n\n梁副官握住箱蓋，向魏戌俞看了一眼。\n\n魏戌俞微微頷首。\n\n箱蓋掀開。\n\n裡面只有泥土與幾團發黑的稻草。\n\n一名士兵舉著燈，忍不住探頭看了看。\n\n「怎麼什麼都沒有？」\n\n梁副官伸手接過鐵撬，將表面的稻草撥開。\n\n一樣黑色的東西從泥土中露了出來。\n\n是一隻軍用皮靴。\n\n皮靴的鞋帶仍好好地繫著，靴底沾滿了黃泥。\n\n梁副官沒有伸手去拿，而是用鐵撬輕輕碰了一下靴尖。\n\n靴子動了。\n\n他手上的動作頓時停住。\n\n「上校，這靴子裡頭有東西。」\n\n魏戌俞將燈移近。\n\n靴口上方，露出了一小截深色布料。\n\n那是軍褲。\n\n再往上，膝蓋幾乎貼著胸口，整個人以極為不自然的姿勢蜷縮在木箱內，身上覆滿泥土。\n\n一名士兵看清之後，忍不住倒吸了一口冷氣。\n\n「是咱們的人！」\n\n他下意識伸手，想將那人的肩膀從泥土裡拉出來。\n\n魏戌俞立即喝道：「別碰！」\n\n然而已經遲了。\n\n泥土中猛然伸出一隻青灰色的手，一把扣住了士兵的手腕。\n\n「啊！」\n\n士兵慘叫一聲，整個人被拽得撞向木箱，提燈脫手飛了出去。\n\n梁副官一把揪住他的後領，將人往後拖。\n\n那隻手的力氣卻大得驚人，任憑兩人如何拉扯，五根手指始終死死扣在士兵腕上。\n\n木箱劇烈晃動起來。\n\n魏戌俞抬腳踹向箱身。\n\n早已腐朽的木板當場碎裂，泥土與稻草傾瀉而出，一具身穿軍服的軀體跟著滾落在地。\n\n在場的士兵全都變了臉色。\n\n那人的皮膚灰白乾癟，嘴唇發黑，雙腿扭曲地蜷在胸前。最駭人的是，他的脖子竟朝著背後折了過去，後腦幾乎貼住脊背。\n\n這樣的傷勢，絕無活命的可能。\n\n可他的手仍抓著士兵。\n\n梁副官抬腳抵住那人的肩膀，雙手猛地發力，總算將士兵拖了出來。\n\n「退到門口！」\n\n魏戌俞拔出手槍，對準地上的屍身。\n\n那具屍體抽搐了兩下。\n\n喀啦。\n\n一聲令人頭皮發麻的骨頭摩擦聲。\n\n他的脖子竟然慢慢轉了回來。\n\n緊接著，他睜開了眼睛。\n\n眼珠渾濁發白，已經看不見瞳孔。\n\n「救……」\n\n魏戌俞握著槍，沒有扣下扳機。\n\n「你是昨夜的押運兵？」\n\n屍體的嘴唇顫動了幾下。\n\n「救我……」\n\n梁副官盯著那人的胸口。\n\n「上校，他沒有呼吸。」\n\n魏戌俞自然也看見了。\n\n那人的胸膛始終沒有半點起伏，說話時甚至連下顎都不曾正常活動。\n\n聲音卻清清楚楚地從他嘴裡傳了出來。\n\n「別……開門……」\n\n魏戌俞問道：「哪一道門？」\n\n那雙渾濁的眼珠緩緩轉動，望向車尾。\n\n「第七節……」\n\n話音未落，他忽然張大嘴巴，發出一聲淒厲的慘叫。\n\n整具屍體猛地往後一縮。\n\n像是被什麼看不見的東西抓住了雙腳，硬生生朝著車尾拖去。\n\n他十指死死抓住地板，指甲刮過木板，發出刺耳的聲響。\n\n梁副官大喊：「上校，小心！」\n\n魏戌俞迅速側身。\n\n那具屍體擦著他的軍靴滑了過去，撞翻兩只木箱，沿著狹窄的走道直奔車尾。\n\n士兵們慌忙往車門外退。\n\n魏戌俞提燈追了上去。\n\n就在屍體撞上車尾門板的那一刻，車廂裡的燈火突然全部熄滅。\n\n黑暗中傳來一聲沉重的撞擊。\n\n緊接著，是一陣令人毛骨悚然的抓撓聲。\n\n聲音就在魏戌俞面前。\n\n離他不過數步。\n\n「上校！」\n\n「我在。副官，點燈！」\n\n梁副官摸出火柴。\n\n第一根沒有點著。\n\n第二根剛亮起，便被一股不知從何而來的陰風吹熄。\n\n黑暗中，那陣抓撓聲忽然變了位置。\n\n從車尾移到了左側車壁。\n\n又從車壁移到了頭頂。\n\n梁副官猛然抬頭。\n\n他雖然什麼也看不見，卻能清楚聽見某種東西正貼著車頂爬行。\n\n喀、喀、喀。\n\n一小團泥土落在他的肩膀上。\n\n「上校，頭頂有東西！」\n\n魏戌俞循著聲音伸手，一把將他往旁邊拉去。\n\n砰！\n\n一只木箱從上方砸了下來，正落在梁副官方才站著的位置。\n\n碎裂的木板四處飛散。\n\n梁副官趁機劃亮第三根火柴，用手擋住火苗，迅速點燃風燈。\n\n光線重新照亮車廂。\n\n頭頂空空蕩蕩。\n\n地上只剩那只摔碎的木箱。\n\n而方才那具屍體，已經不見了。\n\n「沒事吧？」\n\n魏戌俞看向梁副官。\n\n「沒事，多謝上校。」\n\n梁副官拍去肩上的泥土，抬頭望向車頂。\n\n原本密密麻麻的腳印之間，多出了幾道新鮮的刮痕。\n\n他仔細辨認了一會兒，走到魏戌俞身旁。\n\n「上校，方才那只木箱原先堆在左邊，離我們少說也有五六尺。」\n\n魏戌俞順著他所指的方向看去。\n\n左側堆放貨物的地方果然空出了一塊。\n\n「有人把它搬到了上頭？」\n\n「恐怕是。否則它不可能從那個位置落下來。」\n\n梁副官重新望向車頂，神情頗為凝重。\n\n「而且方才在上頭爬行的東西，聽聲音不像只有一個。」\n\n魏戌俞將風燈舉高，仔細照過每一處角落。\n\n車頂的橫樑並不寬，根本藏不住一個成年男子，更別說是好幾個人。\n\n可剛才的動靜，他也聽得一清二楚。\n\n魏戌俞從軍以來，經歷過不少生死關頭。槍聲、爆炸聲，乃至敵人在黑暗中接近時所發出的細微聲響，他都能憑經驗分辨一二。\n\n然而方才那陣聲音，卻不屬於他熟悉的任何一種。\n\n那東西移動得很快。\n\n且沒有落地。\n\n「看來這些腳印的主人還在附近。」\n\n魏戌俞放下風燈。\n\n「只是不知為何，燈一亮便看不見了。」\n\n梁副官道：「要不要讓外頭的人再取幾盞燈來？」\n\n「好。別讓太多人進來，這地方狹窄，真出了事反倒不好撤。」\n\n「明白。」\n\n魏戌俞走向車尾。\n\n地上的拖痕筆直延伸，到了緊閉的門板前，突然中斷。\n\n他拉開車門。\n\n門外是空蕩蕩的連接平台，再往後便是鐵軌與月台。\n\n留守在外頭的士兵聞聲趕了過來。\n\n「上校！」\n\n「方才有東西從這裡出去嗎？」\n\n幾人面面相覷。\n\n「報告上校，沒有。」\n\n魏戌俞望著腳下的雨水。\n\n水面完整，沒有泥痕，也沒有拖拽過的痕跡。\n\n梁副官走了過來，俯身查看門板下方。\n\n「上校，方才那道門閂是扣著的。那東西撞過來的時候，門根本沒有開過。」\n\n魏戌俞將門板前後看了一遍。\n\n「也就是說，它是在我們眼皮底下，穿過這道門消失的。」\n\n梁副官看著那道拖痕，沉默片刻。\n\n「和第七節車廂一樣。」\n\n魏戌俞點了點頭。\n\n「看來這道門，才是整節車廂最有問題的地方。」\n\n他沒有急著將門關上，而是走回車廂內，查看方才那具屍體滾落的位置。\n\n梁副官則從碎裂的木箱旁拾起一樣東西。\n\n「上校。」\n\n那是一枚沾著泥土的軍方識別牌，應是方才那具屍體掙扎時掉落的。\n\n識別牌上的字跡尚能辨認，背面卻多了一截暗紅色的細繩。\n\n細繩上穿著一枚黑色珠子。\n\n魏戌俞接過珠子，放在風燈下仔細端詳。\n\n珠子並非尋常玉石，通體漆黑，表面刻有七個大小不一的圓點，圓點之間又以極細的線條相連。\n\n梁副官看了一會兒。\n\n「像是北斗七星。」\n\n「是北斗，但排列不對。」\n\n魏戌俞用拇指摩挲著其中兩個圓點。\n\n「尋常北斗圖都是按照人在地面仰望星空的方向繪製。這上頭的星位卻是反的。」\n\n「刻錯了？」\n\n「七顆星的位置全都對，只是左右顛倒。真要刻錯，也錯得太整齊了。」\n\n魏戌俞將珠子翻轉過來。\n\n「像是從天上往地下看。」\n\n梁副官若有所思。\n\n「若是墓中的東西，會不會與古人所說的陰陽顛倒有關？」\n\n魏戌俞看了他一眼。\n\n「有可能。古人認為地上與地下是兩個世界，有些陵墓中的星象、方位，的確與陽間的規矩不同。」\n\n他又看了看串著珠子的紅繩。\n\n紅繩已經褪色，末端還沾著些許黑褐色的污漬。\n\n「這珠子不是軍中的東西。繩子又纏在識別牌上，不像是那士兵生前佩戴的。」\n\n梁副官接過識別牌，重新端詳。\n\n「繩結是從外面繞上去的。」\n\n「嗯。恐怕得弄清楚，是誰替他戴上了這東西。」\n\n魏戌俞將珠子暫時收起，望向地上散落的陪葬器物。\n\n「墓土、無舌銅鈴、無首陶人，現在又多了這麼一樣東西。這些玩意兒不像是偶然湊在一塊兒的。」\n\n梁副官道：「您的意思是，第七節車廂原本就載著墓裡出來的東西？」\n\n「眼下只能這麼猜。」\n\n魏戌俞重新走向車尾。\n\n「若真是如此，有人將不該帶出來的東西帶上了軍列，這才惹出了昨夜的禍事。」\n\n梁副官聽罷，神情愈發凝重。\n\n「那第七節裡的人……」\n\n「先別急著下定論。活要見人，死也得見屍。」\n\n魏戌俞的目光落在車廂門板上。\n\n他並不是不相信鬼神。\n\n事實上，他比大多數人都清楚，世間確實有些事情不能以常理解釋。然而知道有這些東西存在，與真正遇見它們，畢竟是兩回事。\n\n昨夜究竟發生了什麼，第七節車廂又被帶往何處，直到現在仍無法確定。\n\n但有一點，他幾乎可以肯定。\n\n這列火車只是事情的開端。\n\n「副官，讓外頭的人再退遠些。這門有些蹊蹺，我想再瞧瞧。」\n\n梁副官依言吩咐下去，隨後提著一盞新取來的風燈，回到車廂內。\n\n魏戌俞將車尾的門重新關上。\n\n門板上方鑲著一小塊方形玻璃，玻璃有些污濁，原是供押運人員觀察後方情況所用的。\n\n透過玻璃，可以看見月台另一端的幾名士兵。\n\n魏戌俞伸手在門板上敲了敲。\n\n沒有異樣。\n\n他正打算仔細查看門框，梁副官忽然抬起了頭。\n\n「上校，您聽。」\n\n兩人安靜下來。\n\n喀噠。\n\n喀噠。\n\n喀噠。\n\n一陣極有規律的聲響從門板後方傳來。\n\n梁副官立即走到車壁旁，將手掌貼在木板上。\n\n「車沒動。」\n\n魏戌俞自然知道。\n\n腳下的列車始終停在月台上，外頭甚至還能聽見站務人員走動的聲音。\n\n可門後傳來的，分明是火車行駛時，車輪碾過鐵軌接縫的聲音。\n\n而且越來越近。\n\n魏戌俞舉起風燈，靠近玻璃。\n\n方才還能看見的月台，此刻竟已消失不見。\n\n玻璃後方一片昏暗。\n\n一盞煤油燈懸掛在高處，隨著某種規律緩緩晃動。\n\n燈光下，一排木質貨箱整齊地堆放著。兩側是狹長的窗戶，窗外不斷掠過漆黑的岩壁。\n\n梁副官走到他身旁。\n\n「這是另一節車廂。」\n\n魏戌俞盯著玻璃看了片刻，猛地拉開門。\n\n清晨的冷風迎面吹來。\n\n外頭仍是月台。\n\n幾名士兵站在不遠處，見魏戌俞突然開門，紛紛轉過頭。\n\n梁副官走下平台，繞到車尾仔細查看，又蹲下身看了看車底。\n\n「上校，外頭什麼都沒有。」\n\n魏戌俞招了招手。\n\n待梁副官重新登上車廂，他再次將門關上。\n\n那節正在行駛的車廂，重新出現在玻璃後方。\n\n梁副官的眉頭緊緊皺了起來。\n\n「開門便消失，關門又能看見。難道問題出在這塊玻璃上？」\n\n他將風燈移到不同角度，試圖辨認玻璃中的倒影。\n\n魏戌俞則低頭觀察門板。\n\n「不像倒影。咱們的燈在這頭，玻璃裡那盞燈卻在晃，連窗外的東西都在往後退。」\n\n梁副官將耳朵貼近門板。\n\n「車輪聲也是從裡面傳出來的。」\n\n魏戌俞看著玻璃後方的景象。\n\n「副官，你瞧那只木箱。」\n\n車廂右側有一只長形木箱，箱身靠近地面的部分，漆著半個被磨損的軍方標記。\n\n在它旁邊，還能看見一件搭在貨箱上的軍服。\n\n「這恐怕就是昨夜消失的第七節車廂。」\n\n梁副官望著窗外不斷掠過的岩壁。\n\n「可它似乎還在隧道裡行駛。」\n\n「從昨夜到現在，已經過了這麼久。北山那條隧道再長，也不至於走不出去。」\n\n魏戌俞微微皺眉。\n\n「除非它走的早就不是北山那條隧道了。」\n\n梁副官又仔細看了一會兒，忽然察覺一處異常。\n\n「上校，那不是磚牆。」\n\n魏戌俞順著他的視線望去。\n\n車窗外不斷向後掠去的岩壁上，偶爾閃過幾道淺色的紋路。\n\n起初看不清楚，直到玻璃後方的煤油燈晃向一側，兩人才勉強辨認出那是刻在石壁上的圖案。\n\n有些像雲紋，有些則像身披長袍的人像。\n\n其中還有一幅極大的雕刻，依稀可見一頭四足伏地的異獸。\n\n只可惜車廂行駛得太快，轉眼便從窗外掠了過去。\n\n「隧道裡怎麼會有雕刻？」梁副官問。\n\n魏戌俞沒有立即回答。\n\n他曾經走過不少鐵路隧道。為了避免山體坍塌，隧道內部往往會以磚石加固，即便是直接從山岩中開鑿而成的地方，也不會有人費盡心思在石壁上雕刻這些東西。\n\n除非那些岩壁原本就不是為了通行火車而建造的。\n\n「副官，你還記得方才的墓土嗎？」\n\n「記得。」\n\n「若那些土與陪葬品都是從同一個地方來的……」\n\n魏戌俞望著玻璃後方的車廂。\n\n「我懷疑，這列火車進了某個地下的地方。」\n\n梁副官神情微變。\n\n「您是說，墓裡？」\n\n魏戌俞正欲開口，玻璃後方忽然有了動靜。\n\n車廂深處，一只木箱旁坐著個人。\n\n那人身穿軍服，背對著門板，低垂著頭，兩肩不住地抖動。\n\n梁副官將風燈舉高了些。\n\n「上校，有個人在裡面。」\n\n魏戌俞也看見了。\n\n那人似乎在哭。\n\n又像是在笑。\n\n他們看了片刻，那人始終沒有回頭。\n\n梁副官低聲道：「身上穿的是押運兵的衣服。莫非是另外一個失蹤的士兵？」\n\n魏戌俞用指節敲了敲玻璃。\n\n「喂，聽得見嗎？」\n\n那人的肩膀忽然停止了抖動。\n\n車輪聲依舊在響。\n\n過了一會兒，他慢慢站起身。\n\n魏戌俞與梁副官同時握緊了手中的槍。\n\n那人轉了過來。\n\n風燈照亮了他的臉。\n\n沒有眼睛。\n\n沒有鼻子。\n\n沒有嘴巴。\n\n那張臉上只有一片平整而蒼白的皮。\n\n梁副官握著槍，往後退了半步。\n\n「上校，這不是人。」\n\n那東西開始朝玻璃走來。\n\n一步。\n\n兩步。\n\n它的步伐與常人無異，甚至還十分端正，胸前的軍服扣得一絲不苟。\n\n直到它走近，魏戌俞才發現，它胸口的位置沒有任何起伏。\n\n「副官，往後退。」\n\n梁副官依言向後退去，槍口始終對著門板。\n\n那張空白的臉緊緊貼住了玻璃。\n\n一道聲音從門後傳了出來。\n\n「上校。」\n\n梁副官的動作頓時僵住。\n\n那是他的聲音。\n\n語氣、音調，甚至連說話時習慣性的停頓都一模一樣。\n\n「人員已全數到齊。」\n\n那東西抬起手，放在玻璃上。\n\n「請您上車。」\n\n魏戌俞轉頭看了梁副官一眼。\n\n「你的聲音。」\n\n「聽出來了。」\n\n梁副官握緊手槍，臉色十分難看。\n\n魏戌俞再次看向玻璃。\n\n「這東西沒有嘴，卻能學人說話。方才那具屍體也是如此，明明已經死透了，還能開口求救。」\n\n梁副官盯著那張空白的臉。\n\n「您是說，那具屍體說的話，未必是他自己想說的？」\n\n「恐怕連聲音都不是他的。」\n\n魏戌俞話音剛落，門後那東西突然抬起另一隻手，重重拍在玻璃上。\n\n砰！\n\n整扇門猛然震動。\n\n緊接著，它又開口了。\n\n「恐怕連聲音都不是他的。」\n\n這一次，是魏戌俞的聲音。\n\n梁副官立即舉槍。\n\n魏戌俞一把拉開車門。\n\n冷風灌入車廂。\n\n月台、鐵軌、士兵，一切恢復如常。\n\n他將門敞開，沒有再關上。\n\n梁副官走到外頭，朝車廂後方仔細看了看，確定沒有任何異樣，這才收起手槍。\n\n「上校，那東西方才一直讓您上車。」\n\n「我知道。」\n\n「若是剛才直接開門走過去……」\n\n魏戌俞望著敞開的門板。\n\n「我們也有可能變成第七節車廂裡的人。」\n\n梁副官回想起方才那張沒有五官的臉，不由得皺起眉頭。\n\n「可它既然能學我們說話，為何不直接從門裡出來？」\n\n「或許它出不來。」\n\n魏戌俞伸手指了指那塊玻璃。\n\n「至少在我們能看見它的時候，它始終隔著這道門。方才它拍得那麼用力，玻璃卻連一道裂痕也沒有。」\n\n梁副官走近查看。\n\n玻璃果然完好無損。\n\n「這門也許不只是兩節車廂之間的一道門。」魏戌俞說，「弄清楚以前，暫且不要再關上了。」\n\n「是。我讓人守著。」\n\n魏戌俞點了點頭。\n\n他正要轉身，目光卻忽然落在門板內側。\n\n「副官，燈拿來。」\n\n不知何時，門板上竟多了一張發黃的紙。\n\n紙張薄如蟬翼，邊緣已經腐爛，緊緊貼附在木板上。\n\n梁副官將風燈移近，有些疑惑。\n\n「方才查看門閂時，這裡還沒有東西。」\n\n魏戌俞伸手，小心翼翼地將它揭了下來。\n\n紙上繪著一幅墨色圖案。\n\n一隻形態古樸的巨龜伏於地上，龜背盤繞著一條長蛇。蛇身細長，自龜殼後方蜿蜒而上，蛇首高昂，口中似乎銜著一枚圓珠。\n\n龜蛇四周，環繞著七顆星宿。\n\n每一顆星之間，都以極細的墨線相連。\n\n梁副官看了片刻。\n\n「玄武？」\n\n魏戌俞沒有回答。\n\n梁副官又將風燈靠近了些。\n\n「不過，這玄武的模樣倒與尋常廟裡見到的不太一樣。蛇尾穿過龜殼，星宿也全在它背上……」\n\n說到一半，他忽然停住。\n\n他注意到魏戌俞的神情變了。\n\n自打進入這節車廂以來，無論是滿車的墓土、倒懸於車頂的腳印，還是那具會開口說話的死屍，都不曾令魏戌俞露出這樣的表情。\n\n梁副官與他共事多年，見過他在戰場上身負重傷，仍能從容下達軍令；也見過他面對軍部高層的責難，據理力爭，寸步不讓。\n\n能讓魏戌俞真正感到為難的事情，並不多。\n\n然而此刻，他竟盯著一張破舊的紙，久久沒有移開視線。\n\n「上校，您認得這圖？」\n\n魏戌俞盯著手中的紙。\n\n良久，他才開口。\n\n「副官，把車站封了。」\n\n梁副官一怔。\n\n「整座車站？」\n\n「對。這列火車不准再開，任何人不許進入第六節車廂。今日在這裡見過的東西，也不准往外傳。」\n\n「是！」\n\n「另外，方才受傷的士兵，讓大夫好好看看。其他人若有不適，也一併送去。」\n\n「明白。」\n\n魏戌俞將那張紙折起，收入軍服內側。\n\n梁副官沒有再問，轉身下了車，著手安排封鎖事宜。\n\n不一會兒，月台上便傳來士兵集合的聲音。\n\n站長似乎還想上前說些什麼，被梁副官攔在了外頭。\n\n魏戌俞獨自站在車廂內，望著那些散落於黃土中的陪葬器物。\n\n這世上繪製玄武圖騰的地方不少，懂得星宿排列的人也不在少數。\n\n然而，會將龜蛇、星宿及那些細密紋路組合成這般模樣的，據他所知，只有一個家族。\n\n魏家。\n\n那是魏家嫡系族人世代相傳的印記，從不輕易示於外人。\n\n即便在魏家最為顯赫的那些年，也只有極少數族人知道它完整的模樣。\n\n而那幅圖案，與他背上的家族印記幾乎一模一樣。\n\n只是有一處不同。\n\n方才梁副官沒有留意，魏戌俞卻看得清清楚楚。\n\n紙上的七顆星宿，有六顆是以墨線繪製的。\n\n唯獨最後一顆，塗成了血紅色。\n\n幼年時，魏戌俞曾在家族祠堂中見過一幅相同的圖。\n\n那時父親告訴他，魏家的玄武印只有在一種情況下，才會將最後一顆星塗成紅色。\n\n那不是用來辨認族人的印記。\n\n而是一道警告。\n\n有一座本該永遠封閉的墓，被人打開了。\n\n（第一回完）"}, {"n": 2, "title": "山中的異象", "body": "北山車站的鐘敲過十下，雨總算停了。\n\n梁副官站在月台上，指揮士兵將第六節車廂的側門及尾門固定敞開，又命人在鐵軌兩端設下警戒。站務人員一律撤往候車室，沒有軍方許可，不得再靠近那列火車。\n\n站長遠遠瞧著，心裡急得厲害。\n\n北山是南北貨運的重要通道，這條鐵路若是停上一日，後頭不知道得耽擱多少貨物。他幾次想找魏戌俞商量，卻始終沒敢上前，只得在月台上來回踱步。\n\n直到魏戌俞從車廂裡走出來，他才硬著頭皮迎了上去。\n\n「魏上校，您看這鐵路……咱們總不能一直停著吧？南邊好幾列貨車還等著過山，若是上頭怪罪下來，小的實在擔待不起啊！」\n\n魏戌俞戴回手套，瞥了他一眼。\n\n「昨晚才死了兩個人，嫌不夠多？」\n\n「不、不敢！」\n\n「山上的事情沒弄清楚以前，誰敢放車過去，我就拿誰問罪。」\n\n站長當即噤了聲。\n\n梁副官從月台另一頭走來，手中拿著一張北山鐵路的地形圖。\n\n「上校，車站已經安排好了。方才受傷的士兵也送去醫治了，手腕上有些淤傷，所幸沒傷著骨頭。」\n\n「嗯。」\n\n魏戌俞接過地圖，將它攤在月台旁的一張木桌上。\n\n北山的地勢並不複雜。鐵路自南方延伸而來，沿著山勢向東轉折，穿過隧道後，再經一段下坡抵達車站。\n\n梁副官伸手指向其中一處。\n\n「昨夜火車是從這裡進山的。隧道全長不到兩里，兩端都有守衛。除了鐵路工人使用的幾處避車洞，裡頭沒有其他出口。」\n\n魏戌俞看了片刻。\n\n「車廂是在隧道裡消失的，墓裡的東西也是在那個時候跑進來的。若要弄清楚這列火車究竟去了什麼地方，還是得從隧道著手。」\n\n梁副官點頭。\n\n「我也是這麼想。不過有件事，恐怕得先提醒您。」\n\n「什麼事？」\n\n「方才我派人去警衛亭查看，那地方除了老周，昨夜似乎還有別的東西待過。」\n\n魏戌俞抬起頭。\n\n梁副官將一只布包放在桌上。\n\n布包打開，裡頭是一塊巴掌大的玻璃碎片。\n\n玻璃上沾著乾涸的泥水，中央有一塊十分清晰的印子。\n\n那是一隻手掌的印痕。\n\n魏戌俞拿起玻璃，迎著日光仔細觀察。\n\n「從外面留下的？」\n\n「起初我也以為是。」\n\n梁副官將玻璃轉了個面。\n\n「可泥是在裡頭。」\n\n魏戌俞的目光停在玻璃上。\n\n掌印十分完整，甚至能辨認出掌心幾道細密的紋路。然而，那隻手的五根手指之間，竟還多出了一道細長的痕跡。\n\n不仔細看，很容易以為是泥水流下來所形成的。\n\n梁副官指著那道痕跡。\n\n「這隻手，有六根手指。」\n\n魏戌俞看了片刻，將玻璃放回布包。\n\n「老周呢？」\n\n「還在車站休息，精神不大好。大夫說他受了驚嚇，暫時不能再受刺激。」\n\n「那就別去問他了。」\n\n魏戌俞將地圖折起，交還給梁副官。\n\n「帶上幾個身手好的，咱們去山裡瞧瞧。」\n\n「是。」\n\n山間的警衛亭\n雨後的北山格外陰冷。\n\n一行人沿著鐵路往西走，兩側盡是高聳的山壁與茂密的樹林。山間積水尚未退去，軍靴踩在泥濘的碎石上，不時發出細微的聲響。\n\n走了約莫半個鐘頭，前方出現一座孤零零的警衛亭。\n\n警衛亭依著山坡而建，屋頂鋪著黑瓦，牆面早已斑駁。門口掛著一塊木牌，上頭寫著「北山西口」，字跡被雨水沖得有些模糊。\n\n梁副官推開門。\n\n裡頭一片狼藉。\n\n火爐旁散落著幾塊煤炭，桌椅翻倒，電話聽筒垂在牆邊。地上還有一只摔碎的茶杯，茶葉混著泥土，早已乾在地板上。\n\n魏戌俞站在門口，並未立即進去。\n\n他先看了看門板。\n\n門閂完好，門框也沒有遭人破壞的痕跡。\n\n「副官，昨夜發現老周的時候，門是關著的？」\n\n「是。聽說是從裡頭閂上的，鐵路工人從破窗伸手進去，才將門打開。」\n\n魏戌俞走到窗邊。\n\n窗框上的玻璃碎了大半，剩餘幾塊歪歪斜斜地嵌在木框中。原本刷在窗框上的白漆，有好幾處被硬生生刮了下來。\n\n他用手指沿著木框上的刮痕摸了一遍。\n\n「玻璃是往裡碎的。」\n\n梁副官蹲下身，查看散落在地上的碎片。\n\n「大部分都落在窗戶下方。看來昨夜確實有東西想從窗外進來。」\n\n魏戌俞繞到屋外。\n\n警衛亭右側是一道頗為陡峭的山坡，窗戶距地面約莫五尺，正下方既沒有石階，也沒有可供攀爬的地方。\n\n雨後的泥土十分鬆軟。\n\n然而窗外的泥地上，連半個腳印也沒有。\n\n梁副官站在窗下，仰頭望著破碎的玻璃。\n\n「若是尋常人，便是能夠爬上來，也總得在泥地裡留下些痕跡。」\n\n「除非它根本不是從地上爬上來的。」\n\n魏戌俞抬頭看向屋簷。\n\n梁副官也順著他的目光望了過去。\n\n屋簷下方有一條細長的黑印，從屋頂一直延伸到窗框上方。\n\n仔細辨認之後，才能看出那竟是幾道指痕。\n\n六道。\n\n梁副官沉默了片刻。\n\n「和玻璃上那隻手一樣。」\n\n魏戌俞沒有回答。\n\n他想起第六節車廂頂部那些密密麻麻的腳印。\n\n若昨夜爬上車頂的東西，與來到警衛亭的是同一類東西，那麼第七節車廂消失的同時，恐怕還有什麼東西留在了北山。\n\n「讓弟兄們留意頭頂。」他說。\n\n梁副官立即向身後的士兵交代。\n\n魏戌俞重新走進警衛亭。\n\n屋子不大，一張木桌、一把椅子、一座火爐，幾乎已占去了大半空間。\n\n牆上掛著一件蓑衣，旁邊是一頂舊帽子。\n\n木桌下方有幾道十分凌亂的抓痕，想來是老周昨夜留下的。\n\n魏戌俞正要起身，忽然發現桌腳旁躺著一樣東西。\n\n是一盞信號燈。\n\n燈身有些生鏽，玻璃燈罩上還有一道斜斜的裂痕。\n\n他將燈拾起。\n\n「副官。」\n\n「在。」\n\n「外頭掛著的那盞燈，是誰的？」\n\n梁副官回頭看了一眼。\n\n警衛亭門外的木鉤上，也掛著一盞鐵製信號燈。\n\n他走出去將燈取下，帶回屋內。\n\n兩盞燈並排放在桌上。\n\n樣式相同。\n\n大小相同。\n\n就連燈罩上的裂痕，也一模一樣。\n\n梁副官將兩盞燈轉了個方向。\n\n其中一盞的底部刻著一個歪歪斜斜的「周」字，大概是主人為了辨認，自己拿刀刻上去的。\n\n他翻過另一盞燈。\n\n底部也有一個「周」字。\n\n連刻字時留下的刀痕都毫無分別。\n\n「這……」\n\n梁副官來回比對了幾次。\n\n魏戌俞伸手將其中一盞燈拿了過來。\n\n「這盞不對。」\n\n「哪裡不對？」\n\n「太冷了。」\n\n梁副官伸手碰了碰。\n\n果然，那盞燈冰冷得異常。明明已經在屋裡放了許久，摸上去卻像是剛從冰水中撈出來的。\n\n魏戌俞打開燈罩。\n\n裡頭沒有燈油。\n\n燈芯也早已腐朽，輕輕一碰，便碎成了一撮黑灰。\n\n「奇怪。」梁副官說道，「若這盞燈已經壞成這樣，昨夜又是誰把它帶到這裡來的？」\n\n魏戌俞將燈罩重新扣上。\n\n「恐怕不是誰帶來的。」\n\n他望著桌上的兩盞燈。\n\n「我倒想知道，這世上怎麼會有兩件連破損之處都一模一樣的東西。」\n\n梁副官若有所思。\n\n「就像照鏡子？」\n\n魏戌俞看了他一眼。\n\n「有些像。」\n\n一個人可以仿造另一盞燈的模樣，但要將經年累月留下的刮痕、鏽斑，甚至無意間刻壞的一筆都模仿得絲毫不差，幾乎是不可能的事。\n\n除非其中一盞，原本就是另一盞的影子。\n\n可影子又怎會有重量？\n\n魏戌俞從軍多年，遇事向來不急於下定論。即使心中已經有了七八分猜測，他也習慣再往下查一查，免得一時武斷，錯過真正重要的線索。\n\n但眼前這兩盞燈，確實讓他想起了某些兒時聽過的故事。\n\n那些故事，多半發生在死人聚集的地方。\n\n「兩盞都帶回去，分開存放。」\n\n「是。」\n\n梁副官正要將燈收起，屋外忽然傳來一名士兵的喊聲。\n\n「報告上校！山上發現了東西！」\n\n魏戌俞立即走出警衛亭。\n\n一名士兵站在不遠處的鐵軌旁，指著隧道口上方。\n\n「上校，您看那兒！」\n\n眾人抬頭望去。\n\n隧道入口兩側長滿藤蔓，昨夜的大雨沖垮了其中一小片山土，露出底下原本被掩埋的石壁。\n\n石壁上，竟伸出了一隻石頭雕成的手。\n\n那隻石手足有尋常人手掌的兩倍大，五指細長，掌心朝外，手腕以下的部分仍埋在山土之中。\n\n石頭表面覆滿青苔，指甲及指節卻雕刻得極為精細。\n\n魏戌俞走到山壁下方，仰頭看了一會兒。\n\n「把旁邊的藤蔓清開，別傷著石頭。」\n\n幾名士兵取來工兵鏟，順著山壁爬了上去。\n\n藤蔓被一層層割斷，泥土也隨之剝落。約莫一刻鐘後，那隻石手的主人終於露出了大半個身子。\n\n那是一尊跪在地上的石像。\n\n石像身穿交領長袍，衣袖寬大，左手置於膝上，右手高舉，掌心正對山下的鐵路。\n\n石像的頭部微微低垂，雙眼緊閉，嘴角向下，神情十分莊嚴。\n\n然而他的衣服上，卻刻滿了細小的人臉。\n\n那些人臉有男有女，或張口呼喊，或緊閉雙目，數十張面孔層層疊疊地分布在衣袍的褶皺之間。\n\n乍看之下，還以為是衣服上的花紋。\n\n梁副官走近了些。\n\n「這石像倒是少見。怎麼有人會在衣服上刻這麼多人臉？」\n\n魏戌俞沿著石像的輪廓看了一遍。\n\n「你看他的手。」\n\n「像是在攔人。」\n\n「不錯。」\n\n魏戌俞又指向石像緊閉的雙眼。\n\n「尋常鎮守陵墓的石像，多半雙目圓睜，作威嚇之勢。這尊石像卻閉著眼，伸手阻攔，倒不像是不許外頭的人進去。」\n\n梁副官抬頭望向石像背後的山壁。\n\n「而是不許裡頭的東西出來？」\n\n「有這個可能。」\n\n魏戌俞退後幾步，重新觀察石像與隧道入口的位置。\n\n石像身體所朝的方向，恰好與隧道形成一條斜線。\n\n若將山壁遮掩的部分也算進去，這尊石像原先所面對的地方，應當就在隧道內部。\n\n梁副官似乎也察覺到了這一點。\n\n「上校，莫非當年修鐵路的時候，從什麼古代遺址中間挖了過去？」\n\n「恐怕得看看當年的工程圖才能確定。」\n\n魏戌俞說著，忽然發現石像右肩處有幾塊顏色較淺的石面。\n\n他踩著山石攀了上去，伸手撥去上頭的泥土。\n\n石像肩部有一道很深的缺口。\n\n缺口邊緣十分銳利，既沒有苔蘚，也沒有長年遭受風吹雨打的痕跡。\n\n旁邊還有幾處鑿子留下的印記。\n\n梁副官跟著爬了上來。\n\n「新鑿的？」\n\n「嗯。」\n\n魏戌俞蹲在石像旁，仔細查看那幾處鑿痕。\n\n「這東西埋在山裡少說也有幾百年，不會自己變成這副模樣。昨夜下雨以前，應當已經有人來過。」\n\n他望向石像下方。\n\n那裡原本還有一塊石座，如今石座的一角已被人撬開，露出幾個模糊的古字。\n\n魏戌俞伸手將泥土抹去。\n\n只辨認出其中兩個字。\n\n勿返。\n\n梁副官低聲念道：「勿返？」\n\n「不要回來，或者不要讓什麼東西回來。」\n\n魏戌俞盯著那兩個字，眉頭微微皺起。\n\n究竟是什麼東西不能回來？\n\n又是誰，不久前特地跑到這座荒山上，鑿開了這尊石像？\n\n他正思索著，隧道深處忽然傳來了一陣低沉的聲響。\n\n嗚——\n\n山谷間的眾人紛紛轉頭。\n\n那聲音十分悠長，穿過空蕩蕩的隧道，在山壁之間反覆迴盪。\n\n像是火車的汽笛聲。\n\n幾名士兵神色一變。\n\n梁副官立即看向鐵軌。\n\n「不可能。這條路已經封了，今日沒有任何列車通行。」\n\n魏戌俞從山坡上跳了下來。\n\n隧道口漆黑一片。\n\n沒有火光。\n\n沒有煤煙。\n\n鐵軌上也沒有半點震動。\n\n他站在原地聽了片刻。\n\n那聲音只響了一次，便再也沒有出現。\n\n「副官，準備進去。」\n\n隧道裡的送葬人\n一行人共八人。\n\n魏戌俞與梁副官走在前頭，兩名士兵提著風燈，其餘幾人持槍跟在後方。\n\n隧道內部遠比外頭陰冷。\n\n入口處尚有磚石加固，往深處走，兩側便逐漸變成裸露的山岩。頂部垂著幾根不知從何處生長下來的細根，雨水沿著根鬚滴落，在地上形成一汪汪淺水。\n\n梁副官走了一段，忽然停下腳步。\n\n「上校，這裡有刮痕。」\n\n他將風燈移向右側岩壁。\n\n石壁上有幾道橫向的擦痕，位置約與貨車車身相當。擦痕之中夾雜著黑色漆料，有些地方甚至嵌著極小的木片。\n\n魏戌俞俯身查看。\n\n「昨夜火車經過時，確實撞過這裡。」\n\n梁副官沿著石壁向前走了十餘步。\n\n「奇怪的是，地上的鐵軌沒有損壞。車輪既然沒離開鐵軌，車身又是怎麼撞上這道山壁的？」\n\n魏戌俞從石縫中取下一塊漆片。\n\n「也許撞上山壁的，並不是整節車廂。」\n\n「您的意思是？」\n\n「還記得第六節車尾的抓痕嗎？若有東西攀在車廂外頭，火車在隧道裡行駛，它與石壁發生碰撞，也會留下這些痕跡。」\n\n梁副官重新打量岩壁。\n\n擦痕有高有低，部分位置甚至比車頂還高。\n\n他將燈往上移去。\n\n「那東西的個頭恐怕不小。」\n\n魏戌俞點了點頭。\n\n眾人繼續向前。\n\n越往裡走，隧道內的水氣便越重。\n\n不知走了多久，前方忽然飄來一股淡淡的香氣。\n\n梁副官最先聞見。\n\n「上校，是香灰的味道。」\n\n魏戌俞也聞到了。\n\n與第六節車廂裡的氣味十分相似，只是這一次少了腐朽木材的氣息，多了一股新近燃燒過的檀香味。\n\n「誰會跑到這種地方燒香？」\n\n一名士兵忍不住嘀咕了一句。\n\n無人回答。\n\n前方的隧道微微向左彎曲，風燈照不到轉角後方。\n\n魏戌俞抬手，示意眾人放慢腳步。\n\n就在此時，一陣細微的聲音從隧道深處傳了過來。\n\n嗚咿——\n\n聲音尖細，拖得極長。\n\n停頓片刻，又響了一次。\n\n梁副官側耳聽了聽。\n\n「像是嗩吶。」\n\n魏戌俞皺起眉頭。\n\n緊接著，那聲音中又多出了一陣敲鑼聲。\n\n一長，兩短。\n\n鑼聲並不響亮，聽上去像是隔著很遠的距離，中間還夾雜著一種有節奏的哭聲。\n\n幾名士兵面面相覷。\n\n其中一人出身鄉下，聽了半天，臉色漸漸白了。\n\n「上校……這是出殯的調子。」\n\n梁副官轉頭望向他。\n\n「你認得？」\n\n那士兵點了點頭。\n\n「我們村裡辦白事，就是這麼吹的。」\n\n魏戌俞望向前方。\n\n隧道轉角處，忽然亮起了一點白光。\n\n接著是第二點。\n\n第三點。\n\n一盞又一盞白色燈籠，從轉角後方慢慢浮現。\n\n「全體靠邊。」\n\n魏戌俞壓低聲音。\n\n士兵們立即退至鐵軌兩側，將槍口對準前方。\n\n嗩吶聲越來越近。\n\n一張張白色紙錢從黑暗中飄了出來，落在潮濕的地面上。\n\n梁副官將風燈往前照去。\n\n終於，眾人看清了那是一支送葬的隊伍。\n\n走在最前方的是兩個身穿白衣的人。\n\n他們頭戴高高的白帽，手中提著紙燈籠，低垂著腦袋，步伐整齊而緩慢。\n\n後頭跟著十餘名披麻戴孝的人，有的手持招魂幡，有的捧著牌位，還有幾個人拿著竹製的樂器。\n\n隊伍中央，八個身材高大的人抬著一口黑漆棺材。\n\n棺材上覆著一塊深紅色的布，布面繡有繁複的金色花紋，四角各垂下一串銅錢。\n\n每走一步，銅錢便相互碰撞，發出清脆的響聲。\n\n然而那八個抬棺人，並沒有腳。\n\n寬大的白色衣袍垂至地面，隨著他們的移動輕輕晃動。\n\n衣袍底下空空蕩蕩。\n\n整口棺材，就這樣在半空中朝眾人緩緩靠近。\n\n「都別出聲。」\n\n魏戌俞伸手攔住了身旁正要舉槍的士兵。\n\n他目不轉睛地望著那支隊伍。\n\n這些人的衣著與如今的民間喪葬服飾大不相同。白衣的領口極寬，腰間繫著粗麻，幾名捧牌位的人還穿著長及腳踝的古式麻袍。\n\n那口棺材的樣式也十分古老。\n\n棺首高而寬，兩側微微向外隆起，漆面上隱約可見暗金色的雲紋與異獸。\n\n這絕不是近些年才製作的東西。\n\n梁副官靠近魏戌俞，低聲問道：\n\n「上校，要不要先撤出去？」\n\n魏戌俞看了一眼兩側山壁。\n\n隊伍所在的位置距離他們不過十餘丈，再往後退，恐怕也未必來得及。\n\n「前頭有避車洞。先讓人進去，別擋著它們的路。」\n\n梁副官立即朝後方打了個手勢。\n\n士兵們貼著山壁，陸續退入兩側的凹室。\n\n魏戌俞與梁副官則進了右側較近的一處避車洞。\n\n那地方只能勉強容納三四個人。石壁濕滑，地上積著一層薄水，眾人只能緊挨著站立。\n\n送葬隊伍越來越近。\n\n哭聲也越來越清楚。\n\n魏戌俞這才發現，那些哭聲並非來自一兩個人。\n\n隊伍中所有披麻戴孝的人都在哭。\n\n他們低垂著頭，身體微微晃動，嘴裡不斷發出相同的哭聲。\n\n連換氣的間隔都一模一樣。\n\n走在最前方的人經過避車洞時，梁副官下意識將風燈往身後移了移。\n\n火光照到了那人的側臉。\n\n梁副官的手頓了一下。\n\n那不是一張活人的臉。\n\n白得沒有半點血色的皮膚上，雙頰各畫著一團鮮紅的胭脂，細長的眉毛高高挑起，嘴唇則被塗成極為鮮豔的紅色。\n\n像極了喪事上擺放的紙人。\n\n但他的眼睛在動。\n\n那雙眼珠緩緩轉向避車洞內。\n\n梁副官沒有動。\n\n魏戌俞也沒有動。\n\n片刻後，那人重新低下頭，繼續向前。\n\n嗩吶聲從兩人面前經過。\n\n一張紙錢飄入洞中，落在魏戌俞的軍靴旁。\n\n他低頭瞧了一眼。\n\n紙錢上並沒有尋常的圓孔。\n\n中央竟畫著一張五官模糊的人臉。\n\n魏戌俞正想蹲下身仔細辨認，外頭忽然傳來一陣異樣的水聲。\n\n梁副官轉頭望去。\n\n對面的避車洞裡，一名士兵不知何時走了出來。\n\n他背著槍，雙手垂在身側，神情茫然地站在鐵軌旁。\n\n「回去！」\n\n梁副官壓著聲音喝道。\n\n士兵沒有反應。\n\n他呆呆望著送葬隊伍，嘴唇動了幾下。\n\n「娘……」\n\n魏戌俞立即抬頭。\n\n隊伍後方有個身形矮小的婦人，穿著白色麻衣，頭上覆著一塊布。\n\n她緩緩抬起手，朝那士兵招了招。\n\n「兒啊，過來。」\n\n士兵竟真的抬腳走了過去。\n\n「拉住他！」\n\n魏戌俞一聲令下，梁副官率先衝出避車洞。\n\n對面的兩名士兵也反應過來，伸手抓住同伴的胳膊。\n\n然而那名士兵力氣大得異常，竟一把甩開兩人，徑直朝婦人走去。\n\n梁副官幾步追上，扣住他的肩膀，猛地將他往後一扯。\n\n幾乎就在同一瞬間，那婦人轉過了頭。\n\n覆在臉上的白布掉了下來。\n\n布底下是一張乾癟而漆黑的臉。\n\n兩個眼窩深深凹陷，嘴唇早已腐爛，露出一排泛黃的牙齒。\n\n她猛地伸出手，抓住士兵的衣襟。\n\n士兵發出一聲慘叫。\n\n梁副官死死扣著他的肩膀。\n\n那婦人看似瘦小，力氣卻大得驚人，連梁副官也被扯得向前踉蹌了半步。\n\n魏戌俞迅速上前，一把抓住士兵的另一條胳膊。\n\n「副官，往後！」\n\n兩人同時發力。\n\n婦人的五指深深陷入軍服之中，衣料被扯得緊繃。\n\n撕啦一聲。\n\n士兵胸前的軍服被撕下一大片，整個人終於脫離了婦人的手。\n\n梁副官將他推向後方的兩名士兵。\n\n「帶回去！」\n\n婦人站在鐵軌中央，望著幾人。\n\n她的嘴慢慢張開。\n\n「我的兒啊……」\n\n下一刻，原本正在行走的送葬隊伍，突然全部停了下來。\n\n嗩吶聲戛然而止。\n\n鑼聲消失。\n\n哭聲也消失了。\n\n整條隧道頓時陷入一片死寂。\n\n魏戌俞抬頭望去。\n\n隊伍中十餘個披麻戴孝的人，正一個接著一個地轉過頭來。\n\n「上校，情況不對。」\n\n梁副官握著槍，緩緩退到魏戌俞身旁。\n\n那些人並沒有立即靠近。\n\n他們只是站在原地，低垂著身子，將臉轉向眾人。\n\n最前方提著燈籠的兩個紙人也回過了頭。\n\n白色燈籠輕輕晃動。\n\n裡頭的火焰竟在頃刻間變成了幽綠色。\n\n魏戌俞的目光迅速掃過整支隊伍。\n\n方才眾人躲在避車洞內，這些東西尚且能夠視而不見。如今那名士兵被從隊伍旁拉了回來，它們卻全都停住了腳步。\n\n「副官，這些東西是衝著方才那名士兵來的。」\n\n梁副官立即回頭。\n\n那士兵已被兩名同伴拖回避車洞，正靠著石壁劇烈喘息，眼神逐漸恢復清明。\n\n「可人已經救回來了。」\n\n「它們似乎不打算就這麼放過我們。」\n\n話音剛落，隊伍中央突然傳來一聲沉重的響動。\n\n抬棺的八個人，同時彎下了腰。\n\n黑漆棺材被緩緩放在鐵軌上。\n\n魏戌俞神色微變。\n\n他幼時曾在魏家的藏書中讀過一段記載，講的是古人遇見陰魂送葬時的禁忌。\n\n陰魂借道，不可阻行。\n\n若棺落地，則有取替之意。\n\n書上所謂的取替，指的是將活人帶入棺中，頂替原本應當下葬的亡者。\n\n當年讀到這一段時，他只將它當作家族蒐集的民間異聞。\n\n如今看著那口緩緩落地的黑棺，他卻有了一種極為不祥的預感。\n\n「副官，讓所有人往出口撤。」\n\n梁副官沒有多問。\n\n「是！」\n\n就在幾名士兵準備動身時，棺材裡傳出了一陣抓撓聲。\n\n喀啦、喀啦。\n\n魏戌俞望向棺蓋。\n\n棺蓋正在移動。\n\n一隻蒼白的手從縫隙中伸了出來。\n\n緊接著是第二隻。\n\n第三隻。\n\n那些手掌大小不一，手指細長，有些甚至不似成年人的手。\n\n它們抓住棺沿，一點一點地將棺蓋往上抬。\n\n梁副官見狀，立即喝道：\n\n「撤！」\n\n士兵們轉身便跑。\n\n棺蓋猛地翻落。\n\n轟！\n\n沉重的棺木砸上鐵軌，一股黑色的霧氣從棺材裡湧了出來。\n\n魏戌俞抬起手臂擋住迎面而來的風。\n\n霧中有東西。\n\n一具身穿深色壽衣的屍身從棺內直直坐了起來。\n\n它頭頂戴著一頂漆黑的帽子，身形異常高大，裸露在衣袖外的雙臂卻乾瘦如枯枝。\n\n與方才從棺中伸出的那些手不同，它的兩隻手都只有五根手指。\n\n然而隨著它站起身，梁副官終於看見了那些多出來的手究竟長在什麼地方。\n\n在它的背後。\n\n壽衣下方密密麻麻地隆起了數個鼓包，幾條細長的手臂從衣襟及袖口的破洞中鑽出，彼此纏繞，不停地抓向四周。\n\n那東西從棺中跨了出來。\n\n腳下沒有鞋。\n\n十根腳趾漆黑乾癟。\n\n它赤腳踩在鐵軌上，慢慢抬起頭。\n\n「跑！」\n\n魏戌俞一把將梁副官推向出口的方向。\n\n身後傳來一聲嘶啞的尖叫。\n\n原本靜止的送葬人突然動了。\n\n白色衣袍在黑暗中飛快晃動，幾道身影幾乎貼著山壁向眾人撲來。\n\n一名士兵回身開槍。\n\n砰！\n\n槍聲在狹窄的隧道內震耳欲聾。\n\n子彈穿過其中一人的胸口，白衣上頓時多了一個破洞。\n\n那東西卻像是毫無知覺，依舊朝前撲來。\n\n梁副官回頭喝道：\n\n「別停！快走！」\n\n前方幾名士兵已經跑出十餘步。\n\n忽然，一盞白色燈籠從隧道頂部垂了下來。\n\n持燈的紙人倒懸在眾人頭頂，白帽幾乎擦過一名士兵的肩膀。\n\n士兵嚇得向旁一閃，踩中鐵軌，整個人重重摔倒在地。\n\n梁副官立即折返，一把將他拉起。\n\n魏戌俞舉槍朝上方連開兩槍。\n\n紙人的白帽被打落，臉上鮮紅的胭脂在火光中格外刺眼。\n\n它從頭頂俯衝下來。\n\n魏戌俞猛地側身，避開了迎面撲來的雙手，隨即抬腿踹向它的胸口。\n\n那東西撞上山壁，發出一聲輕飄飄的響動。\n\n不像撞到人的身體。\n\n倒像踢中了一個空心的竹架。\n\n魏戌俞低頭看了一眼自己的軍靴。\n\n靴尖沾著一片碎紙。\n\n「副官，火！」\n\n梁副官頓時會意，將手中的風燈拋了過來。\n\n魏戌俞接住風燈，在那紙人再次撲來之前，猛地將燈砸向它身上的白衣。\n\n玻璃碎裂。\n\n燈油濺開。\n\n轟的一聲，火焰沿著白衣迅速向上蔓延。\n\n那張塗著胭脂的臉瞬間皺縮起來，五官如同被烤化的蠟一般扭曲。\n\n紙人發出尖銳的叫聲，在地上瘋狂翻滾。\n\n濃煙充斥隧道。\n\n其他幾個逼近的送葬人也停住了腳步。\n\n「它們怕火！」\n\n梁副官叫道。\n\n「先出去再說！」\n\n魏戌俞轉身追上隊伍。\n\n身後，那具從棺材裡爬出來的怪物仍在移動。\n\n沉重的腳步聲一下一下地落在鐵軌上。\n\n每走一步，便伴隨著數隻手臂抓撓石壁的聲音。\n\n眾人不敢回頭。\n\n直到前方終於出現隧道口的天光，一行人才稍稍鬆了口氣。\n\n梁副官跑在最後，確認所有士兵都已出去，這才跨過隧道口。\n\n魏戌俞站在山坡旁，回身望向黑暗。\n\n那陣沉重的腳步聲停住了。\n\n隧道深處，再一次傳來了幽幽的嗩吶聲。\n\n一張白色紙錢從黑暗中飄了出來。\n\n落在陽光照得到的地方。\n\n眨眼之間，那張紙錢便化成了一撮灰。\n\n隧道外，幾名士兵或坐或蹲，個個臉色發白。\n\n其中兩人受了輕傷，所幸並無性命之虞。\n\n梁副官清點完人數，走到魏戌俞身旁。\n\n「上校，人都在。」\n\n魏戌俞點了點頭。\n\n「方才那個士兵呢？」\n\n「已經清醒了。」\n\n兩人走了過去。\n\n那名士兵坐在石頭上，胸前的軍服被撕得不成樣子，雙手至今仍在發抖。\n\n見魏戌俞走來，他連忙起身。\n\n「上校，卑職……」\n\n「坐著。」\n\n魏戌俞看了一眼他的傷勢。\n\n「方才那個女人，你認得？」\n\n士兵的嘴唇顫動了幾下。\n\n「卑職看見的是家母。」\n\n「你母親還在世？」\n\n士兵搖了搖頭。\n\n「五年前便過世了。」\n\n梁副官與魏戌俞互望一眼。\n\n那士兵低下頭，眼眶有些發紅。\n\n「她老人家走的時候，卑職還在外頭當兵，連最後一面都沒見著。方才她叫我過去，我也不知怎麼的，就……」\n\n魏戌俞沒有責備他。\n\n「方才跟你說話的不是你母親。記清楚了，往後再遇上這種事情，無論對方是誰，都不要跟著走。」\n\n士兵用力點頭。\n\n「是！」\n\n魏戌俞轉向梁副官。\n\n「安排兩個人送傷兵回去，其餘的人暫且在外頭守著。隧道的事情沒弄明白以前，不准再有人擅自進去。」\n\n「明白。」\n\n梁副官正要離開，又想起一件事。\n\n「上校，方才那些東西，似乎過不了隧道口。」\n\n魏戌俞望向那撮已被風吹散的紙灰。\n\n「我也注意到了。」\n\n「可昨夜襲擊老周的東西，分明已經出了隧道。」\n\n「所以未必是同一類東西。」\n\n魏戌俞沉吟片刻。\n\n「而且方才咱們用槍打它，幾乎沒有作用，火卻能將它燒起來。這些東西看著像人，實際上恐怕連血肉之軀都算不上。」\n\n梁副官想起那具背上長滿手臂的怪物。\n\n「棺材裡的那個呢？」\n\n魏戌俞搖了搖頭。\n\n「不好說。」\n\n他並不認為自己的家族知識足以解釋眼前的一切。\n\n魏家數百年間留下的古籍與紀錄，雖然記載了許多罕見的邪異現象，但其中有些東西連撰寫者本人都未曾親眼見過。\n\n更何況，世間未被記錄下來的怪事，恐怕遠比那些書上所寫的還多。\n\n「那口棺材的樣式，你可還記得？」魏戌俞問道。\n\n「記得。黑漆棺木，棺首很高，上頭有金色的雲紋，還蓋著紅布。」\n\n「嗯，那種形制的棺木，至少有數百年的歷史了。」\n\n魏戌俞轉身望向山上的石像。\n\n「若這支送葬隊伍真是從什麼地方出來的，那地方應該離這兒不遠。」\n\n梁副官也抬起了頭。\n\n「上校，您的意思是，北山本身就有一座古墓？」\n\n「還不能確定。不過這尊石像既然被人動過，附近應當還能找到其他痕跡。」\n\n魏戌俞脫下沾滿泥土的手套。\n\n「咱們上去看看。」\n\n山壁後的祕密\n石像所在的山坡十分陡峭。\n\n昨夜的雨水沖刷過後，原本覆蓋山壁的泥土剝落了不少，裸露的樹根盤根錯節，勉強可供人攀扶。\n\n魏戌俞與梁副官沿著山壁向上，兩名士兵則帶著繩索緊跟在後。\n\n攀至石像上方時，梁副官忽然停了下來。\n\n「上校，這邊有人走過。」\n\n他指著一片被壓倒的灌木。\n\n灌木的枝條向同一方向折斷，其中幾根斷枝的切口十分平整，顯然是有人持刀砍過。\n\n兩人順著痕跡往前。\n\n不久，一條隱藏在山壁後方的小路出現在眼前。\n\n小路極為狹窄，兩側長滿野草，若不是昨夜的大雨沖去了部分泥土，從下方幾乎看不出它的存在。\n\n魏戌俞蹲下身。\n\n地上有兩道平行的凹痕。\n\n凹痕約莫相隔三尺，一直延伸至小路深處。\n\n「副官，瞧這個。」\n\n梁副官走近觀察。\n\n「不像車輪印，兩側的泥土都被往外推開了。」\n\n「有人拖過重物。」\n\n魏戌俞伸手量了一下凹痕的寬度。\n\n「而且東西不小。」\n\n沿著小路走了約莫百餘步，前方出現一片向內凹陷的山壁。\n\n山壁上垂著大量藤蔓，底下露出一截深灰色的石階。\n\n梁副官撥開藤蔓。\n\n石階共有七級，寬不足一丈，兩旁各雕有一隻伏地的異獸。\n\n左側的異獸頭生雙角，四足如虎；右側的異獸身形似犬，嘴裡卻含著一顆人頭。\n\n兩尊石獸都朝向階梯下方。\n\n在石階盡頭，有一道低矮的石門。\n\n石門早已被人推開。\n\n門旁散落著幾根新近使用過的木棍，還有半截斷裂的粗繩。\n\n魏戌俞拾起繩索。\n\n繩子十分結實，內側有明顯的磨損，纖維間還沾著幾粒漆黑的碎屑。\n\n「有人來過不止一次。」\n\n梁副官將風燈舉向石門內部。\n\n「上校，裡頭似乎不是很深。」\n\n魏戌俞抽出手槍。\n\n「進去看看。」\n\n石門後是一間不大的石室。\n\n與方才的隧道不同，這裡顯然經過精心修築。四面石壁由大小一致的青石砌成，頂部呈拱形，正中央還雕刻著一幅巨大的圖案。\n\n梁副官將風燈舉高。\n\n那是一幅送葬圖。\n\n圖中有十餘名身穿麻衣的人，手持燈籠、招魂幡及各式祭器。八名高大的男子抬著棺材，正朝一座高聳的山門走去。\n\n棺材上覆著一塊布。\n\n布角垂著四串圓形的飾物。\n\n梁副官仰頭看了許久。\n\n「上校，這與咱們方才在隧道裡見到的，幾乎一模一樣。」\n\n魏戌俞的神情也變得凝重起來。\n\n石刻上的人物並非隨意排列。走在前頭的兩名引路人、後方持幡的孝子、中央的棺材，甚至連吹奏樂器的人數，都與他們方才所見相差無幾。\n\n唯一不同的是，石刻中的送葬隊伍並不是朝山外走的。\n\n而是在進山。\n\n「這上頭記載的，恐怕是數百年前的一場葬禮。」\n\n魏戌俞沿著雕刻向右看去。\n\n「你看，那座山門後面還有東西。」\n\n山門後方，雕著一座規模極其龐大的宮殿。\n\n重重殿宇沿山勢向下延伸，石階、迴廊、樓閣彼此相連。宮殿中央是一座形似祭壇的高台，四周跪滿了密密麻麻的人。\n\n雕刻的最深處，還有一輪被群星環繞的圓形圖案。\n\n梁副官看得有些出神。\n\n「若這雕的是陵墓，墓主人生前的地位恐怕不低。」\n\n「不只是地位不低。」\n\n魏戌俞伸手指向宮殿下方。\n\n那裡刻著許多身形細小的人，肩扛石料，正沿著山道向下行走。\n\n在他們身後，還有一排持鞭的監工。\n\n「這麼多人力，這麼大的地下建築，絕不是尋常富貴人家能修得起的。」\n\n梁副官算了算雕刻中的殿宇數量。\n\n「真要照這圖上的規模來修，恐怕得將半座山都挖空。」\n\n魏戌俞沒有接話。\n\n他的注意力已經落在石室中央。\n\n那裡有一座由整塊青石雕成的長形石台。\n\n石台約有八尺長，兩側各有一道凹槽，表面刻著雲紋，四角則雕著張口咆哮的獸首。\n\n石台中央十分乾淨，與周圍積滿灰塵的地方形成鮮明對比。\n\n「上校，這上頭原本應該放著東西。」\n\n梁副官蹲下身。\n\n石台兩側有幾處新鮮的撬痕，地上還散落著黑色漆片。\n\n魏戌俞取出方才在隧道石壁上拾到的碎片。\n\n兩者的色澤十分相似。\n\n他又將手中的漆片放在石台旁比對。\n\n「棺材。」\n\n梁副官抬起頭。\n\n「有人將原本放在這裡的棺材搬走了？」\n\n「不錯。這石台的長寬與棺床相仿，四角又有固定棺木的凹槽。」\n\n魏戌俞望向門外。\n\n「外頭那些拖拽的痕跡，恐怕也是搬運棺材時留下的。」\n\n梁副官重新站起身。\n\n「若這口棺材就是第七節車廂裡的東西，那麼昨夜的怪事……」\n\n「多半與它有關。」\n\n魏戌俞沒有將話說得太滿。\n\n眼下至少已經能夠確定，有人在軍列出事以前，從北山搬走了一口年代極為久遠的棺材。\n\n而這間石室顯然只是某座古老建築的一小部分。\n\n至於雕刻上那座龐大的地下宮殿究竟位於何處，仍然不得而知。\n\n梁副官繞過石台，忽然發現牆角堆著一團被遺棄的油布。\n\n他用槍管將油布挑開。\n\n底下有幾塊破碎的木板、一截麻繩，以及半張沾滿泥土的紙。\n\n「上校，您過來看看。」\n\n魏戌俞接過那張紙。\n\n紙張並不古老，邊緣還殘留著新近使用過的漿糊。上頭以紅色墨水印著幾行文字，中間蓋有一枚方形印章。\n\n是軍方用來封存重要貨物的封條。\n\n梁副官將燈移近。\n\n「這東西怎麼會在這裡？」\n\n魏戌俞沒有回答。\n\n他用拇指將紙上的泥土慢慢擦去。\n\n印章下方還有一行手寫的文字。\n\n筆跡遒勁，收筆俐落，最後一字微微向右挑起。\n\n梁副官看清楚之後，臉色驟然一變。\n\n他跟隨魏戌俞多年，經手過無數由魏戌俞親自批閱的公文，對這字跡再熟悉不過。\n\n「上校，這是您的簽名？」\n\n魏戌俞盯著那張紙。\n\n姓名、筆鋒，甚至連他寫字時習慣性的停頓，都模仿得極為相似。\n\n那張軍方封條上，清清楚楚地簽著三個字。\n\n魏戌俞。\n\n然而他從未來過這間石室。\n\n更不曾下令讓任何人，從北山運走一口棺材。\n\n魏戌俞將封條攥在手中，臉色徹底沉了下來。\n\n「副官。」\n\n「在。」\n\n「回軍部。」\n\n（第二回完）"}, {"n": 3, "title": "不該響的銅鈴", "body": "回到軍部時，已是下午。\n\n魏戌俞脫下沾滿泥土的軍大衣，隨手搭在椅背上，走到辦公桌前，將從北山石室帶回的封條攤開。\n\n一旁還放著幾份他近日親自簽署的公文。\n\n兩者的筆跡極為相似。\n\n魏戌俞拿起鋼筆，在一張空白的紙上寫下自己的姓名，與封條上的字跡仔細比對。\n\n他盯著看了許久，忽然冷笑了一聲。\n\n「倒是下了不少功夫。」\n\n這些年，想在他眼皮底下動手腳的人不是沒有。\n\n有膽子冒用他的姓名，將一口來歷不明的棺材送上軍列的，倒還是頭一回。\n\n他將封條收入抽屜，轉身走到窗前。\n\n軍部大院內，幾隊士兵正在操練，整齊的口令聲不時傳入屋中。遠處的山峰隱沒在灰濛濛的天色裡，山腰上還盤繞著尚未散去的霧氣。\n\n魏戌俞望著北山的方向。\n\n會說話的死屍、沒有五官的人、隧道中的送葬隊伍，以及那張繪有魏家印記的古紙。\n\n這些東西若是單獨出現，興許還能從魏家留下的古籍中找到些許頭緒。\n\n偏偏全都集中在了同一件事情上。\n\n魏戌俞伸手解開軍服最上方的兩顆扣子，揉了揉眉心。\n\n自從父親過世後，他已經有許多年不曾認真追查過這類事情。\n\n當年魏家發生變故，族人死的死、散的散，那些原本由族中長輩掌管的古籍也遺失了不少。有些事情，即使是他，如今也無從查證。\n\n不過，若論起民間那些稀奇古怪的傳說，以及江湖上流傳的各種禁忌，有一個人知道的恐怕比他還多。\n\n上午離開北山時，他便已經吩咐梁副官去請那人過來。\n\n算算時辰，也差不多該到了。\n\n就在此時，辦公室外傳來一陣腳步聲。\n\n「上校，蘇爺到了。」\n\n「進來。」\n\n門才推開，外頭便探進來一顆腦袋。\n\n「魏長官，我聽說您昨夜丟了一節火車？」\n\n來人約莫三十多歲，穿著一身深褐色長衫，外頭罩著一件黑色馬褂，手裡還拎著個裝滿東西的布袋。\n\n他的頭髮梳得整整齊齊，鼻梁上架著一副細框眼鏡，乍看之下，倒有幾分讀書人的模樣。\n\n只是那雙眼睛總帶著笑意，一開口，便將身上那點斯文氣全破壞了。\n\n此人姓蘇，名孟達。\n\n北城做古董生意的人，多半都認得他。\n\n蘇孟達年輕時曾在各地遊歷，去過荒山野嶺，也進過尋常人連名字都不願提起的古墓。這些年在北城經營一間古董鋪子，偶爾替人鑑定古物，遇上有趣的事情，便關了鋪子出門，一走就是十天半個月。\n\n他知道的事情極雜。\n\n上至古代帝王的喪葬禮制，下至鄉野間如何替夭折的孩童招魂，幾乎都能說上一些。\n\n久而久之，江湖上的人便送了他一個稱呼。\n\n蘇爺。\n\n魏戌俞與他相識多年，深知此人的本事，也深知此人的嘴有多不老實。\n\n「進來坐。」魏戌俞說。\n\n蘇孟達笑嘻嘻地走進辦公室。\n\n「魏長官，您這回可真是遇上大事了。梁副官一路上跟我說，又是死人開口，又是紙人出殯，聽得我連午飯都忘了吃。」\n\n梁副官站在門旁，瞥了他一眼。\n\n「蘇爺，您方才在車上吃了三個燒餅。」\n\n「那叫墊肚子，哪能算午飯？」\n\n梁副官不再理他。\n\n魏戌俞指了指桌前的椅子。\n\n「坐。」\n\n蘇孟達拉開椅子，將布袋擱在腳邊，倒也不客氣，拿起桌上的茶壺便給自己倒了杯茶。\n\n「我原先還以為您找我喝茶，誰知道是找我來收鬼的。」\n\n「收得了嗎？」\n\n「那得看是什麼鬼。若是個漂亮女鬼，蘇某倒也願意捨命奉陪。」\n\n梁副官默默移開了視線。\n\n魏戌俞將一只木盒推到蘇孟達面前。\n\n「別廢話，講重點。」\n\n「得嘞。」\n\n蘇孟達放下茶杯，掀開盒蓋。\n\n盒內擺著從第六節車廂帶回來的幾樣古物。\n\n無舌銅鈴、無首陶人、幾枚銅錢，以及那枚刻有反向北斗七星的黑色珠子。\n\n原本掛在蘇孟達臉上的笑容，漸漸淡了下去。\n\n他伸手拿起銅鈴，翻來覆去地看了半天，又從懷中取出一只小巧的放大鏡，仔細查看鈴身上的紋路。\n\n「這東西也是從車上找到的？」\n\n「不錯。」\n\n「響過沒有？」\n\n梁副官抬起頭。\n\n「響過一次。」\n\n蘇孟達手上的動作停住了。\n\n「誰聽見的？」\n\n「在場的人都聽見了。」\n\n蘇孟達沉默片刻，將銅鈴輕輕放回桌上。\n\n「魏長官，您那座車站，現在恐怕還不能讓人進去。」\n\n魏戌俞望著他。\n\n「說來聽聽。」\n\n無聲之鈴\n蘇孟達將銅鈴倒扣在桌上，拿起放大鏡，指著鈴身下方一圈不起眼的紋飾。\n\n「二位瞧瞧，這上頭刻的是什麼？」\n\n梁副官俯身看去。\n\n銅鈴上的紋飾十分細密，由許多彎曲的線條組成。由於銅鏽覆蓋了大半圖案，只能勉強看出其中有幾個形似跪地的人影。\n\n「像是人在跪拜。」\n\n「不錯。」\n\n蘇孟達取出一根細竹籤，小心剔去其中一處浮鏽。\n\n一個更為清晰的人形逐漸顯露出來。\n\n那人雙膝跪地，兩條胳膊高舉過頭，掌心朝上，頭部卻向後仰著。\n\n他的嘴張得極大。\n\n在他面前，還有一個更小的人影。\n\n那人影雙腳離地，懸在半空之中。\n\n魏戌俞將銅鈴轉了半圈。\n\n「不只一個。這一整圈刻的都是同樣的東西。」\n\n蘇孟達點頭。\n\n「魏長官好眼力。這叫引魂紋。」\n\n「引魂？」\n\n梁副官重新端詳那些人影。\n\n蘇孟達說道：\n\n「我早些年在西邊一個山村住過幾日。那地方有個風俗，人死在外頭，屍首若是找不回來，家裡便會請人製作一只銅鈴，放在亡者生前住過的屋子裡。」\n\n「鈴中不裝鈴舌，也不能用手去搖。據說到了夜深人靜的時候，若那人的魂魄找回來了，銅鈴自然會響。」\n\n魏戌俞道：「我在古籍上見過類似的說法。」\n\n「那便好辦了。不過這只鈴，與尋常用來引魂的鈴又不大一樣。」\n\n蘇孟達拿起竹籤，指著那些跪地的人形。\n\n「你們看，這些人的頭，都是朝後仰的。」\n\n梁副官仔細看了看。\n\n「確實如此。」\n\n「若是活人招魂，理應面向亡者所在的方向。可這上頭的人一個個背對著魂魄，頭又仰成這副模樣，哪像是在招人回來？」\n\n魏戌俞盯著那個懸在半空中的小人。\n\n「倒像是魂魄正從他們身上離開。」\n\n蘇孟達猛地一拍桌子。\n\n「正是！」\n\n梁副官皺了皺眉。\n\n「蘇爺，桌上的東西經不起您這麼拍。」\n\n蘇孟達將手縮了回來。\n\n「梁副官放心，拍壞了我賠。」\n\n「您上回打碎軍部的茶壺，也是這麼說的。」\n\n「那都多久以前的事了？你這人怎麼比帳房先生還記仇？」\n\n魏戌俞抬眼看向他。\n\n蘇孟達立即端正了坐姿。\n\n「說正事，說正事。」\n\n他重新指向銅鈴。\n\n「依我看，這東西不是用來叫亡魂回來的，而是用來將魂魄帶走的。」\n\n辦公室裡安靜了片刻。\n\n梁副官問道：「帶去哪裡？」\n\n「那就得看造這只鈴的人，想把它們送到哪裡去了。」\n\n蘇孟達將銅鈴放下。\n\n「古時候有些方士相信，人死之後，魂魄不一定會立即離開身體。若能借助某些特殊的器物，便可以將魂魄從屍身中引出，送往指定的地方。」\n\n「當然，是真是假，我也沒親眼見過。」\n\n魏戌俞沉吟片刻。\n\n「鈴響之後，車廂裡便傳出了敲擊木箱的聲音。那具屍體也是在那個時候出現的。」\n\n蘇孟達看向他。\n\n「您懷疑兩者有關？」\n\n「至少時間上對得上。」\n\n魏戌俞伸手將銅鈴移至桌面中央。\n\n「那具屍體已經死透了，卻能開口說話，最後又被什麼東西拖回了第七節車廂所在的位置。」\n\n「倘若這只鈴真能引魂，那麼當時它究竟是在引什麼東西過來，還是在將什麼東西送回去？」\n\n蘇孟達摸著下巴，半晌沒有作聲。\n\n梁副官忽然開口。\n\n「上校，會不會是那具屍體本就不該出現在第六節車廂？」\n\n魏戌俞轉過頭。\n\n「繼續說。」\n\n「那具屍體出現後，一直說著救我，又讓我們不要開門。可最後它卻被拖回了車尾。」\n\n梁副官望向銅鈴。\n\n「若這只鈴響起時，有什麼東西正在尋找他，那麼他後來消失，或許並不是他自己想回去的。」\n\n蘇孟達若有所思地點了點頭。\n\n「有道理。如此說來，那位押運兵倒像是從什麼地方逃出來，結果又被抓了回去。」\n\n魏戌俞沒有接話。\n\n他想起那具屍體十指抓住地板、拼命掙扎的模樣。\n\n當時那人的恐懼，確實不像是裝出來的。\n\n倘若連死了的人都在想方設法逃離那個地方……\n\n第七節車廂究竟被帶到了哪裡？\n\n沒有頭的陶人\n蘇孟達將銅鈴放到一旁，又拿起那尊無首陶人。\n\n與方才不同，這一次，他只看了幾眼，便忍不住輕輕咦了一聲。\n\n「怪了。」\n\n魏戌俞問道：「怎麼？」\n\n「這東西的做法，我倒是見過。只是沒見過做成這般模樣的。」\n\n蘇孟達將陶人放在桌上，從布袋裡摸出一把小刷子，仔細刷去陶人衣袍縫隙間的泥土。\n\n隨著泥土逐漸剝落，原本隱藏在衣襬上的圖案也露了出來。\n\n那並非尋常花紋。\n\n而是一張張細小的人臉。\n\n每張臉只有指甲大小，五官卻刻得十分清楚。有的緊閉雙眼，有的張口呼喊，還有幾張面孔扭曲得幾乎辨認不出人形。\n\n梁副官的神情頓時變了。\n\n「北山那尊石像！」\n\n魏戌俞立即走近。\n\n果然，陶人衣襬上的圖案，與山壁上那尊跪地石像極為相似。\n\n「兩件東西應當出自同一處。」\n\n魏戌俞拿起陶人，仔細查看上面的雕刻。\n\n「石像有頭，雙目緊閉；陶人卻沒有頭。除此之外，衣服上的人臉、衣襟的樣式，甚至連袖口的紋路都很相似。」\n\n蘇孟達聽了，連忙問道：\n\n「那尊石像是什麼姿勢？」\n\n梁副官將自己在北山見到的石像大致比畫了一遍。\n\n蘇孟達一面聽，一面端詳陶人的雙手。\n\n「一個伸手阻攔，一個雙手抓著胸口……」\n\n他從桌上取了張白紙，提筆將兩尊人像的姿勢簡略畫了下來。\n\n左邊是跪地石像。\n\n右邊是無首陶人。\n\n他畫得實在不怎麼樣，石像的身子歪歪斜斜，陶人的兩條胳膊更像是兩根插在身上的樹枝。\n\n梁副官看了片刻。\n\n「蘇爺，您畫的是人？」\n\n「不然呢？」\n\n「恕我直言，不大像。」\n\n蘇孟達瞪了他一眼。\n\n「我又不是來考畫師的！」\n\n魏戌俞將那張紙拉到自己面前。\n\n他倒是沒有在意蘇孟達的畫工，目光始終停留在兩尊人像的手勢上。\n\n過了片刻，他拿起鋼筆，在跪地石像的手掌旁畫了一條線，又在陶人胸前補上幾筆。\n\n「蘇爺，你看看，若將這兩個姿勢連起來呢？」\n\n蘇孟達俯身看去。\n\n魏戌俞所畫的線條，恰好將兩尊人像連成了前後相接的動作。\n\n第一個人伸手阻攔。\n\n第二個人雙手抓住胸口。\n\n而第二尊陶人的頭，已經不見了。\n\n蘇孟達臉上的笑容逐漸消失。\n\n「魏長官，您的意思是，這兩尊像刻的或許是同一個人？」\n\n「未必是同一個人，但可能是同一件事情的不同階段。」\n\n魏戌俞指向陶人衣袍上的面孔。\n\n「北山石像身上的這些臉，大多還算平靜。陶人身上的卻十分痛苦。若這不是裝飾，那麼雕刻者便是有意讓它們發生變化。」\n\n梁副官仔細看著桌上的兩幅圖。\n\n「一個在阻止什麼，另一個卻像是已經來不及了。」\n\n蘇孟達突然伸手將陶人翻了過來。\n\n「等等。」\n\n他重新拿起竹刷，清理陶人底部的泥土。\n\n先前辨認出的那個「殉」字依舊清晰。\n\n而在殉字旁邊，還有半個被泥土覆蓋的字。\n\n蘇孟達看了半天，又將陶人轉了幾個方向。\n\n「這不是兩個字。」\n\n魏戌俞俯身。\n\n「什麼意思？」\n\n「前頭這個不是字，是數目。」\n\n蘇孟達拿起鋼筆，在紙上寫下一個形狀古怪的符號。\n\n「古時有些地方記錄祭品數量，不用尋常文字，而用特定的記數符號。我曾經見過一批祭祀用的青銅器，底部就有類似的東西。」\n\n他指著陶人。\n\n「這尊陶人，恐怕只是整批器物中的一個。」\n\n梁副官問道：「能看出有多少個嗎？」\n\n蘇孟達搖了搖頭。\n\n「殘缺得太厲害，說不準。」\n\n魏戌俞將陶人接了過來。\n\n他的手指從那些細小的人臉上一一滑過。\n\n忽然，他注意到陶人底部有一處極淺的凹槽。\n\n那凹槽位於陶人的兩腳之間，呈細長的方形。\n\n「副官，取根細鐵絲來。」\n\n梁副官很快從外頭找來一截鐵絲。\n\n魏戌俞將鐵絲伸入凹槽，輕輕向內探去。\n\n鐵絲進去近兩寸，才碰到阻礙。\n\n「裡面是空的。」\n\n蘇孟達立刻湊了過來。\n\n魏戌俞將陶人晃了晃。\n\n裡頭傳出一聲極輕的碰撞。\n\n三人對視一眼。\n\n這陶人腹中，竟然還藏著東西。\n\n蘇孟達從布袋裡取出幾件細小的工具。\n\n他做古董生意多年，遇上內藏物件的古器並不稀奇，因此手上的動作十分熟練。\n\n只見他將一根細長的銅製工具伸入陶人底部，輕輕轉動了幾下。\n\n喀。\n\n陶人腳下那塊看似完整的底座，竟向外鬆開了些許。\n\n梁副官有些意外。\n\n「還有暗扣？」\n\n「古人的手藝，可不比咱們差。」\n\n蘇孟達小心取下底座。\n\n一團發黑的絲線從陶人腹中掉了出來。\n\n他用竹籤將絲線撥開。\n\n絲線之中，赫然纏著一截細小的骨頭。\n\n梁副官立即皺起眉頭。\n\n「人骨？」\n\n蘇孟達湊近瞧了瞧。\n\n那截骨頭長不過一寸，一端略粗，另一端則十分纖細，表面呈現出陳舊的黃褐色。\n\n「像是人的指骨。」\n\n魏戌俞問道：「絲線上還有什麼？」\n\n蘇孟達繼續拆開。\n\n除了骨頭，裡面還有幾縷極細的黑色髮絲，以及一小片折疊得十分整齊的薄金箔。\n\n金箔展開後，三人都看見了上頭刻著的一行小字。\n\n字體十分古老。\n\n魏戌俞將金箔移近窗邊，借著日光辨認。\n\n他幼時曾隨家中長輩學過數種古文字，雖然多年未曾使用，但大部分仍能認出。\n\n「生者……無名。」\n\n他停了片刻，繼續往下念。\n\n「死者……歸位。」\n\n梁副官低聲重複了一遍。\n\n「生者無名，死者歸位？」\n\n蘇孟達盯著桌上的骨頭與髮絲，神情愈發凝重。\n\n「我原先還以為，這東西是代替活人殉葬的陶俑。」\n\n魏戌俞轉向他。\n\n「現在呢？」\n\n蘇孟達將金箔放回桌上。\n\n「恐怕是拿活人做成的祭品。」\n\n屋內一時無人說話。\n\n蘇孟達繼續道：\n\n「有些古老的祭祀，會取人的毛髮、指甲或骨頭，放入與其身分相對應的器物中。這種做法，講究的是人與物之間有所牽連。」\n\n「尋常的陪葬陶俑，代替的是活人的身分。但這東西裡放了真正的人骨，還刻著這麼一段話……」\n\n他頓了頓。\n\n「造這批陶人的人，究竟是想代替活人，還是想將活人留在裡面，可就不好說了。」\n\n魏戌俞拿起那片金箔。\n\n「生者無名。」\n\n他想起第七節車廂中那個沒有五官的人。\n\n沒有姓名，沒有面容，甚至連聲音都不是自己的。\n\n「蘇爺，若一個人死後連自己的臉都沒有了，民間可有什麼說法？」\n\n蘇孟達看了他一眼。\n\n「您說的是車廂裡那個東西？」\n\n「嗯。」\n\n「這類傳說倒是不少。有的地方叫借面鬼，有的叫無相鬼。不過那些傳說裡的東西，大多會想方設法取得活人的面容。」\n\n梁副官道：「昨夜警衛亭的老周，一直說自己的臉被什麼東西拿走了。」\n\n蘇孟達轉過頭。\n\n「他是這麼說的？」\n\n「醒來之後，逢人便問自己的臉還是不是原來那張。」\n\n蘇孟達沉默了一會兒。\n\n「那他最好這幾日別照鏡子。」\n\n梁副官皺眉。\n\n「為何？」\n\n「怕他在鏡子裡看見不該看見的東西。」\n\n魏戌俞望向桌角。\n\n那裡還擺著兩盞一模一樣的信號燈。\n\n他伸手將其中一盞推到蘇孟達面前。\n\n「說到鏡子，你再看看這個。」\n\n另一盞燈\n蘇孟達將兩盞燈並排放好。\n\n他先查看了兩盞燈的外殼，又比對燈罩上的裂痕，最後將它們翻過來，仔細觀察底部的刻字。\n\n「這倒是真稀奇。」\n\n他拿起其中一盞燈，掂了掂重量。\n\n「連鏽斑都長在同一個地方？」\n\n梁副官點頭。\n\n「我們在警衛亭找到它們時，便是這副模樣。只是其中一盞異常冰冷，裡頭的燈芯也已經爛了。」\n\n蘇孟達將燈放回桌上。\n\n他盯著兩盞燈看了許久，忽然伸手將它們往左右各挪了些。\n\n「梁副官，勞煩替我找面鏡子。」\n\n「鏡子？」\n\n「對，能照見這兩盞燈便成。」\n\n梁副官很快取來一面小圓鏡。\n\n蘇孟達將鏡子立在桌上，先把一盞燈放到鏡前，再將另一盞放在鏡旁。\n\n三人仔細觀察。\n\n過了片刻，魏戌俞伸出手，指向兩盞燈底部的刻字。\n\n「等等。」\n\n他將其中一盞燈略微傾斜。\n\n刻在底部的「周」字本來便歪斜難辨，乍看之下確實毫無分別。\n\n然而仔細比對，才發現其中一個「周」字內側那一短橫，竟是朝著相反的方向收筆。\n\n蘇孟達將鏡子移近。\n\n鏡中的刻字與另一盞燈上的刻字，完全吻合。\n\n梁副官恍然大悟。\n\n「難怪我們先前看不出來。這字刻得太潦草了，若不是這麼比對，根本不容易察覺。」\n\n魏戌俞又轉動兩盞燈。\n\n燈罩上的裂痕、鐵皮上的刮痕，甚至底部一處不起眼的凹陷，也全都呈現相反的方向。\n\n「不是完全相同。」\n\n他放下手中的燈。\n\n「是左右顛倒。」\n\n蘇孟達點了點頭。\n\n「就像鏡中的東西，從鏡子裡拿了出來。」\n\n梁副官沉吟道：\n\n「黑珠上的北斗七星也是反的。這兩件事，莫非有什麼關聯？」\n\n魏戌俞將黑色珠子取來，放到鏡前。\n\n鏡中的七星，恰好恢復成尋常的排列。\n\n蘇孟達看著鏡面，突然一言不發。\n\n「蘇爺？」\n\n魏戌俞喚了他一聲。\n\n蘇孟達抬起頭。\n\n「魏長官，北山那節車廂，您是透過什麼東西看見的？」\n\n「車門上的玻璃。」\n\n「當時開門便看不見，關上門才能看見？」\n\n「不錯。」\n\n「門後的東西還會學你們說話？」\n\n梁副官道：「連語氣都一模一樣。」\n\n蘇孟達重新低下頭，望著鏡中的珠子。\n\n「我倒是想起一個地方。」\n\n魏戌俞拉開椅子坐下。\n\n「什麼地方？」\n\n「早些年我在北方收古董時，遇上過一個姓馮的老先生。那老先生祖上幾代都是替人看墳、尋墓的，手裡存著不少從未流傳出去的古書。」\n\n「有一回喝酒，他跟我提到過一種墓。」\n\n蘇孟達說到這裡，伸手將桌上的鏡子轉向魏戌俞。\n\n「尋常陵墓講究坐向、山勢、水脈，無論修得多大，總歸還是依著地上的規矩來建。」\n\n「但他說，有一種墓，修建的時候，裡頭的東西全是反的。」\n\n梁副官問道：「什麼叫全是反的？」\n\n「星辰是反的，方位是反的，連墓裡雕刻的人像，也未必朝著活人所認為的方向。」\n\n蘇孟達伸出手，輕輕敲了一下鏡面。\n\n「據那老先生所說，修建這種墓的人，認為人死之後所去的地方，並不在地下，也不在天上，而是在咱們所能看見的這個世界背後。」\n\n「就像一面鏡子。」\n\n「人站在鏡前，看得見裡頭的自己，卻永遠走不進去。」\n\n魏戌俞緩緩道：\n\n「除非有人找到進去的方法。」\n\n蘇孟達點了點頭。\n\n「那些人費盡心思修建陵墓，或許就是想在兩個世界之間，開出一扇門。」\n\n辦公室內再次安靜下來。\n\n梁副官望向兩盞信號燈。\n\n「那第七節車廂，莫非是進了那扇門？」\n\n「有這個可能。」\n\n蘇孟達嘆了口氣。\n\n「不過這話若是放在今日以前，誰跟我說有一節火車跑進陰曹地府，我非得請他喝兩碗醒酒湯不可。」\n\n魏戌俞沒有笑。\n\n「那位馮先生可曾說過，那座墓在什麼地方？」\n\n「沒說。」\n\n「人在哪裡？」\n\n「早死了。」\n\n魏戌俞抬眼看他。\n\n蘇孟達攤開雙手。\n\n「魏長官，這可怪不得我。那老先生當年便七十多歲了，我總不能為了今日這樁案子，提前讓他老人家再活十幾年吧？」\n\n梁副官無奈地看向窗外。\n\n魏戌俞沉吟片刻。\n\n「除此之外，他還提過什麼？」\n\n蘇孟達收起笑容，認真想了想。\n\n「倒還有一件事。」\n\n「說。」\n\n「他說，這種墓若真能修成，必定不是為了讓死人安息。」\n\n蘇孟達望著鏡面。\n\n「而是為了讓死了的人，再回來。」\n\n北山車站的電話\n桌上的茶早已涼透。\n\n窗外操練的士兵不知何時散去了，天色也逐漸暗了下來。\n\n魏戌俞站起身，從抽屜中取出那張畫有玄武圖案的古紙。\n\n他將它攤在桌上。\n\n蘇孟達原本正伸手去拿茶壺，目光掃過紙上的圖案，手卻停在了半空中。\n\n「玄武？」\n\n他放下茶壺，湊近仔細看了幾眼。\n\n隨後抬頭望向魏戌俞。\n\n「這不是你們家的東西嗎？」\n\n梁副官有些意外。\n\n魏戌俞並不奇怪蘇孟達能認出這幅圖。\n\n兩人相識多年，蘇孟達雖然不清楚魏家的全部往事，卻曾接觸過幾件魏家流傳下來的古物。\n\n「在第六節車廂找到的。」\n\n魏戌俞指著那顆血紅色的星宿。\n\n「這種印記，是魏家先人用來警示後人的。」\n\n蘇孟達問道：「警示什麼？」\n\n「有禁地被人動過。」\n\n蘇孟達盯著古紙，臉上再也看不見半點笑意。\n\n「這麼說，北山的墓，當年曾經由魏家的人看守？」\n\n「應當有關。」\n\n魏戌俞將古紙翻過來。\n\n「但魏家看守過的地方不只一處。這些年族中遺失的東西太多，究竟是哪一座墓，我現在也無法確定。」\n\n蘇孟達想了一會兒。\n\n「這倒不難。只要找到北山一帶早些年的山川圖誌，再看看有沒有關於大型陵墓的記載，總能查到些東西。」\n\n梁副官道：「明日我便派人去尋。」\n\n「不必等明日。」\n\n魏戌俞看了一眼窗外的天色。\n\n「今日能找多少，便找多少。另外，當年修建北山隧道的圖紙也一併找來。」\n\n「是。」\n\n梁副官正要離開，桌上的電話突然響了起來。\n\n鈴聲在安靜的辦公室中顯得格外刺耳。\n\n魏戌俞拿起聽筒。\n\n「哪裡？」\n\n「報告上校，北山車站。」\n\n電話另一端傳來一名士兵的聲音。\n\n「站上出了些情況。」\n\n魏戌俞皺起眉頭。\n\n「說。」\n\n「方才有弟兄在月台巡視，聽見第六節車廂裡有人說話。我們按照您的命令，沒有進去，只在外頭查看。」\n\n「說的什麼？」\n\n「聽不太清楚，好像是有人在哭，還有人一直喊著救命。」\n\n魏戌俞立即望向蘇孟達。\n\n「車門呢？」\n\n「兩道門都敞著，沒有動過。」\n\n「讓所有人遠離車廂。」\n\n「是！」\n\n對方應了一聲，卻沒有立即掛斷電話。\n\n魏戌俞聽見遠處有人在高聲說話。\n\n緊接著是一陣急促的腳步聲。\n\n「怎麼回事？」\n\n電話那頭的士兵似乎轉身詢問了什麼，過了片刻，才重新拿起聽筒。\n\n「上校，車廂裡好像多了些東西。」\n\n「什麼東西？」\n\n「紙錢。」\n\n魏戌俞的神情微微一變。\n\n「有白色的紙錢不斷從車門裡飛出來，月台上已經落了不少。」\n\n蘇孟達站起身。\n\n梁副官也停在門旁。\n\n電話那頭的聲音突然變得有些混亂。\n\n有人在喊著退後。\n\n有人似乎撞倒了什麼東西。\n\n隨後，一陣極為熟悉的聲音，從聽筒中隱隱傳了過來。\n\n嗚咿——\n\n細長而淒涼。\n\n魏戌俞握緊了聽筒。\n\n那是他今日在北山隧道中聽過的聲音。\n\n嗩吶。\n\n「立即撤出月台！」\n\n「是！上校！」\n\n電話另一頭傳來急促的腳步聲。\n\n嗩吶聲卻越來越清晰。\n\n過了片刻，士兵的聲音再次響起。\n\n「上校……」\n\n「怎麼了？」\n\n「有人從車廂裡走出來了。」\n\n魏戌俞沉聲道：\n\n「不要靠近，看清楚是什麼東西。」\n\n那名士兵似乎往遠處跑了幾步，呼吸變得十分急促。\n\n「白衣服……提著燈籠……」\n\n梁副官臉色一變。\n\n「是隧道裡那支送葬隊伍？」\n\n蘇孟達猛然轉頭，看向桌上的無舌銅鈴。\n\n「魏長官，快讓他們離開車站！」\n\n魏戌俞立即對著電話喝道：\n\n「全體撤離！不准留在站內！」\n\n然而話音剛落，聽筒中忽然傳來一陣刺耳的雜音。\n\n電話斷了。\n\n魏戌俞放下聽筒，抓起椅背上的軍大衣。\n\n「副官，備車。」\n\n「是！」\n\n梁副官立即往外走。\n\n蘇孟達也提起布袋，手忙腳亂地將桌上的幾件工具收了進去。\n\n魏戌俞看向他。\n\n「你也去？」\n\n「您都碰上這麼大的事了，我還能回家睡覺不成？」\n\n蘇孟達將布袋往肩上一挎。\n\n「再說，活了這麼多年，抬棺材的紙人倒還沒親眼瞧見過。這趟若是不去，往後說不定得後悔一輩子。」\n\n魏戌俞看了他一眼。\n\n「去了便跟緊些，別擅自行動。」\n\n「明白。魏長官叫我往東，我絕不往西。」\n\n梁副官從門外探進身子。\n\n「蘇爺，您若能少說兩句，咱們現在已經在樓下了。」\n\n蘇孟達正欲還嘴，魏戌俞已經走到了門口。\n\n就在三人即將離開辦公室時，身後突然傳來一聲輕響。\n\n叮。\n\n三人同時停住腳步。\n\n蘇孟達臉上的神情瞬間僵住。\n\n魏戌俞緩緩轉過身。\n\n辦公桌上，那只沒有鈴舌的銅鈴依舊靜靜地放在原處。\n\n沒有風。\n\n也沒有人碰它。\n\n叮。\n\n又響了一聲。\n\n梁副官望向魏戌俞。\n\n「上校……」\n\n蘇孟達立刻抬手，示意他不要出聲。\n\n他小心翼翼地走回桌前，盯著銅鈴看了片刻，忽然注意到旁邊那面小圓鏡。\n\n鏡子仍立在桌上。\n\n鏡中可以看見辦公桌、木盒、散落的古物，以及後方那扇緊閉的窗戶。\n\n蘇孟達慢慢俯下身。\n\n「魏長官，過來瞧瞧。」\n\n魏戌俞與梁副官走到桌旁。\n\n蘇孟達指向鏡中的銅鈴。\n\n三人看得清清楚楚。\n\n鏡外的銅鈴沒有鈴舌。\n\n鏡中的銅鈴，卻有。\n\n一根漆黑細長的東西懸在鈴腹之中，正微微晃動。\n\n叮。\n\n銅鈴第三次響了。\n\n梁副官下意識望向真正的銅鈴。\n\n它依然沒有動。\n\n響聲是從鏡子裡傳出來的。\n\n蘇孟達的額頭逐漸滲出一層冷汗。\n\n「魏長官，方才我有件事沒說。」\n\n魏戌俞看向他。\n\n「什麼事？」\n\n「那位馮先生當年說過，若有朝一日，人在鏡子裡看見與外頭不一樣的東西，千萬不要盯著鏡面看太久。」\n\n梁副官問道：「為什麼？」\n\n蘇孟達嘴唇動了動。\n\n還未來得及回答，鏡中的景象便發生了變化。\n\n一盞白色燈籠，從鏡中辦公室的門外緩緩飄了進來。\n\n緊接著，是第二盞。\n\n魏戌俞猛然回頭。\n\n真正的辦公室門口空無一人。\n\n他重新望向鏡面。\n\n兩個頭戴白帽、雙頰塗著鮮紅胭脂的紙人，已經站在鏡中的辦公室內。\n\n它們手提燈籠，朝三人所在的方向深深鞠了一躬。\n\n隨後，幾個披麻戴孝的人陸續走了進來。\n\n八名抬棺人緊隨其後。\n\n那口熟悉的黑漆棺材，被緩緩放到了鏡中的地板上。\n\n梁副官的手已經摸向腰間。\n\n蘇孟達卻一把按住他的胳膊。\n\n「別動！」\n\n鏡中的紙人慢慢抬起頭。\n\n它們沒有看梁副官。\n\n也沒有看蘇孟達。\n\n兩雙漆黑的眼珠，直直望向魏戌俞。\n\n接著，其中一個紙人從懷中取出一塊黑色木牌，恭恭敬敬地擺在棺材前方。\n\n那是一塊靈位。\n\n上頭以鮮紅色的字跡，寫著一個人的姓名。\n\n魏戌俞看清那幾個字，神情頓時沉了下來。\n\n梁副官也怔住了。\n\n因為那塊靈位上寫的，赫然是——\n\n魏戌俞之靈位。\n\n而鏡中的棺材裡，突然傳出了魏戌俞自己的聲音。\n\n「副官。」\n\n「開棺。」\n\n（第三回完）"}, {"n": 4, "title": "陰陽借道", "body": "「副官。」\n\n「開棺。」\n\n那聲音從鏡中的棺材裡傳來，不緊不慢，甚至帶著魏戌俞平日下達軍令時特有的語氣。\n\n梁副官站在桌旁，握槍的手緊了緊。\n\n魏戌俞冷眼望著鏡面。\n\n「我倒要看看，裡頭躺的是什麼東西。」\n\n蘇孟達一聽，連忙伸手攔住他。\n\n「魏長官，使不得！人家連您的靈位都備好了，就差您老人家親自進去躺著了。」\n\n魏戌俞皺眉看向他。\n\n「有辦法沒有？」\n\n「容我想想。」\n\n「快些。」\n\n鏡中的兩個紙人依舊站在棺材兩側，臉上掛著僵硬的笑容。\n\n黑色靈位上的紅字格外刺眼。\n\n蘇孟達從布袋中翻出一塊黑布，正要蓋住鏡面，魏戌俞卻伸手制止了他。\n\n「等等。」\n\n「魏長官，您還想瞧什麼？」\n\n魏戌俞指著鏡中的辦公室。\n\n「看地上。」\n\n梁副官俯身望去。\n\n鏡中的地板上散落著許多白色紙錢，八名抬棺人站在黑棺周圍，寬大的衣袍幾乎遮住了整片地面。\n\n除此之外，並沒有什麼特別之處。\n\n然而仔細看了片刻，梁副官忽然發現，那些紙錢底下似乎還壓著一層東西。\n\n「是水？」\n\n魏戌俞點了點頭。\n\n鏡中的地板上有一層淺淺的積水，水面倒映著辦公室的桌椅，以及那幾盞散發幽光的白色燈籠。\n\n可真正的辦公室內，地板分明是乾的。\n\n「水是從棺材底下流出來的。」\n\n魏戌俞順著水跡看去。\n\n黑漆棺木的底部正在不斷滲水，幾縷水草從棺材與地板之間的縫隙露了出來。\n\n那些水草細長發黑，隨著水流緩緩擺動。\n\n蘇孟達也湊近瞧了瞧。\n\n「怪了，難不成這口棺材原先是泡在水裡的？」\n\n魏戌俞沒有回答。\n\n他注意到棺材底下流出的水，並沒有朝四周散開。\n\n而是在往他們所在的方向流動。\n\n水面逐漸漫過鏡中的辦公桌。\n\n一滴水珠，忽然從真正的鏡框下方落了下來。\n\n啪嗒。\n\n三人同時低頭。\n\n桌面上，多了一小灘水。\n\n蘇孟達臉色一變，立即將黑布往鏡上一蓋。\n\n幾乎就在同一瞬間，桌上的銅鈴劇烈震動起來。\n\n叮叮叮叮——\n\n清脆的鈴聲連成一片，震得人耳膜發疼。\n\n鏡子也開始晃動。\n\n黑布底下，彷彿有什麼東西正用力向外頂撞，原本平整的布面逐漸鼓了起來。\n\n梁副官迅速伸手按住鏡框。\n\n「上校，裡頭有東西！」\n\n魏戌俞一把抓起桌上的銅鈴，將它從鏡旁移開。\n\n鈴聲戛然而止。\n\n黑布下方的動靜也隨之消失。\n\n辦公室重新安靜下來。\n\n過了好一會兒，蘇孟達才慢慢吐出一口氣。\n\n「好險。」\n\n梁副官仍按著鏡框。\n\n「蘇爺，這樣就沒事了？」\n\n「沒事？」\n\n蘇孟達指著桌上那灘水。\n\n「梁副官，人家的水都流到咱們這兒來了。您要是覺得沒事，不如今晚把這面鏡子抱回房裡，看看還能流出些什麼。」\n\n梁副官面無表情地望著他。\n\n「您自己留著吧。」\n\n魏戌俞將銅鈴放回木盒，合上盒蓋。\n\n「蘇爺，這面鏡子原本是尋常物件，為何偏偏在銅鈴響起之後才出現異象？」\n\n蘇孟達收斂笑容，仔細想了想。\n\n「恐怕不是鏡子有問題，而是這只鈴。」\n\n他伸手敲了敲木盒。\n\n「魏長官，您還記不記得我方才說過的話？古人相信，活人與死人所處的地方，中間隔著一層看不見的東西。平日各走各的道，誰也碰不著誰。」\n\n「可若有一件器物，能讓兩邊互相聽見聲音，甚至看見彼此……」\n\n梁副官接過話。\n\n「就有可能讓它們找到過來的路？」\n\n「不錯。」\n\n蘇孟達望向被黑布蓋住的鏡子。\n\n「咱們方才把銅鈴放在鏡子旁，興許是無意間替它們指了條路。」\n\n魏戌俞沉默片刻。\n\n「北山車站沒有銅鈴，卻同樣出現了送葬隊伍。」\n\n「所以這只鈴未必是唯一能引路的東西。」\n\n蘇孟達看向桌上那些尚未收拾的古物。\n\n「說不定咱們帶回來的這些東西，有一件算一件，全都與那頭有關。」\n\n魏戌俞低頭望了一眼桌上的水。\n\n水色混濁，還帶著極淡的腥氣。\n\n他取來一張白紙，從水中挑起一縷細小的黑色水草。\n\n那水草剛離開水面，便迅速蜷縮起來，轉眼間化作一撮黑灰。\n\n梁副官看得十分清楚。\n\n「與隧道口的紙錢一樣。」\n\n魏戌俞點頭。\n\n「先把這些東西分開存放。鏡子不要掀開，也別讓旁人碰。」\n\n他拿起軍大衣。\n\n「走，去北山。」\n\n入夜的車站\n三輛軍車沿著山路疾馳。\n\n天色已經完全暗了下來。\n\n北山的雨雖然停了，山間卻起了濃霧。車頭的燈光照出不到數丈遠，兩側的樹木時隱時現，彷彿有無數黑影立在山路旁。\n\n蘇孟達坐在後座，懷裡抱著他的布袋。\n\n車子經過一段崎嶇的山路時，他整個人猛地向上一顛，腦袋險些撞上車頂。\n\n「魏長官，您這車若再開快些，咱們倒也不必去找那口棺材了。」\n\n坐在前座的梁副官回過頭。\n\n「蘇爺若是不舒服，可以閉上眼睛休息。」\n\n「梁副官，你這話說得輕巧。眼睛閉上了，屁股可還是疼的。」\n\n魏戌俞望著窗外。\n\n「蘇爺。」\n\n「哎。」\n\n「帶來的東西都齊了？」\n\n蘇孟達拍了拍懷中的布袋。\n\n「齊了。我吃飯的傢伙都在這兒，今晚若是見著什麼稀奇玩意兒，保管不讓它白白跑了。」\n\n梁副官道：「但願如此。」\n\n「你怎麼對我這般沒信心？」\n\n梁副官轉了回去。\n\n「您少說幾句，我便多幾分信心。」\n\n蘇孟達張了張嘴，轉頭望向魏戌俞。\n\n魏戌俞難得露出了一絲笑意，卻沒有替他說話。\n\n蘇孟達只得抱著布袋，悻悻地靠回椅背上。\n\n不久，前方的濃霧中出現了幾點燈光。\n\n北山車站到了。\n\n與白日不同，此刻車站外聚集了大批站務人員及士兵。幾盞臨時架起的燈照亮了空地，地上堆著匆忙搬出來的行李、被褥，還有一些來不及收拾的雜物。\n\n站長披著一件厚棉衣，縮在人群裡，臉色比白日更加難看。\n\n汽車剛停穩，一名軍官便快步迎了上來。\n\n「上校！」\n\n魏戌俞下了車。\n\n「站裡的人都撤出來了？」\n\n「大部分都撤出來了，只是還有三名弟兄沒有出來。方才派人進去找，結果走到候車室便聽見有人吹嗩吶，誰也不敢再往前。」\n\n魏戌俞看了一眼車站。\n\n候車室內還亮著燈。\n\n透過幾扇玻璃窗，能看見裡頭整整齊齊的長椅，以及掛在牆上的時刻表。\n\n一切看起來十分正常。\n\n「電話為何斷了？」\n\n軍官神色有些古怪。\n\n「線路沒有損壞。只是後來無論往哪裡打，聽筒裡都有人在哭。」\n\n蘇孟達聽見這話，抬頭望了望車站屋頂。\n\n「好重的陰氣。」\n\n梁副官看向他。\n\n「您看得見？」\n\n「看不見。」\n\n「那您怎麼知道？」\n\n蘇孟達朝站長的方向努了努嘴。\n\n「你瞧他那張臉，活像剛從棺材裡爬出來的。」\n\n梁副官深吸了一口氣，決定不再理會他。\n\n魏戌俞從士兵手中接過風燈。\n\n「副官，蘇爺，跟我進去。」\n\n身後的軍官立即上前。\n\n「上校，要不要再帶幾個弟兄？」\n\n「不用。讓人守住外頭，沒我的命令，不准進去。」\n\n「是！」\n\n三人穿過車站大門。\n\n就在踏入候車室的一刻，蘇孟達忽然伸手抓住了梁副官的胳膊。\n\n「等等。」\n\n梁副官回過頭。\n\n「怎麼了？」\n\n蘇孟達指向門口上方。\n\n那裡懸掛著一盞尋常的電燈。\n\n燈光照在地板上，清楚映出了魏戌俞與梁副官的影子。\n\n蘇孟達低頭看了看自己的腳下。\n\n他的影子也在。\n\n可是，地上還有第四道影子。\n\n那道影子就站在三人中間。\n\n頭頂似乎戴著一頂高高的帽子。\n\n蘇孟達慢慢抬起頭。\n\n三人中間空無一人。\n\n他又低頭看向地面。\n\n那道影子依然存在。\n\n「魏長官。」\n\n「看見了。」\n\n魏戌俞並沒有回頭，而是將手中的風燈向左移了些。\n\n他們三人的影子隨著光源移動，地上第四道影子卻始終立在原處。\n\n梁副官仔細看了片刻。\n\n「這影子的方向不對。咱們的影子都朝著裡頭，只有它朝外。」\n\n蘇孟達緩緩蹲下身。\n\n那影子的頭部狹長，兩肩微微下垂，右手似乎還提著一樣東西。\n\n是一盞燈籠。\n\n「方才那些人說，送葬隊伍已經出了車廂。」\n\n蘇孟達低聲道。\n\n「看來人家還沒走遠。」\n\n他從布袋裡取出一只小瓷瓶，倒了少許白色粉末在指間。\n\n梁副官問道：「這又是什麼？」\n\n「麵粉。」\n\n梁副官愣了一下。\n\n「麵粉？」\n\n「不然你以為是仙丹？」\n\n蘇孟達將粉末輕輕灑向地上那道影子。\n\n細白的麵粉落在影子邊緣，竟有一部分沒有落到地面，而是在半空中停住了。\n\n彷彿黏在一件看不見的衣服上。\n\n蘇孟達原本還帶著幾分笑意的臉，頓時僵住。\n\n魏戌俞迅速將風燈向前一探。\n\n那團懸在半空的白色粉末突然散開。\n\n地上的影子也不見了。\n\n候車室深處傳來一陣細碎的腳步聲。\n\n嗒、嗒、嗒。\n\n聲音很快消失在通往月台的門後。\n\n蘇孟達站起身，拍了拍手。\n\n「這回可真長見識了。」\n\n魏戌俞望向前方。\n\n「走吧，留意腳下和頭頂。」\n\n三人沿著候車室向內走去。\n\n牆上的掛鐘停在三點十七分。\n\n售票窗口內空無一人，桌上放著一本翻開的記事簿，鋼筆還擱在硯台旁。\n\n靠牆的幾張長椅上，留有站務人員撤離時未能帶走的茶杯及衣物。\n\n魏戌俞經過售票窗口時，忽然停下腳步。\n\n「副官。」\n\n梁副官順著他的目光望去。\n\n窗口旁邊掛著一塊木牌。\n\n上頭原本應該寫著售票二字。\n\n可那兩個字，竟然是反的。\n\n梁副官走到牆邊，查看另一塊指示月台方向的木牌。\n\n同樣是反的。\n\n蘇孟達臉上的笑容漸漸消失。\n\n他抬頭看了一眼掛鐘。\n\n「二位，你們再看看時辰。」\n\n魏戌俞望向鐘面。\n\n方才停在三點十七分的指針，此刻已經走到了三點十六分。\n\n秒針一格一格地跳動。\n\n卻是朝著相反的方向。\n\n梁副官立即轉身，望向他們進來的大門。\n\n門外的軍車不見了。\n\n士兵不見了。\n\n原本燈火通明的車站空地，只剩下一片濃得化不開的白霧。\n\n「上校，咱們進來的地方變了。」\n\n魏戌俞盯著門外的濃霧。\n\n片刻後，他轉頭看向蘇孟達。\n\n「蘇爺。」\n\n「在。」\n\n「咱們恐怕已經走到你說的另一頭了。」\n\n不在人間的月台\n梁副官快步走到車站大門前，試著將風燈伸入霧中。\n\n火苗微微晃動。\n\n一股極寒的氣息從門外湧了進來，吹得他手背上的汗毛根根豎起。\n\n「上校，外頭聽不見任何聲音。」\n\n魏戌俞走到他身旁。\n\n他們進來之前，車站外至少有五六十人。即使隔著濃霧，也不可能連一點人聲都聽不見。\n\n蘇孟達從布袋中取出一枚銅錢，朝門外扔了出去。\n\n銅錢沒入白霧。\n\n過了半晌，竟沒有傳來落地的聲音。\n\n「得，這門暫且是走不得了。」\n\n蘇孟達退回兩人身旁。\n\n「魏長官，您說咱們進來時也沒做什麼出格的事，怎麼一眨眼便到了這鬼地方？」\n\n魏戌俞沉吟道：\n\n「進門時，地上那道影子是朝外的。或許從那時候開始，咱們所在的地方就已經變了。」\n\n梁副官重新看向候車室。\n\n「先前失蹤的三名弟兄，會不會也遇上了同樣的事情？」\n\n「有可能。」\n\n魏戌俞將風燈舉高。\n\n「先找人，再想辦法出去。」\n\n三人離開候車室，穿過通往月台的走廊。\n\n越往外走，四周的霧氣便越重。\n\n月台上的燈忽明忽暗，鐵軌向兩側無限延伸，遠處的山峰早已消失不見。\n\n原本停放軍列的位置，如今空空蕩蕩。\n\n梁副官皺起眉頭。\n\n「火車也不見了。」\n\n魏戌俞正要開口，遠處忽然響起一陣嘈雜的聲音。\n\n有人在交談。\n\n有人在咳嗽。\n\n還有孩童哭鬧的聲音。\n\n那些聲音從月台另一端傳來，逐漸變得清晰。\n\n蘇孟達伸長脖子望了望。\n\n「這地方還有旅客？」\n\n霧氣中，慢慢出現了幾道人影。\n\n一個提著藤編行李箱的男人。\n\n一個懷抱嬰孩的婦人。\n\n幾名穿長衫、戴圓帽的老人。\n\n緊接著，更多的人從霧裡走了出來。\n\n他們穿著各不相同的衣服，有些是當下常見的長衫短褂，有些卻是數十年前的樣式。當中甚至還有幾個梳著髮髻、身穿古式衣袍的人。\n\n這些人陸續來到月台，沿著鐵軌排成一列。\n\n他們不吵不鬧，手裡都拿著一張巴掌大的白紙，安靜地等待著。\n\n梁副官將手搭在槍套上。\n\n「上校，他們的衣服……」\n\n「我看見了。」\n\n魏戌俞拉住蘇孟達，三人退至一根石柱後方。\n\n一名提著藤箱的男人從他們面前經過。\n\n風燈的光照在他的臉上。\n\n那男人面色灰白，左邊太陽穴上有一道極深的傷口，傷口周圍的血跡早已乾涸。\n\n他卻渾然不覺，依舊提著藤箱，慢悠悠地走向人群。\n\n後頭那名抱著嬰孩的婦人也走了過來。\n\n她低著頭，輕輕拍打懷中的包袱，嘴裡哼著不知名的童謠。\n\n包袱中傳出嬰孩的哭聲。\n\n蘇孟達忍不住多瞧了一眼。\n\n婦人懷裡抱著的，根本不是孩子。\n\n而是一只用紅布包裹的陶罐。\n\n陶罐上貼著一張發黃的紙，寫著幾行模糊的小字。\n\n那哭聲，正是從罐子裡傳出來的。\n\n蘇孟達慢慢縮回腦袋。\n\n「魏長官。」\n\n「嗯？」\n\n「這地方的旅客，恐怕沒有一個是活人。」\n\n魏戌俞的目光從那些人身上一一掃過。\n\n他注意到，無論男女老少，所有人手裡拿著的白紙，大小與樣式都完全一致。\n\n其中一張被人垂在身側，恰好讓他看見了正面的文字。\n\n上頭寫著姓名、生辰。\n\n末尾還有一個鮮紅的「殉」字。\n\n魏戌俞想起那尊無首陶人腹中的金箔。\n\n生者無名，死者歸位。\n\n他還沒來得及細想，月台另一端忽然傳來了一聲呼喊。\n\n「上校！」\n\n梁副官立即回頭。\n\n一個身穿軍服的人從霧中跑了出來。\n\n「上校！梁副官！」\n\n那人滿頭大汗，神情驚慌，跑到近處時，險些一頭撞上石柱。\n\n梁副官認出了他。\n\n「小陳？」\n\n那士兵連忙點頭。\n\n「是我！梁副官，您可算來了！我在這兒繞了半天，怎麼走都走不出去！」\n\n魏戌俞上下打量了他一眼。\n\n「另外兩個人呢？」\n\n「在前頭！有一個受了傷，我出來找路，原本想回去叫人的，結果……」\n\n士兵說到這裡，忽然望向月台上的人群。\n\n他的臉色變得煞白。\n\n「他們又來了。」\n\n蘇孟達問道：\n\n「你見過這些東西？」\n\n士兵點頭。\n\n「方才也是這樣，來了好多人，在月台上等車。過不了多久就會有火車過來，等人都上了車，這地方又會變成原來的樣子。」\n\n魏戌俞問道：「你見過幾次？」\n\n「三次了。」\n\n三人互望一眼。\n\n若這士兵所言不假，此地的情形恐怕一直在反覆重演。\n\n「帶路。」\n\n魏戌俞說道。\n\n「先去找另外兩個人。」\n\n小陳連忙轉身，沿著月台向前走去。\n\n可才走了沒幾步，梁副官便突然伸手拉住了魏戌俞。\n\n「上校。」\n\n魏戌俞停下腳步。\n\n梁副官指了指前方的小陳，又指了指地面。\n\n蘇孟達低頭一看，臉色頓時變了。\n\n那名士兵走過的地方，竟沒有留下任何腳印。\n\n月台上明明積著一層薄水，他的軍靴每一次落地，卻連半點水花也沒有濺起。\n\n魏戌俞抬起頭。\n\n「小陳。」\n\n前方的人停了下來。\n\n「上校？」\n\n「過來。」\n\n士兵轉過身，露出一個十分自然的笑容。\n\n「上校，就在前頭了。您快跟我來吧。」\n\n魏戌俞沒有動。\n\n那士兵等了一會兒，又開口道：\n\n「您快跟我來吧。」\n\n他的笑容絲毫未變。\n\n「您快跟我來吧。」\n\n蘇孟達悄悄往後退了一步。\n\n「魏長官，您這兵，說起話來倒像個留聲機。」\n\n魏戌俞拔出手槍。\n\n「副官，後退。」\n\n就在這時，士兵的腦袋猛地向旁一歪。\n\n原本端正的五官，竟像是被一隻無形的手抹過一般，逐漸變得平坦。\n\n鼻梁消失了。\n\n嘴唇消失了。\n\n最後，連那雙眼睛也慢慢陷入皮膚之中。\n\n只剩下一張空白的臉。\n\n「上校。」\n\n它重新開口。\n\n這次用的，卻是梁副官的聲音。\n\n「您快跟我來吧。」\n\n魏戌俞抬槍便打。\n\n砰！\n\n子彈穿過那東西的肩膀，將它打得向後踉蹌了半步。\n\n它低頭看了看自己的肩膀，隨即重新抬起那張沒有五官的臉。\n\n下一刻，它的四肢突然向後折去。\n\n整個身體仰倒在地，雙手雙腳以極為古怪的姿勢撐住地面，腹部高高拱起。\n\n蘇孟達瞪大眼睛。\n\n「這東西怎麼還能這樣走路？」\n\n話音未落，那東西已經貼著地面疾速爬來。\n\n梁副官立即開槍。\n\n魏戌俞側身避開迎面撲來的手臂，一腳踹中它的腰腹。\n\n那東西被踢得撞上石柱，卻像沒有骨頭一般，四肢順勢攀住柱身，三兩下便爬到了月台頂棚。\n\n梁副官將燈往上一照。\n\n「上校，它的手！」\n\n那東西的兩隻手掌緊貼著頂棚。\n\n每隻手上，都有六根手指。\n\n魏戌俞頓時想起警衛亭玻璃上的掌印。\n\n「就是昨夜去找老周的那種東西！」\n\n頂棚上，那張空白的臉緩緩轉向三人。\n\n「魏長官。」\n\n這一回，是蘇孟達的聲音。\n\n蘇孟達氣得抬頭。\n\n「學什麼不好，偏學我說話！」\n\n那東西忽然從頂棚撲了下來。\n\n魏戌俞一把將蘇孟達拉向身後，梁副官則從側面迎上，抬腿將它踢離原本的方向。\n\n它重重摔在月台邊緣。\n\n尚未來得及爬起，遠處突然傳來一聲汽笛。\n\n嗚——\n\n原本排在鐵軌旁的那些旅客，齊刷刷地轉過頭。\n\n那東西也停止了動作。\n\n它趴在地上，一動不動。\n\n濃霧深處，一點昏黃的光芒逐漸亮起。\n\n鐵軌開始震動。\n\n一列火車，正朝月台駛來。\n\n死人乘坐的火車\n三人迅速退回石柱後方。\n\n車頭從白霧中緩緩現身。\n\n那是一輛極為老舊的蒸汽火車，黑漆車身布滿鏽斑，車頭懸掛著兩盞暗紅色的燈。\n\n煙囪裡沒有冒出煤煙。\n\n只有一縷縷灰白色的霧氣，沿著車頭向下流淌。\n\n火車停穩之後，車門相繼打開。\n\n一股熟悉的腐木與香灰氣味從車內飄了出來。\n\n蘇孟達探出半個腦袋。\n\n「這車倒是比魏長官的軍車還安靜。」\n\n梁副官低聲道：\n\n「蘇爺，您若再往外探，那些東西可就瞧見您了。」\n\n蘇孟達立即縮了回來。\n\n魏戌俞目光緊盯著火車。\n\n這列車與尋常貨運列車不同。\n\n每節車廂的窗戶都十分狹窄，窗框上雕有繁複的花紋。車身側面還掛著一塊塊木製牌匾，上頭刻著古老的文字。\n\n乍看之下像是車廂編號。\n\n細看之後，他卻辨認出了幾個字。\n\n一殿。\n\n二殿。\n\n三殿。\n\n他順著火車向後望去。\n\n每節車廂都有一個不同的殿名。\n\n這列火車，倒像是將一整座地下宮殿拆成了數個部分，裝在鐵軌之上。\n\n旅客們開始依序上車。\n\n一個身穿黑色長袍的人站在車門旁，接過每個人手中的白紙，看也不看，便將它們投入身旁的一只銅盆。\n\n紙張落入銅盆，立即燃起幽綠色的火焰。\n\n每燒掉一張紙，車廂內便亮起一盞燈。\n\n魏戌俞看得十分仔細。\n\n「蘇爺，那些人手上的東西不像車票。」\n\n蘇孟達點了點頭。\n\n「我也看出來了。那上頭有姓名、生辰，倒像是從前祭祀時寫給亡者的疏文。」\n\n「為何末尾還寫著殉字？」\n\n「這便奇怪了。」\n\n蘇孟達望著那些陸續上車的人。\n\n「若是尋常送亡魂上路，沒必要特意寫這個字。除非這些人不是自己要去，而是被什麼東西收走的。」\n\n梁副官忽然抓住魏戌俞的袖子。\n\n「上校，您看那邊！」\n\n距離他們約莫二十步遠的地方，三個身穿軍服的人正混在人群之中。\n\n其中兩人架著另一人的胳膊，緩慢地朝車門移動。\n\n正是失蹤的那三名士兵。\n\n他們個個低垂著頭，眼神空洞，手中也拿著白色紙張。\n\n魏戌俞立刻從石柱後走了出來。\n\n「副官，去救人！」\n\n梁副官應聲而出。\n\n蘇孟達連忙跟上。\n\n三人穿過月台，迅速靠近那幾名士兵。\n\n走在最前頭的恰好是小陳。\n\n魏戌俞一把扣住他的肩膀。\n\n「醒醒！」\n\n小陳抬起頭。\n\n他的瞳孔散得很開，目光呆滯，對眼前的人沒有任何反應。\n\n「上校？」\n\n他喃喃念了一句，隨即又轉向車門。\n\n梁副官抓住另外兩名士兵，試圖將他們從人群中拉出來。\n\n然而這三人像是著了魔一般，雙腳仍在不斷向前挪動。\n\n蘇孟達急忙拿起小陳手中的白紙。\n\n紙上寫著他的姓名。\n\n生辰下方，還多了一行紅字。\n\n蘇孟達只看了一眼，便猛地將白紙撕成兩半。\n\n小陳渾身一震。\n\n他突然大口喘息起來，像是剛從水裡被人撈出來。\n\n「上校！」\n\n「醒了？」\n\n小陳茫然地望著四周。\n\n「我……我怎麼會在這兒？」\n\n「回去再說。」\n\n魏戌俞扶住他的肩膀，將他帶離人群。\n\n梁副官與蘇孟達如法炮製，將另外兩名士兵手中的紙也一併撕去。\n\n兩人很快恢復了神智。\n\n可就在最後一張白紙被撕開時，站在車門旁的黑袍人，忽然停止了收取紙張的動作。\n\n它慢慢抬起頭。\n\n月台上的旅客也一個接著一個地停了下來。\n\n蘇孟達回頭望了一眼。\n\n「魏長官，咱們恐怕壞了人家的好事。」\n\n魏戌俞將受傷的士兵交給梁副官。\n\n「走！」\n\n車門旁的黑袍人張開嘴巴。\n\n沒有發出任何聲音。\n\n然而整列火車的車窗，卻在同一時間傳出了劇烈的拍打聲。\n\n砰！砰！砰！\n\n一隻隻蒼白的手掌貼上玻璃。\n\n緊接著，是無數張驚恐而扭曲的面孔。\n\n「放我出去！」\n\n「救命！」\n\n「開門啊！」\n\n車廂裡突然爆發出此起彼伏的哭喊聲。\n\n整座月台頓時亂成一片。\n\n那些原本安靜等待的旅客，紛紛朝魏戌俞等人轉過身來。\n\n蘇孟達剛跑出幾步，忽然感到腳下一沉。\n\n低頭一看，竟是一隻手從月台邊緣的縫隙中伸了出來，死死扣住他的腳踝。\n\n「魏長官！」\n\n魏戌俞回身抓住他的胳膊，猛地將他向前一拉。\n\n那隻手應聲從縫隙中脫出。\n\n蘇孟達踉蹌了兩步，低頭一瞧。\n\n腳踝上還掛著那隻斷手。\n\n「好大的見面禮！」\n\n他連忙甩腿將斷手踢開。\n\n梁副官一面扶著傷兵，一面高聲喊道：\n\n「上校，前面也有東西！」\n\n月台出口處，不知何時已站著兩個提白燈籠的紙人。\n\n它們並肩而立，將通往候車室的門堵得嚴嚴實實。\n\n魏戌俞環顧四周。\n\n左側是火車。\n\n右側是車站的磚牆。\n\n身後大批亡魂正緩緩圍了上來。\n\n「蘇爺，有沒有別的路？」\n\n蘇孟達抬頭看了一眼前方的玻璃窗。\n\n忽然，他怔住了。\n\n「有！」\n\n魏戌俞立即望向他。\n\n蘇孟達指著候車室外牆上的一扇玻璃門。\n\n「魏長官，您看那塊玻璃！」\n\n玻璃映著月台上的燈光。\n\n然而倒影之中，沒有那列火車。\n\n沒有白衣旅客。\n\n也沒有那些提著燈籠的紙人。\n\n玻璃裡的月台空空蕩蕩。\n\n遠處，還能看見幾名持槍警戒的士兵。\n\n那才是真正的北山車站。\n\n鏡中之門\n蘇孟達率先衝到玻璃門旁。\n\n他伸手握住門把，用力一拉。\n\n門後是一間空蕩蕩的屋子。\n\n裡頭積滿灰塵，幾張腐朽的桌椅堆在牆角，根本不是他們在玻璃裡看見的地方。\n\n「怎麼回事？」\n\n梁副官扶著傷兵趕了過來。\n\n蘇孟達將門重新關上。\n\n玻璃中又出現了那座正常的月台。\n\n「怪了，明明就在這兒，怎麼一開門便沒了？」\n\n魏戌俞快步走近。\n\n「蘇爺，把門慢慢打開。」\n\n蘇孟達依言照做。\n\n隨著玻璃門向內轉動，倒影中的月台也開始改變角度。\n\n原本站在遠處的幾名士兵逐漸移出玻璃範圍，取而代之的，是候車室門口的一排長椅。\n\n魏戌俞盯著玻璃中的景象，突然想起白日在第六節車廂內看見的那扇門。\n\n當時他一開門，第七節車廂便會消失。\n\n可那道門並未真的將兩個地方連在一起，至少從他們所在的那一頭，無法直接走過去。\n\n眼下這扇玻璃門卻有些不同。\n\n隨著門板轉動，玻璃中的景象也在轉動。\n\n就像一扇能夠改變方向的窗戶。\n\n「副官，把燈給我。」\n\n魏戌俞接過風燈，站到玻璃門前，慢慢將燈移向右側。\n\n玻璃中的候車室沒有他的倒影。\n\n然而當風燈移至門框邊緣時，玻璃另一頭的一名士兵忽然抬起了頭。\n\n魏戌俞立刻將風燈左右晃了兩下。\n\n那士兵似乎看見了什麼，迅速朝他們所在的方向走來。\n\n梁副官神情一振。\n\n「他看得見咱們的燈！」\n\n「未必看得見咱們，但光能過去。」\n\n魏戌俞將風燈停在原處。\n\n「蘇爺，再把門往裡轉些。」\n\n蘇孟達握著門把，緩緩轉動。\n\n玻璃中的士兵越走越近。\n\n直到門板與門框形成一個極為狹窄的角度時，魏戌俞手中的風燈突然猛烈晃動了一下。\n\n他感覺到一股風。\n\n不是月台上那種陰冷潮濕的風。\n\n而是外頭山間尋常的夜風。\n\n「停！」\n\n蘇孟達立即停住。\n\n魏戌俞伸手探入門縫。\n\n他的手指竟然在幾人面前消失了。\n\n梁副官大吃一驚。\n\n「上校！」\n\n魏戌俞將手收回。\n\n完好無損。\n\n他重新將風燈伸了過去。\n\n玻璃的另一頭，那名士兵猛地退了一步，指著前方大聲呼喊起來。\n\n雖然聽不見他的聲音，但三人都看得清楚，他正在召集其他士兵。\n\n蘇孟達大喜。\n\n「通了！」\n\n魏戌俞回頭望向月台。\n\n那群東西已經逼近。\n\n幾張灰白的人臉從霧中浮現，離他們不過數步。\n\n「副官，先送傷兵出去！」\n\n梁副官立即將傷兵扶向門縫。\n\n那士兵半邊身體剛穿過門框，玻璃中的幾名士兵便迅速圍了上來，伸手將他拉了過去。\n\n人消失了。\n\n緊接著，又出現在玻璃的另一頭。\n\n小陳與另外一名士兵也先後穿過門縫。\n\n蘇孟達正要跟上，身後忽然傳來一聲刺耳的尖叫。\n\n先前那個六指的無臉人從頂棚上倒懸而下，一把抓住了玻璃門的上沿。\n\n門板猛地向外移動。\n\n玻璃中的景象開始扭曲。\n\n「不好！」\n\n蘇孟達死死握住門把。\n\n魏戌俞回身朝那東西連開兩槍。\n\n子彈擊中它的胸口，卻沒能讓它鬆手。\n\n它的兩條胳膊越伸越長，六根手指深深扣入木框，整扇門被扯得嘎吱作響。\n\n梁副官立即衝上前，抓住門板另一側。\n\n「蘇爺，別鬆手！」\n\n「我倒是想鬆，這不是怕把命一塊兒鬆出去嗎！」\n\n魏戌俞一腳踏上旁邊的長椅，縱身抓住門框上方的橫樑，抬腿狠狠踹向那東西的頭部。\n\n那東西的身體猛然向後仰去。\n\n梁副官趁勢將門拉回原位。\n\n通道重新出現。\n\n「蘇爺，出去！」\n\n魏戌俞喝道。\n\n蘇孟達望了一眼魏戌俞。\n\n「您呢？」\n\n「少廢話，走！」\n\n蘇孟達咬了咬牙，將門把交給梁副官，側身穿過門縫。\n\n魏戌俞跳下長椅。\n\n他剛要走向門口，那個無臉人突然從上方垂下腦袋，緊緊貼在他的肩旁。\n\n「副官。」\n\n又是魏戌俞自己的聲音。\n\n「把門關上。」\n\n梁副官聞聲抬頭。\n\n他沒有理會那道聲音，而是伸手扣住魏戌俞的手臂。\n\n「上校，走！」\n\n魏戌俞順勢抓住門框，兩人同時跨出門縫。\n\n身後傳來一聲玻璃碎裂的巨響。\n\n一股巨大的力量從背後襲來。\n\n梁副官與魏戌俞被撞得向前踉蹌數步，幾名守在月台上的士兵連忙上前扶住兩人。\n\n「上校！」\n\n「梁副官！」\n\n魏戌俞穩住身形，立即回頭。\n\n身後是一扇緊閉的玻璃門。\n\n玻璃早已碎得只剩下一半。\n\n門後的候車室空空蕩蕩。\n\n火車仍停在原處。\n\n遠處的山峰、車站外的軍車，以及四周全副武裝的士兵，全都重新出現在眼前。\n\n他們回來了。\n\n蘇孟達坐在月台的長椅上，喘得上氣不接下氣。\n\n見魏戌俞與梁副官平安出來，他這才拍了拍胸口。\n\n「魏長官，我這些年走南闖北，死人見過不少，倒是頭一回差點讓死人捎上一程。」\n\n魏戌俞看向他。\n\n「受傷了沒有？」\n\n「沒有，就是心疼。」\n\n梁副官皺眉。\n\n「哪裡疼？」\n\n蘇孟達低頭摸了摸自己的布袋。\n\n「我那瓶麵粉落在裡頭了。」\n\n梁副官看了他半晌，轉身便走。\n\n蘇孟達望著他的背影。\n\n「梁副官，那可是上好的白麵啊！」\n\n魏戌俞忍不住笑了一聲。\n\n但很快，他便收起了笑容。\n\n他走到月台邊緣，望著那列漆黑的軍用貨車。\n\n第六節車廂的兩道門依舊敞開著。\n\n一張白色紙錢，正靜靜地躺在車門下方。\n\n二十年前的工程圖\n車站內的三名士兵已經全部救出。\n\n魏戌俞重新調派人手，將車站內外徹底封鎖。所有人只准在外圍警戒，不得再進入候車室與月台。\n\n經過方才的事情，他愈發肯定，北山出現的異象並非單純的亡魂作祟。\n\n那些東西有自己的規矩。\n\n反向的文字、倒走的時鐘、出現在另一頭的影子，以及能夠連通兩個地方的玻璃門。\n\n這些現象看似毫無關聯，實際上卻始終圍繞著同一件事情。\n\n陰陽顛倒。\n\n魏戌俞站在車站外，低頭望著手中的懷錶。\n\n他們從進入候車室到逃出來，少說也有半個鐘頭。\n\n可留守在外頭的軍官卻告訴他，三人進去不過片刻，前後連一刻鐘都不到。\n\n梁副官得知此事後，也頗感意外。\n\n「難怪那幾名弟兄說，已經看見火車來過三次。」\n\n蘇孟達道：\n\n「照這麼說，那頭的時辰與咱們也不一樣？」\n\n魏戌俞將懷錶收起。\n\n「恐怕不只是時辰不同。」\n\n他想起方才火車上那些穿著不同年代衣服的旅客。\n\n若是數十年、甚至數百年前死去的人，皆能出現在同一座月台上，那麼他們所經過的地方，或許從一開始就不受尋常歲月的限制。\n\n至於那列火車究竟要將亡者送往何處，他暫時還想不明白。\n\n「魏上校！」\n\n站長匆匆從人群中跑了過來。\n\n他手裡抱著一只積滿灰塵的木匣。\n\n「您白日不是讓軍部的人找北山隧道的舊圖紙嗎？方才我想起來，咱們站上倒還留著一些早年的東西。」\n\n魏戌俞伸手接過木匣。\n\n「拿來我看看。」\n\n站長連忙找來一張桌子。\n\n木匣打開後，裡頭擺著幾卷泛黃的圖紙，以及一本封皮早已脫落的記事簿。\n\n梁副官取來風燈，將圖紙逐一攤開。\n\n蘇孟達也湊了過來。\n\n圖紙上以細密的墨線描繪著北山的地勢，山脈、河流、道路以及鐵路的走向，都記載得十分詳盡。\n\n魏戌俞很快找到了北山隧道所在的位置。\n\n「副官，你看這裡。」\n\n在最早的工程圖上，鐵路原本應該從北山西側繞行，並未打算開鑿隧道。\n\n後來有人用紅筆重新標記了一條路線。\n\n這條路線直接穿過山腰，也就是如今的北山隧道。\n\n蘇孟達看了半天。\n\n「這條路倒是近了不少。不過好端端的山路不走，偏要從山裡挖過去，想必當年也費了不少人力。」\n\n梁副官翻開旁邊的記事簿。\n\n其中幾頁記載了當年開鑿隧道時發生的事故。\n\n山體坍塌、地下滲水、工人失蹤。\n\n直到其中一頁，記載的內容突然變得古怪起來。\n\n梁副官低聲念道：\n\n「開山至第七日，鑿見青石古道，兩壁刻有送葬之圖，石人跪列，皆面向山內……」\n\n蘇孟達立即抬頭。\n\n「送葬圖？」\n\n魏戌俞接過記事簿。\n\n後頭還有幾行文字。\n\n「入其道，約行百餘步，見石門三重。門後有水聲，不見其源。夜間聞人哭，工匠多不敢入。」\n\n再往後，卻被人以墨水重重塗去。\n\n魏戌俞將紙張迎向燈光。\n\n墨跡已經滲透紙背，底下的文字幾乎無法辨認。\n\n梁副官指向工程圖上的紅線。\n\n「上校，照這上面的記載，當年修隧道的人，很可能挖穿了一條古代修建的地下道路。」\n\n「嗯。」\n\n魏戌俞望著圖上的山勢。\n\n「但那條古道未必是通往北山深處的。」\n\n他將另一張山川圖取來，與工程圖並排放置。\n\n北山的地勢雖高，山體卻並不算廣。若真有一座石刻上所描繪的龐大地下宮殿，單憑這一座山，恐怕根本容納不下。\n\n更何況，他們在山壁後方找到的石室，規模也遠遠配不上那幅雕刻。\n\n蘇孟達似乎想到了什麼。\n\n「魏長官，會不會北山根本不是那座墓的所在？」\n\n魏戌俞看向他。\n\n「繼續說。」\n\n「古時候那些王侯貴族修墓，除了真正下葬的地方，附近往往還會修建祭殿、神道，有時沿途甚至會有專門停放棺槨的地方。」\n\n蘇孟達伸手指著工程圖。\n\n「若咱們今日找到的那間石室，只是一個停棺之所，那麼這條古道原本通往的地方，才有可能是真正的陵墓。」\n\n梁副官低頭沿著山脈尋找。\n\n「可北山以西都是連綿的山地。若沒有確切的方位，要找出一座埋在地下幾百年的陵墓，恐怕不容易。」\n\n魏戌俞沒有說話。\n\n他將工程圖翻了過來。\n\n圖紙背面有一處厚薄不均的地方。\n\n似乎還黏著另一層紙。\n\n「蘇爺，來看看。」\n\n蘇孟達伸手摸了摸圖紙邊緣，又取出一把薄薄的小刀，沿著兩層紙的接縫小心挑開。\n\n一張折疊得極為整齊的薄紙，從中掉了出來。\n\n紙張比工程圖還要陳舊。\n\n上頭並非山川圖，而是一幅以墨線勾勒的古代石門。\n\n石門高聳，兩側各有一尊伏地異獸，門面刻滿星象與雲紋。\n\n中央則畫著一件圓形器物。\n\n蘇孟達將風燈移近。\n\n「這是……一面鏡子？」\n\n魏戌俞俯身望去。\n\n那面鏡子畫得極為精細。\n\n外緣環繞著十二道雲紋，中央有龜蛇交纏的圖案，周圍排列著七顆星辰。\n\n鏡身左右，各嵌有一枚水滴形的玉石。\n\n蘇孟達看了許久，忽然伸手一拍大腿。\n\n「哎呀！」\n\n梁副官被他嚇了一跳。\n\n「蘇爺，您又怎麼了？」\n\n「這東西我見過！」\n\n魏戌俞立即抬頭。\n\n「在哪裡？」\n\n蘇孟達正欲開口，魏戌俞卻忽然注意到薄紙的右下角還有幾行小字。\n\n那些字與工程圖上的筆跡截然不同。\n\n他將燈移近。\n\n紙上寫著：\n\n北山為道，非墓所在。\n\n棺出則陰陽失序，鏡歸方可閉門。\n\n後世魏氏子孫，若見赤星之印，務必尋鏡，不可使其落入外人之手。\n\n魏戌俞握著紙張的手微微一頓。\n\n這幾句話下方，還有一個極為細小的落款。\n\n梁副官正想仔細辨認，卻見魏戌俞已經將紙張緩緩折了起來。\n\n「上校？」\n\n魏戌俞沒有回答。\n\n那落款，他再熟悉不過。\n\n父親生前所有親筆書信上，都有相同的落款。\n\n他沉默良久，才轉頭望向蘇孟達。\n\n「蘇爺，你方才說，見過這面鏡子？」\n\n蘇孟達點了點頭。\n\n「幾個月前，有個古董商拿著一份舊畫冊來找我鑑定。畫冊上便有這面鏡子，連兩旁嵌著的玉石都一模一樣。」\n\n「東西在哪裡？」\n\n「不在北城。」\n\n蘇孟達頓了頓。\n\n「聽說原本是一戶大商家的收藏品，封存了十幾年，從不輕易示人。不過近來不知出了什麼緣故，那戶人家竟然打算將它賣掉。」\n\n魏戌俞問道：\n\n「哪戶人家？」\n\n蘇孟達伸手摸了摸下巴。\n\n「南邊的程家商會。」\n\n魏戌俞低頭看向手中的薄紙。\n\n父親留下的最後一句話，仍清晰地印在他的腦海中。\n\n不可使其落入外人之手。\n\n「拍賣在什麼時候？」\n\n「這我倒得回去打聽打聽。」\n\n蘇孟達望著圖上的古鏡，忽然皺起眉頭。\n\n「不過，魏長官，有件事情我覺得有些蹊蹺。」\n\n「說。」\n\n「當時拿畫冊來找我的古董商，並不在意這鏡子值多少錢，也不在意它出自哪個朝代。」\n\n「他只問了我一個問題。」\n\n魏戌俞看向他。\n\n「什麼問題？」\n\n蘇孟達的神情逐漸變得嚴肅。\n\n「他問我，這面鏡子，能不能讓死人活過來。」\n\n（第四回完）"}, {"n": 5, "title": "井下的祕密", "body": "天快亮時，北山又起了霧。\n\n魏戌俞站在車站外的山坡上，望著遠處逐漸泛白的天際。\n\n自從昨夜那場異變之後，車站倒是安靜了許多。原本散落在月台上的白色紙錢，在第一縷晨光照進車站時，竟全部化成了灰。\n\n那列軍用火車依舊停在原處。\n\n魏戌俞留下人手看守車站，又命人在通往北山的幾條山路上設下關卡。既然有人能從山中神不知鬼不覺地運走一口棺材，便不能讓他們再有機會回來動其他東西。\n\n梁副官從山坡下走了上來。\n\n「上校，車站的人已經安置妥當，那三名弟兄也送回城裡了。」\n\n「讓大夫多留意幾日。昨夜他們在那頭待的時間比咱們長，未必沒有留下什麼毛病。」\n\n「明白。」\n\n梁副官看了一眼不遠處的汽車。\n\n蘇孟達正靠在後座上呼呼大睡，懷中還抱著他那只布袋。\n\n「上校，咱們是不是也該回去了？」\n\n魏戌俞低頭看了看懷錶。\n\n「走吧。」\n\n兩人剛走到車旁，蘇孟達便睜開了眼睛。\n\n「魏長官，天亮了？」\n\n「亮了。」\n\n蘇孟達打了個哈欠，揉著酸疼的脖子。\n\n「我方才做了個夢，夢見有人請我吃酒席，一桌子好菜，剛拿起筷子，梁副官便把我叫醒了。」\n\n梁副官看了他一眼。\n\n「我沒叫您。」\n\n「那更糟了。」\n\n蘇孟達坐直身子，一臉認真。\n\n「昨夜碰上那麼多死人，誰知道請我吃的是哪家的席？」\n\n梁副官拉開車門。\n\n「蘇爺若是沒吃飽，回城後我讓人給您買幾個燒餅。」\n\n「還是梁副官疼人。」\n\n梁副官的手停了一下。\n\n魏戌俞坐進車內，嘴角微微揚起。\n\n「開車。」\n\n回城後，三人各自休息了幾個鐘頭。\n\n午後，梁副官帶著一個消息來到了魏戌俞的辦公室。\n\n「上校，昨夜那本工程記事簿上記載的幾名工匠，我讓人查過了。大部分已經過世，還在北城的，只剩下一個姓徐的老石匠。」\n\n魏戌俞放下手中的茶杯。\n\n「人在哪裡？」\n\n「城西，靠近舊水渠的地方。當年修建北山隧道時，他負責帶人鑿石，後來不知出了什麼事，突然辭了工。這些年一直靠替人刻墓碑維生。」\n\n「備車。」\n\n梁副官應了一聲。\n\n恰在此時，蘇孟達提著兩包熱騰騰的包子走了進來。\n\n「魏長官，好消息！」\n\n魏戌俞抬起頭。\n\n「鏡子的事？」\n\n「正是。」\n\n蘇孟達將包子擱在桌上，從懷中取出一張淡黃色的紙。\n\n那是一份古物拍賣會的預告，上面印著幾件珍貴的古玩，其中便有一面鎏金古鏡。\n\n雖然只是墨印的圖樣，仍可清楚辨認出鏡背上的龜蛇紋飾、環繞四周的七顆星辰，以及兩側水滴形的嵌玉。\n\n魏戌俞從懷中取出父親留下的圖紙。\n\n兩相對照，果然是同一件東西。\n\n鏡子下方，印著五個小字。\n\n七星鎏金鏡。\n\n「這是我托人弄來的。」蘇孟達說，「拍賣會在六日之後，地點在南邊的商埠。不過這場拍賣不對外開放，沒有主辦方發出的請帖，便是帶著一箱金條也進不去。」\n\n魏戌俞問道：「能弄到請帖嗎？」\n\n「我在想辦法。這次請的都是各地有頭有臉的古董商和大商戶，規矩比尋常拍賣會多得很。」\n\n蘇孟達拿起一個包子。\n\n「魏長官若願意借我幾十根金條，我倒可以先去南邊置辦幾間鋪子，冒充個富商。」\n\n「別廢話，講重點。」\n\n「重點就是，想進去有些麻煩，但未必沒有辦法。」\n\n蘇孟達咬了一口包子，含糊不清地問道：\n\n「二位這是要出門？」\n\n梁副官將徐老石匠的事情告訴了他。\n\n蘇孟達頓時來了精神。\n\n「當年親手挖過那條古道的人？」\n\n「不錯。」\n\n「那我也得去！」\n\n他三兩口將包子塞進嘴裡，又抓起桌上的茶壺灌了一口。\n\n梁副官看得直皺眉。\n\n「蘇爺，您慢些。人又不會跑。」\n\n蘇孟達擦了擦嘴。\n\n「那可難說。依咱們這兩日遇上的事情來看，莫說是活人，便是死人也跑得挺快。」\n\n魏戌俞拿起軍帽。\n\n「走了。」\n\n城西的老石匠\n北城西面有一條荒廢多年的水渠。\n\n早些年間，城中不少染布坊、磨坊都建在這一帶。後來水道改了方向，幾間大作坊陸續搬走，只剩下些破舊的房屋，以及靠手藝謀生的人家。\n\n汽車在一條狹窄的巷子前停下。\n\n再往裡便沒有可供車輛通行的道路，三人只得步行。\n\n巷子盡頭有一處院落。\n\n院牆不高，牆頭長滿枯黃的野草，木門兩旁堆著幾塊尚未完工的石碑。石碑表面覆著白色石粉，旁邊還擱著大小不一的鑿子。\n\n蘇孟達走過去，隨手摸了摸一塊石碑。\n\n「這手藝不錯。碑文的筆鋒都能刻出來，這老先生應當有些年頭了。」\n\n梁副官上前敲門。\n\n「徐先生？」\n\n院內無人回應。\n\n他又敲了兩下。\n\n魏戌俞站在一旁，目光忽然落在門檻上。\n\n門檻邊緣有幾道新鮮的擦痕，其中一處還沾著些許泥土。\n\n「副官，門沒鎖。」\n\n梁副官伸手一推。\n\n木門緩緩向內打開。\n\n院子裡十分凌亂。\n\n一張竹椅倒在地上，晾曬衣物的竹竿折成了兩截，幾件灰色衣裳散落在石板上。\n\n屋門敞著。\n\n門旁還有一只摔碎的陶碗。\n\n梁副官立即拔出手槍。\n\n「上校，有人來過。」\n\n魏戌俞點頭，率先走進屋內。\n\n屋子不大，靠牆擺著一張木床，床頭放著幾件換洗衣裳。另一側則是一張用來描畫碑文的長桌。\n\n桌上的墨汁尚未完全乾透，硯台卻被打翻了。\n\n牆邊兩只木櫃全被拉開，裡頭的東西散了一地。\n\n蘇孟達蹲下身，拾起一張揉皺的紙。\n\n「不像尋常竊賊。」\n\n梁副官回頭。\n\n「怎麼說？」\n\n蘇孟達指了指地上的一只木匣。\n\n「裡頭還有銀元呢。若是來偷錢的，哪有放著銀元不拿，偏偏把一堆破紙翻得亂七八糟的道理？」\n\n魏戌俞走到長桌旁。\n\n桌面有一片較為乾淨的地方，四周積著薄薄的石粉，中央卻沒有。\n\n「這裡原本擱著東西。」\n\n他用手比了比大小。\n\n「應當是個木盒，或者一疊較厚的紙。」\n\n梁副官查看了桌下及附近的木櫃。\n\n「沒找到。」\n\n魏戌俞望向窗外。\n\n「看來除了咱們，還有人想從徐老先生這兒知道些事情。」\n\n蘇孟達嘆了一口氣。\n\n「難得遇上個知道內情的活人，可別讓咱們又撲了個空。」\n\n話音剛落，院子後方忽然傳來一聲輕響。\n\n咚。\n\n三人同時安靜下來。\n\n咚、咚。\n\n又是兩聲。\n\n聲音沉悶，像是有人用石頭敲擊牆壁。\n\n梁副官握著槍走到窗邊。\n\n屋後還有一個小院，院中央種著一棵高大的槐樹，樹下是一口年代久遠的石井。\n\n井旁的木架已經傾斜，原本用來打水的繩索斷成兩截，半截垂在井口外頭。\n\n魏戌俞推開後門。\n\n三人循著聲音走到井邊。\n\n咚。\n\n這一回，聽得分外清楚。\n\n聲音是從井底傳來的。\n\n「底下有人嗎？」\n\n梁副官俯身朝井中喊了一聲。\n\n井底傳來一陣微弱的喘息。\n\n「救……救命……」\n\n是個上了年紀的男人。\n\n魏戌俞立即蹲到井口旁。\n\n「可是徐老先生？」\n\n「是……快拉我上去……」\n\n梁副官取出手電筒，朝井中照去。\n\n井壁以灰色石磚砌成，內側長滿深綠色的苔蘚。距離井口約莫兩丈深的地方，有一處向內凹陷的缺口。\n\n一名頭髮花白的老人正蜷縮在那處缺口裡，半邊身子浸在水中，雙手死死抓著井壁上一塊凸起的石頭。\n\n「上校，人還活著。」\n\n魏戌俞伸手拉了拉井旁斷裂的繩索。\n\n斷口十分平整，顯然是被人用利器割斷的。\n\n「有人不想讓他上來。」\n\n蘇孟達探頭望了一眼。\n\n「老先生，您先別急，咱們這就想辦法救您上來！」\n\n老人一聽，非但沒有鬆口氣，反而拼命搖頭。\n\n「別下來！」\n\n「什麼？」\n\n「水裡有東西……千萬別下來！」\n\n蘇孟達臉上的笑容頓時消失。\n\n魏戌俞接過梁副官手中的電筒，將光線移向井底。\n\n老人腳下的水呈深褐色，水面漂著幾片枯葉。\n\n除了老人不時掙扎所造成的漣漪，暫時看不出有什麼異常。\n\n然而就在魏戌俞準備將電筒移開時，一縷漆黑的東西從老人身旁的水中浮了上來。\n\n像是水草。\n\n細細長長，在水面舒展開來，隨著水波逐漸飄向老人垂在水中的雙腿。\n\n蘇孟達瞇起眼睛。\n\n「魏長官，您照著那團黑的東西。」\n\n魏戌俞依言將光線移了過去。\n\n那東西越浮越多。\n\n很快便覆蓋了大半個水面。\n\n蘇孟達看得頭皮發麻。\n\n「是頭髮。」\n\n梁副官立即跑回前院，從堆放石料的地方找來一捆粗繩。\n\n魏戌俞則解開軍大衣，將它交給蘇孟達。\n\n「我下去。」\n\n蘇孟達連忙攔住他。\n\n「魏長官，您沒聽見老先生說的話？底下那東西連是什麼都還不知道！」\n\n「他在水裡泡了這麼久，已經沒多少力氣了。光把繩子放下去，未必抓得住。」\n\n魏戌俞指向井壁上的缺口。\n\n「那地方離水面還有些距離，只要能把他帶出來，就不必碰水。」\n\n梁副官走了過來。\n\n「上校，讓我下去吧。」\n\n魏戌俞抬頭看了看井旁已經傾斜的木架。\n\n「你留在上頭。這木架恐怕承受不住兩個人的重量，得靠你們把人拉上來。」\n\n梁副官知道他已經拿定主意，便不再爭辯。\n\n「明白。」\n\n兩人將繩索固定好，梁副官又仔細查看了一遍井口的石磚，確定沒有鬆動之處。\n\n蘇孟達則趴在井旁，始終盯著水面上的黑髮。\n\n那些頭髮似乎沒有散開的意思。\n\n它們全都朝著同一個方向飄去。\n\n老人的腳邊。\n\n「魏長官，得快些了。」\n\n魏戌俞抓住繩索，翻身進了井口。\n\n井下的空氣陰冷潮濕，帶著一股令人作嘔的腥氣。\n\n他踩著井壁上凸出的石磚，緩緩向下移動。\n\n到了半途，井口的光線已經變得十分微弱。\n\n老人抬起頭，哆嗦著嘴唇望向他。\n\n「長官……」\n\n「別動，我過來。」\n\n魏戌俞踩住一塊較為結實的石磚，伸手探向老人所在的缺口。\n\n直到近處，他才發現老人的右腿上有傷，褲管被血浸透，腳踝也腫得厲害。\n\n難怪一直爬不上去。\n\n「抓著我的肩膀。」\n\n老人顫巍巍地伸出手。\n\n魏戌俞剛將繩索移到老人身側，頭頂突然傳來梁副官的聲音。\n\n「上校，水位在升！」\n\n魏戌俞立即低頭。\n\n方才還在老人膝下的井水，不知何時已經漫過了他的腰部。\n\n更奇怪的是，整個井面沒有任何水流湧入的聲響。\n\n那水竟是無聲無息地往上升的。\n\n蘇孟達趴在井口，大聲喊道：\n\n「魏長官，別看水裡！先把人帶上來！」\n\n魏戌俞將老人扶起。\n\n「副官，拉！」\n\n繩索逐漸繃緊。\n\n老人剛離開那處石壁，井水突然劇烈翻湧起來。\n\n一團濕漉漉的黑髮從水中猛地竄出，纏住了老人的小腿。\n\n老人發出一聲慘叫。\n\n「它抓住我了！」\n\n魏戌俞低頭一看。\n\n黑髮底下，浮著一張蒼白的人臉。\n\n那人面朝上方，雙眼緊閉，五官被水泡得有些浮腫。\n\n隨著黑髮在水中散開，第二張臉也出現了。\n\n接著是第三張。\n\n第四張。\n\n一張張面孔密密麻麻地擠在水面之下。\n\n有老有少，甚至還有幾張看起來不過十來歲的臉。\n\n他們全都閉著眼睛。\n\n唯獨嘴巴微微張開，像是在無聲地呼吸。\n\n魏戌俞拔出短刀，割斷纏在老人腿上的黑髮。\n\n「往上拉！」\n\n梁副官與蘇孟達立即發力。\n\n老人被拖離水面。\n\n與此同時，井水中的那些人，忽然全部睜開了眼睛。\n\n一股巨大的力量猛地撞上井壁。\n\n魏戌俞腳下的石磚頓時鬆動，他整個人向下一滑，軍靴險些浸入水中。\n\n「上校！」\n\n梁副官死死攥住繩索。\n\n魏戌俞伸手扣住石縫，穩住身形。\n\n「先拉他上去，我沒事！」\n\n井水仍在升高。\n\n那些浮在水中的人臉已經離他不足一尺。\n\n忽然，一隻皮膚慘白的手從水面伸出，抓住了井壁。\n\n緊接著，數十隻手一同伸了出來。\n\n它們並沒有朝魏戌俞撲過去。\n\n而是抓著井壁，一點一點地將自己的身體往上拖。\n\n魏戌俞這才看清，那些東西的下半身竟全纏在一起。\n\n濃密的黑髮彼此交錯，將它們連成了一團龐大而臃腫的東西。\n\n井下根本不是有幾十具獨立的屍體。\n\n而是一個由無數屍身糾纏而成的怪物。\n\n「蘇爺！」\n\n魏戌俞抬頭喊道。\n\n「這東西見過沒有？」\n\n蘇孟達伸長脖子，往井下瞧了一眼。\n\n「沒有！」\n\n「想想辦法！」\n\n「正在想！」\n\n蘇孟達急得在井邊來回走了兩步，忽然注意到井口旁的青石蓋。\n\n石蓋上刻著一道道水波紋，中央是一隻伏地的龜形異獸。由於長年用來遮蓋井口，圖案已經磨得有些模糊。\n\n他猛地蹲下身，撥開石蓋上的枯葉。\n\n龜形異獸的四足下方，各壓著一個張口的人頭。\n\n蘇孟達神色一變。\n\n「鎮水石？」\n\n梁副官正將老人拖至井口，聞言轉過頭。\n\n「什麼東西？」\n\n「這石蓋原本不是尋常井蓋，是用來鎮水的！」\n\n蘇孟達又看了看井沿，果然發現石蓋邊緣與井口的石槽十分吻合。\n\n「有人把它挪開了！」\n\n就在這時，老人終於被拉出井口。\n\n梁副官將他扶到一旁，立即將繩索重新放下。\n\n「上校，接住！」\n\n魏戌俞一把抓住繩索，踩著井壁迅速向上攀爬。\n\n下方傳來一陣極為尖銳的哭聲。\n\n男男女女的聲音混在一起，在狹窄的井中迴盪，震得人耳膜發疼。\n\n一隻手猛地抓住魏戌俞的軍靴。\n\n魏戌俞回身踹開。\n\n另一隻手又從旁伸了過來。\n\n他抓緊繩索，借力向上一躍，雙腳離開井壁。\n\n梁副官猛然發力，將他往上拽了數尺。\n\n蘇孟達也趕忙抓住繩索。\n\n「魏長官，再快些！那水要漫出來了！」\n\n井口下方，已經能夠看見一片漆黑的頭髮。\n\n水位竟在短短片刻之間上升了近兩丈。\n\n魏戌俞抓住井沿，翻身躍出。\n\n幾乎就在他雙腳落地的同一瞬間，井中猛然伸出十餘隻手。\n\n它們抓住井口的石磚，瘋狂地向外攀爬。\n\n蘇孟達立即撲向那塊石蓋。\n\n「梁副官，搭把手！」\n\n梁副官與魏戌俞同時上前，三人合力將沉重的青石蓋推向井口。\n\n幾隻蒼白的手仍死死扣在石沿上。\n\n石蓋一寸一寸地向前移動。\n\n井底的哭聲愈發淒厲。\n\n忽然，那些手像是被什麼東西燙到一般，迅速縮回了井中。\n\n轟！\n\n石蓋落入石槽。\n\n整個院子頓時安靜下來。\n\n蘇孟達兩手撐著膝蓋，大口喘氣。\n\n梁副官則立即轉向魏戌俞。\n\n「上校，您受傷了？」\n\n魏戌俞低頭看了看軍靴。\n\n靴面上留下了幾道清晰的指痕，褲腳也被扯破了一小塊。\n\n「沒事。」\n\n他望向石蓋上的龜形異獸。\n\n「蘇爺，這東西有什麼來歷？」\n\n蘇孟達喘了半天，才直起身子。\n\n「古人認為井、泉、潭一類通往地下的地方，有時會聚集陰邪之物。因此有些老井會在井口設置石獸，用來鎮住底下的東西。」\n\n他拍了拍石蓋。\n\n「不過我先前見過的鎮水石，大多是些尋常神獸。像這種腳底還踩著人頭的，倒是頭一回見。」\n\n梁副官望著井口。\n\n「方才那些東西縮回去，是因為這石蓋？」\n\n「八成有關。」\n\n蘇孟達蹲下身，仔細查看四周。\n\n石蓋表面積著厚厚的灰塵，唯獨邊緣有一道嶄新的刮痕。\n\n「看來原本一直蓋得好好的，是今日才被人挪開的。」\n\n魏戌俞轉過頭，望向坐在槐樹底下的老人。\n\n「得問問他了。」\n\n二十年前沒能回來的人\n梁副官從汽車上取來藥箱，替老人簡單處理了腿上的傷。\n\n老人姓徐，今年六十三歲，年輕時便跟著父親學習鑿石的手藝，一雙手布滿厚厚的老繭，指關節也因長年的勞作而有些變形。\n\n此刻，他披著一件乾燥的衣裳，坐在屋內的木椅上，仍止不住地發抖。\n\n魏戌俞讓梁副官倒了杯熱茶給他。\n\n老人喝了幾口，臉上總算恢復了些血色。\n\n「多謝幾位救命之恩。不知幾位長官是……」\n\n梁副官道：「這位是北城警備司令部的魏上校。」\n\n老人端著茶杯的手忽然一顫。\n\n「姓魏？」\n\n魏戌俞看向他。\n\n「老先生認得我？」\n\n老人仔細打量著他的面容，尤其是那雙眼睛。\n\n看了好一會兒，他才喃喃道：\n\n「像……實在是像。」\n\n「像誰？」\n\n「像當年救過我的魏先生。」\n\n魏戌俞心中微微一動。\n\n「可是二十年前，北山修隧道的時候？」\n\n老人緩緩點頭。\n\n「原來您是他的後人。」\n\n蘇孟達搬了張椅子，在老人身旁坐下。\n\n「老先生，咱們今日就是為了當年北山的事情來的。您也別著急，慢慢說，那時候究竟發生了什麼？」\n\n老人捧著茶杯，望向窗外那口已被封住的石井。\n\n過了許久，他才開口。\n\n「那口井上的石蓋，也是魏先生當年留下的。」\n\n「哦？」\n\n蘇孟達頓時坐直了身子。\n\n老人道：\n\n「二十年前，我還在北山做工。那時候咱們一群人跟著洋人的工程師鑿山，工錢給得多，雖說辛苦，倒也沒什麼怨言。」\n\n「直到有一日，山裡挖出了一條石道。」\n\n那是一條隱藏在山岩深處的古道。\n\n兩旁立著石人，牆壁上雕刻著送葬的隊伍，地上鋪的青石板十分平整，縫隙間還嵌著一些已經生鏽的銅片。\n\n當時工人們都以為挖到了古人的墳墓。\n\n幾個膽子大的，甚至商量著趁夜裡進去瞧瞧，看看能不能撿些值錢的東西。\n\n「那天夜裡，去了十一個人。」\n\n老人說到這裡，握著茶杯的手逐漸收緊。\n\n「第二天早上，一個也沒回來。」\n\n工程師怕出了人命，便又派了幾個人進去找。\n\n徐老石匠也是其中之一。\n\n他們沿著古道往下走，經過三道石門，最後來到一處極為寬敞的地下石殿。\n\n石殿中央沒有棺材，也沒有任何金銀財寶。\n\n只有一池漆黑的水。\n\n水池四周立著十二尊石人。\n\n那些石人個個跪伏在地，雙手向前伸出，額頭幾乎貼著水面。\n\n每尊石人的背上，都雕刻著一張人臉。\n\n「咱們拿著燈照進水裡，底下什麼也瞧不見。可其中一個弟兄耳朵好，說聽見水裡有人在哭。」\n\n梁副官問道：\n\n「是那些失蹤的工人？」\n\n老人搖了搖頭。\n\n「不知道。咱們順著池子找了一圈，後來有個人忽然喊了一聲，說水裡有腳。」\n\n「腳？」\n\n蘇孟達忍不住追問。\n\n「人的腳？」\n\n「對。」\n\n老人臉色煞白。\n\n「一雙、兩雙……全是腳底朝上，像有好些人倒著站在水裡。」\n\n屋中頓時安靜下來。\n\n魏戌俞想起方才井底那些彼此糾纏的屍身。\n\n老人繼續說道：\n\n「咱們哪裡見過這種東西？當時便嚇得往外跑。可來時明明經過了三道石門，回頭再走，卻怎麼也找不著第三道門了。」\n\n「轉來轉去，最後還是回到那池水旁。」\n\n「後來，是魏先生帶人進來，把咱們救了出去。」\n\n魏戌俞問道：\n\n「他是怎麼找到出去的路的？」\n\n「他不讓咱們看地上的石板，只讓咱們抬頭看石殿頂上的雕刻。」\n\n老人伸出一根手指，在半空中慢慢比畫。\n\n「那上頭刻著好多星星，還有一條盤在龜背上的蛇。魏先生沿著那些星星找了好一會兒，最後在一尊石人背後找到了另一條路。」\n\n蘇孟達轉頭望向魏戌俞。\n\n「又是玄武七星。」\n\n魏戌俞微微頷首。\n\n北山石室、黑色珠子、七星鎏金鏡，以及父親當年用來尋找出路的星象雕刻，果然都與同一件事情有關。\n\n「那口棺材呢？」他問。\n\n老人抬起頭。\n\n「您也知道那口棺材？」\n\n「知道。它近日被人從北山運走了。」\n\n老人的臉色驟然一變。\n\n手中的茶杯險些掉到地上。\n\n「搬走了？」\n\n「嗯。」\n\n「怎麼能搬走！那東西不能動啊！」\n\n老人猛地站起身，右腿的傷口受到牽扯，疼得他又跌坐回椅子上。\n\n梁副官連忙扶住他。\n\n魏戌俞皺起眉頭。\n\n「老先生，您先坐好。為何不能動？」\n\n老人喘著粗氣。\n\n「當年魏先生就是為了那口棺材來的！」\n\n「他說，那口棺材放在北山不是為了下葬，也不是為了祭祀。只要棺材在原處，山裡的那些東西便不容易跑出來。」\n\n蘇孟達低聲道：\n\n「難怪棺材一被運走，北山就亂成這樣。」\n\n魏戌俞沉默片刻。\n\n「這口井上的石蓋，又是怎麼回事？」\n\n老人望向後院。\n\n「當年魏先生發現北山古道底下有水脈，與城西幾處老泉相通。後來他沿著水脈查了好些地方，才找到這口廢井。」\n\n「那塊石蓋是他帶來的。他交代我，無論底下有什麼聲音，都不能掀開。」\n\n「這些年我另外打水，那口井從來沒用過。偶爾夜裡聽見哭聲，我也只當沒聽見。」\n\n梁副官皺起眉頭。\n\n「既然如此，今日是誰將石蓋挪開的？」\n\n老人低下頭。\n\n「今日清早，有幾個人來找我。」\n\n「他們問我，當年在北山做工時，有沒有留下什麼石刻、拓本之類的東西。我說沒有，他們便不信，把屋裡翻了個遍。」\n\n「後來我想去街上叫人，被其中一個抓了回來。」\n\n老人摸了摸受傷的腿。\n\n「他們掀開井蓋，把我扔了下去，說若我再不肯交出東西，便讓我在底下待上一日。」\n\n「幸好我抓住了井壁，沒直接掉進水裡。」\n\n魏戌俞的神色逐漸冷了下來。\n\n「幾個人？」\n\n「四個。」\n\n「可認得他們？」\n\n老人搖頭。\n\n「從沒見過。他們穿著尋常衣服，說話也不像本地人。」\n\n魏戌俞沒有繼續追問那些人的樣貌。\n\n既然對方知道徐老石匠參與過當年的工程，又知道他可能留有拓本，便顯然不是臨時起意。\n\n而且那幾個人竟特意掀開廢井的石蓋，說不定也知道井底藏著什麼東西。\n\n他們根本沒打算讓老人活著出來。\n\n「老先生。」\n\n魏戌俞望著他。\n\n「他們要找的東西，您當真沒有？」\n\n老人沉默了。\n\n蘇孟達一瞧他這副模樣，便知道事情另有隱情。\n\n「老先生，咱們三個方才可是差點跟您一塊兒沉到井底。您若真藏著什麼寶貝，總得讓咱們開開眼界吧？」\n\n老人看了看蘇孟達，又看向魏戌俞。\n\n「東西……確實還在。」\n\n石碑裡的拓本\n老人指著前院那些尚未完工的石碑。\n\n「最靠牆的那塊，底下墊著一塊方石。東西就在方石下面。」\n\n梁副官立即走了出去。\n\n不一會兒，他帶著一只扁平的木盒回來。\n\n木盒外頭包著三層油布，盒蓋的縫隙還用蠟封得十分嚴實。\n\n蘇孟達接過木盒，忍不住讚歎。\n\n「藏得好！難怪那些人把屋子翻遍了也找不著。」\n\n老人道：\n\n「我替人刻了一輩子的碑，早就知道有些東西藏在屋裡，反倒不安全。」\n\n木盒打開後，裡面是一卷泛黃的紙。\n\n蘇孟達小心翼翼地將它攤在桌上。\n\n那是一幅極長的石刻拓本。\n\n紙上以黑白兩色呈現出一連串古代雕刻，圖案十分繁複，足足占滿了整張長桌。\n\n魏戌俞與梁副官走到桌旁。\n\n拓本由左至右，大致分成三幅畫面。\n\n第一幅描繪的是一群人被帶往山中。\n\n那些人身穿長袍，男女皆有，雙手以繩索綁在身前，排列成一支長長的隊伍。\n\n隊伍兩旁有身披盔甲的士兵，手持長戈，押送眾人前行。\n\n山腳下矗立著一座巨大的石門。\n\n石門上方雕刻著日月星辰，門旁跪著兩尊石像。\n\n梁副官伸手指向人群。\n\n「上校，您看他們的手。」\n\n魏戌俞俯身望去。\n\n那些被押送的人之中，有幾個雙手並沒有被綁住。\n\n他們懷裡各抱著一尊小小的人像。\n\n人像沒有頭。\n\n「無首陶人。」魏戌俞道。\n\n蘇孟達立即將拓本拉近了些。\n\n「看來咱們從火車上找到的那個東西，確實不是尋常陪葬品。」\n\n三人接著看向第二幅畫。\n\n畫中的場景已經由山外轉入地下。\n\n一座巨大的石殿中央，有一方圓形祭台。祭台上站著一名頭戴高冠的人，雙手捧著一面圓鏡。\n\n在他腳下，跪滿了先前被押送進山的人。\n\n每個人面前都擺著一尊陶人、一只小鈴。\n\n梁副官望著那些鈴。\n\n「這幾樣東西，咱們都在第六節車廂裡見過。」\n\n「不錯。」\n\n魏戌俞的目光落在那名高冠男子手中的鏡子上。\n\n鏡背環繞著七顆星辰。\n\n雖然雕刻得並不十分清楚，仍能辨認出兩側的嵌玉，以及中央龜蛇交纏的圖案。\n\n七星鎏金鏡。\n\n蘇孟達盯著那幅祭祀圖，半天沒說話。\n\n梁副官問道：\n\n「蘇爺，您看這是在做什麼？」\n\n「不知道。」\n\n蘇孟達難得回答得十分乾脆。\n\n「若是尋常祭祀，不論祭的是天地還是祖宗，祭台上總該有些供奉之物。可這上頭除了那面鏡子，什麼也沒有。」\n\n他指向台下跪著的人。\n\n「除非真正的祭品，全在下面。」\n\n魏戌俞沒有作聲。\n\n他順著拓本看向最後一幅畫。\n\n隨即皺起了眉頭。\n\n第三幅畫與前兩幅截然不同。\n\n雕刻者以一道極長的橫線，將整個畫面分成上下兩部分。\n\n上方是宮殿、祭台及跪地的人群。\n\n下方也有一座一模一樣的宮殿。\n\n只是所有東西都是倒過來的。\n\n石柱朝下，屋瓦朝下，人像也頭朝下地跪伏著。\n\n兩座宮殿彼此相對，如同水中倒影。\n\n唯獨中央那面圓鏡，正好位於兩個世界的交界之處。\n\n而在倒懸的宮殿內，有幾個人正沿著石階，向上方爬去。\n\n梁副官看了許久。\n\n「上校，這與昨夜那座車站……」\n\n「很像。」\n\n魏戌俞伸手指向那些攀爬的人影。\n\n「不過這幅畫比咱們昨夜見到的東西，還多說明了一件事。」\n\n蘇孟達順著他的手指望去。\n\n最靠近圓鏡的那個人影，半邊身子已經穿過了分隔上下世界的橫線。\n\n在他下方，還有數十雙手正爭先恐後地向上伸去。\n\n蘇孟達的眉頭逐漸皺緊。\n\n「他們想從下面爬上來？」\n\n魏戌俞點了點頭。\n\n「若雕刻者想表達的是祭祀的結果，那麼這些人恐怕原本就不屬於上面那個世界。」\n\n梁副官低聲道：\n\n「死而復生？」\n\n屋中一片寂靜。\n\n蘇孟達忽然想起幾個月前，那名古董商拿著畫冊來找自己時所問的話。\n\n這面鏡子，能不能讓死人活過來？\n\n他將事情重新想了一遍，愈想愈覺得不對。\n\n「魏長官，當初找我鑑定鏡子的人，恐怕早就知道些什麼了。」\n\n魏戌俞望向那幅拓本。\n\n「而且他未必是唯一知道的人。」\n\n如今有人運走北山的棺材，有人尋找古道的拓本，又有人打聽七星鎏金鏡的用途。\n\n這些人所做的事情看似分散，目的卻很可能相同。\n\n那面即將被拍賣的古鏡，恐怕比他原先預想的更加重要。\n\n「蘇爺，請帖的事情得抓緊了。」\n\n蘇孟達點頭。\n\n「回去我便找人打聽。」\n\n魏戌俞轉向梁副官。\n\n「讓人將徐老先生接回城裡安置。這地方不能再住了。」\n\n「是。」\n\n老人望著桌上的拓本，神情有些猶豫。\n\n「魏長官，其實……還有一件事。」\n\n魏戌俞轉過身。\n\n「您說。」\n\n老人低下頭，從木盒底部取出另一張紙。\n\n那張紙只有巴掌大小，邊緣泛黃，上頭用炭筆畫著一個男人的側臉。\n\n男人約莫三四十歲，鼻梁高挺，左側眉骨上有一道極為明顯的疤痕。\n\n畫得雖不十分精細，那道疤痕卻格外清楚。\n\n「這是何人？」梁副官問。\n\n老人道：\n\n「二十年前，北山挖出古道的消息傳開後，曾經來過一批人。他們不是修鐵路的，也不是咱們這些做工的，卻對那條古道十分熟悉。」\n\n「這人便是其中一個。」\n\n蘇孟達接過紙張。\n\n「您為何特地將他的模樣畫下來？」\n\n「因為他害死過人。」\n\n老人望著那張畫，眼中露出極深的恨意。\n\n「咱們有幾個弟兄原本已經找到出去的路，是他為了進入更深的地方，非要他們再去推開一道石門。」\n\n「門打開以後，裡面湧出了許多黑水。幾個弟兄全被沖了進去，連屍首也沒找回來。」\n\n魏戌俞問道：\n\n「後來呢？」\n\n「後來，魏先生帶人封住了那道石門。」\n\n老人吞嚥了一下。\n\n「可這個人不肯出來。他說裡面還有他想要的東西，誰勸都不聽。」\n\n「直到最後一道石門落下，他也沒出現。」\n\n蘇孟達摸了摸下巴。\n\n「照這麼說，此人應當還留在那條古道裡？」\n\n「是啊。」\n\n老人慢慢抬起頭。\n\n「這二十年來，我一直都是這麼想的。」\n\n魏戌俞忽然察覺到他話中的異樣。\n\n「老先生，您為何現在提起他？」\n\n老人看向屋外。\n\n午後的陽光照在院中的石碑上，槐樹的枝葉隨風輕晃，一切看起來再尋常不過。\n\n可他的身體卻又開始發抖。\n\n「今日清早，那幾個來找我麻煩的人裡頭，有一個一直站在門外。」\n\n「他沒有進屋，也沒有動手。」\n\n「臨走以前，他轉過頭來，看了我一眼。」\n\n老人伸出顫抖的手，指向紙上那道橫過眉骨的疤痕。\n\n「就是他。」\n\n蘇孟達一怔。\n\n「您確定不是長得相似？」\n\n「不會錯的。」\n\n老人死死盯著那張畫。\n\n「那張臉，那道疤，我這輩子都忘不了。」\n\n梁副官皺眉道：\n\n「可事情已經過了二十年，您如今再見到他，樣貌多少也該有些變化。」\n\n老人緩緩搖頭。\n\n「沒有。」\n\n「什麼？」\n\n「他跟二十年前一模一樣。」\n\n老人抬起頭，眼神中滿是恐懼。\n\n「我已經是個快入土的老頭子了。」\n\n「可他連一根白頭髮都沒有長。」\n\n（第五回完）"}, {"n": 6, "title": "活了二十年的死人", "body": "屋內安靜得只剩下茶水滴落的聲音。\n\n徐老石匠方才太過激動，杯中的茶灑了些出來，沿著桌角一滴一滴落到地上。\n\n蘇孟達拿著那張畫，仔細端詳了許久。\n\n「老先生，您當年見他的時候，他大概多大歲數？」\n\n「三四十歲吧。」\n\n「今日見到的呢？」\n\n「還是那個模樣。」\n\n蘇孟達掰著手指算了算。\n\n「二十年……便是平日吃得再好、睡得再足，也不至於半點沒老。」\n\n梁副官望向魏戌俞。\n\n「上校，會不會與北山那些能變成活人模樣的東西有關？」\n\n魏戌俞拿過那張畫。\n\n「不排除這個可能。不過，昨夜咱們遇見的東西雖然能模仿人的聲音和相貌，行為舉止卻與常人有些分別。」\n\n他轉向徐老石匠。\n\n「今日那人可曾開口？」\n\n老人想了想。\n\n「說過一句。」\n\n「說的什麼？」\n\n「他讓另外三個人仔細找，說當年魏先生留下的東西，必定還在我這兒。」\n\n魏戌俞的目光微微一沉。\n\n對方知道父親。\n\n不僅如此，對方似乎還清楚父親當年做過什麼。\n\n這便與北山那些只會模仿活人的鬼怪不大一樣了。\n\n蘇孟達將椅子往前挪了些。\n\n「魏長官，江湖上倒是有不少返老還童、長生不老的傳聞。有人服丹，有人修道，還有人說只要尋到一處特殊的風水寶地，便能讓人肉身不腐、容貌不衰。」\n\n「你信？」\n\n「從前是不大信的。」\n\n蘇孟達指了指後院那口石井。\n\n「可自打跟您走了這兩日，我覺得往後聽人說話，還是別急著笑話人家的好。」\n\n梁副官沒有接他的話。\n\n他站在窗前，目光越過院牆，望向對面一座早已荒廢的染布坊。\n\n染布坊的二樓開著一扇窗。\n\n窗後似乎站著個人。\n\n梁副官眨了下眼睛，那道人影已經不見了。\n\n他立即轉身。\n\n「上校，外頭有人。」\n\n魏戌俞抬起頭。\n\n「在哪裡？」\n\n「對面的染布坊。方才有人在窗後往這兒看。」\n\n蘇孟達聞言，也湊到窗旁。\n\n那扇窗戶半敞著，兩側懸掛的破布隨風晃動，裡頭漆黑一片。\n\n「會不會是附近的住戶？」\n\n梁副官搖了搖頭。\n\n「那人見我抬頭，立刻便退了回去。」\n\n魏戌俞將桌上的拓本捲好，重新放入木盒。\n\n「蘇爺，你陪老先生待在這兒。」\n\n蘇孟達立即站了起來。\n\n「魏長官，您二位要去瞧瞧？」\n\n「嗯。」\n\n魏戌俞拔出手槍，看了一眼彈匣。\n\n「若真是早上那批人，他們既然沒找到想要的東西，恐怕也不會這麼輕易罷休。」\n\n他將木盒交給蘇孟達。\n\n「東西收好。」\n\n蘇孟達接過木盒，難得沒有多說什麼。\n\n「放心。」\n\n魏戌俞朝梁副官使了個眼色。\n\n兩人推門而出。\n\n荒廢的染布坊\n染布坊與徐老石匠的住處之間，隔著一條不足兩丈寬的巷子。\n\n坊門上的匾額早已不知去向，只留下幾根生鏽的鐵釘。門口堆著破裂的染缸，缸內積滿雨水與落葉。\n\n魏戌俞伸手推門。\n\n木門竟是虛掩著的。\n\n屋內傳來一股濃重的霉味。\n\n昔日用來晾曬布匹的木架仍立在原處，數十匹褪色的長布自橫樑垂落，有些已經腐爛，有些則被風吹得緩緩晃動。\n\n日光透過破損的屋瓦落下，在布匹之間切出一道道狹長的光柱。\n\n梁副官站在門旁，仔細看了一眼地面。\n\n「上校，有新鮮的腳印。」\n\n地上積了厚厚一層灰，幾道鞋印從門口延伸至木梯旁，鞋底的紋路十分清楚。\n\n魏戌俞蹲下身。\n\n「不只一個人。」\n\n他指著其中兩道彼此交疊的鞋印。\n\n「一個穿布鞋，另一個穿皮鞋。皮鞋的後跟磨得厲害，右腳比左腳深些。」\n\n梁副官沿著鞋印望向二樓。\n\n「兩人都上去了。」\n\n魏戌俞微微頷首。\n\n兩人一前一後踏上木梯。\n\n木梯年久失修，每踩一步，都會發出一聲細微的呻吟。\n\n到了二樓，眼前是一條狹長的走廊。\n\n兩側原本是存放染料及布匹的庫房，如今大多只剩下空蕩蕩的木架。\n\n靠近徐老石匠住處的那扇窗戶旁，擺著一張翻倒的木椅。\n\n魏戌俞走過去，從窗戶向外望。\n\n老石匠的院落盡收眼底。\n\n就連後院那口石井，也能看得清清楚楚。\n\n「他們恐怕早就在這兒了。」\n\n梁副官望著窗台。\n\n窗台上有幾個煙頭，旁邊還擱著半碗沒喝完的茶。\n\n他伸手碰了碰茶碗。\n\n「還是溫的。」\n\n魏戌俞立即抬頭。\n\n就在此時，走廊另一端的庫房裡，突然傳出一陣輕微的木板摩擦聲。\n\n梁副官迅速轉身。\n\n一道黑影從庫房門口掠過。\n\n「站住！」\n\n那人轉身便跑。\n\n魏戌俞與梁副官立即追了上去。\n\n走廊盡頭有一扇通往露台的木門，那人一腳踹開門板，縱身翻過欄杆。\n\n梁副官趕到露台時，只見那人順著外頭的木棚滑了下去，落地後迅速鑽入巷中。\n\n「上校，我去追！」\n\n「當心些！」\n\n梁副官翻過欄杆，緊跟而下。\n\n魏戌俞正要上前，身後一匹垂落的染布忽然動了一下。\n\n他猛地轉身。\n\n一道寒光迎面劃來。\n\n魏戌俞側身避開，刀刃擦著軍大衣掠了過去。\n\n藏在布匹後方的男人一擊未中，立即反手揮刀。\n\n魏戌俞扣住他的手腕，猛然向外一擰，另一手扣住他的肩膀，將他整個人撞向旁邊的木架。\n\n木架轟然倒塌。\n\n幾匹陳年布料落了下來，揚起大片灰塵。\n\n那男人卻極為敏捷，順勢從魏戌俞手中掙脫，一腳踢開地上的木架，朝走廊另一頭跑去。\n\n魏戌俞抬槍。\n\n「再跑一步試試。」\n\n那人停住了。\n\n灰塵緩緩落下。\n\n他背對著魏戌俞，右手仍握著短刀。\n\n「刀放下。」\n\n男人沒有動。\n\n「聽不懂人話？」\n\n過了片刻，短刀終於落到地上。\n\n魏戌俞持槍走近。\n\n「轉過來。」\n\n那人緩緩轉身。\n\n他穿著一件普通的灰色短褂，身形精瘦，約莫四十歲上下。\n\n濃眉，高鼻。\n\n左側眉骨上，有一道極為醒目的舊疤。\n\n魏戌俞的目光停在那道疤痕上。\n\n與徐老石匠畫下的那張臉，分毫不差。\n\n「原來是你。」\n\n那男人望著魏戌俞，嘴角竟浮現出一絲笑意。\n\n「魏家的人。」\n\n魏戌俞冷冷看著他。\n\n「你認得我？」\n\n男人沒有回答，反而將魏戌俞從頭到腳打量了一遍。\n\n「你與你父親倒是有幾分相像。」\n\n「你見過他？」\n\n「何止見過。」\n\n男人輕輕笑了一聲。\n\n「當年若不是他多管閒事，有些事情早就辦成了。」\n\n魏戌俞握槍的手沒有移動。\n\n「二十年前北山死了那麼多人，是你幹的？」\n\n「死了幾個修路的，又算得了什麼？」\n\n男人的語氣極其平淡。\n\n彷彿那些人命不過是路邊幾塊礙事的石頭。\n\n「你父親若是聰明一些，也不至於落得後來那般下場。」\n\n魏戌俞的臉色沉了下來。\n\n「把話說清楚。」\n\n男人笑而不語。\n\n魏戌俞向前走了一步。\n\n「我父親的事，你知道多少？」\n\n「魏上校，你當真想知道？」\n\n男人忽然抬起右手，摸了摸自己眉骨上的疤痕。\n\n「那便去找那面鏡子吧。」\n\n魏戌俞眉頭微皺。\n\n「七星鎏金鏡？」\n\n聽見這五個字，男人臉上的笑意更深了。\n\n「看來你已經查到不少東西了。」\n\n「北山的棺材也是你讓人搬走的？」\n\n「你會知道的。」\n\n「我現在就要知道。」\n\n魏戌俞將槍口抬高了些。\n\n「別考驗我的耐性。」\n\n男人卻絲毫不見慌張。\n\n他抬頭看向魏戌俞身後。\n\n「時辰到了。」\n\n魏戌俞心中一凜，立即側身。\n\n身後沒有任何人。\n\n再回頭時，那男人已經抓住旁邊一匹垂落的布，縱身翻出了窗戶。\n\n魏戌俞迅速追到窗邊。\n\n樓下是一座巨大的染缸。\n\n缸身足有半人高，裡頭積著多年未曾清理的黑水。\n\n那男人落入染缸，濺起大片水花。\n\n魏戌俞沒有猶豫，立即沿著露台旁的木梯下樓。\n\n可等他趕到染缸旁時，水面已經恢復了平靜。\n\n缸內漂浮著幾片枯葉。\n\n除此之外，什麼也沒有。\n\n他伸手將旁邊一根木棍探入水中。\n\n木棍很快便碰到了缸底。\n\n深不過數尺。\n\n一個成年男子，根本不可能藏在裡頭。\n\n魏戌俞望著那池黑水，神情愈發凝重。\n\n水面上，倒映著他的身影。\n\n忽然，倒影中的魏戌俞笑了一下。\n\n真正的魏戌俞卻沒有笑。\n\n他猛地退後一步。\n\n水面蕩起一圈漣漪。\n\n那張臉隨即消失了。\n\n梁副官回來時，魏戌俞仍站在染缸旁。\n\n「上校，人沒追上。」\n\n他的軍服袖口沾了不少泥土，右手還拿著一件深灰色的外衣。\n\n「那人對這一帶十分熟悉，穿過幾條巷子便不見了。不過他翻牆的時候，外衣被瓦片勾住，我從裡頭找到了一樣東西。」\n\n梁副官從衣袋裡取出一塊拇指大小的銅牌。\n\n銅牌呈長方形，四角磨得十分圓滑，正面刻著一座三層樓閣，背面則刻有一條首尾相銜的長蛇。\n\n魏戌俞接過看了看。\n\n「不像軍中的東西。」\n\n「我也是這麼想。那人身手不錯，跑起來又極有章法，應當不是普通的街頭地痞。」\n\n梁副官注意到地上的水跡。\n\n「上校，另一個人呢？」\n\n魏戌俞指了指染缸。\n\n「進去了。」\n\n梁副官走近一看，不由得愣住。\n\n「這裡頭？」\n\n「嗯。就是徐老先生今日見過的那個人。」\n\n「有疤的那個？」\n\n魏戌俞點頭。\n\n「他認得我父親，還知道七星鎏金鏡。看他的反應，二十年前北山發生的事情，他恐怕從頭到尾都參與了。」\n\n梁副官低頭查看染缸。\n\n缸身並沒有破損，底部也不存在其他出口。\n\n他撿起木棍，在水中攪了幾下。\n\n「奇怪，這缸底是實的。」\n\n「我看過了。」\n\n魏戌俞望著逐漸平靜的水面。\n\n「若不是親眼見他跳下去，連我都不會相信這裡曾經有過一個人。」\n\n梁副官站直身子。\n\n「難道他當真活了二十年，容貌卻沒有變過？」\n\n「還不能確定。」\n\n魏戌俞將銅牌收入衣袋。\n\n「不過，若有人能利用北山那些古怪的東西來去自如，往後咱們得更加小心了。」\n\n梁副官點了點頭。\n\n兩人正要離開，魏戌俞忽然停住腳步。\n\n「副官。」\n\n「在。」\n\n「方才追人的時候，可有受傷？」\n\n梁副官低頭看了一眼自己沾滿泥土的袖口。\n\n「沒有，翻牆時蹭了一下。」\n\n「沒事就好。走吧。」\n\n蘇爺的發現\n兩人回到徐家院落時，蘇孟達正蹲在後院的石井旁。\n\n他的膝上擱著一張宣紙，手裡拿著一根炭筆，正認認真真地描摹井蓋上的圖案。\n\n梁副官走了過去。\n\n「蘇爺，您這是在做什麼？」\n\n「給你們找條後路。」\n\n蘇孟達抬起頭。\n\n「那兩個人呢？」\n\n「跑了。」\n\n「都跑了？」\n\n梁副官瞥了他一眼。\n\n「您若有興趣，下回讓您去追。」\n\n「那倒不必。我這兩條腿平日走走路尚可，真要翻牆，恐怕還得請梁副官在下頭接著。」\n\n魏戌俞走到井邊。\n\n「發現什麼了？」\n\n蘇孟達立刻將宣紙遞給他。\n\n紙上描繪著龜形異獸，以及異獸四足下方的人頭。\n\n在四周那些看似普通的水波紋之間，蘇孟達還特意標記了幾處極不起眼的斷口。\n\n「魏長官，您瞧這幾道紋路。」\n\n魏戌俞蹲下身，將宣紙與石蓋上的圖案比對。\n\n水波紋共有七道。\n\n每一道紋路的長短不同，斷開的位置也各不相同。\n\n蘇孟達用炭筆將七處斷口連了起來。\n\n「像什麼？」\n\n梁副官俯身看去。\n\n「北斗七星。」\n\n「不錯。而且這七顆星的排列是正的。」\n\n蘇孟達站起身，從懷中取出徐老石匠交給他們的拓本。\n\n「昨夜那顆黑珠上的北斗是反的，兩盞信號燈的紋路也是反的。可這塊用來鎮住井底東西的石蓋，偏偏是正的。」\n\n魏戌俞接過拓本。\n\n他將描有上下兩座宮殿的那一部分展開。\n\n兩座宮殿隔著一條橫線，彼此倒置。\n\n「所以你認為，北斗星象不只是裝飾？」\n\n「八成不是。」\n\n蘇孟達指著石蓋。\n\n「方才徐老先生又跟我說了件事。當年您父親替他封井的時候，這塊石蓋可不是隨隨便便往井口一擱便完事了。」\n\n他指向石蓋邊緣一處三角形的刻痕。\n\n「您父親特意將這道刻痕轉到北邊，還交代老先生，往後即便井蓋有所移動，也得照原來的方位放回去。」\n\n梁副官蹲下身，查看井沿的石槽。\n\n果然，在朝北的一側，有一道與石蓋刻痕相對應的缺口。\n\n「咱們方才推回去時，恰好對上了。」\n\n「是啊。」\n\n蘇孟達笑了笑。\n\n「否則咱們現在說不定還在井邊跟那些東西拉扯呢。」\n\n魏戌俞沒有笑。\n\n他從懷中取出父親留在工程圖裡的那張薄紙。\n\n棺出則陰陽失序，鏡歸方可閉門。\n\n如今看來，這句話所指的門，未必是一扇尋常的石門。\n\n北山的隧道、城西的廢井、火車上的玻璃，甚至軍部辦公室內的鏡子，都曾經與那個不知名的地方產生聯繫。\n\n那口被搬走的棺材，便像是原先壓在門上的石蓋。\n\n一旦被人挪開，各處原本不該相通的地方，就會逐漸連接起來。\n\n「蘇爺。」\n\n魏戌俞將薄紙重新折好。\n\n「若用相同的法子，能不能暫時鎮住北山的東西？」\n\n蘇孟達摸了摸下巴。\n\n「得看那地方還剩下什麼。若當年修築古道的人確實留下過類似的機關，興許能將其中幾處通道重新封住。」\n\n「能撐多久？」\n\n「這我可不敢保證。」\n\n蘇孟達難得認真地說道：\n\n「魏長官，堵住一口井與堵住整條地下水脈，是兩回事。咱們頂多先讓它們出不來，要想徹底把事情解決，恐怕還是得找到那面鏡子。」\n\n魏戌俞望著石蓋上的七星紋路。\n\n「能暫時封住就夠了。」\n\n北山的三道石門\n當日傍晚，徐老石匠被軍部的人接走。\n\n臨行以前，他又告訴魏戌俞一件事。\n\n當年魏家的人封住古道時，曾經在北山那間停放棺木的石室中留下三塊石板。\n\n三塊石板分別刻著不同的圖案。\n\n若日後山中再出怪事，可以試著依照石板上的紋路，將古道重新封閉。\n\n只是這些年過去了，他也不知道那幾塊石板是否還在。\n\n魏戌俞當即帶著梁副官與蘇孟達返回北山。\n\n夕陽落到山後時，三人再次來到那間隱蔽的石室。\n\n山風從藤蔓之間穿過，吹得石門旁的野草簌簌作響。\n\n石室內依舊空蕩蕩的。\n\n原先停放黑棺的石台孤零零立在中央，頂上的送葬圖在風燈照耀下顯得格外陰森。\n\n蘇孟達是第一次來到這個地方。\n\n他一進門，便仰頭望向拱頂上的雕刻。\n\n「好傢伙。」\n\n他提著風燈，在石室裡轉了一圈。\n\n「這般規模的石刻，若能完整拓下來，怕是整個北城的古董商都得跑來瞧上一眼。」\n\n梁副官淡淡道：\n\n「蘇爺可別忘了咱們是來做什麼的。」\n\n「我這不是正在看嘛。」\n\n蘇孟達沿著石壁緩緩走動，目光掠過送葬人、石門及那座規模龐大的地下宮殿。\n\n突然，他停了下來。\n\n「魏長官，您來看看。」\n\n魏戌俞走到他身旁。\n\n蘇孟達所指的是雕刻中一處毫不起眼的角落。\n\n地下宮殿外圍，畫著三座彼此相連的小殿。\n\n第一座殿前刻有一輪太陽。\n\n第二座殿前是一輪彎月。\n\n第三座殿前，則是一組七星圖案。\n\n「日、月、星。」\n\n蘇孟達低聲道。\n\n「那老先生說有三塊石板，會不會就是這三樣？」\n\n魏戌俞抬高風燈，仔細觀察石室四周。\n\n這間石室呈長方形，除了入口，左右及正前方皆是完整的石壁。\n\n石壁上沒有其他出路。\n\n梁副官繞著石台走了一圈，忽然蹲下身。\n\n「上校，石台下面有縫。」\n\n魏戌俞與蘇孟達立即走了過去。\n\n石台底座與地面之間，果然有一道極窄的縫隙。\n\n梁副官將燈移近。\n\n底座正面的雲紋並非直接雕刻在整塊石頭上，而是由數塊大小相同的石板拼成。\n\n他伸手拂去上面的泥土。\n\n第一塊石板上，隱約露出了一輪日形圖案。\n\n旁邊兩塊，恰好是彎月與七星。\n\n「找到了。」\n\n蘇孟達蹲在地上，伸手推了推其中一塊石板。\n\n紋絲不動。\n\n他又試著將石板往左右挪動，仍沒有任何反應。\n\n「奇怪，既然特意做成活動的石板，總該有個能移動的地方才是。」\n\n魏戌俞蹲下身，仔細查看石板四周。\n\n三塊石板的大小完全一致，唯獨日形石板的左上角，有一處不大自然的凹陷。\n\n他伸手摸了摸。\n\n凹陷呈半圓形，深約一指。\n\n「蘇爺，你看這兒。」\n\n蘇孟達湊近一瞧，隨即從布袋中取出細長的鐵尺，順著凹陷探了進去。\n\n鐵尺很快碰到了石板後方。\n\n喀。\n\n一聲極輕的響動。\n\n日形石板竟然向外彈出了半寸。\n\n「成了！」\n\n蘇孟達伸手扣住石板邊緣，慢慢向外拉動。\n\n就在石板被完全拉出的同一刻，石室深處傳來一陣沉悶的水聲。\n\n三人同時停下動作。\n\n梁副官抬頭望向正前方的石壁。\n\n「牆後有水。」\n\n那水聲越來越大。\n\n像是一條原本靜止的地下河，突然開始流動。\n\n魏戌俞將風燈舉向石台後方。\n\n石壁底部原先乾燥的縫隙裡，正緩緩滲出黑色的水。\n\n蘇孟達低頭看看自己手裡的石板。\n\n「魏長官，我是不是動錯東西了？」\n\n「先別放回去。」\n\n魏戌俞指向石板背面。\n\n「上頭有字。」\n\n石板背面刻著一幅極為簡單的圖案。\n\n一輪太陽高懸於上方，下方則畫著三道半開的石門。\n\n三道石門之間，各有一條細線相連。\n\n梁副官伸手接過石板，仔細辨認。\n\n「這些線不像尋常紋飾。上校，會不會是在說明三道門之間的關係？」\n\n魏戌俞沒有回答。\n\n他將目光移向拱頂上的雕刻。\n\n三座小殿沿著山勢排列，日殿最高，月殿其次，星殿則修在最下方。\n\n然而再往深處看，雕刻中那座倒懸的地下宮殿，三座小殿的排列恰恰相反。\n\n星在上，月在中，日在下。\n\n他忽然想起城西那塊鎮水石。\n\n正向的七星能夠鎮住井中的東西，反向的七星則出現在那些從墓中帶出的古物上。\n\n兩種方向，或許便代表著兩種不同的用途。\n\n「蘇爺，把另外兩塊也取出來。」\n\n蘇孟達依言照辦。\n\n月形石板及七星石板相繼被取出。\n\n石室中的水聲驟然變大。\n\n黑水已經漫過石壁下方的縫隙，沿著地面向三人腳邊流了過來。\n\n梁副官將風燈移近。\n\n水中漂著幾片發黑的枯葉，還有一小截已經腐朽的木頭。\n\n那木頭上殘留著黑漆。\n\n「上校，這水恐怕與停放棺材的地方相通。」\n\n魏戌俞接過另外兩塊石板。\n\n三塊石板背面皆有雕刻。\n\n日形石板上，三道門是半開的。\n\n月形石板上，三道門已關閉了兩道。\n\n唯獨七星石板上，三道門全部閉合，門前還伏著一隻龜蛇交纏的異獸。\n\n「原來如此。」\n\n魏戌俞將三塊石板並排放在石台上。\n\n「它們不只是對應三座殿，也記載著三道門開合的次序。」\n\n蘇孟達一面望著石板，一面望著拱頂上的雕刻。\n\n「日出則開，日落則閉。若從陽間的規矩來看，最後應當是七星歸位。」\n\n梁副官道：\n\n「可石板原本便是日、月、星的順序，為何還會出事？」\n\n魏戌俞拿起日形石板，仔細端詳它的正面。\n\n「副官，你看這上頭的太陽。」\n\n太陽下方，有一座由三道橫線構成的山峰。\n\n那三道橫線並非平直，而是微微向上彎曲。\n\n魏戌俞將石板倒轉過來。\n\n山峰變成了朝下的圖案。\n\n與拱頂雕刻中那座倒懸宮殿的山勢，完全吻合。\n\n梁副官頓時明白了。\n\n「有人將石板倒著放了回去？」\n\n「不錯。日月圖案近似圓形，若不仔細看，很難察覺上下有別。」\n\n蘇孟達拿起七星石板，往風燈下一照。\n\n七顆星辰之間有極細的連線，其中幾處刻痕幾乎已被磨平。\n\n「這塊也是。星象全是反的。」\n\n他不由得嘖了一聲。\n\n「搬棺材的那些人，看來連這地方的機關都知道。」\n\n魏戌俞伸手接過石板。\n\n「先將它們恢復原位。」\n\n此時黑水已漫至石台周圍。\n\n梁副官突然後退了一步。\n\n「上校，水裡有人。」\n\n魏戌俞立即低頭。\n\n石台旁的水面，倒映著拱頂上的送葬圖。\n\n原本一動不動的那些石刻人像，此刻竟在倒影中緩緩行走。\n\n前頭的人提著燈籠，後頭的人手持招魂幡。\n\n八名抬棺人正抬著黑棺，沿著石刻中的山路朝前走去。\n\n然而他們行走的方向，與石刻完全相反。\n\n他們正在出山。\n\n蘇孟達看得心頭一緊。\n\n「魏長官，咱們得趕在它們走到山門之前，把這幾塊石板放回去！」\n\n魏戌俞立即將日形石板嵌入石槽。\n\n喀嚓。\n\n石室深處傳來一聲沉重的響動。\n\n水面上的送葬隊伍停了一下。\n\n梁副官將月形石板推入第二處石槽。\n\n又是一聲巨響。\n\n黑水的流勢逐漸減緩。\n\n然而最後那塊七星石板，無論如何都推不進去。\n\n「上校，裡頭卡住了。」\n\n梁副官將風燈放在石台旁，伸手摸索石槽內部。\n\n「有塊石頭擋著。」\n\n蘇孟達立即取出工具，試圖將那塊石頭挑出來。\n\n就在此時，石台旁的水面突然鼓了起來。\n\n一盞白色燈籠，從漆黑的水中慢慢浮出。\n\n燈籠上沒有半點水跡。\n\n裡頭還燃著幽綠色的火焰。\n\n魏戌俞迅速將手槍拔了出來。\n\n「蘇爺，快！」
