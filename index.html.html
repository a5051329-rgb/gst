\n\n「就差一點！」\n\n蘇孟達手腕一轉，終於將卡在石槽中的碎石挑了出來。\n\n梁副官立即將七星石板推入。\n\n轟隆隆——\n\n石室深處傳來一連串石門落下的聲響。\n\n第一聲極近。\n\n第二聲稍遠。\n\n第三聲則彷彿來自山腹極深之處。\n\n水面上的燈籠猛地熄滅。\n\n黑水開始迅速退去。\n\n那些倒映於水中的送葬人，似乎也察覺到了什麼，原本整齊的隊伍頓時亂了起來。\n\n一個紙人轉過身，伸出雙手，拼命朝水面上方抓來。\n\n但隨著最後一點黑水退入石壁的縫隙，那張塗著紅色胭脂的臉，也徹底消失在三人眼前。\n\n石室重新恢復寂靜。\n\n蘇孟達一屁股坐到石階上。\n\n「這下好了，今晚總算不用再趕人家的白事了。」\n\n梁副官長長吐出一口氣。\n\n魏戌俞則站在石台前，望著那三塊已經恢復原位的石板。\n\n他的父親當年應當也站在這裡，做過相同的事情。\n\n只可惜時隔多年，原本封住的東西，終究還是被人放了出來。\n\n南下\n翌日清晨，北山車站傳來消息。\n\n自昨夜起，站內再未出現哭聲、紙錢或任何不尋常的動靜。第六節車廂裡那股腐木與香灰混合的氣味，也比先前淡了許多。\n\n魏戌俞仍未下令解除封鎖。\n\n他知道，古道的三道石門只能暫時阻止那些東西出來。\n\n失蹤的第七節車廂仍未找到，那口黑棺也不知去向。\n\n至於真正的陵墓，甚至連確切的位置都尚未弄清楚。\n\n當日上午，蘇孟達又來了一趟軍部。\n\n這一回，他手裡拿著三張火車票。\n\n「魏長官，南邊的事情都打聽清楚了。」\n\n魏戌俞從公文中抬起頭。\n\n「請帖弄到了？」\n\n「沒有。」\n\n魏戌俞看了他一眼。\n\n蘇孟達趕忙接著說道：\n\n「不過我有個做古董生意的朋友，明日也要南下。他與拍賣會的主辦人有些交情，等到了地方，興許能替咱們想想辦法。」\n\n梁副官接過火車票。\n\n「明日一早出發？」\n\n「不錯。路上得走一日多，咱們提早到，也好打聽打聽其他買家的來歷。」\n\n蘇孟達走到桌旁，忽然壓低聲音。\n\n「據我聽來的消息，這回想買七星鎏金鏡的人還不少。有幾位連古董都不懂，卻指名道姓非要這件東西不可。」\n\n魏戌俞放下鋼筆。\n\n「開了多少價？」\n\n蘇孟達伸出五根手指。\n\n「尚未開拍，私底下便有人出到五萬大洋。」\n\n梁副官聞言，也不免有些意外。\n\n「一面古鏡，竟值這麼多？」\n\n「若只是古鏡，自然不值。」\n\n蘇孟達拉開椅子坐下。\n\n「可若有人當真相信它能讓死人復生，或者讓活人永遠不死，那便是再多添個零，恐怕也有人肯出。」\n\n魏戌俞沉默片刻。\n\n「無論如何，鏡子不能落入那些人手中。」\n\n他轉向梁副官。\n\n「副官，北山的事情安排妥當。此行不必帶太多人，咱們三個去便是。」\n\n「是。」\n\n蘇孟達聽了，頓時笑了起來。\n\n「魏長官，這趟南下總該比北山舒坦些吧？我聽說南邊酒樓不少，姑娘也生得漂亮。咱們辦完正事，總能抽空逛逛。」\n\n魏戌俞重新拿起鋼筆。\n\n「你若有這個閒工夫，不如先把請帖弄到手。」\n\n蘇孟達嘆了口氣。\n\n「梁副官，你說我認識他這麼多年，他怎麼就不知道享福呢？」\n\n梁副官將三張火車票收好。\n\n「您認識上校這麼多年，怎麼還沒習慣呢？」\n\n蘇孟達一時無言。\n\n魏戌俞低頭批閱公文，嘴角卻微微揚了起來。\n\n同一日，北城一間酒樓的雅間內。\n\n一名身穿綢緞長衫的男人正靠在椅背上，手裡端著一杯酒。\n\n他身形壯實，手指上戴著兩枚金戒指，桌邊還站著幾個隨從。\n\n在他面前，擱著一張燙金請帖，以及一只裝滿銀元的木匣。\n\n坐在對面的男人頭戴黑色禮帽，帽簷壓得很低，看不清面容。\n\n「東西就在這次拍賣會上。」\n\n他將請帖推了過去。\n\n「無論用什麼法子，都要將它帶回來。」\n\n綢衫男人打開木匣，望著滿滿一匣銀元，頓時眉開眼笑。\n\n「一面古鏡罷了，值得您老人家這麼費心？」\n\n黑帽男人沒有回答。\n\n綢衫男人收起請帖，端起酒杯。\n\n「放心，正巧我家裡也給我在南邊安排了一門親事。這趟過去，辦完您的事情，再見見那位商家小姐，倒是一舉兩得。」\n\n「別誤了正事。」\n\n「那是自然。」\n\n綢衫男人將杯中的酒一飲而盡，起身帶著隨從離開。\n\n房門關上之後，雅間內只剩下黑帽男人。\n\n他取下帽子，放在桌上。\n\n午後的陽光透過窗戶，照亮了他的側臉。\n\n左側眉骨上，有一道陳年的疤痕。\n\n他從懷中取出一面小小的銅鏡。\n\n銅鏡表面斑駁不堪，卻依然能夠映出他的面容。\n\n他望著鏡中的自己，伸手摸了摸那道疤痕。\n\n過了許久，竟低低笑了起來。\n\n「姓魏的，二十年前你父親壞了我的好事。」\n\n「這一回，倒要看看你有多少本事。」\n\n話音落下。\n\n他將銅鏡放回桌上。\n\n然而就在銅鏡離開他面前的那一刻，鏡中的面孔忽然發生了變化。\n\n原本尚算年輕的容貌，迅速浮現出密密麻麻的皺紋。\n\n頭髮盡白，眼窩深陷，皮膚乾癟得幾乎貼住骨頭。\n\n那根本不是一張四十歲男人的臉。\n\n而是一張早已衰老得不成模樣的臉。\n\n最可怕的是——\n\n鏡中的老人，直到此刻仍睜著眼睛，死死望著鏡外的自己。\n\n（第六回完）"}, {"n": 7, "title": "南下的列車", "body": "清晨的北城車站，比往日熱鬧許多。\n\n月台上堆滿了準備南運的貨物，挑著扁擔的小販穿梭在人群之中，賣燒餅的、賣茶水的、替旅客搬運行李的，吆喝聲此起彼伏。\n\n北山鐵路尚未完全恢復通行，南下的客車暫時改由城東另一條線路出發，路程比原先多出近三個鐘頭。\n\n蘇孟達站在月台上，左手提著布袋，右手捧著一包剛買來的糖炒栗子。\n\n「梁副官，吃不吃？」\n\n「不吃。」\n\n「這一路得坐上一日多呢，您就不怕嘴閒得慌？」\n\n「不怕。」\n\n「那您平日跟著魏長官出門，兩個人都不說話，豈不是悶得要命？」\n\n梁副官看了他一眼。\n\n「這次有您在，想必是不會了。」\n\n蘇孟達剝栗子的動作停了一下。\n\n「我怎麼聽著不像是在誇我？」\n\n「您聽得很準。」\n\n魏戌俞從兩人身後走來。\n\n「上車了。」\n\n此次南下並非公開的軍務行程，魏戌俞特意換下了軍服，穿著一件深灰色襯衣，外頭罩著黑色長大衣。梁副官也換了一身便裝，將隨身攜帶的手槍藏在外衣之下。\n\n少了軍銜與肩章，魏戌俞看上去倒像是哪戶富裕人家的公子。\n\n只是常年從軍養成的習慣，並非換一身衣服便能掩去。\n\n他走路時腰背挺直，目光偶爾掃過四周，經過人群也極少停留。幾名迎面走來的旅客，甚至不自覺地往旁邊讓了讓。\n\n蘇孟達跟在後頭，看了半天，忽然湊到梁副官身旁。\n\n「你說魏長官穿成這樣，到了南邊，會不會有人上門招他做女婿？」\n\n梁副官沒有回答。\n\n走在前面的魏戌俞倒是聽見了。\n\n「蘇爺。」\n\n「哎。」\n\n「請帖弄到了？」\n\n蘇孟達立即閉上了嘴。\n\n三人的座位位於頭等客車的中段。\n\n車廂內鋪著深紅色的地毯，兩側各設有數間獨立包廂，包廂內置有軟座、木製小桌及可供旅客休息的臥鋪。\n\n魏戌俞將大衣掛在一旁，取出徐老石匠留下的拓本，攤在桌上。\n\n自從北山古道重新封閉以後，軍部便再未接獲異象出現的消息。\n\n但那幾道石門究竟能維持多久，誰也說不準。\n\n尤其是那個眉骨帶疤的男人。\n\n魏戌俞至今仍記得他消失在染缸中的情景。\n\n那人對父親的事情十分熟悉，又有辦法利用水面來去自如。若他當真是二十年前進入北山古道的人，那麼這二十年間，他究竟去了哪裡，又做了些什麼？\n\n蘇孟達見他盯著拓本，便將裝栗子的紙袋往旁邊挪了挪。\n\n「魏長官，您還在想那個有疤的人？」\n\n「嗯。」\n\n「我這兩日也琢磨過。照徐老先生的說法，那人當年是留在第三道石門後頭的。既然如今能在外頭走動，想來是找到了別的出口。」\n\n魏戌俞指向拓本上那座倒懸的宮殿。\n\n「他從染缸裡消失時，水面上還留下了我的倒影。」\n\n梁副官抬起頭。\n\n「您先前說，那倒影自己笑了？」\n\n「不錯。」\n\n蘇孟達慢慢將手中的栗子放下。\n\n「若只是借水面逃走，您的倒影又何必跟著發生變化？」\n\n魏戌俞看向他。\n\n「這正是我想不明白的地方。」\n\n蘇孟達沉吟片刻。\n\n「我倒有個猜測。」\n\n「說。」\n\n「您還記得那兩盞信號燈吧？一盞是老周自己的，另一盞卻是從那頭來的。兩件東西既然能同時存在，那人呢？」\n\n梁副官皺了皺眉。\n\n「您的意思是，活人也能有兩個？」\n\n「咱們在北山見過那個無臉的東西，它能變成小陳的模樣。但那畢竟是模仿，與信號燈的情況還不大一樣。」\n\n蘇孟達伸出兩根手指。\n\n「若真有一個人，在陽間有一副身子，在那頭又有另一副身子……」\n\n他將兩根手指交錯了一下。\n\n「那麼二十年過去，老了的究竟是哪一個？」\n\n魏戌俞望著拓本，沒有立即回答。\n\n梁副官則想起了一件事。\n\n「上校，那人既然讓您去找鏡子，會不會早就知道咱們要南下？」\n\n「有可能。」\n\n魏戌俞將拓本慢慢捲起。\n\n「他故意在我面前提及父親的事，又有意將話引向那面鏡子。這些舉動不像是要阻止我追查，反倒像是巴不得我繼續查下去。」\n\n蘇孟達撓了撓眉毛。\n\n「那咱們豈不是順了他的意？」\n\n「順不順他的意，鏡子都得找。」\n\n魏戌俞將拓本收入木盒。\n\n「至於他想做什麼，等東西到了手裡，自然有機會弄清楚。」\n\n車外響起一聲悠長的汽笛。\n\n火車緩緩駛離月台。\n\n北城的屋舍逐漸向後退去，取而代之的是大片田野與連綿的山丘。\n\n蘇孟達靠在窗旁，望著外頭的景色，舒舒服服地伸了個懶腰。\n\n「總算能坐一趟尋常火車了。」\n\n梁副官瞥了他一眼。\n\n「您最好別說這種話。」\n\n頭等車廂的客人\n火車行駛了近三個鐘頭。\n\n到了午間，窗外已能看見大片河流與農田。陽光透過玻璃照進包廂，桌上的茶水隨車身輕輕晃動。\n\n蘇孟達吃完了半袋栗子，便說什麼也坐不住了。\n\n「魏長官，我去餐車瞧瞧，看看有什麼好吃的。」\n\n魏戌俞正在翻閱一本書，頭也沒抬。\n\n「去吧。」\n\n蘇孟達轉向梁副官。\n\n「一起？」\n\n「不了。」\n\n「那我給二位帶些回來。」\n\n蘇孟達推開包廂門，哼著小曲走了出去。\n\n不到半刻鐘，他便又回來了。\n\n手裡什麼也沒拿。\n\n梁副官抬起頭。\n\n「吃的呢？」\n\n蘇孟達將包廂門掩上，神祕兮兮地坐到魏戌俞對面。\n\n「魏長官，我方才遇上個有錢的主兒。」\n\n魏戌俞翻了一頁書。\n\n「與我何干？」\n\n「原本是不相干。」\n\n蘇孟達往前湊了湊。\n\n「不過我瞧見他手裡有樣東西，您興許會感興趣。」\n\n魏戌俞這才抬起眼睛。\n\n「什麼東西？」\n\n「南邊那場拍賣會的請帖。」\n\n梁副官立即放下茶杯。\n\n「您確定？」\n\n「錯不了。深紅色的封面，四周燙金，正中央印著程家商會的印記。我打聽這東西打聽了好幾日，還能認錯不成？」\n\n魏戌俞將書合上。\n\n「什麼人？」\n\n「不認得。三十來歲，長得挺壯，身上掛的金子怕是比我鋪子裡的銅器還多。帶著四個隨從，占了餐車最裡頭的兩張桌子。」\n\n蘇孟達想了想，又補了一句。\n\n「派頭倒是不小，就是瞧著不大像正經做買賣的。」\n\n魏戌俞站起身。\n\n「走，去看看。」\n\n蘇孟達頓時笑了。\n\n「我就知道您坐不住。」\n\n梁副官起身拿了外衣。\n\n「蘇爺，您少說兩句。」\n\n餐車內鋪著白色桌布，每張桌上都擺著一只玻璃花瓶。\n\n正值用餐時分，幾名侍者端著餐盤在過道中來回穿梭，空氣中瀰漫著牛肉、紅茶與烘烤麵包的香氣。\n\n蘇孟達所說的那個男人，就坐在餐車最末端。\n\n他身穿墨綠色綢緞長衫，腕上戴著一串沉香木珠，右手兩枚金戒指格外顯眼。此刻正大喇喇地靠著椅背，讓身旁的隨從替他倒酒。\n\n「少爺，老爺可是交代過，這趟到了南邊，得先把程家的事情辦妥。」\n\n「知道了，成天唸個沒完。」\n\n男人端起酒杯。\n\n「我錢世豪想娶個女人，還得你們教？」\n\n隨從連忙陪笑。\n\n「小的不敢。」\n\n錢世豪將杯中的酒飲盡。\n\n「再說，那位程小姐若真有傳聞中那麼漂亮，這趟倒也不算白跑。」\n\n另一名隨從笑道：\n\n「那是自然。聽說這位小姐在南邊可是出了名的美人，程家又只有這麼一個女兒，少爺若能娶進門……」\n\n「行了。」\n\n錢世豪不耐煩地揮了揮手。\n\n「先把那件古董買下來再說。」\n\n三人隔著幾張桌子坐下。\n\n餐車內人聲嘈雜，魏戌俞並未聽清他們前頭談論親事的話，只聽見最後一句。\n\n他朝錢世豪桌上的東西望了一眼。\n\n一張深紅色的請帖擱在酒瓶旁。\n\n正是蘇孟達所說的那一張。\n\n蘇孟達壓低聲音。\n\n「錢世豪……這名字我倒是聽過。」\n\n梁副官問道：\n\n「什麼來頭？」\n\n「北邊有個錢家，早些年是靠碼頭起家的。表面上做些運貨、倉儲的買賣，背地裡也替人收債、爭地盤。這位錢少爺若是那家的人，便難怪身旁跟著這麼些打手了。」\n\n魏戌俞看了看錢世豪的幾名隨從。\n\n「他們身上有槍。」\n\n梁副官順著他的目光望去。\n\n其中一人的短褂下方微微隆起，腰側露出一截皮製槍套。\n\n蘇孟達端起茶杯。\n\n「做古董買賣還帶著這麼多槍，倒是比我有出息。」\n\n魏戌俞收回視線。\n\n「先吃飯。」\n\n「不去問問他那張請帖？」\n\n「不急。」\n\n侍者很快將三人的午餐送了上來。\n\n蘇孟達一面吃著牛肉，一面不時往錢世豪那頭張望。\n\n就在此時，一名年輕侍者端著熱茶經過錢世豪身旁。\n\n火車恰好在此時轉彎，車身晃了一下。\n\n侍者手中的茶壺微微傾斜，幾滴茶水濺到了錢世豪的袖口。\n\n「對不起，先生！」\n\n侍者連忙取出手帕。\n\n錢世豪低頭看了一眼袖子，抬手便是一巴掌。\n\n啪！\n\n整節餐車頓時安靜下來。\n\n年輕侍者被打得向旁踉蹌了兩步，手中的茶壺落到地上，摔得粉碎。\n\n「你沒長眼睛？」\n\n侍者捂著臉，連連道歉。\n\n「先生，實在對不住，我替您擦乾淨……」\n\n錢世豪一把拍開他的手。\n\n「擦？你知道這件衣服值多少錢嗎？把你賣了都賠不起！」\n\n餐車的領班聞聲趕來，好聲好氣地向他賠不是。\n\n錢世豪卻絲毫沒有罷休的意思。\n\n他朝身旁的隨從使了個眼色。\n\n「讓他跪下。」\n\n兩名隨從立即上前，一左一右扣住侍者的胳膊。\n\n蘇孟達放下了刀叉。\n\n梁副官也抬起了頭。\n\n魏戌俞依舊坐在原處。\n\n只是他的目光，已經落在了錢世豪身上。\n\n「放開他。」\n\n聲音不大。\n\n卻讓餐車內所有人都聽得清清楚楚。\n\n錢世豪轉過頭。\n\n他打量著坐在窗旁的魏戌俞，見對方穿著一身便裝，身邊又只跟著兩個人，不由得嗤笑了一聲。\n\n「這位先生，您在跟誰說話？」\n\n魏戌俞看著那兩名隨從。\n\n「手放開。」\n\n錢世豪臉上的笑容漸漸淡了下來。\n\n「我教訓個不懂規矩的下人，還輪得到你來管？」\n\n魏戌俞拿起手帕，擦了擦手。\n\n「幾滴茶水，值得你這麼大的陣仗？」\n\n「值不值得，那是我的事。」\n\n錢世豪推開椅子，站了起來。\n\n「你若是心疼他，不如替他把這件衣服賠了。」\n\n魏戌俞抬起眼睛。\n\n「衣服我賠得起。你方才打人的那一巴掌，又打算怎麼賠？」\n\n餐車裡有人忍不住笑了一聲。\n\n錢世豪的臉色頓時難看起來。\n\n他在北邊橫行慣了，平日便是惹出什麼事情，也有錢家的人替他收拾。如今當著滿車旅客的面被人頂撞，哪裡咽得下這口氣。\n\n「好大的口氣。」\n\n他朝身旁的人抬了抬下巴。\n\n「請這位先生過來，讓我好好跟他講講道理。」\n\n一名隨從立即走到魏戌俞桌前，伸手便要去抓他的肩膀。\n\n還未碰到衣服，梁副官已經站了起來。\n\n他扣住那人的手腕，反手一擰。\n\n那人疼得彎下腰去，另一隻手趕忙扶住桌沿。\n\n梁副官平靜地看著他。\n\n「有話好好說，別動手。」\n\n錢世豪一愣。\n\n其餘幾名隨從立即圍了上來。\n\n蘇孟達低頭看了看自己還沒吃完的牛肉，連忙端起餐盤，往旁邊挪了一個位置。\n\n「諸位慢些，這盤菜還挺貴的。」\n\n沒有人理他。\n\n一名身材魁梧的隨從跨過過道，揮拳便朝梁副官臉上打去。\n\n梁副官側頭避開，抓住他的胳膊，順勢向下一壓。\n\n砰！\n\n那人的胸口重重撞上桌面。\n\n花瓶倒了。\n\n茶杯碎了。\n\n蘇孟達捧著餐盤，望著滿地狼藉，忍不住搖頭。\n\n「這下可比方才那幾滴茶水值錢多了。」\n\n錢世豪氣得一把推開面前的椅子。\n\n「給我打！」\n\n兩名隨從鬆開侍者，轉身朝魏戌俞撲去。\n\n魏戌俞這才站了起來。\n\n第一人伸手抓向他的衣領，被他扣住胳膊，借勢推向迎面而來的另一人。\n\n兩人撞在一塊兒，還未站穩，魏戌俞便已跨過座位間的空隙，抬腿踹在其中一人的膝側。\n\n那人當場跪倒。\n\n另一人見勢不妙，伸手摸向腰間。\n\n魏戌俞的目光驟然一冷。\n\n「手拿出來。」\n\n對方動作一頓。\n\n魏戌俞上前扣住他的手臂，一把將人按在車壁上。\n\n一支手槍從那人的腰間掉了出來，落在地毯上。\n\n餐車內頓時響起一陣驚呼。\n\n幾名旅客慌忙起身，往車廂另一端退去。\n\n梁副官彎腰拾起手槍，退至魏戌俞身旁。\n\n四名隨從，轉眼間便倒了三個。\n\n剩下一個站在錢世豪身後，看著眼前的情形，竟遲遲不敢上前。\n\n魏戌俞整了整袖口。\n\n「還打嗎？」\n\n錢世豪氣得滿臉通紅。\n\n他原本以為對方不過是個多管閒事的富家公子，哪裡料到竟有如此身手。\n\n「你知道我是誰嗎？」\n\n魏戌俞淡淡道：\n\n「不知道，也沒興趣。」\n\n「我爹是錢萬山！北邊幾個碼頭都有我們錢家的生意！你敢動我的人，信不信我讓你走不出這列火車？」\n\n魏戌俞聞言，倒是笑了一下。\n\n「就憑這幾個？」\n\n錢世豪一時竟接不上話。\n\n蘇孟達終於吃完了最後一塊牛肉。\n\n他放下餐盤，慢悠悠地走了過來。\n\n「錢少爺，出門在外，還是和氣生財的好。您瞧瞧，衣服原先不過濕了幾滴，如今倒好，幾個手下都快不能走路了。」\n\n錢世豪狠狠瞪了他一眼。\n\n「你又算什麼東西？」\n\n蘇孟達指了指自己。\n\n「我？我是來吃飯的。」\n\n梁副官側過頭，望向窗外。\n\n魏戌俞則走到那名年輕侍者身旁。\n\n侍者的左頰已經腫了起來，嘴角也有些血跡。\n\n「去找大夫看看。」\n\n「多謝先生，多謝先生……」\n\n侍者連連鞠躬。\n\n魏戌俞轉頭望向錢世豪。\n\n「打碎的東西，還有他的醫藥費，你來賠。」\n\n錢世豪咬著牙，正要開口，餐車另一頭忽然傳來急促的腳步聲。\n\n「讓一讓！讓一讓！」\n\n列車長帶著兩名乘警趕了過來。\n\n一見餐車內的情形，又見梁副官手中拿著槍，幾人的神情立即緊張起來。\n\n「哪位先生動了槍？」\n\n梁副官將手槍放到桌上。\n\n「槍是他們的。車內的旅客都能作證。」\n\n先前受驚的幾名旅客紛紛開口。\n\n「就是那穿綠衣服的人先打人的！」\n\n「他的人還想拔槍呢！」\n\n「我們全瞧見了！」\n\n錢世豪見情形不對，立刻變了臉色。\n\n一張請帖\n列車長原本打算將錢世豪一行人交給下一站的警察。\n\n錢世豪身旁的隨從急忙將他拉到一旁，低聲勸了幾句。\n\n「少爺，咱們這趟南下還有正事。若真被扣在半路上，耽擱了那位先生交代的事情，可不好交代啊！」\n\n錢世豪的臉色微微一變。\n\n他朝桌上的請帖望了一眼，又望向魏戌俞。\n\n過了片刻，他從懷中取出一疊鈔票，重重拍在桌上。\n\n「這些總夠了吧！」\n\n列車長清點了一下鈔票，正欲說話，魏戌俞卻先開了口。\n\n「向人道歉。」\n\n錢世豪猛然抬頭。\n\n「你說什麼？」\n\n「聽不懂？」\n\n兩人對視良久。\n\n錢世豪的胸口劇烈起伏了幾下，終究還是轉向那名侍者，從牙縫裡擠出一句：\n\n「方才對不住了。」\n\n魏戌俞這才將目光移開。\n\n列車長也不願讓事情繼續鬧大，確認侍者願意接受賠償之後，便命人將錢世豪的幾名隨從帶到另一節車廂安置。\n\n蘇孟達站在一旁，目光卻始終沒有離開桌上的請帖。\n\n待列車長走後，他朝魏戌俞使了個眼色。\n\n魏戌俞會意，走到錢世豪面前。\n\n「你這張請帖，哪裡來的？」\n\n錢世豪立即伸手將請帖抓了起來。\n\n「關你什麼事？」\n\n「我也想去這場拍賣會。」\n\n魏戌俞拉開一張椅子，從容坐下。\n\n「開個價。」\n\n錢世豪愣了一下，隨即冷笑。\n\n「原來是看上了我的東西。」\n\n他將請帖在手中晃了晃。\n\n「這可是程家商會親自發的請帖，你便是有錢，也不見得弄得到。」\n\n蘇孟達湊了過來。\n\n「錢少爺，價錢好商量嘛。」\n\n「商量？」\n\n錢世豪往魏戌俞面前一坐。\n\n「你方才不是挺有本事的嗎？怎麼，現在倒有事求我了？」\n\n魏戌俞望著他，沒有說話。\n\n錢世豪見狀，自以為總算抓住了對方的把柄，臉上又浮現出幾分得意。\n\n「這樣吧，你若真想要這張請帖，就跟我比一樣東西。」\n\n蘇孟達有些意外。\n\n「比什麼？」\n\n錢世豪伸出右手，將胳膊擱在桌上。\n\n「掰腕子。」\n\n梁副官的目光從錢世豪粗壯的手臂移到魏戌俞臉上。\n\n蘇孟達則慢慢抿住了嘴，似乎在努力忍住笑意。\n\n錢世豪自幼喜歡與人比力氣，仗著身形壯實，在碼頭上與人掰腕子，倒也極少輸過。\n\n方才魏戌俞能打倒自己的手下，在他看來，不過是身手靈活，占了些技巧上的便宜。\n\n真正論起力氣，未必是他的對手。\n\n「你若贏了，請帖歸你。若是輸了……」\n\n錢世豪指了指腳下。\n\n「當著這麼多人的面，給我鞠三個躬，方才的事情便算了。」\n\n蘇孟達忍不住開口。\n\n「錢少爺，您可想清楚了？」\n\n「用不著你多嘴！」\n\n魏戌俞看向他手中的請帖。\n\n「說話算話？」\n\n「自然！」\n\n「好。」\n\n魏戌俞脫下外衣，將右手的襯衫袖口挽了兩圈。\n\n梁副官默默接過他的衣服。\n\n周圍原本準備離開的旅客，見兩人竟要比起力氣，紛紛停下腳步。\n\n錢世豪將請帖放在桌上，伸出右手。\n\n魏戌俞握了上去。\n\n「開始吧。」\n\n錢世豪嘴角一揚，猛然發力。\n\n然而下一刻，他臉上的笑容便僵住了。\n\n魏戌俞的手，紋絲不動。\n\n錢世豪不信邪，又加重了幾分力道。\n\n他手背上的青筋逐漸凸起，連肩膀也跟著往前傾。\n\n魏戌俞卻仍坐得端端正正。\n\n「就這些？」\n\n錢世豪咬緊牙關，幾乎將全身的重量都壓了上去。\n\n魏戌俞皺了皺眉。\n\n隨即手腕一沉。\n\n砰！\n\n錢世豪的手背重重撞上桌面。\n\n整個過程，不過幾個呼吸的工夫。\n\n周圍響起一陣喝采聲。\n\n蘇孟達背著雙手，煞有介事地嘆了口氣。\n\n「錢少爺，您若是早些找我比，興許還能贏上一回。」\n\n錢世豪死死瞪著魏戌俞。\n\n「不算！再來！」\n\n魏戌俞伸手取走桌上的請帖。\n\n「沒空陪你玩。」\n\n錢世豪猛地起身。\n\n「把東西還我！」\n\n魏戌俞冷冷看了他一眼。\n\n「輸不起，就別跟人賭。」\n\n錢世豪伸出的手停在半空中。\n\n周圍這麼多人看著，方才的條件又是他自己提出來的，如今再想反悔，連身旁的隨從都有些掛不住臉。\n\n魏戌俞接過梁副官遞來的外衣，轉身離開。\n\n蘇孟達樂呵呵地跟了上去。\n\n臨走以前，還不忘回頭朝錢世豪拱了拱手。\n\n「多謝錢少爺成人之美。」\n\n錢世豪一腳踹翻了旁邊的椅子。\n\n回到包廂後，蘇孟達笑得連茶都險些喝不下去。\n\n「魏長官，我費了幾日工夫，托了多少人情都弄不來的東西，您倒好，坐下來動動手腕便有了。」\n\n魏戌俞將請帖放到桌上。\n\n「拿去看看。」\n\n蘇孟達立即放下茶杯。\n\n請帖以厚實的紅色紙板製成，外緣壓有金色花紋，封面中央印著程家商會四個大字。\n\n翻開之後，裡頭記載著拍賣的日期、地點，以及受邀者的姓名。\n\n蘇孟達念道：\n\n「恭請錢世豪先生蒞臨……」\n\n他頓了一下。\n\n「這倒有些麻煩。」\n\n梁副官接過請帖。\n\n「上頭有姓名。」\n\n「不錯。這種請帖不是誰拿著都能進去的。拍賣會門口多半還會有人核對姓名。」\n\n蘇孟達摸著下巴想了想。\n\n「不過，這位錢少爺平日都在北邊活動，南邊見過他的人應當不多。若是咱們到了地方，興許能想些法子。」\n\n魏戌俞拿回請帖。\n\n「既然是請錢世豪進去，那便讓錢世豪進去。」\n\n梁副官抬起頭。\n\n「您的意思是……」\n\n蘇孟達一拍大腿。\n\n「妙啊！魏長官，您是打算冒充錢家少爺？」\n\n「只是買件東西，用誰的名字並不重要。」\n\n魏戌俞將請帖收入懷中。\n\n「拿到鏡子便走。」\n\n蘇孟達忍不住上下打量了他一番。\n\n「那倒也是。您這副相貌，穿件好衣裳，再配上一塊金錶，說是哪戶大商家的少爺，還真有人信。」\n\n梁副官道：\n\n「只是那位真正的錢少爺，恐怕不會善罷甘休。」\n\n「讓他來。」\n\n魏戌俞重新坐回窗旁，拿起方才未看完的書。\n\n蘇孟達見他又開始看書，不免覺得有些無趣。\n\n「魏長官，您好歹也得練練富家少爺的派頭吧？到了南邊，可不能動不動便讓人立正站好。」\n\n魏戌俞翻了一頁。\n\n「蘇爺。」\n\n「哎。」\n\n「出去。」\n\n梁副官低下頭，嘴角微微動了一下。\n\n蘇孟達捧著剩下的半袋栗子，長長嘆了口氣。\n\n「難得我一片苦心。」\n\n錢世豪的行李\n傍晚時分，火車在一座小城的車站停靠。\n\n幾名乘警將錢世豪一行人送下火車。\n\n餐車內雖然已經達成和解，但錢世豪的手下攜槍鬧事，列車長終究不敢讓他們繼續留在車上。\n\n錢世豪站在月台上，眼睜睜看著火車重新開動。\n\n「少爺，咱們怎麼辦？」\n\n一名隨從捂著還在疼痛的胳膊，小心翼翼地問道。\n\n錢世豪一巴掌拍在他的後腦勺上。\n\n「還能怎麼辦？去買下一班車的票！」\n\n「是、是！」\n\n另一人猶豫了一下。\n\n「可那張請帖……」\n\n錢世豪望著遠去的列車，神情陰沉。\n\n「一張請帖而已。我就不信到了南邊，憑我錢家的身分，還能進不了程家的門。」\n\n他轉過頭。\n\n「方才那幾個人的來歷，給我打聽清楚。今日這筆帳，我遲早要跟他算。」\n\n隨從連忙點頭。\n\n幾人拖著行李離開月台。\n\n走到候車室時，其中一名隨從忽然聽見了一陣細微的響動。\n\n喀、喀。\n\n聲音來自他手中那只黑色皮箱。\n\n他低頭瞧了一眼。\n\n「少爺，您這箱子裡裝的是什麼？」\n\n錢世豪回頭。\n\n「問那麼多做什麼？」\n\n「方才裡頭好像有聲音。」\n\n錢世豪神色一變，立即伸手將皮箱奪了過去。\n\n這只皮箱並非他的行李。\n\n出發前一日，那位眉骨帶疤的先生特意派人送了過來，交代他抵達南邊之後，若順利取得七星鎏金鏡，便將鏡子裝入其中。\n\n除此之外，還有一項古怪的叮囑。\n\n在取得古鏡以前，無論箱中傳出什麼聲音，都不准將它打開。\n\n錢世豪當時還覺得那人故弄玄虛。\n\n一只空箱子，能有什麼聲音？\n\n可此刻，那只皮箱確實在他的手中微微震動。\n\n喀、喀。\n\n又響了兩聲。\n\n錢世豪盯著箱子，心裡莫名有些發毛。\n\n「找個地方住下，明日一早再走。」\n\n他將皮箱夾在胳膊下，快步離開車站。\n\n沒有人注意到，皮箱底部的接縫間，正慢慢滲出一滴漆黑的水。\n\n夜幕降臨。\n\n南下的列車仍在行駛。\n\n魏戌俞靠著窗戶閉目休息，梁副官正在整理明日抵達後的行程，蘇孟達則早早躺上臥鋪，睡得十分安穩。\n\n桌上的風燈隨著車身輕輕搖晃。\n\n再過一日，他們便能抵達南邊的商埠。\n\n魏戌俞並不知道，那張從錢世豪手中贏來的請帖，除了能讓他順利進入拍賣會之外，還會替他惹來另一件意料之外的事情。\n\n而此時此刻，遠在南方的程家宅邸內，一位年輕小姐正坐在梳妝台前，聽著家中的長輩交代幾日後的安排。\n\n「人家錢少爺特地從北邊過來，到時候妳可別又找藉口不見人。」\n\n女子對著鏡子整理耳飾，神情頗為不以為然。\n\n「見就見嘛。」\n\n「這回可不許胡鬧。」\n\n她放下耳飾，轉過頭來。\n\n「先說好了，若是長得不好看，我可不嫁。」\n\n（第七回完）"}, {"n": 8, "title": "程家有女", "body": "南方的天氣與北城截然不同。\n\n火車駛過最後一段山路時，窗外已能看見成片的桑田與水鄉。河道兩岸白牆黑瓦，幾艘載滿貨物的木船順流而下，遠處還有一座橫跨河面的石橋。\n\n到了午后，列車終於駛入維安城。\n\n維安城是南方數一數二的商埠，水陸交通發達，往來商賈眾多。城中既有百年歷史的老字號商鋪，也有近些年才興建的洋樓、銀行及大飯店。\n\n火車尚未停穩，月台上便已聚集了大批接站的人。\n\n蘇孟達貼著車窗往外瞧。\n\n「魏長官，您看看人家這地方，連車站都比咱們北城氣派。」\n\n魏戌俞穿上外衣。\n\n「你喜歡？」\n\n「那是自然。」\n\n「那便留下來。」\n\n蘇孟達立即轉過頭。\n\n「那可不成。北城還有間鋪子等著我養活呢。」\n\n梁副官提起行李。\n\n「蘇爺，您那間鋪子十天有八天關著門，倒也不必太過掛念。」\n\n「梁副官，做人不能光看表面。我那叫三年不開張，開張吃三年。」\n\n魏戌俞已經走出了包廂。\n\n「跟上。」\n\n三人隨著人群下了火車。\n\n車站外停滿了黃包車與汽車，街道兩旁商鋪林立，招牌一個比一個醒目。穿著西裝的洋行職員與身著長衫的商人擦肩而過，偶爾還能看見幾位打扮時髦的年輕女子，挽著手從百貨公司的玻璃櫥窗前走過。\n\n蘇孟達一路看得津津有味。\n\n魏戌俞卻沒多少興致。\n\n「先找地方住下。蘇爺，你那位朋友在哪裡？」\n\n「就在城東做古董生意。我已經托人捎了口信，晚些便能見著。」\n\n「好。」\n\n梁副官攔了輛汽車，將行李交給司機。\n\n就在三人準備上車時，一輛深藍色汽車從前方駛過。\n\n車窗敞著，後座坐著一位穿淺色洋裝的年輕女子。她正側著頭與身旁的人說話，橘棕色的捲髮在陽光下泛著柔和的光澤。\n\n汽車很快匯入街上的車流。\n\n魏戌俞並未留意。\n\n此時的他滿腦子都是那面尚未到手的古鏡，哪裡有工夫去看街上的姑娘。\n\n維安城的程家\n「停車！」\n\n深藍色汽車在一間糕餅鋪前停了下來。\n\n坐在副駕駛座上的女傭回過頭。\n\n「小姐，老爺交代咱們早些回去。」\n\n「買幾盒點心又耽誤不了多少時候。」\n\n年輕女子推門下車，徑直走進糕餅鋪。\n\n鋪中的掌櫃一見來人，立即笑著迎了出來。\n\n「程小姐！今日還是要桂花糕？」\n\n「桂花糕兩盒，核桃酥一盒。昨日買回去的栗子糕也不錯，再給我包些。」\n\n「好嘞！」\n\n女子在櫃檯旁等了一會兒，目光落在牆上新掛的一幅字畫上。\n\n她歪著腦袋看了半晌。\n\n「掌櫃的，你這畫掛歪了。」\n\n掌櫃回頭一瞧。\n\n「有嗎？」\n\n「右邊高了些。」\n\n「哎喲，還真是。程小姐眼睛可真尖！」\n\n掌櫃趕忙搬來凳子，將字畫扶正。\n\n女子這才滿意地收回目光。\n\n她便是程家唯一的女兒，程小楓。\n\n程家在維安城經商已有數代，名下涉及紡織、航運、洋行及各式商業買賣，城中不少商號都與程家有往來。\n\n程小楓自幼便是家中眾人捧在手心裡長大的小姐。\n\n她生得漂亮，一雙眼睛尤其明亮，笑起來頗為討人喜歡。加之家境優渥，衣食住行從未受過半點委屈，養成了個想說什麼便說什麼、想做什麼便做什麼的性子。\n\n說她任性，倒也確實有幾分。\n\n不過她自小跟在父親身旁出入各種商業場合，耳濡目染之下，也學會了如何察言觀色、如何與人交涉。\n\n真到了該講規矩的地方，她比誰都清楚分寸。\n\n唯獨有一件事，任憑家中長輩如何勸說，她始終不肯讓步。\n\n那便是自己的婚事。\n\n「小姐。」\n\n女傭提著點心跟在她身後。\n\n「聽說錢少爺這幾日便要到了。」\n\n「到了就到了。」\n\n「您一點也不好奇他長什麼模樣？」\n\n程小楓停下腳步。\n\n「妳見過？」\n\n「沒有。不過聽夫人說，錢少爺生得十分富態。」\n\n程小楓的眉頭立即皺了起來。\n\n「富態？」\n\n「是呀。」\n\n「那怎麼不乾脆說他生得十分有福氣？」\n\n女傭忍不住笑了。\n\n「小姐！」\n\n程小楓拉開車門，坐了進去。\n\n「我爹若真覺得他那麼好，便讓我爹自己嫁過去好了。」\n\n「這話可不能讓老爺聽見。」\n\n「我當著他的面也敢說。」\n\n汽車重新駛上街道。\n\n程小楓打開一盒桂花糕，捏了一塊送進嘴裡，絲毫沒將那門尚未見面的婚事放在心上。\n\n程家宅邸位於城南。\n\n宅子前半部仍保留著傳統庭院的格局，後半部則添建了一幢三層洋樓，廊下種滿花木，院中央還有一座小巧的噴水池。\n\n程小楓回到家時，父親正在客廳接待幾位商會的客人。\n\n她原本打算直接回房，卻在經過走廊時被父親叫住了。\n\n「小楓，過來。」\n\n程小楓抱著點心盒走了進去。\n\n「爹。」\n\n她先向在座的幾位長輩問好，又讓女傭將剛買回來的糕點分給客人，這才挨著父親坐下。\n\n「您找我？」\n\n程父指了指桌上的一疊名帖。\n\n「過幾日商會辦拍賣會，到時候妳也來幫忙招呼客人。」\n\n「好啊。」\n\n「還有，北邊錢家的少爺也會來。」\n\n程小楓拿糕點的手頓了一下。\n\n「原來您打的是這個主意。」\n\n程父瞪了她一眼。\n\n「讓妳認識認識人家，又不是要妳即刻拜堂。」\n\n「那就好。」\n\n她笑盈盈地替父親添了杯茶。\n\n「到時候若是不合我的眼緣，您可不能怪我。」\n\n在座的一位商會長輩笑道：\n\n「程小姐眼光這麼高，究竟要什麼樣的青年才俊才看得上？」\n\n程小楓想也沒想。\n\n「首先得長得好看。」\n\n眾人頓時笑了起來。\n\n程父無奈地搖了搖頭。\n\n「光長得好看有什麼用？」\n\n「那也不能不好看呀。」\n\n她理直氣壯地說道：\n\n「往後可是要日日見面的，總得讓我看著高興吧？」\n\n程父拿這個女兒毫無辦法，只得揮手讓她回房。\n\n程小楓心滿意足地站了起來。\n\n臨走時，她的目光無意間掃過桌上的拍賣名冊。\n\n「咦？」\n\n她將名冊拿了起來。\n\n其中一頁印著一面造型精美的鎏金古鏡。\n\n「爹，這不是咱們家庫房裡的那面鏡子嗎？」\n\n客廳中的笑聲忽然停了。\n\n程父伸手將名冊拿了回去。\n\n「是。」\n\n「您不是從來不許人碰它？怎麼突然捨得拿出來賣了？」\n\n「放了這麼多年，也沒什麼用處。」\n\n程小楓有些意外。\n\n「可您以前明明說過，那是娘留下的東西。」\n\n程父沒有立即回答。\n\n他端起茶杯，喝了一口茶。\n\n「妳記錯了。」\n\n「我沒記錯。」\n\n「小楓。」\n\n程父的語氣忽然重了些。\n\n「去休息吧。這些事情不必過問。」\n\n程小楓望了父親一眼。\n\n她雖然覺得奇怪，卻也看得出父親不願當著客人的面談論此事，便沒有再追問。\n\n「知道了。」\n\n她轉身離開客廳。\n\n直到她的腳步聲遠去，程父才重新低頭望向那本名冊。\n\n他伸出手，將印有古鏡圖樣的那一頁慢慢合上。\n\n「東西一旦賣出去，便與程家再無關係。」\n\n一旁的商會長輩沉默了片刻。\n\n「但願如此。」\n\n一面不照人的鏡子\n維安城東有一條專做古玩買賣的街道。\n\n街上店鋪不算大，門面也大多樸素，但若真往裡頭走，便能看見不少尋常百姓一輩子也未必見得到的東西。\n\n蘇孟達帶著魏戌俞及梁副官走進其中一間鋪子。\n\n鋪中擺滿了瓷器、銅器與古舊字畫，空氣中有股淡淡的沉香味。\n\n一名戴著圓框眼鏡的中年男人正在櫃檯後頭擦拭一只青花瓷瓶。\n\n見到蘇孟達，他先是一愣，隨即笑了起來。\n\n「老蘇！什麼風把你吹來了？」\n\n「發財的風。」\n\n「你若真有發財的門路，還能想起我？」\n\n「這話說得，咱們多少年的交情了！」\n\n兩人寒暄了幾句，蘇孟達便將魏戌俞與梁副官介紹給對方，只說是北城來的朋友，有意買些古物。\n\n掌櫃連忙請三人入內喝茶。\n\n待房門關上，蘇孟達這才取出七星鎏金鏡的圖樣。\n\n「老兄，這件東西，你知道多少？」\n\n掌櫃接過圖樣，臉上的笑容淡了些。\n\n「你們也是衝著它來的？」\n\n魏戌俞察覺到了他話中的意思。\n\n「還有不少人來問過？」\n\n「豈止不少。」\n\n掌櫃將圖樣放在桌上。\n\n「這鏡子還沒正式亮相，消息便傳遍了大半個古玩行。這幾日從外地來的買家，十個裡頭倒有六七個是為了它。」\n\n蘇孟達問道：\n\n「程家收藏這東西多久了？」\n\n掌櫃搖了搖頭。\n\n「這便沒人說得準了。程家從前也做古物買賣，後來才逐漸將生意轉向紡織與航運。他們家庫房裡有多少好東西，誰也不知道。」\n\n「那鏡子呢？你可曾親眼見過？」\n\n「見過一次。」\n\n掌櫃端起茶杯，神情有些不自然。\n\n「半個月前，程家請了幾位懂行的人過去，替此次拍賣的古物估價。我也在其中。」\n\n他頓了頓。\n\n「那面鏡子，確實是件難得一見的好東西。」\n\n七星鎏金鏡直徑約有六寸，鏡背以鎏金工藝製成，外緣刻有層層雲紋，中央的玄武圖案則以極細的線條描出龜甲與蛇鱗。\n\n七顆星辰並非平平整整地刻在鏡背上，而是各自嵌於一個細小的圓形凹槽之中。\n\n鏡身兩側的白玉溫潤通透，即使經過漫長歲月，仍看不出多少磨損。\n\n如此精美的工藝，即便放在古代王侯的收藏之中，也絕非尋常物件。\n\n蘇孟達聽得心癢難耐。\n\n「鏡面呢？」\n\n掌櫃看了他一眼。\n\n「鏡面才是最奇怪的地方。」\n\n魏戌俞放下茶杯。\n\n「怎麼個奇怪法？」\n\n「那面鏡子保存得極好，鏡面平整，也沒有太多銅鏽。照理說，應當還能照見人影。」\n\n掌櫃伸出一根手指，輕輕敲了敲桌面。\n\n「可我當日將它舉到面前，裡頭什麼也沒有。」\n\n梁副官問道：\n\n「可是年代太久，鏡面已經失了光澤？」\n\n「我起初也是這麼想的。」\n\n掌櫃搖了搖頭。\n\n「後來我將它移到燈下，卻能清清楚楚看見燈火。再往桌上一照，茶壺、茶杯也都照得出來。」\n\n蘇孟達臉上的笑容漸漸消失。\n\n「它只照不出人？」\n\n「不錯。」\n\n掌櫃壓低了聲音。\n\n「當時在場的幾個人都覺得古怪，可程家的人不許咱們再試，當即便將鏡子收了起來。」\n\n魏戌俞沉吟片刻。\n\n「它能照出東西，卻照不出活人……」\n\n這倒與普通鏡子的用途恰好相反。\n\n魏戌俞想起父親留下的那句話。\n\n鏡歸方可閉門。\n\n倘若七星鎏金鏡本身便具有辨別陰陽兩界的能力，那麼它極有可能並非單純用來開啟某種機關的鑰匙。\n\n或許古人費盡心思鑄造它，本就是為了看見一些活人看不見的東西。\n\n蘇孟達又問：\n\n「那拍賣會的請帖，還能弄到嗎？」\n\n掌櫃苦笑。\n\n「這次程家管得嚴，請帖早已發完了。若是換作往年，我倒還能替你想想辦法。」\n\n魏戌俞從懷中取出那張深紅色請帖。\n\n「有這個，能進去嗎？」\n\n掌櫃接過一看。\n\n「錢世豪？」\n\n蘇孟達笑呵呵地點頭。\n\n「正是。」\n\n掌櫃望了望蘇孟達，又望向魏戌俞。\n\n「這位先生是錢家少爺？」\n\n魏戌俞神色如常。\n\n「有問題？」\n\n「沒有，沒有。」\n\n掌櫃連忙將請帖還了回去。\n\n「持帖的客人可以帶兩名隨行人員入場。錢家少爺又是程家特別邀請的客人，自然沒有問題。」\n\n蘇孟達滿意地拍了拍手。\n\n「那便好辦了。」\n\n掌櫃遲疑了一下。\n\n「不過，錢少爺當日恐怕還得見一見程家的主人。」\n\n魏戌俞道：\n\n「為何？」\n\n「這……」\n\n掌櫃似乎覺得有些奇怪。\n\n「錢家與程家早有交情，既然特地邀您過來，總不能連面都不見吧？」\n\n魏戌俞點了點頭，沒有放在心上。\n\n與商會主人打個照面，客套幾句，於他而言並不是什麼難事。\n\n倒是蘇孟達離開古董鋪後，越想越覺得有趣。\n\n「魏長官，您這錢少爺怕是得做得像模像樣些了。」\n\n魏戌俞瞥了他一眼。\n\n「你有意見？」\n\n「沒有。我就是想著，萬一程家要留您吃頓飯，您可得少板著臉。人家做買賣的最講究和氣，您平日那副神情，怕是連桌上的魚都不敢翻身。」\n\n梁副官忍不住開口。\n\n「蘇爺，您還是先管好自己吧。」\n\n錢少爺的皮箱\n當日深夜，距離維安城尚有數百里的一座小城內，錢世豪正躺在旅店的床上，翻來覆去睡不著。\n\n白日火車上受的那口氣，他至今還沒嚥下去。\n\n尤其是想起那人輕而易舉便將自己的手腕壓倒在桌上的模樣，心裡更是惱火。\n\n「一群沒用的東西！」\n\n他拿起枕頭砸向牆壁。\n\n睡在外間的隨從聽見動靜，連忙敲門。\n\n「少爺，您有什麼吩咐？」\n\n「明日的車票買好了沒有？」\n\n「買好了。天一亮咱們便能走。」\n\n「滾去睡！」\n\n「是。」\n\n腳步聲逐漸遠去。\n\n錢世豪重新躺回床上。\n\n房內只點著一盞煤油燈，窗外偶爾傳來幾聲犬吠。\n\n他閉上眼睛。\n\n不知過了多久，床底忽然傳來一聲輕響。\n\n喀。\n\n錢世豪睜開眼。\n\n那只黑色皮箱，便放在床底下。\n\n喀、喀。\n\n又是兩聲。\n\n他皺著眉頭坐起身。\n\n「什麼東西？」\n\n聲音停了。\n\n錢世豪盯著床底看了一會兒，心裡有些發毛。\n\n他伸手將皮箱拖了出來。\n\n箱子比白日沉了許多。\n\n原本空蕩蕩的皮箱，此刻竟像裝了幾十斤重的東西，拖過地板時發出沉重的摩擦聲。\n\n錢世豪想起那位先生的交代，終究沒有將皮箱打開。\n\n可就在他準備把箱子推回床底時，裡頭忽然傳來了一聲長長的嘆息。\n\n錢世豪嚇得連忙縮手。\n\n他猛地站起身，朝房門大喊：\n\n「來人！」\n\n外間的隨從匆忙跑了進來。\n\n「少爺！」\n\n錢世豪指著地上的皮箱。\n\n「把這東西搬出去！」\n\n隨從愣了一下。\n\n「搬去哪兒？」\n\n「外頭！隨便找個地方放著！」\n\n隨從不敢多問，彎腰提起皮箱。\n\n才提起來，便覺得手上一沉。\n\n「少爺，這箱子怎麼這麼重？」\n\n錢世豪狠狠瞪了他一眼。\n\n「讓你搬便搬！」\n\n隨從只得抱起皮箱，吃力地往外走。\n\n走廊盡頭有一間空房，他將箱子放了進去，重新鎖上房門。\n\n正打算離開時，屋內忽然傳來一聲悶響。\n\n像是皮箱倒了。\n\n隨從站住腳步。\n\n房內又響了一聲。\n\n這一次，他聽得分外清楚。\n\n那聲音並不像箱子倒地。\n\n倒像是有人從地上站了起來。\n\n他猶豫了片刻，將耳朵貼近門板。\n\n屋內傳來一陣緩慢的腳步聲。\n\n啪嗒。\n\n啪嗒。\n\n一步一步。\n\n朝著房門走來。\n\n隨從頓時不敢動了。\n\n腳步聲停在門後。\n\n隔著一層薄薄的木板，他甚至能聞見一股極重的腥氣。\n\n「誰……誰在裡頭？」\n\n沒有回答。\n\n他正要往後退，卻忽然感到頭頂一涼。\n\n一滴水落在他的鼻尖上。\n\n隨從緩緩抬起頭。\n\n房門上方有一扇用來透氣的小窗。\n\n漆黑的窗框之中，不知何時竟垂下了一縷濕漉漉的頭髮。\n\n緊接著，一根蒼白的手指從窗縫中伸了出來。\n\n隨從張大了嘴。\n\n還未來得及叫出聲，走廊上的煤油燈便熄滅了。\n\n翌日清晨。\n\n錢世豪被敲門聲吵醒。\n\n「少爺！該出發了！」\n\n他打著哈欠起身，讓隨從將行李搬下樓。\n\n昨夜那只黑色皮箱已經重新擺在門外。\n\n錢世豪看了它一眼。\n\n「阿福呢？叫他過來提箱子。」\n\n幾名隨從互望一眼。\n\n「少爺，阿福一早便不見了。」\n\n「人呢？」\n\n「不知道。他的行李還在房裡，人卻沒了。旅店掌櫃也說沒見他出去過。」\n\n錢世豪本就急著趕車，哪有心思理會一個下人的去向。\n\n「不用管他！走！」\n\n一名隨從伸手提起皮箱。\n\n「咦？」\n\n錢世豪回頭。\n\n「又怎麼了？」\n\n「這箱子……今日倒輕了許多。」\n\n錢世豪沒有答話，轉身下了樓。\n\n幾人提著行李匆匆離開。\n\n直到旅店的夥計前去收拾房間，才發現昨夜存放皮箱的那間空房，地板上多了一大灘黑水。\n\n黑水中央，擱著一雙布鞋。\n\n那是阿福昨夜穿的鞋。\n\n兩隻鞋整整齊齊地並排放著。\n\n鞋尖，卻朝著牆壁。\n\n拍賣會前夕\n第二日下午，程小楓被父親叫到了商會。\n\n拍賣會將於翌日晚間舉行，場地設在程家商會名下的一幢三層洋樓內。\n\n大廳中央已搭好展示古物的高台，兩側擺放著數十張鋪有深紅色軟墊的椅子。二樓則設有供貴客休息的雅間，走廊上懸掛著新換的水晶吊燈。\n\n程小楓拿著名冊，在大廳裡走了一圈。\n\n「這幾張椅子再往旁邊挪些。明日客人多，過道太窄，侍者端著東西不好走。」\n\n商會的夥計立即照辦。\n\n「還有二樓東邊那間雅室，窗簾換成淺色的。原先那套太厚重，白日都得點燈，客人坐在裡頭也不舒服。」\n\n「是，小姐。」\n\n她又翻看了幾頁名冊，發現有兩位向來不睦的商家主人被安排在相鄰的位置，便順手將其中一人的座位調開了。\n\n管事跟在她身旁，忍不住讚道：\n\n「還是小姐細心，這事連我都險些忘了。」\n\n「他們去年在我爹的壽宴上便吵過一回。我可不想明日再聽一次。」\n\n程小楓將名冊合上。\n\n「拍賣的東西都送來了？」\n\n「大部分都已入庫。」\n\n「那面七星鎏金鏡呢？」\n\n管事的神情微微一變。\n\n「也送來了。」\n\n「帶我去看看。」\n\n「這……老爺特別交代，那件東西不許隨意取出。」\n\n程小楓望著他。\n\n「我就看一眼，又不拿走。」\n\n管事面露難色。\n\n見他實在為難，程小楓也沒有繼續堅持。\n\n「算了，不為難你。」\n\n她將名冊交還給管事，轉身準備上樓。\n\n恰在此時，幾名夥計抬著一只黑色木匣，從後方的庫房走了出來。\n\n木匣外頭包著厚厚的紅綢，四角還鑲有黃銅護片。\n\n程小楓一眼便認出了它。\n\n小時候，她曾在母親的房裡見過這只木匣。\n\n那時母親總是將它放在書櫃最上層，不許她隨意拿取。\n\n她走上前去。\n\n「等等。」\n\n幾名夥計立即停下腳步。\n\n程小楓伸手摸了摸木匣上的銅扣。\n\n銅扣中央刻著一朵小小的梅花。\n\n她記得很清楚。\n\n母親生前的許多私人物件上，都有這樣一朵梅花。\n\n父親卻說，這面鏡子與母親無關。\n\n程小楓站在原地想了片刻。\n\n「小姐？」\n\n管事出聲提醒。\n\n她收回手。\n\n「沒事，送過去吧。」\n\n幾名夥計繼續向前。\n\n程小楓望著那只逐漸遠去的木匣，心裡忽然有些不是滋味。\n\n自從母親失蹤之後，家中便很少再有人提起她。\n\n每逢問及母親從前的事情，父親總會找些理由將話題岔開。\n\n如今連她留下來的東西也要賣掉了。\n\n究竟有什麼事情，是非得瞞著自己的？\n\n同一時間，城中飯店的房間內。\n\n梁副官將一套新送來的深色西裝掛在衣架上。\n\n蘇孟達圍著衣架轉了一圈，滿意地點了點頭。\n\n「不錯，不錯。這才有些富家少爺的樣子。」\n\n魏戌俞坐在沙發上，翻閱著拍賣會的名冊。\n\n「穿什麼有那麼重要？」\n\n「當然重要。您明日是去做買賣的，又不是去抄人家的家。」\n\n蘇孟達取出一塊金色懷錶。\n\n「來，這個也帶上。」\n\n魏戌俞看了一眼。\n\n「哪來的？」\n\n「我的。」\n\n「真的假的？」\n\n蘇孟達捂住胸口。\n\n「魏長官，您這話可太傷人了。我好歹也是個做古董生意的，還能拿塊假錶給您不成？」\n\n梁副官淡淡道：\n\n「上回您賣給我的那只鼻煙壺……」\n\n「梁副官！」\n\n蘇孟達立即打斷他。\n\n「咱們今日不談陳年舊事。」\n\n魏戌俞忍不住笑了笑，伸手將懷錶接了過來。\n\n隨後，他指著名冊上的一件古物。\n\n「七星鎏金鏡安排在最後拍賣。」\n\n蘇孟達走了過來。\n\n「好東西自然得留到最後。」\n\n「明日入場後，多留意那些衝著鏡子來的人。若那個有疤的男人也派了人過來，應當不難看出端倪。」\n\n梁副官點頭。\n\n「明白。」\n\n魏戌俞將名冊合上。\n\n「拿到鏡子以前，盡量不要暴露身分。」\n\n「放心吧。」\n\n蘇孟達笑著拱了拱手。\n\n「明日起，我便稱您一聲錢少爺了。」\n\n魏戌俞抬眼看他。\n\n「你少開口便是。」\n\n夜深了。\n\n程家商會的最後幾名夥計收拾完東西，依次離開大廳。\n\n管事親自巡視過庫房，確認門窗皆已鎖好，這才熄滅走廊上的燈。\n\n整幢洋樓逐漸陷入黑暗。\n\n庫房內，數十件準備拍賣的古物整齊地擺放在木架上。\n\n那只鑲有黃銅護片的木匣，被單獨安置在一張鋪著紅絨的長桌中央。\n\n四周寂靜無聲。\n\n忽然，匣中傳來一聲細微的響動。\n\n喀。\n\n原本扣得嚴嚴實實的銅扣，自行彈開了。\n\n木匣的蓋子慢慢向上抬起。\n\n一面鎏金古鏡靜靜地躺在紅綢之中。\n\n窗外的月光恰好落在鏡面上。\n\n鏡中沒有庫房的屋頂。\n\n沒有長桌。\n\n也沒有窗外的月亮。\n\n只有一間陰暗的石室。\n\n石室四周立著高大的石柱，地上鋪滿積水，遠處隱約可見一扇雕有玄武圖案的巨大石門。\n\n石門前，站著一個身穿素色長裙的女人。\n\n她赤著雙腳，長髮披散，雙手貼在冰冷的石門上。\n\n像是已經在那裡等了很久。\n\n忽然，她似乎察覺到了什麼，慢慢轉過頭。\n\n那張蒼白的面容，竟與程小楓有七八分相似。\n\n女人一步一步走向鏡面。\n\n她伸出手，輕輕碰了碰鏡子的另一頭。\n\n嘴唇微微顫動。\n\n「小楓……」\n\n一滴眼淚從她眼角滑落。\n\n「不要讓他們把鏡子帶回來。」\n\n（第八回完）"}, {"n": 9, "title": "點天燈，得夫人", "body": "拍賣會當日，維安城下了一場小雨。\n\n直到傍晚，雨勢才逐漸停歇。\n\n程家商會門前早已停滿了各式汽車，幾名身穿深色制服的侍者站在台階兩側，替陸續抵達的賓客引路。\n\n大廳內燈火通明，水晶吊燈將整座洋樓照得金碧輝煌。留聲機裡播放著悠揚的樂曲，侍者端著盛有酒水的銀盤在人群中穿梭，衣著華貴的商人們三五成群地站在一塊兒，談論著今晚即將拍賣的古物。\n\n魏戌俞三人抵達時，距離拍賣開始還有近一個鐘頭。\n\n蘇孟達特意換了一件嶄新的長衫，頭髮也抹了些髮油，看上去倒比平日多了幾分正經。\n\n他站在汽車旁，上下打量著魏戌俞。\n\n「魏長官，您平日若肯多穿穿這樣的衣裳，北城那些姑娘恐怕早就把您府上的門檻踏平了。」\n\n魏戌俞低頭整理袖口。\n\n「待會兒進去，記得改口。」\n\n「明白，錢少爺。」\n\n蘇孟達笑嘻嘻地彎了彎腰。\n\n「小的蘇孟達，今日全憑少爺差遣。」\n\n梁副官從另一側下車，冷不防來了一句。\n\n「蘇爺，您若能一直這麼聽話就好了。」\n\n蘇孟達正欲還嘴，魏戌俞已經邁步走上台階。\n\n門口負責接待的管事接過請帖，仔細核對了一番，隨即露出格外殷勤的笑容。\n\n「原來是錢少爺！您總算來了，我們老爺今日還特地問起您呢。」\n\n魏戌俞微微頷首。\n\n「有勞。」\n\n「您裡邊請！二樓已替您備好了雅座。老爺眼下正在招呼幾位貴客，待會兒得了空，想必會親自過來與您見面。」\n\n管事走了兩步，又笑著補了一句。\n\n「我們家小姐今日也在，錢少爺可得好好把握機會啊！」\n\n魏戌俞有些莫名其妙地看了他一眼。\n\n管事卻只是笑，並未多作解釋。\n\n蘇孟達跟在後頭，忍不住低聲道：\n\n「這錢家的面子倒是不小，連人家小姐都要親自出來招待。」\n\n魏戌俞沒有理會。\n\n他一進大廳，便將四周的情形大致看了一遍。\n\n大廳共有三處出入口，兩側樓梯皆通往二樓，展示台後方另有一道走廊，想來是供商會人員出入庫房之用。\n\n今晚的賓客雖多，卻也不全像是來做買賣的商人。\n\n其中有兩個男人坐在大廳角落，一人穿著深褐色長衫，另一人戴著一雙黑色皮手套。\n\n兩人不與旁人交談，目光卻不時掃向展示台後方。\n\n魏戌俞朝梁副官看了一眼。\n\n梁副官會意，默不作聲地記下了那兩人的模樣。\n\n三人誰也沒有注意到，大廳另一頭，正有一雙眼睛目不轉睛地望著魏戌俞。\n\n程家大小姐\n程小楓今日穿了一件淺杏色的旗袍。\n\n衣襟上繡著幾朵淡粉色的梅花，外頭披著一條薄薄的白色披肩。橘棕色的長髮在耳側微微捲起，髮間別著一枚珍珠髮飾。\n\n她原本正陪著父親招呼幾位遠道而來的客人，談笑間不經意往大廳入口望了一眼。\n\n隨即，她的目光便停住了。\n\n距離樓梯不遠的地方，站著一個身材高挑的男人。\n\n他穿著一套剪裁合宜的深色西裝，棕黑色的短髮整齊地向後梳起，左耳戴著一枚銀色耳飾。側臉輪廓分明，鼻梁高挺，一雙眼睛在燈光下透著極淡的藍色。\n\n此刻，他正低頭與身旁的人說話，右手隨意插在西裝口袋裡。\n\n程小楓看了好一會兒。\n\n她自幼跟著父親出入各種宴會，見過的富家少爺、青年才俊不在少數，其中自然也有幾個長得不錯的。\n\n可眼前這個男人，無論相貌、身形，還是舉手投足間的氣度，竟樣樣都合她的心意。\n\n尤其是那副從容不迫、彷彿天塌下來也不會慌張的模樣。\n\n實在好看。\n\n「小楓？」\n\n程父喚了她一聲。\n\n她沒有反應。\n\n「小楓！」\n\n「啊？」\n\n程小楓這才回過頭。\n\n「妳在看什麼？」\n\n「爹，您認得那個人嗎？」\n\n她指了指樓梯旁。\n\n程父順著她的手指望去，恰好有幾名賓客走過，擋住了魏戌俞的身影。\n\n「哪個？」\n\n「就是穿深色西裝，個子很高的那個。」\n\n「今日來的外地客人不少，妳若好奇，自己過去問問便是。」\n\n「好！」\n\n程小楓將手中的酒杯交給女傭，抬腿便要走。\n\n程父連忙叫住她。\n\n「等等！妳可別忘了，今晚錢家少爺也會來。」\n\n「知道啦！」\n\n「人家特地從北邊過來，妳多少上點心。」\n\n「爹，您就放心吧，我保證今晚一定給您找個滿意的女婿！」\n\n程父愣了一下。\n\n「我讓妳去相親，誰讓妳去找——」\n\n話還沒說完，程小楓已經跑遠了。\n\n程父望著女兒的背影，忍不住嘆了口氣。\n\n這丫頭，也不知道又在打什麼主意。\n\n另一頭，魏戌俞三人已經來到了二樓雅座。\n\n程小楓站在樓梯旁，望著那男人走上樓，心中盤算著該找個什麼藉口與他說話。\n\n恰好有名女傭從旁經過。\n\n「小姐，您在這兒做什麼？」\n\n程小楓拉住她。\n\n「妳看見方才上樓的那位先生沒有？」\n\n「哪位先生？」\n\n「長得最好看的那個。」\n\n女傭愣了一下，忍不住笑了。\n\n「小姐，今日來了這麼多客人，我哪知道您說的是哪一位？」\n\n程小楓踮起腳尖，朝二樓望了望。\n\n見那男人已經入座，她索性找了個能看清東首雅座的位置坐下，又從侍者手中取了杯果汁。\n\n「算了，我自己來。」\n\n「小姐，您要做什麼？」\n\n她抿了一口果汁，笑得眉眼彎彎。\n\n「認識新朋友呀。」\n\n私闖庫房\n二樓雅座內，魏戌俞正翻閱著拍賣名冊。\n\n七星鎏金鏡被安排在最後拍賣。\n\n距離那面鏡子正式亮相，至少還有兩個鐘頭。\n\n「魏長官，咱們就這麼等著？」\n\n蘇孟達拿起一塊糕點。\n\n「等到鏡子上了台，直接出價便是。程家這麼大的商會，總不至於拿件假東西出來砸自己的招牌。」\n\n魏戌俞將名冊合上。\n\n「是不是假東西，倒不是我最擔心的。」\n\n「那您擔心什麼？」\n\n「那面鏡子極有可能藏著機關。若有人事先動過手腳，即便買下來，也未必還能用。」\n\n梁副官點頭。\n\n「尤其那個有疤的男人，既然知道鏡子的用途，便有可能在拍賣以前做些安排。」\n\n魏戌俞望向樓下展示台後方的走廊。\n\n方才進來時，他已經看見有兩名商會夥計抬著裝有古物的木箱從那裡經過。\n\n「我去看看鏡子。」\n\n蘇孟達差點被糕點噎住。\n\n「現在？」\n\n「嗯。」\n\n「人家還沒拿出來拍賣呢！」\n\n「所以才要現在去。」\n\n魏戌俞站起身，整理了一下衣襟。\n\n「副官，你留在這兒，留意方才那兩個人。蘇爺，你去打聽今晚有多少買家是為了古鏡而來的。」\n\n梁副官立即應道：\n\n「明白。」\n\n蘇孟達則一臉無奈。\n\n「魏長官，您這才當了不到半個鐘頭的富家少爺，怎麼又幹起抄人庫房的事情了？」\n\n魏戌俞瞥了他一眼。\n\n「別廢話。」\n\n說完，便轉身離開了雅座。\n\n魏戌俞沿著二樓走廊向東走去。\n\n與前方熱鬧的大廳不同，這一帶的燈光明顯暗了許多，牆上掛著幾幅古舊字畫，厚重的地毯將人的腳步聲掩去了大半。\n\n走廊盡頭立著一扇雕花木門，門旁還站著兩名商會護衛。\n\n魏戌俞沒有貿然走近。\n\n他在一幅山水畫前停下腳步，佯裝欣賞畫上的題字，餘光卻始終留意著前方的動靜。\n\n一名身穿灰色制服的管事拿著名冊走來。\n\n兩名護衛認得他，立即替他開門。\n\n透過短暫敞開的門縫，魏戌俞看見裡頭還有一條走廊，左右各有數間房屋。\n\n幾件以紅綢包裹的古物正從其中一間屋子搬出來。\n\n看來庫房確實在那頭。\n\n不過，程家對這些古物的看守比他預想中嚴密得多。\n\n魏戌俞轉身走向另一側。\n\n他在商會內繞了小半圈，經過幾處供夥計休息的房間，才來到洋樓後方的一處露台。\n\n露台下方是商會的內院，幾名工人正在整理運送古物所用的木箱。\n\n他抬頭望去。\n\n距離露台不遠處，便是方才那條走廊的窗戶。\n\n魏戌俞脫下西裝外套，搭在臂彎，走入露台旁的陰影之中。\n\n恰在此時，樓下傳來一陣催促聲。\n\n「前頭人手不夠！再過來兩個！」\n\n幾名夥計匆匆離開。\n\n待內院重新安靜下來，魏戌俞的身影已經從露台上消失了。\n\n片刻之後。\n\n庫房外的走廊上，一扇原本半敞的窗戶輕輕晃動了一下。\n\n魏戌俞悄無聲息地落在窗旁。\n\n他重新穿好西裝，撫平衣袖上的褶皺。\n\n迎面恰好有兩名搬運古物的夥計走過。\n\n「先生，您怎麼在這兒？」\n\n其中一人有些意外。\n\n魏戌俞神色自若。\n\n「洗手間在哪裡？」\n\n「您走錯地方了，得從前頭的樓梯下去。」\n\n「多謝。」\n\n他微微頷首，不緊不慢地朝對方所指的方向走去。\n\n待兩名夥計的腳步聲遠去，魏戌俞才停了下來。\n\n身旁的房門掛著一塊銅牌。\n\n庫房。\n\n門上裝著一把厚重的黃銅鎖，窗戶內側也加裝了鐵欄。\n\n他正思索著該如何進去，走廊另一頭忽然又傳來了腳步聲。\n\n魏戌俞立即退入旁邊的轉角。\n\n兩名夥計抬著木箱走來，管事親自取出鑰匙開了門，吩咐他們將下一批拍品準備妥當。\n\n屋內頓時忙碌起來。\n\n魏戌俞趁著幾人搬運古物的空當，悄然混入庫房，隱沒在一排高大的木架後方。\n\n過了片刻，管事帶著夥計離開。\n\n門外傳來鎖扣碰撞的聲音。\n\n屋中只剩下魏戌俞一人。\n\n他從木架後走出來，目光迅速掃過四周。\n\n庫房比從外頭看起來更加寬敞。\n\n數排木架上陳列著瓷器、玉器、青銅器與古舊字畫，靠牆的位置還放著幾尊半人高的石像，個個面容肅穆，在昏暗的燈光下顯得有些陰森。\n\n魏戌俞一路走向庫房深處。\n\n很快，他便在一張鋪有紅絨的長桌上，看見了那只四角鑲有黃銅護片的黑色木匣。\n\n大小與拍賣名冊上的記載十分相符。\n\n他伸手摸向木匣上的銅扣。\n\n就在這時。\n\n身後忽然傳來一個女子的聲音。\n\n「這位先生，你在找什麼呀？」\n\n魏戌俞的動作猛然一頓。\n\n魏戌俞轉過身。\n\n只見一個年輕女子正倚在木架旁，手中晃著一串鑰匙，饒有興致地望著他。\n\n正是程小楓。\n\n「前頭有那麼多古物可以看，先生怎麼偏偏跑到這兒來了？」\n\n魏戌俞看了一眼庫房的門。\n\n門不知何時已經重新打開。\n\n「妳是？」\n\n「我？」\n\n程小楓笑了起來。\n\n「這兒是我們家的庫房，應該是我問你才對吧？」\n\n魏戌俞心下了然。\n\n看來眼前這位便是程家的小姐。\n\n「原來是程小姐。」\n\n「你認得我？」\n\n「方才在大廳裡見過。」\n\n程小楓的眼睛一下子亮了起來。\n\n「你也有注意到我呀？」\n\n魏戌俞微微一怔。\n\n事實上，他方才根本沒有留意到她。\n\n不過既然話已經說出口，也不好再特意解釋，只得微微點頭。\n\n程小楓頓時笑得更加開心。\n\n「我還以為只有我在看你呢！」\n\n魏戌俞一時竟不知該如何接話。\n\n她往前走了幾步。\n\n「不過，先生還沒回答我的問題。你方才明明坐在二樓的雅座裡，怎麼一轉眼就跑到我們庫房來了？」\n\n「程小姐一直跟著我？」\n\n「對啊。」\n\n她答得毫不猶豫。\n\n「我原本想找你說話，結果你走得那麼快。我一路跟過來，還差點把你跟丟了呢。」\n\n說到這兒，她忽然想起什麼。\n\n「對了，你方才是從後面的窗戶進來的吧？」\n\n魏戌俞沉默了一下。\n\n「妳看見了？」\n\n「看見了呀！」\n\n程小楓伸手比畫著。\n\n「那窗戶離露台可有一段距離呢，你竟然一下子就過去了。我還在想，你究竟是來買東西的，還是專門來偷東西的？」\n\n魏戌俞望著眼前這位笑容燦爛的姑娘。\n\n他在軍中出入各種險地多年，倒是頭一回被人跟蹤，還偏偏是因為這麼個理由。\n\n「程小姐誤會了。」\n\n他的語氣比方才和緩了些。\n\n「在下確實是來參加拍賣會的，只是對今晚最後一件拍品有些好奇，忍不住想先睹為快。」\n\n程小楓望向他身後的木匣。\n\n「七星鎏金鏡？」\n\n「不錯。」\n\n「你很喜歡古董？」\n\n「平日有些研究。」\n\n「那你直接找我們商會的人問一問不就好了？何必翻窗戶呢？」\n\n魏戌俞笑了笑。\n\n「聽說這件東西不許客人提前觀看，只好自己想些辦法。唐突之處，還望程小姐見諒。」\n\n程小楓盯著他看了幾秒。\n\n這男人不笑的時候已經十分好看。\n\n沒想到笑起來更好看。\n\n她原本還想端出幾分程家大小姐的架子，好好盤問他一番，結果見他這麼客氣，心裡那點氣勢早就消散得差不多了。\n\n「好吧，看在你這麼有禮貌的份上，我就先不叫人了。」\n\n她雙手背在身後，走到魏戌俞面前。\n\n「不過，你總得告訴我你是誰吧？」\n\n魏戌俞略一思索。\n\n「錢世豪。」\n\n程小楓臉上的笑容忽然停住了。\n\n「誰？」\n\n「錢世豪。」\n\n她睜大眼睛，從上到下打量了他一遍。\n\n「北邊錢家的那個錢世豪？」\n\n「正是。」\n\n程小楓搖頭。\n\n「我不信。」\n\n這下倒輪到魏戌俞有些意外了。\n\n「為何不信？」\n\n「你跟我聽說的錢世豪，長得不太一樣。」\n\n「程小姐見過他？」\n\n「沒有。」\n\n「既然沒見過，又怎知不像？」\n\n「那……」\n\n程小楓歪著頭，認認真真地思索了一會兒。\n\n她總不能告訴人家，自己聽說的錢世豪是個脾氣暴躁、五大三粗的男人吧？\n\n她朝魏戌俞伸出手。\n\n「請帖呢？給我看看。」\n\n魏戌俞從懷中取出那張深紅色的請帖，遞給了她。\n\n程小楓接過請帖。\n\n封面是自家商會的印記。\n\n內側的姓名，也確確實實寫著錢世豪三個字。\n\n她低頭看看請帖，又抬頭看看魏戌俞。\n\n過了好一會兒。\n\n忽然笑了。\n\n「原來真是你呀！」\n\n她將請帖還給魏戌俞，連說話的聲音都輕快了不少。\n\n「你怎麼不早說呢？」\n\n魏戌俞有些莫名其妙。\n\n方才還說不相信，怎麼一張請帖便讓她高興成了這樣？\n\n程小楓走到那只黑色木匣前，伸手解開銅扣。\n\n「來吧！」\n\n她將匣蓋掀開，又朝魏戌俞招了招手。\n\n「不是想看鏡子嗎？過來看呀！」\n\n魏戌俞站在原處。\n\n「妳方才不是說，不許客人進來？」\n\n「那是別人。」\n\n「這樣合規矩嗎？」\n\n程小楓笑著揚了揚下巴。\n\n「我們家的東西，我說可以就可以。不過你得在這兒看，不能拿出去。」\n\n魏戌俞望了她一眼。\n\n「那便多謝程小姐了。」\n\n「不用客氣！」\n\n她替他挪來一盞檯燈，又十分熱心地將桌上的幾件雜物移開。\n\n「這樣看得清楚嗎？要不要再拿一盞燈過來？」\n\n「這樣便好。」\n\n「好，那你慢慢看！」\n\n程小楓拉了張椅子，在桌旁坐下。\n\n魏戌俞低頭看鏡子。\n\n她則托著下巴看魏戌俞。\n\n兩人各自看著自己感興趣的東西，倒也相安無事。\n\n鏡中有異\n匣中鋪著一層深紅色的綢布，一面造型精美的鎏金古鏡靜靜地躺在其中。\n\n魏戌俞戴上手套，將古鏡小心取出。\n\n實物比父親留下的圖紙更加精緻。\n\n鏡背以鎏金覆飾，外緣共有十二道相互交疊的祥雲紋。細看之下，每一道雲紋的末端都刻有極為細小的人形圖案。\n\n那些人形雙膝跪地，雙手高舉，頭部卻沒有雕出任何五官。\n\n中央的玄武栩栩如生。\n\n龜甲由數十塊細密的幾何紋樣組成，長蛇自龜腹盤繞而上，蛇首微微抬起，口中銜著一枚圓珠。\n\n魏戌俞的目光在那條長蛇身上停留了許久。\n\n蛇尾穿過龜甲。\n\n蛇首銜珠。\n\n與他背上的家族印記，幾乎完全相同。\n\n而在玄武周圍，七顆星辰分別嵌於細小的圓形凹槽之中。\n\n每顆星辰四周都有一圈刻度，細如髮絲，若不是將古鏡拿到燈下仔細端詳，根本不易察覺。\n\n魏戌俞伸手輕輕推動其中一顆星辰。\n\n喀。\n\n鏡身內部傳出一聲極為細微的響動。\n\n他立即停手。\n\n那聲音不像是銅片彼此摩擦。\n\n倒像是某個沉睡已久的機關，忽然被人喚醒了。\n\n「咦？」\n\n程小楓從椅子上站了起來。\n\n「它會動？」\n\n「嗯。」\n\n「我以前怎麼沒發現？」\n\n她好奇地湊到魏戌俞身旁。\n\n「這幾顆星星都能轉嗎？」\n\n「應當可以。不過在弄清楚用途以前，最好不要亂動。」\n\n程小楓乖乖地收回了正準備伸出去的手。\n\n「好，聽你的。」\n\n魏戌俞將鏡身翻了過來。\n\n鏡面保存得極好，雖然略顯暗淡，卻沒有太多銅鏽。\n\n他將鏡子舉至面前。\n\n裡頭清晰地映出身後的木架、牆上的掛鐘，以及桌旁那盞散發著暖黃色光芒的檯燈。\n\n唯獨沒有他自己。\n\n魏戌俞稍稍偏轉鏡身。\n\n程小楓身後的椅子也出現在鏡中。\n\n椅面空空蕩蕩。\n\n彷彿站在它前方的程小楓，根本不存在。\n\n「很奇怪吧？」\n\n程小楓笑道：\n\n「我小時候還以為這是面壞掉的鏡子，拿著它照了半天，差點讓人拿去重新磨一磨。」\n\n魏戌俞看了她一眼。\n\n「幸好妳沒磨。」\n\n「怎麼？磨了會不值錢嗎？」\n\n「恐怕不只是不值錢。」\n\n「那幸好我娘當時把我攔住了。」\n\n程小楓說完，又朝鏡面做了個鬼臉。\n\n「你看，無論做什麼表情，它都不理我。」\n\n魏戌俞原本神情凝重，見她這副模樣，倒也忍不住笑了一下。\n\n然而就在下一刻，他臉上的笑意忽然消失了。\n\n鏡中的掛鐘，不知何時停止了走動。\n\n魏戌俞抬頭望向牆壁。\n\n真正的掛鐘仍在走。\n\n滴答。\n\n滴答。\n\n聲音清晰可聞。\n\n他重新低頭。\n\n鏡中的鐘擺卻靜止在半空中，維持著一個極不自然的角度。\n\n更奇怪的是，鏡中原本明亮的庫房，也在逐漸變暗。\n\n木架上的瓷器一件件失去光澤。\n\n牆壁浮現出大片斑駁的水痕。\n\n就連那盞檯燈的火光，也由暖黃色慢慢轉成了幽暗的青色。\n\n魏戌俞立即抬起頭。\n\n眼前的庫房依舊如常。\n\n燈光明亮，掛鐘仍在走動。\n\n程小楓正低頭整理披肩，絲毫沒有察覺到任何異樣。\n\n他再次望向鏡面。\n\n鏡中的庫房已經完全變了模樣。\n\n那是一間荒廢了不知多少年的屋子。\n\n木架腐朽，地上積滿黑水，幾尊石像歪斜地倒在牆角。\n\n原本掛著字畫的牆面上，竟隱隱浮現出幾道古老的石刻紋路。\n\n魏戌俞緩緩移動鏡身。\n\n鏡中庫房的門，開了一條縫。\n\n一片白色的衣角從門後掠過。\n\n緊接著。\n\n積滿黑水的地面上，憑空出現了一個腳印。\n\n又是一個。\n\n那是一雙赤裸的腳留下的痕跡。\n\n腳印從門口一路延伸，越過木架，繞過長桌，最終停在了程小楓所站的位置。\n\n魏戌俞握著古鏡的手微微收緊。\n\n「程小姐。」\n\n「嗯？」\n\n「妳方才可有聽見什麼聲音？」\n\n程小楓側耳聽了聽。\n\n「沒有呀。怎麼了？」\n\n魏戌俞沒有回答。\n\n鏡中，一隻蒼白的手從她身後的陰影中緩緩伸了出來。\n\n那隻手的手指纖細，腕間戴著一只玉鐲，寬大的白色衣袖上沾著些許水漬。\n\n它似乎正在尋找什麼。\n\n五指在半空中摸索了片刻，慢慢伸向程小楓的肩膀。\n\n「過來！」\n\n魏戌俞眉頭一皺，突然伸手握住程小楓的手腕，將她拉到了自己身旁。\n\n程小楓毫無防備，整個人向前踉蹌了一小步。\n\n魏戌俞順勢扶住她的手臂，才沒讓她撞上桌角。\n\n兩人之間的距離，一下子縮短了許多。\n\n程小楓愣住了。\n\n這是他今晚第一次主動碰她。\n\n她低頭望向握著自己手腕的那隻手。\n\n他的手掌很大，隔著薄薄的手套，仍能感覺到掌心傳來的溫度。\n\n方才那一下雖然來得突然，力道卻控制得很好，沒有弄疼她。\n\n程小楓慢慢抬起頭。\n\n從這個角度看去，她甚至能清楚看見魏戌俞的睫毛，以及他左耳那枚銀色耳飾上的細小紋路。\n\n他的肩膀比她想像中還要寬。\n\n身上有股很淡的木質香氣。\n\n程小楓的心跳莫名快了起來。\n\n她從前並非沒有與男子接觸過，宴會上的握手、跳舞，於她而言都是再尋常不過的事情。\n\n可那些時候，她從來沒有過這種感覺。\n\n胸口像是有隻不聽話的小兔子，突然蹦了起來。\n\n連耳根都有些發熱。\n\n她偷偷望著魏戌俞的側臉。\n\n心想，若是能再多靠近一點，似乎也不錯。\n\n然而魏戌俞此刻的注意力，全在那面古鏡上。\n\n鏡中那隻蒼白的手停了下來。\n\n它在程小楓原先站立的位置懸了片刻，五指微微蜷起，彷彿想抓住某件已經失去的東西。\n\n隨後，竟緩緩向下垂落。\n\n魏戌俞隱約看見一道人影。\n\n那人穿著一襲白衣，低垂著頭，黑色長髮遮住了大半張臉。\n\n它沒有繼續靠近。\n\n只是靜靜地站在原處。\n\n片刻後，人影消失了。\n\n鏡中的黑水、腐朽木架與斑駁牆壁也隨之褪去。\n\n掛鐘重新開始走動。\n\n一切恢復如常。\n\n魏戌俞將古鏡緩緩放下。\n\n「沒事了。」\n\n他鬆開了程小楓的手。\n\n程小楓低頭看了看自己的手腕，心中竟有些小小的失落。\n\n怎麼這麼快就放開了？\n\n「方才怎麼了？」\n\n她抬起頭。\n\n「你突然拉我，嚇了我一跳。」\n\n魏戌俞看了眼她身後的位置。\n\n「沒什麼，以為瞧見了些東西。」\n\n「什麼東西？」\n\n「可能是看錯了。」\n\n程小楓眨了眨眼睛。\n\n「所以你剛才是在保護我？」\n\n魏戌俞略微一頓。\n\n「算是吧。」\n\n程小楓頓時笑了起來。\n\n「那你人還挺好的嘛！」\n\n她雙手背在身後，腳尖輕輕踮了兩下，連站姿都透著幾分藏不住的雀躍。\n\n魏戌俞有些不解地看著她。\n\n方才若不是情況突然，他也不會貿然伸手拉一個初次見面的姑娘。\n\n可她這副高興的模樣，又是怎麼回事？\n\n他搖了搖頭，重新低頭查看古鏡。\n\n「程小姐，這面鏡子從前一直由妳母親保管？」\n\n「嗯。」\n\n「她可曾提過鏡子的來歷？」\n\n程小楓想了想。\n\n「那時候我年紀還小，只記得她很喜歡研究這些古物。有時候會對著這面鏡子坐上大半日，還會在紙上畫許多奇奇怪怪的圖案。」\n\n「什麼圖案？」\n\n「星星、圓圈，還有一些我看不懂的字。」\n\n她伸手指向鏡背。\n\n「有些跟這上頭的紋路挺像的。」\n\n魏戌俞若有所思。\n\n「那些東西如今還在嗎？」\n\n程小楓搖了搖頭。\n\n「不知道。自從我娘失蹤以後，她房裡的東西便被收起來了，我爹也很少再提起她。」\n\n說到這裡，她臉上的笑容稍稍淡了些。\n\n魏戌俞察覺到她的情緒，沒有繼續追問。\n\n他重新檢查鏡身兩側的白玉，確認先前轉動的那顆星辰已經恢復原位，才將古鏡放回木匣。\n\n「今日多謝程小姐。」\n\n「看完啦？」\n\n「嗯。」\n\n「那你可看出什麼門道了？」\n\n「有一些，不過還得回去仔細研究。」\n\n程小楓笑道：\n\n「那你今晚就把它買下來吧！到時候想研究多久都可以。」\n\n魏戌俞微微頷首。\n\n「正有此意。」\n\n未來的夫君\n魏戌俞合上木匣，望著身旁的程小楓。\n\n他忽然想起方才的事情。\n\n「程小姐，有件事我倒是有些好奇。」\n\n「什麼事？」\n\n「妳方才還在懷疑我是來偷東西的，怎麼知道我的姓名之後，便突然改變了態度？」\n\n程小楓眨了眨眼睛。\n\n「你不知道？」\n\n「知道什麼？」\n\n她仰起臉，笑盈盈地望著他。\n\n「因為你是我未來的夫君啊！」\n\n魏戌俞怔住了。\n\n庫房內安靜了片刻。\n\n「……什麼？」\n\n「夫君呀！」\n\n程小楓還特意提高了些聲音，生怕他沒有聽清楚。\n\n「我爹說咱們兩家有意結親，今晚就是要讓我與你見個面的。你不知道嗎？」\n\n魏戌俞望著她。\n\n一時間竟然不知道該說什麼。\n\n他忽然想起方才進門時，管事那副異常殷勤的模樣。\n\n我們老爺今日還特地問起您呢。\n\n我們家小姐今日也在，錢少爺可得好好把握機會啊！\n\n還有昨日在古董鋪中，那位掌櫃特意提到，錢家少爺到了拍賣會上，恐怕得親自見一見程家的主人。\n\n原來如此。\n\n難怪程家對錢世豪的招待如此周到。\n\n他原以為那不過是兩家商戶之間的交情，哪裡料到這位錢少爺南下，除了買古鏡，竟還有一門親事等著他。\n\n魏戌俞伸手揉了揉眉心。\n\n這回倒真是給自己找了個麻煩。\n\n「程小姐。」\n\n「嗯！」\n\n「妳我今日才第一次見面。」\n\n「我知道呀。」\n\n「婚姻大事，豈能如此草率？」\n\n程小楓歪著頭想了想。\n\n「可是我覺得你很好呀。」\n\n「妳連我是什麼樣的人都不知道。」\n\n「那我可以問你嘛！」\n\n她頓時來了精神。\n\n「你今年多大？平日喜歡做什麼？喜歡吃甜的還是鹹的？你住的地方離維安城有多遠？」\n\n魏戌俞抬手打斷她。\n\n「程小姐，我不是這個意思。」\n\n「那是什麼意思？」\n\n魏戌俞張了張嘴。\n\n終究又閉上了。\n\n他總不能在這個節骨眼上，告訴對方自己根本不是錢世豪。\n\n程小楓見他半天說不出話，忍不住湊近了些。\n\n「你是不是害羞了？」\n\n「沒有。」\n\n「那你怎麼不敢看我？」\n\n魏戌俞重新望向她。\n\n「我現在不是正看著妳？」\n\n程小楓立即笑了起來。\n\n「那你覺得我好不好看？」\n\n「……」\n\n魏戌俞從軍多年，無論面對上級長官、地方豪紳，還是那些窮凶極惡的匪徒，都從未像此刻這般不知道該如何接話。\n\n眼前這姑娘倒是一點也不見外。\n\n見魏戌俞遲遲沒有回答，程小楓也不生氣，反而自顧自地說道：\n\n「算了，不用你說，我自己也知道。」\n\n魏戌俞終於忍不住笑了一聲。\n\n這姑娘倒是對自己頗有信心。\n\n程小楓見他笑了，心裡更加高興。\n\n「你笑起來真好看。」\n\n魏戌俞臉上的笑意頓時僵了一下。\n\n他決定不再繼續這個話題。\n\n「時候不早了，我該回去了。」\n\n「好吧。」\n\n程小楓雖然還想多與他說幾句話，卻也知道拍賣會即將開始，便主動走到門口，向外張望了一眼。\n\n「外頭沒人，你快出去吧。」\n\n魏戌俞微微頷首。\n\n「今日之事，多謝。」\n\n「跟我客氣什麼？」\n\n她笑著替他拉開門。\n\n「既然你這麼喜歡那面鏡子，待會兒可要好好表現。」\n\n魏戌俞走出庫房。\n\n身後又傳來她輕快的聲音。\n\n「我可是很期待你的表現喔，未來的夫君！」\n\n魏戌俞的腳步頓了一下。\n\n他回頭看了她一眼。\n\n程小楓正站在門旁，笑著朝他揮手。\n\n魏戌俞沉默片刻，終究什麼也沒說，轉身離開了。\n\n直到那道高大的身影消失在走廊轉角，程小楓才重新回到庫房。\n\n她低頭看了看方才被他握過的手腕，又想起他突然拉自己過去的模樣。\n\n嘴角怎麼也壓不下來。\n\n「錢世豪？」\n\n她輕輕念了一遍這個名字。\n\n總覺得這個名字，與方才那男人實在不怎麼相襯。\n\n不過，這倒也無妨。\n\n反正她看上的又不是名字。\n\n古鏡中的另一個世界\n魏戌俞回到雅座時，蘇孟達已經打聽完消息，正在桌旁喝茶。\n\n見他回來，兩人同時站了起來。\n\n梁副官問道：\n\n「上校，找到鏡子了？」\n\n「找到了。」\n\n「情況如何？」\n\n魏戌俞拉開椅子坐下，從懷中取出父親留下的古鏡圖紙。\n\n「與圖紙上的一樣，不過實物藏著一些圖上沒有記載的細節。」\n\n蘇孟達立即湊了過來。\n\n「說來聽聽。」\n\n魏戌俞拿起桌上的鋼筆，在紙上畫出古鏡的大致形狀。\n\n「鏡背外圍有十二道雲紋，每道雲紋的末端，都刻著一個跪地的人形。那些人沒有五官，雙手高舉，姿勢與咱們先前在無舌銅鈴上見過的圖案十分相似。」\n\n梁副官立即想起了那只銅鈴。\n\n「是那些疑似被抽走魂魄的人？」\n\n「不錯。」\n\n魏戌俞又在鏡背中央畫下七個小圓圈。\n\n「除此之外，這七顆星辰都是獨立嵌入鏡身的，每顆星辰四周各有刻度，可以轉動。」\n\n蘇孟達看得眼睛發亮。\n\n「好精巧的東西！」\n\n他將圖紙轉了個方向。\n\n「這麼小的鏡身裡頭，居然還能藏下七組活動的機關。魏長官，您方才可曾試過轉動？」\n\n「試過其中一顆。」\n\n「有何反應？」\n\n「鏡身裡傳出了響聲。」\n\n魏戌俞將鋼筆放下。\n\n「隨後，鏡中便出現了異象。」\n\n蘇孟達臉上的笑容逐漸收斂。\n\n梁副官也將椅子往前挪了些。\n\n魏戌俞將方才在庫房內見到的情形，一五一十地告訴了兩人。\n\n從停止走動的掛鐘，到逐漸腐朽的木架、滿地的黑水，以及那個穿著白衣、試圖靠近程小楓的人影。\n\n聽到最後，蘇孟達忍不住摸了摸自己的胳膊。\n\n「您這意思是，那面鏡子不光能照見鬼，連整間屋子都能照出另一副模樣？」\n\n「嗯。」\n\n「有意思……」\n\n蘇孟達低頭望著圖紙，久久沒有說話。\n\n梁副官則注意到了另一件事。\n\n「上校，北山車站出現異象時，咱們也曾見過兩座幾乎一模一樣的車站。會不會這面鏡子照出的，也是另一邊的庫房？」\n\n「我也是這麼想的。」\n\n魏戌俞指著自己方才畫下的鏡背紋路。\n\n「但有一點不同。北山的玻璃能照出活人的倒影，只是在某些情況下，會顯現另一頭的景象。這面古鏡從一開始便照不出活人。」\n\n蘇孟達緩緩點頭。\n\n「也就是說，它所照見的東西，從一開始便未必與咱們處在同一個地方。」\n\n梁副官皺起眉頭。\n\n「可若是如此，為何連尋常的桌椅、燈火都能照得一清二楚？」\n\n「這正是最古怪的地方。」\n\n蘇孟達從口袋裡取出一枚銅錢，將它放在桌上。\n\n「老話常說，人死有魂，物舊有靈。倘若一件東西在世間存在得足夠久，經歷過的事情多了，便有可能留下某些尋常人看不見的痕跡。」\n\n他翻轉銅錢。\n\n「不過這些畢竟是民間傳說。我可從未聽說過，哪面鏡子能將一整間屋子變成那副鬼樣子。」\n\n魏戌俞沉吟片刻。\n\n「或許它照見的不是庫房的過去。」\n\n蘇孟達抬起頭。\n\n「您的意思是？」\n\n「那幾道浮現在牆壁上的石刻，不像是近些年留下的東西。若當真是另一座庫房，為何會有古墓的紋路？」\n\n梁副官似乎想到了什麼。\n\n「難道鏡中的庫房，已經與那座古墓連在一起了？」\n\n三人同時安靜下來。\n\n雅座之外，依舊是賓客們的談笑聲。\n\n樓下的樂曲悠揚，侍者來來往往，整幢洋樓充滿了熱鬧的人氣。\n\n可三人此刻卻不約而同地望向了大廳後方。\n\n那間存放七星鎏金鏡的庫房，就在距離他們不遠的地方。\n\n若梁副官的猜測當真沒錯，那麼此刻與他們僅有幾牆之隔的，或許便是那座尚未找到的古墓。\n\n蘇孟達忍不住低聲道：\n\n「咱們還沒下墓呢，墓裡的東西倒先找上門來了。」\n\n魏戌俞重新看向圖紙。\n\n「另外，方才那個人影似乎只對程家小姐有興趣。」\n\n「它想害她？」\n\n「不一定。」\n\n魏戌俞回想起那隻手伸向程小楓時的模樣。\n\n那動作十分緩慢，沒有北山那些鬼怪撲向活人時的兇狠。\n\n尤其是在程小楓被拉開之後，那隻手停留在半空中的模樣，甚至讓他有種奇怪的感覺。\n\n像是捨不得。\n\n「它沒有追上來，也沒有其他攻擊的舉動。只是一直想靠近她。」\n\n蘇孟達摸了摸下巴。\n\n「程家小姐以前可曾碰過這面鏡子？」\n\n「碰過。而且照她所說，這面鏡子原先由她母親保管。她母親似乎也對鏡背的紋路做過研究。」\n\n梁副官道：\n\n「若能找到她母親，說不定便能知道七顆星辰該如何使用。」\n\n魏戌俞搖了搖頭。\n\n「她母親已經失蹤多年了。」\n\n蘇孟達聞言，嘆了一口氣。\n\n「怎麼又是個失蹤的？」\n\n他望著圖紙想了半天，忽然伸出一根手指，將桌上那枚銅錢推到七星圖案中央。\n\n「魏長官，我倒是有個猜測。」\n\n「說。」\n\n「先前咱們在北山，靠著恢復日、月、星三塊石板的方位，才重新關上那三道石門。城西那塊鎮水石，同樣得依照正確的星象擺放，才能鎮住井裡的東西。」\n\n他指向古鏡。\n\n「這七顆星辰既然能夠轉動，會不會也得依照某種特定的方位排列，才能發揮真正的用途？」\n\n魏戌俞微微頷首。\n\n「很有可能。」\n\n「不過您在庫房只動了一顆星辰，便出現了這麼大的變化。往後若要研究，恐怕得更加小心。」\n\n蘇孟達頓了頓。\n\n「萬一轉錯了，說不定咱們還沒找到墓門，人便已經被送進墓裡了。」\n\n梁副官望著他。\n\n「蘇爺，您倒是會想。」\n\n「我這叫未雨綢繆！」\n\n魏戌俞將圖紙慢慢折好。\n\n「總之，先把東西拿到手。回北城以後，再找個妥當的地方仔細研究。」\n\n「明白。」\n\n梁副官應了一聲。\n\n蘇孟達卻沒有立即坐回去。\n\n他望著魏戌俞，忽然察覺到一件事情。\n\n「等等，魏長官。」\n\n「怎麼？」\n\n「您方才一直提到程家小姐……」\n\n蘇孟達露出有些古怪的笑容。\n\n「您不是偷偷進去的嗎？怎麼還跟人家姑娘聊上了？」\n\n怎麼多了個嫂子？\n魏戌俞拿起茶杯，喝了一口茶。\n\n「被她發現了。」\n\n蘇孟達一愣。\n\n梁副官也抬起了頭。\n\n「上校，您被發現了？」\n\n「嗯。」\n\n蘇孟達難以置信。\n\n「您？」\n\n魏戌俞瞥了他一眼。\n\n「有什麼問題？」\n\n「沒有，沒有。」\n\n蘇孟達連忙擺手。\n\n他與魏戌俞相識多年，深知這位老朋友的身手。連軍營裡那些經過訓練的士兵，都未必能察覺他的行蹤。\n\n如今倒讓一個商家小姐給逮住了。\n\n這可當真稀奇。\n\n「那程小姐沒叫人？」\n\n「沒有。」\n\n「還讓您看了鏡子？」\n\n「嗯。」\n\n「為何？」\n\n魏戌俞沉默片刻。\n\n將茶杯放回桌上。\n\n「蘇爺，你先前打聽錢家的事情時，有沒有聽說他們與程家有門親事？」\n\n蘇孟達臉上的笑容停住了。\n\n「親事？」\n\n梁副官轉過頭。\n\n「上校，怎麼突然問起這個？」\n\n魏戌俞伸手揉了揉眉心。\n\n「錢世豪是程家小姐的相親對象。」\n\n蘇孟達眨了眨眼睛。\n\n梁副官看向桌上的請帖。\n\n兩人似乎同時意識到了什麼。\n\n蘇孟達試探著問道：\n\n「那她……看見您的請帖了？」\n\n「看見了。」\n\n「您也承認自己是錢世豪了？」\n\n「嗯。」\n\n雅座內頓時陷入一片寂靜。\n\n蘇孟達端著茶杯，嘴巴微微張開。\n\n梁副官的神情也難得出現了一絲呆滯。\n\n過了半晌，蘇孟達才慢慢將茶杯放下。\n\n「魏長官，您出去這麼一會兒……」\n\n他伸出手，指了指門外。\n\n「把親事也給定了？」\n\n魏戌俞冷冷看了他一眼。\n\n「我什麼時候說定了？」\n\n「人家姑娘怎麼說的？」\n\n魏戌俞沒吭聲。\n\n蘇孟達越發好奇。\n\n「您倒是說啊！」\n\n「她稱我為未來的夫君。」\n\n梁副官手中的茶杯微微一晃。\n\n蘇孟達呆呆地望著魏戌俞。\n\n「夫君？」\n\n下一刻，他猛地轉向梁副官。\n\n「梁副官，咱們不是來買鏡子的嗎？」\n\n梁副官木然地點了點頭。\n\n蘇孟達一拍大腿。\n\n「怎麼鏡子還沒買著，倒先多了個嫂子？」\n\n「蘇爺。」\n\n「哎？」\n\n「閉嘴。」\n\n梁副官低下頭，伸手抵住嘴唇。\n\n魏戌俞轉頭看他。\n\n「副官。」\n\n梁副官立即抬頭。\n\n「上校。」\n\n「你笑什麼？」\n\n「沒有。」\n\n魏戌俞盯著他。\n\n梁副官輕咳一聲，努力恢復平日的神情。\n\n「只是……事情的發展有些出乎意料。」\n\n蘇孟達終於忍不住，捂著肚子笑倒在椅背上。\n\n「哎喲，魏長官，我跟您認識這麼多年，怎麼從來不知道您的本事還有這一樣？」\n\n魏戌俞懶得理會他。\n\n「拿到鏡子便走。今晚的事情，不許再提。」\n\n「明白，明白！」\n\n蘇孟達連連點頭。\n\n可沒過多久，他又湊了過來。\n\n「不過，那位程小姐長得如何？」\n\n魏戌俞拿起茶杯。\n\n「蘇爺。」\n\n「哎？」\n\n「你若這麼閒，現在便出去。」\n\n蘇孟達這才老老實實地坐了回去。\n\n梁副官拿起拍賣名冊，默默翻到了下一頁。\n\n他跟隨魏戌俞多年，還是頭一回見到上校因為一個姑娘而如此無奈。\n\n真正的錢世豪\n晚間七點，拍賣正式開始。\n\n大廳中的樂聲漸漸停歇，賓客們陸續入座。\n\n一名身穿黑色禮服的拍賣師走上展示台，向眾人致意。\n\n最先呈上的是一對青花瓷瓶。\n\n接著是白玉雕件、古代字畫，以及一柄嵌有寶石的短劍。\n\n蘇孟達看得津津有味，偶爾還會向梁副官說明其中幾件東西的來歷。\n\n魏戌俞卻始終沒有舉牌。\n\n他只在等那面鏡子。\n\n拍賣進行了近兩個鐘頭，原本擺滿古物的展示台，終於只剩下最後一個空位。\n\n蘇孟達放下手中的瓜子。\n\n「來了。」\n\n兩名商會夥計捧著那只鑲有黃銅護片的黑色木匣，緩緩走上展示台。\n\n大廳中原本有些疲倦的賓客，紛紛坐直了身子。\n\n連斜對面那兩個始終不曾舉牌的男人，也在此刻抬起了頭。\n\n拍賣師面帶笑容地走到台前。\n\n「諸位，接下來便是今晚最後一件拍品，也是本次拍賣會最為珍貴的一件古物。」\n\n夥計解開木匣上的銅扣。\n\n隨著盒蓋掀起，一層柔和的金色光澤映入眾人眼中。\n\n「七星鎏金鏡！」\n\n大廳內頓時響起一陣驚嘆。\n\n就在此時，門外忽然傳來一陣極不和諧的吵鬧聲。\n\n「我就是錢世豪！你們到底有沒有長耳朵？」\n\n魏戌俞抬起眼睛。\n\n蘇孟達手中的瓜子掉回了盤裡。\n\n梁副官轉頭望向大廳入口。\n\n三人對這個聲音都不陌生。\n\n「得。」\n\n蘇孟達低聲道：\n\n「來得早不如來得巧。」\n\n幾名商會管事匆匆走向門口。\n\n「這位先生，您沒有請帖，實在不能進去！」\n\n「我的請帖被人搶了！」\n\n「先生，您先冷靜些……」\n\n「滾開！」\n\n一名管事被人推得向後踉蹌。\n\n錢世豪帶著三名隨從，氣勢洶洶地闖入大廳。\n\n他顯然是剛抵達維安城便趕了過來，衣裳上還沾著旅途中的灰塵，手下更提著那只沉重的黑色皮箱。\n\n「程伯父！」\n\n錢世豪一見程父，連忙換了副笑臉。\n\n「小侄錢世豪，路上遇了些麻煩，來遲了！」\n\n程父怔在原地。\n\n「你說你是誰？」\n\n「錢世豪啊！家父錢萬山！」\n\n一旁的管事連忙道：\n\n「老爺，錢少爺不是早就到了嗎？」\n\n錢世豪眉頭一皺。\n\n「誰到了？」\n\n管事指向二樓。\n\n錢世豪猛然抬頭。\n\n魏戌俞正站在雕花欄杆旁，神情淡漠地望著樓下。\n\n「是你！」\n\n錢世豪氣得渾身發抖。\n\n「好啊！你搶了我的請帖，居然還敢冒充我的身分！」\n\n所有賓客頓時抬起頭來。\n\n魏戌俞卻十分平靜。\n\n「你的請帖？」\n\n「不是我的，難不成還是你的？」\n\n「願賭服輸的道理，你爹沒教過你？」\n\n錢世豪的臉瞬間漲紅。\n\n「你給我下來！」\n\n魏戌俞看了眼展示台上的七星鎏金鏡。\n\n他可不想在這種時候節外生枝。\n\n隨即帶著梁副官及蘇孟達走下樓梯。\n\n程父迎了上來。\n\n「二位，這究竟是怎麼回事？」\n\n錢世豪搶先開口。\n\n「程伯父，您可別被這人騙了！他在火車上搶了我的請帖，如今又冒用我的姓名！」\n\n魏戌俞淡淡道：\n\n「我持帖赴宴。倒是閣下，兩手空空闖進會場，大呼小叫，未免太失禮了些。」\n\n「你有膽子報上姓名！」\n\n「錢世豪。」\n\n錢世豪呆住了。\n\n他活了這麼多年，還是頭一回見到有人當著自己的面，面不改色地冒充自己。\n\n「我才是錢世豪！」\n\n魏戌俞挑了挑眉。\n\n「巧了。」\n\n四周頓時響起一陣竊笑。\n\n蘇孟達低下頭，用力抿住嘴唇。\n\n梁副官則默默望向另一側。\n\n程父一時也弄不清楚究竟誰才是真的錢家少爺。\n\n就在雙方僵持不下之際，程小楓從人群中走了出來。\n\n「爹，出了什麼事？」\n\n錢世豪一見她，眼睛頓時亮了起來。\n\n「想必這位便是程小姐吧？」\n\n他急忙整了整衣領。\n\n「在下錢世豪，正是與妳有婚約的——」\n\n「等等。」\n\n程小楓打斷了他。\n\n「誰跟你有婚約？」\n\n錢世豪一愣。\n\n「咱們兩家的長輩不是早就商量好了嗎？」\n\n「商量歸商量，我可沒答應。」\n\n程小楓看看錢世豪，又看看魏戌俞。\n\n她想起自己從前聽過的那些傳聞，心裡頓時明白了幾分。\n\n原來如此。\n\n難怪跟她聽說的模樣差了這麼多。\n\n不過她可不打算因此改變自己的主意。\n\n她徑直走到魏戌俞身旁，笑著仰起臉。\n\n「我要等的人早就來啦！」\n\n魏戌俞低頭看了她一眼。\n\n這姑娘倒是來得正巧。\n\n錢世豪順著她的目光看去。\n\n這下子，他算是徹底明白了。\n\n在火車上讓他丟盡顏面的人，不僅搶了他的請帖，冒充他的身分，如今甚至連程家小姐也看上了對方。\n\n「你這個混帳！」\n\n錢世豪猛然揮拳，朝魏戌俞打了過去。\n\n魏戌俞側身避開，順手將程小楓往身後一擋。\n\n梁副官立即上前，扣住一名正要幫忙的隨從。\n\n另外兩名隨從見狀，也紛紛撲了過來。\n\n大廳頓時亂成一片。\n\n「別打了！」\n\n「快來人！」\n\n附近的賓客慌忙後退，幾張椅子被撞得東倒西歪。\n\n魏戌俞扣住錢世豪的手腕，順勢將他推開。\n\n「鬧夠了沒有？」\n\n錢世豪踉蹌幾步，撞到了展示台邊緣。\n\n他眼見打不過魏戌俞，一時惱羞成怒，抓起台旁一件沉重的銅製燈座，便朝對方狠狠砸去。\n\n魏戌俞迅速避開。\n\n然而錢世豪用力過猛，手中的燈座竟脫手飛了出去。\n\n蘇孟達猛然瞪大眼睛。\n\n「鏡子！」\n\n沉重的銅座正直直飛向展示台中央。\n\n那面七星鎏金鏡，尚且毫無遮擋地立在木匣之中。\n\n魏戌俞臉色一變。\n\n根本來不及多想，他轉身便撲向展示台，伸手將古鏡護在懷中。\n\n砰！\n\n銅座重重砸中他的左肩。\n\n巨大的撞擊力使他向前一傾，肩膀撞上台沿，破裂的玻璃罩又在他手臂上劃開一道口子。\n\n「上校！」\n\n梁副官大驚，立即衝了過去。\n\n蘇孟達也顧不上其他，三步並作兩步跑到展示台旁。\n\n「魏長官！」\n\n魏戌俞咬緊牙關，低頭查看懷中的古鏡。\n\n鏡身完好無損。\n\n兩側的白玉也沒有半點裂痕。\n\n他這才鬆了口氣。\n\n「鏡子沒事。」\n\n「您還管鏡子！」\n\n蘇孟達望著他左臂逐漸滲出的血跡。\n\n「您這胳膊都流血了！」\n\n魏戌俞將古鏡交還給商會夥計。\n\n「收好，別再讓人碰。」\n\n程小楓站在不遠處，望著這一幕，原先臉上的笑意早已消失得乾乾淨淨。\n\n她猛然轉向錢世豪。\n\n「你給我站住！」\n\n錢世豪怔了一下。\n\n「程小姐，這……」\n\n「誰准你在我們程家的拍賣會上動手的？」\n\n程小楓氣得滿臉通紅。\n\n「你知不知道這些古物有多珍貴？打壞了一件，便再也找不回第二件了！你倒好，連人帶東西一塊兒砸！」\n\n「我不是故意的……」\n\n「不是故意的就能算了？」\n\n她抬手指向魏戌俞。\n\n「你看看人家！寧願自己受傷，也不肯讓古物受到半點損害。再看看你，一進門便大吵大鬧，還差點毀了今晚最珍貴的拍品！」\n\n錢世豪急忙辯解。\n\n「程小姐，我才是真正的錢世豪！妳可不能被那個騙子——」\n\n「你才是冒牌貨！」\n\n程小楓毫不客氣地打斷他。\n\n「真正受我們程家邀請的錢少爺，才不會這般沒規矩，更不會如此糟蹋珍貴的古物！」\n\n「妳！」\n\n「來人啊！」\n\n她轉身朝商會的護衛喊道：\n\n「把這個冒牌貨給我轟出去！」\n\n錢世豪瞪大了眼睛。\n\n「程伯父！您倒是說句話啊！」\n\n程父望著滿地狼藉，又望向被砸得歪斜的展示台，臉色已經難看到了極點。\n\n不論眼前這人究竟是不是錢萬山的兒子，光憑方才的行徑，他便不可能再留對方在會場裡。\n\n「先請這位先生出去。」\n\n「是，老爺！」\n\n幾名護衛立即上前。\n\n周圍的賓客也紛紛開口。\n\n「趕出去！哪有人在拍賣會上這麼鬧事的？」\n\n「方才若不是那位先生出手，這面鏡子恐怕早就碎了！」\n\n「就是！咱們大老遠跑來看古董，可不是來看你撒野的！」\n\n甚至還有幾名方才差點被撞倒的商人，直接捲起袖子，嚷著要錢世豪賠償。\n\n錢世豪回過頭。\n\n「你們幾個還愣著做什麼？」\n\n然而那三名隨從眼見商會的護衛越聚越多，方才又已在梁副官手中吃了虧，哪裡還敢繼續動手。\n\n其中一人提起皮箱，悄悄往門口退去。\n\n另外兩人也連忙跟上。\n\n「少爺，咱們出去再說吧！」\n\n「少爺，好漢不吃眼前虧啊！」\n\n錢世豪還想爭辯，卻已被幾名護衛架住了胳膊。\n\n「放開我！你們知不知道我是誰？」\n\n沒有人理會他。\n\n不消片刻，連同那三名落荒而逃的隨從，錢世豪一行人便被轟出了商會大門。\n\n大廳裡響起一片掌聲。\n\n蘇孟達望著錢世豪消失的方向，搖了搖頭。\n\n「這錢少爺也是個人才。好端端一趟相親，讓他辦成了個過街老鼠。」\n\n梁副官沒有理會他，正低頭查看魏戌俞手臂上的傷勢。\n\n程小楓匆匆走了過來。\n\n「你的傷怎麼樣？」\n\n「無妨。」\n\n「都流血了，怎麼會無妨？」\n\n她看見血跡已經染紅了魏戌俞的襯衫袖口，立即轉頭吩咐管事拿藥箱過來。\n\n魏戌俞活動了一下肩膀。\n\n雖然有些疼痛，所幸手臂尚能正常活動。\n\n「小傷而已，不必緊張。」\n\n程小楓皺著眉頭望向他。\n\n「那面鏡子再珍貴，也犯不著拿自己去擋呀！萬一傷得更重怎麼辦？」\n\n魏戌俞看了她一眼。\n\n「有些東西，不能用價錢來衡量。」\n\n程小楓怔了怔。\n\n他說這句話時，神情十分認真。\n\n那並不是一個古董商人見到珍品時的喜愛，也不像尋常富家少爺為了在眾人面前出風頭而逞能。\n\n他似乎真的有某個非得到那面鏡子不可的理由。\n\n程小楓沒有繼續追問。\n\n她望著他手臂上的傷口，忍不住小聲嘀咕：\n\n「反正下次不許這樣了。」\n\n魏戌俞聽見了，有些意外地看向她。\n\n程小楓立即仰起臉。\n\n「聽見沒有？」\n\n魏戌俞無奈地笑了一下。\n\n「程小姐，妳還是先去看看令尊吧。」\n\n「知道啦！」\n\n待管事送來藥箱後，她讓梁副官先替魏戌俞處理手臂上的傷口，自己則轉身去協助父親安撫賓客。\n\n不到一刻鐘，大廳中的桌椅便重新擺放整齊。\n\n受驚的客人也陸續回到座位。\n\n程小楓站在展示台旁，向在場眾人微微欠身。\n\n「方才讓諸位受驚了，是我們程家招待不周。今晚的拍賣照常進行，稍後商會會另外備上茶點，向各位賠不是。」\n\n她的語氣從容，絲毫不見方才怒斥錢世豪時的火氣。\n\n魏戌俞站在樓梯旁，望著她處理會場上的大小事務。\n\n倒是有些意外。\n\n這姑娘在庫房裡還一副天真爛漫、想到什麼便說什麼的模樣，如今面對滿廳賓客，竟也頗有章法。\n\n「魏長官。」\n\n蘇孟達湊了過來。\n\n「我瞧這位程小姐挺不錯的。上得了廳堂，還轟得走流氓。」\n\n魏戌俞看了他一眼。\n\n「你也想被轟出去？」\n\n蘇孟達立即閉上了嘴。\n\n待魏戌俞三人回到二樓，程小楓也重新坐到了父親身旁。\n\n拍賣師正在整理最後一件拍品的資料。\n\n程父則與幾位商會長輩低聲交談，商量著方才那場鬧劇該如何善後。\n\n唯獨程小楓，心思早已飄到了二樓。\n\n她單手托著下巴，透過雕花欄杆之間的空隙，望著東首雅座內的魏戌俞。\n\n方才在台下時，他那副面對錢世豪依然從容不迫的模樣，已經讓她十分喜歡。\n\n如今他重新坐回椅中，微微敞開的西裝外套下露出白色襯衣，右手端著茶杯，偶爾側過頭與身旁的人說上幾句話。\n\n就連低頭喝茶的模樣都賞心悅目。\n\n程小楓看著看著，忽然又想起在庫房裡被他握住手腕的情景。\n\n她低頭摸了摸自己的手腕，忍不住傻笑起來。\n\n「小姐。」\n\n身旁的女傭小聲喚她。\n\n「嗯？」\n\n「您從坐下來到現在，已經往樓上看了好幾回了。」\n\n「有嗎？」\n\n「您就沒看過別處。」\n\n程小楓絲毫沒有被人拆穿的窘迫，反而拉住女傭的手。\n\n「妳看嘛！是不是很好看？」\n\n女傭順著她的目光望去。\n\n「那位先生確實生得好看。」\n\n「是吧！」\n\n程小楓一下子來了精神。\n\n「而且他不只長得好看，說話也好聽，身手又好。妳方才有沒有瞧見？那個姓錢的根本打不過他！」\n\n女傭忍不住笑了。\n\n「小姐，您今日怎麼跟個小孩子似的？」\n\n「我高興嘛！」\n\n恰好此時，魏戌俞察覺到樓下的視線，抬起了頭。\n\n兩人的目光隔著大廳相遇。\n\n程小楓立即朝他笑了笑，還悄悄揮了揮手。\n\n魏戌俞微微一怔。\n\n出於禮貌，他朝她點了下頭，便重新低頭翻閱名冊。\n\n程小楓卻立刻轉向女傭。\n\n「妳看見沒有？他跟我打招呼了！」\n\n「看見了，看見了。」\n\n她心滿意足地靠回椅背，端起茶杯，心情愉快地喝了一口。\n\n一旁的程父終於注意到女兒的異樣。\n\n「妳在高興什麼？」\n\n「沒什麼呀。」\n\n「方才還氣得要將人轟出去，現在倒笑得這般開心。」\n\n程小楓抿著嘴笑。\n\n「爹，您不懂。」\n\n程父一臉莫名其妙。\n\n他抬頭看了看二樓，又看了看女兒，終究無奈地搖了搖頭。\n\n點天燈\n待風波徹底平息，拍賣師重新走上展示台。\n\n七星鎏金鏡再次被鄭重地取了出來。\n\n這一回，展示台旁多了四名商會護衛。\n\n「諸位，現在正式開始今晚最後一件拍品的競價。」\n\n拍賣師舉起手中的小槌。\n\n「七星鎏金鏡，起拍價，兩萬大洋！」\n\n話音剛落，樓下立即有人舉牌。\n\n「兩萬五千！」\n\n「三萬！」\n\n「三萬五千！」\n\n「四萬！」\n\n蘇孟達咂了咂嘴。\n\n「好傢伙，這才剛開始呢。」\n\n魏戌俞抬手舉牌。\n\n「五萬。」\n\n大廳內頓時響起一陣議論。\n\n然而還沒等拍賣師開口，斜對面那名戴著黑色手套的男人便舉起了牌子。\n\n「六萬。」\n\n另一名商人緊接著喊道：\n\n「七萬！」\n\n魏戌俞神情不變。\n\n「八萬。」\n\n「九萬！」\n\n價格攀升得極快。\n\n不過短短片刻，便已突破十萬大洋。\n\n魏戌俞原以為，直接將價格抬高一些，便能讓其他買家知難而退。\n\n沒想到這些人非但沒有退讓，反而愈喊愈起勁。\n\n「十一萬！」\n\n「十一萬五千！」\n\n「十二萬！」\n\n拍賣師在台上興奮地來回確認價格，樓下的買家更是爭得不可開交。\n\n每當拍賣師準備落槌時，總會有人趕在最後一刻重新舉牌。\n\n魏戌俞低頭看了一眼懷錶。\n\n再這麼喊下去，還不知道得耽擱多少時間。\n\n更何況，方才那場鬧劇已經讓他們在會場中引起太多注意。如今斜對面那兩個來歷不明的男人又始終盯著這件拍品，魏戌俞並不想在此久留。\n\n他重新舉牌。\n\n「十三萬。」\n\n「十四萬！」\n\n樓下立即有人接了上去。\n\n魏戌俞皺起眉頭。\n\n「沒完沒了。」\n\n梁副官望向樓下。\n\n「上校，想要這面鏡子的人，恐怕比咱們預料的還要多。」\n\n蘇孟達也嘆了口氣。\n\n「古玩買賣就是如此。碰上這種人人都想要的東西，沒個半晌工夫，根本分不出勝負。」\n\n說完，他便起身走到欄杆旁，想看看樓下究竟還有哪些人在與他們爭奪這面古鏡。\n\n魏戌俞則向守在雅座外的侍者招了招手。\n\n「過來。」\n\n侍者立即走了進來。\n\n「先生，有何吩咐？」\n\n魏戌俞指了指樓下的七星鎏金鏡。\n\n「有沒有什麼法子，能直接買下那件東西？」\n\n侍者愣了一下。\n\n「先生的意思是……」\n\n「我沒興趣陪他們這麼慢慢喊價。」\n\n魏戌俞靠著椅背，語氣已有幾分不耐。\n\n「能不能省去這些競價的工夫，直接將東西買下來？」\n\n侍者恍然大悟。\n\n他打量了一眼魏戌俞，又望向桌旁一盞尚未點亮的紅色琉璃燈。\n\n「先生若是對這件拍品勢在必得，倒是有個法子。」\n\n「說。」\n\n侍者恭敬地伸手示意。\n\n「您可以點天燈。」\n\n魏戌俞順著他的手望去。\n\n雅座左側擺著一盞造型頗為精巧的銅燈，燈身雕有祥雲紋飾，外頭罩著一層紅色琉璃。\n\n每間雅座似乎都有這樣一盞燈，只是至今沒有任何人將它點亮。\n\n「點了便能買到？」\n\n「正是。」\n\n侍者笑著答道：\n\n「依照咱們商會的規矩，一旦點了天燈，便是勢在必得。您也不必再親自一口一口地喊價了。」\n\n魏戌俞點了點頭。\n\n既然有這般省事的規矩，何必在這兒白費工夫？\n\n「那就點吧。」\n\n侍者的笑容忽然停了一下。\n\n「先生，您當真要點天燈？」\n\n魏戌俞看向他。\n\n「點。」\n\n侍者立即低頭。\n\n「明白了！」\n\n他取來火柴，將那盞紅色琉璃燈點亮。\n\n柔和的紅光瞬間映照在雅座之中。\n\n侍者隨即走到雕花欄杆旁，拉響了懸掛於柱上的銅鈴。\n\n叮——\n\n清脆的鈴聲傳遍整座大廳。\n\n原本此起彼伏的喊價聲，竟在這一瞬間全部停了下來。\n\n拍賣師猛然抬頭。\n\n樓下的賓客紛紛轉過身。\n\n就連原先正與人交談的程父，也一下子站了起來。\n\n拍賣師望著二樓那盞紅燈，臉上的神情既驚訝又興奮。\n\n他高高舉起手中的小槌，朗聲宣布：\n\n「二樓東首貴客——點天燈一盞！」\n\n整座大廳瞬間沸騰。\n\n「什麼？天燈？」\n\n「當真有人點天燈了？」\n\n「程家商會上一次有人點天燈，怕是好幾年前的事情了吧？」\n\n「這是哪一家的少爺？好大的手筆！」\n\n幾名商人瞠目結舌地望著二樓，甚至有人直接從椅子上站了起來，想看清究竟是哪位人物有如此魄力。\n\n魏戌俞坐在雅座之中，望著樓下眾人的反應，逐漸察覺到了不對勁。\n\n不過是換個買東西的法子。\n\n何至於此？\n\n梁副官也皺起了眉頭。\n\n而原本趴在欄杆旁的蘇孟達，聽見拍賣師的宣告後，整個人突然僵住了。\n\n他慢慢轉過身。\n\n目光落在那盞亮得通紅的琉璃燈上。\n\n臉色瞬間變得慘白。\n\n「魏……魏長官……」\n\n魏戌俞轉頭看向他。\n\n「怎麼？」\n\n蘇孟達指著那盞燈，手指竟微微有些發抖。\n\n「您點的？」\n\n「嗯。」\n\n「點天燈？」\n\n「不錯。」\n\n蘇孟達猛地一拍額頭。\n\n「完了！」\n\n梁副官立即站起身。\n\n「蘇爺，怎麼回事？」\n\n蘇孟達沒有回答，急忙將椅子拉到魏戌俞身旁。\n\n「魏長官，您可知道點天燈是什麼意思？」\n\n「不用再喊價，便能買下東西。」\n\n蘇孟達瞪大了眼睛。\n\n「買是能買！可不是這麼個買法啊！」\n\n魏戌俞的眉頭逐漸皺緊。\n\n「別廢話，講重點。」\n\n蘇孟達深吸了一口氣。\n\n「我早些年在南方做古物買賣時，曾經聽過這種規矩。只是這些年極少有人敢點天燈，我一時竟沒想起來！」\n\n他伸手指向樓下那些正仰頭觀望的賓客。\n\n「所謂點天燈，就是您當著全場的面放話，這件東西無論別人出多少錢，您都要買下來！」\n\n魏戌俞望著他。\n\n「所以？」\n\n「所以，人家喊二十萬，您就得出二十萬以上！人家喊五十萬，您就得出五十萬以上！」\n\n蘇孟達急得連手都比畫了起來。\n\n「往後每有人出一次價，拍賣師便會自動替您加一口價，根本不必再問您的意思！」\n\n梁副官神情一變。\n\n「若是有人故意喊出天價呢？」\n\n「那也得認！」\n\n「無論多少？」\n\n「無論多少！」\n\n蘇孟達指著那盞燈。\n\n「只要這盞燈還亮著，別人喊出來的價錢，咱們就得無條件照單全收！」\n\n雅座內忽然安靜了下來。\n\n魏戌俞望著蘇孟達。\n\n蘇孟達望著那盞紅燈。\n\n梁副官低頭看了一眼桌上的名冊，又看向樓下那些虎視眈眈的買家。\n\n三個人面面相覷。\n\n竟沒有一個人說得出話來。\n\n半晌，魏戌俞才緩緩開口。\n\n「這燈不能熄？」\n\n蘇孟達一臉苦相。\n\n「天燈一旦點了，便是當著全場賓客立下的承諾。除非您當眾認輸，放棄這件拍品，再依規矩賠付一筆違約金。」\n\n魏戌俞沉默了。\n\n蘇孟達小心翼翼地問道：\n\n「魏長官，您方才究竟為什麼要點這盞燈？」\n\n「嫌他們喊價太慢。」\n\n「……」\n\n蘇孟達慢慢坐了回去。\n\n他雙手捂住臉，長長地嘆了一口氣。\n\n「我的老天爺。」\n\n「您為了省半個鐘頭，怕是要把後半輩子的家當都搭進去了。」\n\n散盡家財，也得拿下\n「二十萬。」\n\n一道聲音從斜對面的雅座傳來。\n\n黑手套男人舉著手中的牌子，面帶笑容地望向魏戌俞。\n\n方才的價格不過十四萬大洋。\n\n如今他竟一下子抬高了六萬。\n\n拍賣師望向二樓東首那盞紅燈，立即高聲宣布：\n\n「二十萬大洋！天燈貴客再加一萬，二十一萬！」\n\n大廳內頓時響起一陣驚呼。\n\n蘇孟達猛地抬起頭。\n\n「這就二十一萬了？」\n\n梁副官的神情逐漸凝重。\n\n「上校，對方恐怕是故意抬價。」\n\n魏戌俞當然也看出來了。\n\n那男人出價時甚至沒有看向古鏡，目光始終停留在他的臉上。\n\n而在樓下，程小楓早已興奮地拉住了父親的胳膊。\n\n「爹，他點天燈了！」\n\n程父同樣十分意外。\n\n「這年輕人倒是好大的魄力。」\n\n程小楓笑得合不攏嘴。\n\n她方才還叮囑對方要好好表現，沒想到竟然給了她這麼大一個驚喜。\n\n再抬頭望向二樓，只見魏戌俞端坐於紅燈之下，神情沉穩，即便聽見二十一萬大洋的天價，臉上也沒有半點慌亂。\n\n程小楓雙手捧著臉，越看越喜歡。\n\n「爹，您看他，多有氣魄！」\n\n程父無奈道：\n\n「妳倒是比人家還高興。」\n\n「那當然！」\n\n她哪裡知道，此刻樓上的三個男人，正在認真思考回到北城以後該如何籌錢。\n\n「二十五萬！」\n\n黑手套男人再次舉牌。\n\n拍賣師立刻接道：\n\n「天燈貴客，二十六萬！」\n\n蘇孟達已經笑不出來了。\n\n「魏長官，咱們現在就算把身上所有的錢湊在一塊兒，也差得遠呢。」\n\n梁副官低聲說道：\n\n「上校，對方尚未有收手的意思。若繼續下去，最後的數目恐怕難以預料。」\n\n魏戌俞沒有立即回答。\n\n他望著展示台上的古鏡。\n\n腦海中浮現出北山那兩名慘死的守衛、失蹤的第七節車廂、倒影中困於列車上的亡魂，以及城西那口險些吞噬活人的石井。\n\n古道雖然已經重新封住，卻沒有人知道那三道石門還能維持多久。\n\n倘若這面鏡子落入那個眉骨帶疤的男人手中，後果更是難以預料。\n\n尤其親眼見過古鏡的異象之後，他更加肯定，這件東西恐怕掌握著兩個世界之間的某些祕密。\n\n他又想起父親留在工程圖中的那幾句話。\n\n後世魏氏子孫，若見赤星之印，務必尋鏡，不可使其落入外人之手。\n\n魏戌俞沉思良久。\n\n他並不是個不在乎錢財的人。\n\n魏家如今尚存的產業與古物，有些是祖上數代累積下來的，有些則是父親生前親手收藏的。\n\n若說對那些東西沒有半點感情，那自然是假的。\n\n但比起北山那些尚且生死未卜的人，比起那座隨時可能再次失去控制的古墓，這些身外之物又算得了什麼？\n\n他忽然抬起頭。\n\n「副官。」\n\n梁副官立即站直身子。\n\n「在。」\n\n「去給北城發電報。」\n\n蘇孟達轉過頭。\n\n魏戌俞繼續道：\n\n「讓府上的人即刻將家中所有收藏的古物，以及我名下的產業、田地、存款，全數清點。」\n\n梁副官微微一怔。\n\n「上校，您的意思是……」\n\n「能抵押的抵押，能變賣的變賣。等我回去，再親自處置。」\n\n魏戌俞望著那盞紅燈，神情已經恢復了平日的冷靜。\n\n「無論最後是多少錢，都給我想辦法湊齊。」\n\n蘇孟達一下子坐直了身子。\n\n「魏長官，您可想清楚了？再讓那傢伙喊下去，您說不定連宅子都得賣了！」\n\n魏戌俞看向他。\n\n「宅子賣了，可以再買。」\n\n他抬手指向樓下的七星鎏金鏡。\n\n「那東西若是落入別人手中，咱們還有機會再找回來嗎？」\n\n蘇孟達張了張嘴。\n\n終究沒有說出話來。\n\n魏戌俞重新靠回椅背。\n\n「今日就算散盡家財，我也要把這面鏡子帶回北城。」\n\n他的語氣並不重，卻沒有留下半點商量的餘地。\n\n梁副官跟隨他多年，自然明白這位上校一旦拿定主意，便不會再有所動搖。\n\n「是！」\n\n他立即轉身，前去安排發報事宜。\n\n蘇孟達望著魏戌俞，半晌才嘆了口氣。\n\n「得，既然您都決定了，我也沒什麼好說的。」\n\n他往椅背上一靠。\n\n「回頭我那鋪子裡也挑幾件值錢的東西出來。雖然不見得能幫上多少，總比沒有好。」\n\n魏戌俞轉頭看他。\n\n「不必。這是我點的燈，沒道理讓你替我賠錢。」\n\n「哎，咱們多少年的交情了？」\n\n蘇孟達擺了擺手。\n\n「不過先說好，那只宋代的茶盞我可不賣。我平日還得用它喝茶呢。」\n\n魏戌俞忍不住笑了一下。\n\n「行，給你留著。」\n\n「三十萬！」\n\n黑手套男人再次舉牌。\n\n全場一片譁然。\n\n拍賣師的額頭上已經滲出汗珠。\n\n「三十萬大洋！天燈貴客，三十一萬！」\n\n魏戌俞神色如常。\n\n他甚至端起茶杯，不緊不慢地喝了一口。\n\n然而到了這個時候，周圍的賓客已經逐漸察覺到了異樣。\n\n「三十萬？這面鏡子再值錢，也不至於如此吧？」\n\n「那人是哪家的？從方才起便一直在抬價。」\n\n「我看他未必是真想買東西，倒像是存心與點天燈的那位過不去。」\n\n「你們瞧，他連拍品都不看，光盯著人家呢。」\n\n議論聲愈來愈大。\n\n甚至有幾名商會的長輩，也開始打量那個戴著黑色手套的男人。\n\n那男人卻絲毫不以為意。\n\n他嘴角帶著笑，似乎十分享受這種將別人逼入絕境的感覺。\n\n眼見他又要舉牌，身旁穿深褐色長衫的男人忽然伸手，按住了他的手腕。\n\n「夠了。」\n\n黑手套男人皺起眉頭。\n\n「他還沒熄燈。」\n\n「你看看四周。」\n\n那人低聲說道：\n\n「再喊下去，整個會場都要盯上咱們了。」\n\n黑手套男人這才留意到，附近不少賓客都在朝他們所在的方向張望。\n\n「別忘了咱們此行的目的。」\n\n褐衣男人端起茶杯，目光掠過展示台上的古鏡。\n\n「東西最後落在誰手裡，不是由這一槌決定的。」\n\n黑手套男人聞言，沉默了片刻。\n\n隨後，他慢慢放下手中的牌子。\n\n朝魏戌俞所在的方向拱了拱手。\n\n「罷了，君子不奪人所好。」\n\n其餘買家見狀，更是無人敢再出價。\n\n拍賣師高高舉起小槌。\n\n「三十一萬大洋，第一次！」\n\n蘇孟達閉上了眼睛。\n\n「三十一萬大洋，第二次！」\n\n剛剛回到雅座的梁副官，默默望向桌上的紅燈。\n\n「三十一萬大洋，第三次！」\n\n砰！\n\n小槌重重落下。\n\n「成交！恭喜二樓東首貴客，獲得七星鎏金鏡！」\n\n掌聲如雷。\n\n大廳裡所有人都站了起來。\n\n程小楓更是高興得連連拍手，朝二樓的魏戌俞比了個勝利的手勢。\n\n魏戌俞終於鬆了口氣。\n\n那面鏡子，總算到手了。\n\n蘇孟達睜開眼睛，幽幽地望著他。\n\n「魏長官。」\n\n「嗯？」\n\n「往後您若嫌事情辦得太慢，能不能先與我商量一下？」\n\n魏戌俞看著他，沉默半晌。\n\n「……好。」\n\n三十一萬大洋的女婿\n拍賣會結束後，魏戌俞被請進了二樓的一間雅室。\n\n程父與商會的帳房先生皆在場。\n\n程小楓也坐在一旁。\n\n她望著魏戌俞走進來，立即站起身，笑著朝他揮手。\n\n「恭喜你！」\n\n魏戌俞微微頷首。\n\n「多謝。」\n\n「我就知道你一定能買到！」\n\n她拉開身旁的椅子。\n\n「來，坐這兒！」\n\n魏戌俞看了看程父，又看了看她，終究還是坐了下來。\n\n程小楓立刻替他倒了杯茶，又將桌上的桂花糕推到他面前。\n\n「這個很好吃，你試試看！」\n\n程父看著女兒殷勤的模樣，忍不住笑了起來。\n\n這丫頭平日連給自己倒杯茶都得喊上兩聲，今日倒是無師自通。\n\n「今晚這一盞天燈，倒讓我們程家商會開了眼界。賢侄年紀輕輕，便有如此魄力，實在難得。」\n\n聽見這聲賢侄，魏戌俞的神情微微一頓。\n\n他忽然想起了庫房裡的那番對話。\n\n看來那樁親事的誤會，似乎愈來愈深了。\n\n帳房先生將拍賣成交的單據送了過來。\n\n「先生，總價三十一萬大洋，還請您過目。」\n\n魏戌俞接過單據。\n\n「程先生，有件事情，我需要與您商量。」\n\n「請說。」\n\n「此次南下準備的款項不足以付清全部價金。我可以先支付八萬大洋，餘下的款項，還需回北城籌措。」\n\n帳房先生聞言，神情頓時有些為難。\n\n然而程父卻出乎意料地爽快。\n\n「我當是什麼大事。」\n\n他笑著擺了擺手。\n\n「可以，剩下的回去再籌便是。」\n\n魏戌俞有些意外。\n\n蘇孟達站在一旁，更是忍不住抬起了頭。\n\n二十三萬大洋。\n\n這可不是在街邊買了幾個包子，忘了帶錢，改日再還便能了事的小數目。\n\n程父竟然連眉頭都沒皺一下。\n\n「老爺……」\n\n帳房先生忍不住小聲提醒。\n\n「這餘下的二十三萬，數目可不小。」\n\n「我知道。」\n\n程父看向魏戌俞。\n\n「不過商會畢竟有商會的規矩。賢侄回北城以後，我會另外派人前往，清點可供抵押的古物及產業。到時候再依照估定的價值，商量餘款如何處理。」\n\n魏戌俞立即應下。\n\n「理當如此。」\n\n程父滿意地點了點頭。\n\n其實他之所以答應得如此爽快，倒也並非全然不顧商會的利益。\n\n錢家與程家本就有多年生意上的交情，錢萬山在北方也算是有些家底的人物。\n\n更何況，眼前這年輕人今晚不僅以身護住了程家的古物，還讓自己那個向來挑剔得厲害的女兒難得動了心。\n\n程父心中早已將他視為未來的女婿。\n\n既然遲早都是一家人，這筆款項又何必急於一時？\n\n「賢侄，你放心便是。」\n\n程父端起茶杯，笑呵呵地說道：\n\n「往後咱們打交道的日子還長著呢。」\n\n魏戌俞握著茶杯的手微微一頓。\n\n一旁的蘇孟達立刻轉過頭。\n\n梁副官則默默望向窗外。\n\n程小楓笑得格外燦爛。\n\n「爹，您今日真好！」\n\n程父瞪了她一眼。\n\n「平日對妳不好？」\n\n「平日也好，今日最好！」\n\n她伸手抱住父親的胳膊，還親暱地蹭了兩下。\n\n程父無奈地搖了搖頭。\n\n「這丫頭。」\n\n魏戌俞望著眼前這對父女，忽然覺得自己似乎又惹上了一件相當麻煩的事情。\n\n款項交付妥當後，那只黑色木匣終於被送到了三人面前。\n\n魏戌俞親自打開匣蓋，確認七星鎏金鏡完好無損，這才重新扣上銅鎖。\n\n程小楓站在一旁。\n\n「這下你高興了吧？」\n\n魏戌俞微微頷首。\n\n「多謝程小姐。」\n\n「你怎麼又跟我客氣？」\n\n她笑著望向他。\n\n「你們今晚住哪兒？」\n\n「飯店。」\n\n「還要在維安城待幾日？」\n\n「今晚便走。」\n\n程小楓一愣。\n\n「這麼快？」\n\n「北城還有事情等著處理，不宜久留。」\n\n「可是你還沒逛過維安城呢！這兒有好多好吃的東西，城南還有一座很漂亮的花園。我原本想明日帶你去看看的。」\n\n「下次有機會吧。」\n\n「那下次是什麼時候？」\n\n魏戌俞有些無奈。\n\n「暫時說不準。」\n\n程小楓鼓了鼓臉頰。\n\n「好吧。」\n\n她雖然答應了，眼睛卻滴溜溜地轉了兩下，也不知道在想些什麼。\n\n魏戌俞並未留意她的神情，轉身將木匣交給蘇孟達。\n\n蘇孟達立即雙手接過。\n\n「哎喲，三十一萬大洋！」\n\n他小心翼翼地將木匣抱在懷中，生怕磕碰到任何地方。\n\n「魏長官，我活了這麼多年，還是頭一回抱著這麼多錢走路。」\n\n梁副官提醒道：\n\n「蘇爺，您抱緊些。」\n\n「那是自然！」\n\n蘇孟達將木匣往懷中攏了攏。\n\n「今晚便是把我摔了，也不能把它摔了。」\n\n魏戌俞看了他一眼。\n\n「走吧。」\n\n三人向程父告辭，離開了雅室。\n\n程小楓站在原處，目送魏戌俞的身影消失在走廊盡頭。\n\n過了片刻，她忽然轉過頭。\n\n「爹，北城那筆款項，您打算派誰去清點？」\n\n程父正低頭翻閱成交單據。\n\n「還沒想好，怎麼了？」\n\n程小楓笑了笑。\n\n「沒什麼，問問而已。」\n\n長街飛車\n離開商會時，已是深夜。\n\n維安城的街道上行人漸少，雨後的石板路泛著濕潤的光澤。街邊幾盞路燈散發著昏黃的光，遠處偶爾傳來黃包車夫的吆喝聲。\n\n蘇孟達雙手抱著木匣，一面下台階，一面嘀咕。\n\n「三十一萬啊……」\n\n他低頭看了一眼懷中的東西。\n\n「也不知道這鏡子照不照得出財神爺。若真能照出來，我回去頭一件事便是請他老人家保佑咱們發財。」\n\n梁副官淡淡道：\n\n「蘇爺，您先看路吧。」\n\n「放心，我走路穩得很。」\n\n魏戌俞站在台階下，望了一眼街道兩端。\n\n「先回飯店取行李。副官，今晚北上的火車還趕得上嗎？」\n\n梁副官看了看懷錶。\n\n「時間應當足夠。」\n\n「好。」\n\n就在此時，街道另一頭忽然亮起兩道刺眼的車燈。\n\n一輛黑色汽車從停靠在路邊的幾輛馬車後方猛然駛出，直直朝商會門前衝來。\n\n引擎的轟鳴聲撕破了街上的寂靜。\n\n魏戌俞立即察覺不對。\n\n「蘇爺，小心！」\n\n蘇孟達茫然抬頭。\n\n黑色汽車已經衝到近前。\n\n一道人影從半開的車門探出身子，猛地抓住他懷中的木匣。\n\n「哎！做什麼！」\n\n蘇孟達下意識抱緊木匣。\n\n然而對方力氣極大，猛然一扯，蘇孟達整個人頓時被帶得向前踉蹌。\n\n梁副官立即伸手去拉他。\n\n偏偏就在此時，汽車突然加速。\n\n蘇孟達被拖得雙腳離地，身體重重撞向車門。\n\n「蘇爺！」\n\n魏戌俞一把扣住蘇孟達的後領，將他向後拉了回來。\n\n與此同時，木匣從蘇孟達手中脫出，被那人一把拽入車內。\n\n車門砰然關閉。\n\n黑色汽車揚長而去。\n\n蘇孟達跌坐在地上，呆呆地望著自己空蕩蕩的雙手。\n\n半晌，才猛然發出一聲慘叫。\n\n「我的三十一萬！」\n\n魏戌俞已經追了出去。\n\n「副官！」\n\n「在！」\n\n「找車！」\n\n梁副官立即望向街道另一側。\n\n恰好有一輛深灰色汽車從街角駛來。\n\n他毫不猶豫地衝到路中央，抬手示意停車。\n\n司機嚇得猛踩煞車。\n\n車輪在石板路上滑了好一段距離，才堪堪停下。\n\n「你不要命了？！」\n\n梁副官徑直走到駕駛座旁，拉開車門，亮出軍官證。\n\n「您的車被軍隊徵召了，立刻下車！」\n\n司機整個人都懵了。\n\n「什、什麼？」\n\n梁副官一把將尚未反應過來的司機拉下車。\n\n「抱歉，軍務緊急，事後會有人賠償。」\n\n說完，他坐進駕駛座。\n\n魏戌俞迅速拉開車門。\n\n「蘇爺，上車！」\n\n蘇孟達連滾帶爬地從地上起來，跳進了後座。\n\n砰！\n\n車門關上。\n\n汽車猛然加速，揚長而去。\n\n只留下那名司機站在原地，呆呆望著自己的汽車消失在街角。\n\n過了半晌，他才回過神來。\n\n「我的車啊！」\n\n汽車內，蘇孟達一手抓著座椅，一手揉著方才撞疼的胳膊。\n\n「梁副官！」\n\n「怎麼了？」\n\n「您方才那樣子，到底是軍官還是搶車的土匪啊？」\n\n梁副官緊盯著前方。\n\n「蘇爺，您的鏡子還要不要了？」\n\n「要！要！快追！」\n\n魏戌俞坐在副駕駛座，目光始終鎖定前方那輛黑色汽車。\n\n「就在前頭，別跟丟了。」\n\n「明白！」\n\n梁副官猛踩油門。\n\n兩輛汽車之間的距離迅速縮短。\n\n前方的黑色汽車似乎察覺到了他們，車身忽然一晃，猛地轉入右側街道。\n\n梁副官立即跟了上去。\n\n車輪碾過路中央的積水，濺起大片水花。\n\n一名正準備收攤的小販嚇得抱住自己的竹籃，慌忙退到屋簷底下。\n\n兩輛汽車呼嘯而過。\n\n魏戌俞盯著前方的車窗。\n\n黑色汽車的後座上，一個穿著深褐色長衫的男人正抱著那只木匣。\n\n另一個男人轉過頭。\n\n路燈恰好照亮了他抬起的右手。\n\n黑色皮手套。\n\n魏戌俞眼神一沉。\n\n「果然是他們。」\n\n蘇孟達連忙探頭。\n\n「誰？」\n\n「拍賣會上的那兩個人。」\n\n蘇孟達瞪大眼睛。\n\n「好啊！我說他們怎麼突然不喊價了！」\n\n他氣得直拍大腿。\n\n「原來是打算讓咱們花錢，他們白拿！」\n\n話音剛落，魏戌俞忽然大喝一聲。\n\n「低頭！」\n\n砰！\n\n一聲槍響從前方傳來。\n\n汽車前方的玻璃瞬間炸開一個窟窿。\n\n細碎的玻璃飛濺而來。\n\n蘇孟達猛地縮進座椅底下。\n\n「還真開槍啊！」\n\n槍聲中的維安城\n又是一聲槍響。\n\n砰！\n\n子彈擦過汽車側面的鐵皮，迸出一串火星。\n\n梁副官猛然轉動方向盤。\n\n汽車向左一偏，避開迎面而來的一輛馬車。\n\n馬匹受到驚嚇，猛地揚起前蹄。\n\n車夫慌忙拉住韁繩，對著遠去的兩輛汽車破口大罵。\n\n魏戌俞拔出手槍，探身望向前方。\n\n黑手套男人半個身子伸出車窗，手中槍口正對著他們。\n\n「副官，穩住車！」\n\n「是！」\n\n魏戌俞抬手還擊。\n\n砰！砰！\n\n前方汽車的後窗應聲碎裂。\n\n黑手套男人猛地縮回車內。\n\n然而沒過多久，一隻手便從另一側車窗伸了出來。\n\n槍聲再度響起。\n\n汽車右側的後視鏡被打得粉碎。\n\n蘇孟達趴在後座，兩手抱住腦袋。\n\n「魏長官！您二位好歹也給我留個能躲的地方啊！」\n\n「趴好！」\n\n「我都快趴到車底去了！」\n\n梁副官望著前方。\n\n「上校，前頭是商街！」\n\n街道兩旁掛滿了尚未收起的招牌，幾名夜歸的行人正提著燈籠從路上經過。\n\n黑色汽車絲毫沒有減速的意思。\n\n一頭衝進了商街。\n\n「讓開！」\n\n梁副官連按喇叭。\n\n刺耳的聲音響徹長街。\n\n行人驚慌失措地向兩側退去，幾名小販連忙拖走自己的貨物。\n\n前方的黑色汽車撞翻了一輛空板車。\n\n板車在地上旋轉了半圈，橫在道路中央。\n\n「上校！」\n\n梁副官猛地踩下煞車，同時轉動方向盤。\n\n汽車擦著板車的木輪險險駛過。\n\n砰的一聲，車身側面撞上了路旁堆放的竹籃。\n\n數十顆橘子滾得滿街都是。\n\n蘇孟達在後座被甩得東倒西歪。\n\n「梁副官！咱們今晚欠的可不只程家的錢了！」\n\n梁副官顧不上回答。\n\n前方的黑色汽車突然再度轉彎。\n\n兩車之間剛剛縮短的距離，又被拉開了。\n\n魏戌俞抬頭看了一眼前方。\n\n街道盡頭是一座橫跨河渠的石橋。\n\n橋面狹窄，兩側石欄不過半人高。\n\n黑色汽車已經駛上橋面。\n\n「追上去！」\n\n梁副官加重油門。\n\n汽車引擎發出沉悶的吼聲，沿著坡道猛然衝上石橋。\n\n就在兩車相距不過數丈之時，前方汽車的車頂忽然被人從裡面掀開了。\n\n黑手套男人從天窗中探出上半身。\n\n手中的槍口再次對準他們。\n\n蘇孟達抬頭一瞧。\n\n「魏長官！他在上頭！」\n\n砰！砰！砰！\n\n接連幾發子彈擊中車頭。\n\n一盞車燈瞬間熄滅。\n\n梁副官猛地偏頭，一片碎裂的玻璃擦過他的臉頰。\n\n魏戌俞立即轉身。\n\n「副官，受傷了？」\n\n「沒事！」\n\n梁副官抹去臉上的碎屑。\n\n「上校，您坐穩！」\n\n汽車從石橋另一端衝下。\n\n車身劇烈震動，後座的蘇孟達整個人向上一顛，腦袋重重撞上了車頂。\n\n「哎喲！」\n\n魏戌俞望向車頂。\n\n這輛汽車上方同樣設有一扇可以掀開的通風窗。\n\n他立即伸手將其推開。\n\n夜風猛地灌入車內。\n\n「蘇爺，扶我一下。」\n\n蘇孟達一愣。\n\n「您要做什麼？」\n\n魏戌俞已經站了起來。\n\n他踩住座椅邊緣，將上半身探出天窗。\n\n「魏長官！」\n\n蘇孟達嚇得趕忙抱住他的腰。\n\n「您肩膀上還有傷呢！」\n\n魏戌俞沒有理會。\n\n疾馳中的汽車劇烈顛簸，夜風將他的頭髮吹得凌亂，西裝衣襬也在風中獵獵作響。\n\n左臂原本已經止住血的傷口，因方才的動作再次滲出了鮮血。\n\n他卻始終盯著前方。\n\n黑手套男人似乎沒有料到對方也會從車頂出現，神情一變。\n\n兩人幾乎在同一時間舉起了槍。\n\n砰！\n\n蘇孟達嚇得閉上了眼睛。\n\n前方那人的肩膀猛然向後一震，整個人跌回車內。\n\n魏戌俞正要收身，黑色汽車卻突然向旁猛甩。\n\n一只沉重的木箱從對方車窗中被扔了出來。\n\n「副官！」\n\n梁副官迅速避讓。\n\n木箱擦過車身，轟然撞碎在路旁。\n\n魏戌俞失去平衡，上半身險些從天窗翻了出去。\n\n蘇孟達拼命攥住他的衣服。\n\n「魏長官！您可別把我一塊兒帶出去啊！」\n\n魏戌俞伸手扣住車頂邊緣，重新穩住身形。\n\n「抓緊！」\n\n「我已經抓得不能再緊了！」\n\n前方的黑色汽車衝進了一片倉庫區。\n\n街道上再也看不見尋常行人，兩側盡是高聳的磚牆與堆積如山的貨物。\n\n梁副官迅速跟了上去。\n\n「上校，對方的車開始偏了！」\n\n魏戌俞低頭望去。\n\n前方那輛黑色汽車的右側車輪正在劇烈晃動。\n\n車身一會兒向左，一會兒向右，顯然已經難以控制。\n\n下一刻，汽車猛然撞上街角的石柱。\n\n轟！\n\n整個車頭向內凹陷。\n\n車身失去控制，橫著滑過街道，一頭撞進堆放在倉庫外的木箱。\n\n數只木箱轟然倒塌，碎裂的木板四處飛散。\n\n黑色汽車終於停了下來。\n\n然而梁副官駕駛的汽車仍在疾馳。\n\n「上校，當心！」\n\n他猛踩煞車。\n\n車輪在地面拖出兩道長長的黑痕。\n\n汽車一路滑行，直至撞開一扇半掩的木門，才堪堪停住。\n\n魏戌俞被蘇孟達一把拉回車內。\n\n兩人重重跌在座椅上。\n\n整輛車安靜了片刻。\n\n車頭開始冒出一縷白煙。\n\n蘇孟達緩緩睜開眼睛。\n\n「咱們……還活著？」\n\n魏戌俞迅速坐直身子。\n\n「下車！」\n\n奪回古鏡\n前方的黑色汽車已經撞得面目全非。\n\n穿著深褐色長衫的男人推開變形的車門，抱著木匣，踉蹌著從車內爬了出來。\n\n黑手套男人緊隨其後。\n\n他的右肩已經被鮮血染紅，手中卻仍然握著槍。\n\n「快走！」\n\n兩人迅速鑽進倉庫之間的巷道。\n\n魏戌俞立即下車。\n\n「副官，跟上！」\n\n梁副官應聲而出。\n\n蘇孟達也從後座爬了出來。\n\n他原本還有些腿軟，可一看見對方懷中的木匣，頓時又有了力氣。\n\n「三十一萬！給我站住！」\n\n三人沿著倉庫外牆追了上去。\n\n黑手套男人聽見身後的腳步聲，突然轉身開槍。\n\n砰！\n\n子彈擊中魏戌俞身旁的磚牆。\n\n碎裂的磚石擦過他的臉側。\n\n魏戌俞立即閃身避開。\n\n「蘇爺，躲好！」\n\n蘇孟達連忙蹲到一堆麻袋後方。\n\n梁副官則借著旁邊的貨箱遮掩身形，迅速逼近黑手套男人。\n\n兩人很快扭打在了一起。\n\n槍口在拉扯間猛然抬高。\n\n砰！\n\n倉庫上方一盞電燈應聲碎裂。\n\n整條巷道頓時暗了下來。\n\n魏戌俞越過倒塌的木箱，繼續追趕那個抱著古鏡的男人。\n\n對方顯然對這一帶的地形頗為熟悉。\n\n穿過兩座倉庫後，他突然翻上一處堆滿貨物的平台，順著外側木梯往下跳去。\n\n魏戌俞緊追不捨。\n\n就在男人即將鑽入另一條巷道時，魏戌俞一把抓住他的衣領，將人猛地拽了回來。\n\n那男人立即轉身揮拳。\n\n魏戌俞抬手擋住。\n\n兩人狠狠撞上倉庫外的木架。\n\n咔嚓！\n\n木架應聲斷裂。\n\n男人手中的木匣脫手飛出。\n\n魏戌俞臉色一變。\n\n正欲伸手去接，對方卻一把抓住他受傷的左肩。\n\n劇烈的疼痛瞬間襲來。\n\n魏戌俞悶哼一聲。\n\n眼看木匣即將重重摔落在地，旁邊突然衝出一道人影。\n\n「我的祖宗！」\n\n蘇孟達猛地撲了過去。\n\n整個人趴在地上，雙手牢牢接住了木匣。\n\n砰！\n\n他的下巴重重撞上地面。\n\n疼得眼淚差點掉了下來。\n\n然而他根本顧不上疼，立即低頭查看懷中的東西。\n\n木匣完好。\n\n銅扣也沒有鬆脫。\n\n蘇孟達長長吐出一口氣。\n\n「接住了……」\n\n他趴在地上，心疼地摸了摸木匣。\n\n「祖宗保佑，三十一萬還在。」\n\n另一頭，魏戌俞已經掙脫那男人的手。\n\n他抬腿將對方踹向磚牆，隨即扣住男人的衣領。\n\n「誰派你們來的？」\n\n那男人嘴角帶血，卻只是冷笑。\n\n「魏上校，您為了一面鏡子，倒是真捨得下血本。」\n\n魏戌俞目光一沉。\n\n「你認得我？」\n\n男人笑而不語。\n\n魏戌俞將他按得更緊。\n\n「北山的事情，是不是也與你們有關？」\n\n「您還是先擔心自己能不能離開維安城吧。」\n\n話音剛落，遠處忽然傳來一聲尖銳的哨響。\n\n緊接著，數道手電筒的光芒從倉庫另一頭掃了過來。\n\n「人在那兒！」\n\n「快！」\n\n雜亂的腳步聲迅速逼近。\n\n魏戌俞回過頭。\n\n就在這一瞬間，那男人猛地掙開他的手，翻過旁邊的貨箱，消失在黑暗之中。\n\n魏戌俞正欲追趕，蘇孟達突然喊道：\n\n「魏長官！後頭也有人！」\n\n梁副官匆匆從另一條巷子跑了過來。\n\n「上校，那個戴手套的人被同夥救走了。這附近恐怕全是他們的人。」\n\n魏戌俞看向蘇孟達。\n\n「鏡子呢？」\n\n蘇孟達立即打開木匣。\n\n昏暗的光線下，七星鎏金鏡依舊靜靜地躺在紅綢之中。\n\n兩側的白玉沒有破損。\n\n鏡背上的七顆星辰也仍在原處。\n\n「完好無損！」\n\n「好，先撤。」\n\n走投無路\n三人沿原路迅速返回汽車旁。\n\n梁副官拉開車門，重新坐進駕駛座。\n\n魏戌俞與蘇孟達緊跟著上車。\n\n然而梁副官才一發動引擎，車頭便發出一陣極為刺耳的響聲。\n\n喀、喀、喀。\n\n汽車顫動了幾下。\n\n沒了聲音。\n\n梁副官再次嘗試。\n\n這一回，車頭直接冒出一大股白煙。\n\n蘇孟達抱著木匣，瞪大了眼睛。\n\n「梁副官，您別嚇我。」\n\n梁副官又試了一次。\n\n引擎發出最後一聲沉悶的響動，徹底安靜了下來。\n\n「上校，車壞了。」\n\n蘇孟達慢慢靠回椅背。\n\n「完了。」\n\n他望著車頭冒出的白煙，欲哭無淚。\n\n「鏡子的錢還沒還清，這下還得賠人家一輛汽車。」\n\n魏戌俞已經推開車門。\n\n「下車。」\n\n就在此時，遠處突然響起一聲槍響。\n\n砰！\n\n汽車後方的玻璃應聲碎裂。\n\n蘇孟達嚇得從另一側車門滾了出去。\n\n梁副官迅速拔槍還擊。\n\n「上校，左邊也有人！」\n\n魏戌俞抬頭望去。\n\n倉庫外的道路上，已有幾個男人持槍逼近。\n\n遠處甚至還有汽車的引擎聲。\n\n對方顯然早就在這一帶安排了接應的人手。\n\n他們不能再留在這裡。\n\n魏戌俞一把拉起蘇孟達。\n\n「走！」\n\n三人迅速鑽進旁邊的巷道。\n\n身後不斷傳來槍聲。\n\n子彈擊中兩側的磚牆，碎石接連落下。\n\n蘇孟達雙手緊抱木匣，跑得氣喘吁吁。\n\n「魏長官，我這輩子可從沒跑過這麼快！」\n\n「留著力氣！」\n\n魏戌俞回身朝後方開了兩槍，隨即拉住蘇孟達繼續向前。\n\n前方是一處岔路。\n\n梁副官率先跑了過去。\n\n才探出身子，便立刻退了回來。\n\n砰！砰！\n\n兩發子彈擊中牆角。\n\n「上校，這邊也被堵住了！」\n\n魏戌俞望向另一側。\n\n「走右邊！」\n\n三人轉入一條狹窄的巷子。\n\n兩側的磚牆高聳，牆頂還架著鐵絲。\n\n地上積滿雨水，偶爾散落著幾塊腐朽的木板。\n\n身後的腳步聲愈來愈近。\n\n蘇孟達跑了幾步，忽然踩中一處積水，腳下一滑。\n\n魏戌俞眼疾手快，一把拽住他的胳膊。\n\n「小心！」\n\n蘇孟達站穩身子，連忙低頭查看木匣。\n\n「沒事，沒摔著。」\n\n魏戌俞看了他一眼。\n\n「我是問你。」\n\n蘇孟達愣了片刻。\n\n隨即咧嘴一笑。\n\n「我也沒事！」\n\n梁副官站在巷道盡頭，轉頭喊道：\n\n「上校，前面就是大路！」\n\n魏戌俞立即帶著蘇孟達趕了過去。\n\n然而就在即將踏出巷口時，一輛黑色汽車突然從大路另一端駛來。\n\n幾道人影從車內跳了下來。\n\n「在那兒！」\n\n梁副官迅速退回牆後。\n\n「上校，前頭有車，後頭也有人。」\n\n魏戌俞環顧四周。\n\n巷道兩側沒有任何可以通行的門窗。\n\n唯一的出口，便是眼前這條大路。\n\n身後追兵的腳步聲已近在咫尺。\n\n梁副官握緊手槍。\n\n「上校，我掩護您和蘇爺出去。」\n\n「不行。」\n\n魏戌俞看了一眼街道。\n\n「一起走。」\n\n蘇孟達抱著木匣，背靠磚牆，大口喘著粗氣。\n\n「魏長官，您說這面鏡子若真能讓人死而復生，咱們待會兒是不是還有機會用上一回？」\n\n魏戌俞冷冷看了他一眼。\n\n「別廢話。」\n\n他重新握緊手槍，正準備衝出巷口。\n\n忽然，街道上傳來一陣急促的喇叭聲。\n\n叭——叭叭！\n\n一輛深藍色汽車從另一條街道猛然衝了出來。\n\n原本站在路中央的幾個男人嚇了一跳，慌忙向兩側躲避。\n\n汽車歪歪斜斜地擦過路旁的石柱，車輪在濕滑的路面上劃出一道弧線。\n\n隨即以一個相當不自然的角度，猛然停在三人面前。\n\n車頭險些撞上巷口的磚牆。\n\n魏戌俞立即抬槍。\n\n梁副官也迅速戒備。\n\n然而下一刻，駕駛座的車窗被人從裡頭搖了下來。\n\n一道熟悉的女子聲音傳入三人耳中。\n\n「愣著做什麼？快上來呀！」\n\n魏戌俞一怔。\n\n梁副官愣在原地。\n\n蘇孟達抱著木匣，難以置信地瞪大了眼睛。\n\n三人不約而同地望向駕駛座。\n\n只見那位穿著淺杏色旗袍、戴著珍珠髮飾的姑娘，正雙手緊握方向盤，焦急地朝他們招呼。\n\n竟然是程家大小姐！\n\n（第九回完）"}, {"n": 10, "title": "不速之客", "body": "「愣著做什麼？快上來呀！」\n\n程小楓雙手握著方向盤，見三人仍站在原地，急得又按了兩下喇叭。\n\n魏戌俞做夢也沒想到，會在這種地方再次見到她。\n\n更沒想到，這位不久前還坐在拍賣會上吃糕點的程家大小姐，此刻竟然親自開著汽車闖了過來。\n\n砰！\n\n一聲槍響從身後傳來。\n\n子彈擊中巷口的磚牆。\n\n魏戌俞立即回過神來。\n\n「蘇爺，上車！」\n\n梁副官拉開後座車門，先將抱著木匣的蘇孟達送了進去，自己隨後坐上車。\n\n魏戌俞則迅速坐進副駕駛座。\n\n「開車！」\n\n「坐好啦！」\n\n程小楓一腳踩下油門。\n\n汽車發出一聲轟鳴，猛地向前竄了出去。\n\n蘇孟達還沒來得及關上車門，整個人便被狠狠甩向椅背。\n\n「哎喲！」\n\n梁副官眼疾手快，一把將車門拉了回來。\n\n幾乎就在同一時間，幾名持槍的男人從巷口追了出來。\n\n接連數聲槍響。\n\n汽車後方的玻璃應聲碎裂。\n\n程小楓嚇得縮了一下脖子。\n\n「他們怎麼還有槍啊！」\n\n魏戌俞立即轉頭。\n\n「妳不知道他們有槍？」\n\n「我知道你們在打架，可我沒想到打得這麼厲害呀！」\n\n「那妳還敢過來？」\n\n「總不能看著你被人打死吧！」\n\n話音剛落，前方忽然出現一根石柱。\n\n魏戌俞臉色一變。\n\n「看路！」\n\n「啊！」\n\n程小楓慌忙轉動方向盤。\n\n汽車擦著石柱駛了過去，右側車身發出一道極為刺耳的摩擦聲。\n\n蘇孟達抱著木匣，整個人撞向梁副官。\n\n「程小姐！您慢點兒！」\n\n「不能慢啊！他們還在追呢！」\n\n蘇孟達回頭望去。\n\n果然，兩輛黑色汽車已經從後方追了上來。\n\n車燈穿過夜色，將他們車內照得忽明忽暗。\n\n魏戌俞望著前方逐漸狹窄的道路。\n\n「妳會開車？」\n\n程小楓有些不服氣。\n\n「當然會！」\n\n「學了多久？」\n\n「去年就學會了。」\n\n魏戌俞稍稍放心了些。\n\n誰知她又補了一句。\n\n「不過平日都是司機開的，我自己倒沒開過幾回。」\n\n車內忽然安靜了。\n\n梁副官慢慢轉頭，望向駕駛座。\n\n蘇孟達則低頭看了看自己懷中的七星鎏金鏡。\n\n半晌，他長長地嘆了口氣。\n\n「想不到我蘇某人走南闖北這麼多年，沒死在古墓裡，也沒死在槍口下……」\n\n汽車突然向左一甩。\n\n蘇孟達又重重撞上車門。\n\n「倒有可能死於車禍！」\n\n「蘇先生！」\n\n程小楓不滿地喊道：\n\n「我好心來救你們，你怎麼還咒我呀！」\n\n「不敢，不敢！您看路！您千萬看路！」\n\n魏戌俞伸手扶住車門，一時間竟不知道該先留意後方的追兵，還是眼前這位姑娘。\n\n大小姐的駕駛技術\n汽車衝出了倉庫區。\n\n前方是一條沿河而建的長街，兩側的店鋪皆已關門，屋簷下懸掛的紅燈籠在夜風中微微晃動。\n\n程小楓回頭望了一眼。\n\n「他們還在嗎？」\n\n魏戌俞立即伸手，將她的臉轉了回去。\n\n「看前面。」\n\n「喔！」\n\n程小楓乖乖望向前方。\n\n過了片刻，她卻忽然笑了起來。\n\n魏戌俞皺眉。\n\n「妳又笑什麼？」\n\n「沒什麼！」\n\n她握緊方向盤，嘴角卻怎麼也壓不下來。\n\n方才在庫房裡，他握了她的手。\n\n如今又碰了她的臉。\n\n雖然此刻情形實在不適合高興，可一想到這些，程小楓還是忍不住心裡美滋滋的。\n\n後座的蘇孟達正抱著木匣默默祈求祖宗保佑，哪裡知道駕駛座上的姑娘，竟還有這等閒情逸致。\n\n「上校，後面的車追近了。」\n\n梁副官望著後方，神情凝重。\n\n其中一輛黑色汽車已經逼近至數丈之外，副駕駛座的男人正將手伸出窗外。\n\n魏戌俞立即壓低聲音。\n\n「小楓，低頭。」\n\n程小楓下意識縮低身子。\n\n砰！\n\n子彈擊穿車尾，打在後座上方。\n\n梁副官迅速還擊。\n\n後方那輛汽車猛然偏向一側，卻仍舊緊追不放。\n\n程小楓緊張得手心冒汗。\n\n「再往前走，便是廣安橋了！」\n\n魏戌俞問道：\n\n「橋的另一頭通往何處？」\n\n「城北的大街！不過那條路太直，他們肯定還會追上來。」\n\n「還有別的路嗎？」\n\n「有！」\n\n程小楓指著前方。\n\n「左邊有條小巷，能通到以前的布市。那兒的路七彎八拐，外地人根本弄不清楚！」\n\n魏戌俞望向那條巷子。\n\n入口處狹窄得幾乎只容得下一輛汽車，兩旁還堆放著幾只裝布匹的木箱。\n\n「妳確定能過？」\n\n「能！」\n\n程小楓信心十足。\n\n汽車隨即向左一轉。\n\n砰！\n\n車身撞飛了第一只木箱。\n\n砰！\n\n又撞飛了第二只。\n\n魏戌俞閉了閉眼睛。\n\n蘇孟達從後座探出頭來。\n\n「程小姐，您不是說能過嗎？」\n\n「這不是過了嗎？」\n\n「……」\n\n梁副官默默將身體往座椅深處挪了些。\n\n魏戌俞望著前方幾乎貼著車窗掠過的磚牆，終於忍不住開口。\n\n「要不然換我來開？」\n\n「不要！」\n\n程小楓立即拒絕。\n\n「你又不認得路！」\n\n「妳可以指路。」\n\n「來不及啦！前面還要轉彎呢！」\n\n「慢些。」\n\n「知道了！」\n\n嘴上雖然答應，汽車卻絲毫沒有減速的意思。\n\n魏戌俞只得伸手扶住車頂，任由這位大小姐帶著他們在維安城的街巷中橫衝直撞。\n\n舊布市一帶的街道建於多年前。\n\n當初為了方便商戶卸貨，各家店鋪後方都留有通往河岸的窄巷。後來店鋪愈建愈多，這些道路便逐漸交錯在一起，形成了如同迷宮般的格局。\n\n程小楓自幼便跟著家中的商隊與管事四處走動，對這一帶的道路再熟悉不過。\n\n她雖然開車的技術實在不敢恭維，認路的本事卻確實不差。\n\n汽車穿過布市，接連拐過幾個街角。\n\n後方其中一輛黑色汽車因轉彎不及，狠狠撞上了一處堆放竹竿的貨架。\n\n數十根竹竿轟然倒落，將巷道堵住了大半。\n\n另一輛車被迫停下。\n\n程小楓從後視鏡瞥見這一幕，頓時高興起來。\n\n「你看！我就說這兒能甩掉他們！」\n\n魏戌俞尚未回答，前方忽然傳來一陣犬吠。\n\n一條黃狗從路旁竄了出來。\n\n程小楓大驚。\n\n「小狗！」\n\n她猛踩煞車。\n\n整輛汽車驟然停住。\n\n蘇孟達連同木匣一起向前撲去，額頭重重撞上前座。\n\n「哎喲！」\n\n黃狗安然無恙地跑進了另一條巷子。\n\n程小楓鬆了口氣。\n\n「還好，沒撞到。」\n\n蘇孟達揉著額頭，幽幽地說道：\n\n「狗是沒撞著，人倒快撞沒了。」\n\n魏戌俞回頭看了他一眼。\n\n「蘇爺，沒事吧？」\n\n「暫時還活著。」\n\n梁副官低頭檢查了一下木匣。\n\n「鏡子也沒事。」\n\n蘇孟達瞪著他。\n\n「梁副官，您倒是先關心關心我呀！」\n\n遠處又傳來汽車引擎的聲音。\n\n程小楓立即重新發動汽車。\n\n「不好，他們又來了！」\n\n這一回，她沒有繼續往大街的方向走，而是拐入一條通往程家舊貨棧的道路。\n\n路的盡頭立著一道半開的鐵門。\n\n守門的老夥計原本正坐在屋簷下打瞌睡，突然聽見汽車聲，嚇得站了起來。\n\n「誰啊？」\n\n程小楓搖下車窗。\n\n「周伯，是我！」\n\n「小姐？」\n\n「借個路！後頭若有人來，可千萬別讓他們進來！」\n\n「啊？好、好！」\n\n老夥計尚未弄清楚發生了什麼事，便見那輛熟悉的深藍色汽車從面前歪歪斜斜地駛了過去。\n\n程小楓穿過貨棧內院，從另一端駛出。\n\n眼前豁然開朗。\n\n一條寬敞的道路沿著河岸向北延伸，遠處已能看見車站附近的燈火。\n\n身後終於安靜了下來。\n\n沒有槍聲。\n\n也沒有追趕的汽車。\n\n梁副官仔細確認過後方的情形，這才開口。\n\n「上校，應當已經甩開了。」\n\n魏戌俞長長吐出一口氣。\n\n「好。」\n\n程小楓立即轉過頭來。\n\n「我厲不厲害？」\n\n魏戌俞看著她。\n\n又看了看已經被撞得歪斜的後視鏡。\n\n最後望向後座灰頭土臉的蘇孟達。\n\n「……認路的本事倒是不錯。」\n\n程小楓一下子笑了。\n\n「那當然！我可是從小在這兒長大的！」\n\n蘇孟達癱坐在後座，將木匣抱在懷中。\n\n「程小姐，蘇某有一事相求。」\n\n「什麼事？」\n\n「待會兒到了車站，麻煩您讓我先下車。」\n\n「為什麼？」\n\n「我想跪下來，好好謝謝這片土地。」\n\n魏戌俞終於忍不住笑了出來。\n\n連梁副官也側過頭去，嘴角微微揚起。\n\n今晚的救命恩人\n汽車駛上平坦的大路後，程小楓總算放慢了速度。\n\n夜風從破碎的後窗灌入車內，吹得幾人的衣襟不住晃動。\n\n直到此刻，魏戌俞才有工夫仔細打量這輛汽車。\n\n車身兩側滿是擦痕，後方的玻璃碎了，右側車門也被撞出了一塊凹陷。\n\n一輛原本相當漂亮的洋車，如今已經看不出多少富家小姐出門的氣派。\n\n「這是妳的車？」\n\n「是啊，我爹去年送我的生日禮物。」\n\n魏戌俞望了一眼車門。\n\n「修車的費用，我來負責。」\n\n程小楓轉過頭。\n\n「不用啦！我家有專門修車的人。」\n\n「那也不能讓妳平白承擔這筆損失。」\n\n「真的不用。」\n\n她笑嘻嘻地說道：\n\n「你都欠我們家二十三萬大洋了，再多欠一點，我怕你還不起。」\n\n後座傳來蘇孟達的一聲長嘆。\n\n「程小姐，您還真會替人著想。」\n\n魏戌俞沒有理會他。\n\n「妳怎麼知道我們在倉庫區？」\n\n「你們離開商會以後，我原本想出來送你們，結果一出門，就看見蘇先生坐在地上大喊。」\n\n蘇孟達有些尷尬。\n\n「咳……當時情況緊急。」\n\n「然後我就看見你們搶了人家的汽車。」\n\n梁副官立即糾正。\n\n「程小姐，那是臨時徵用。」\n\n「有什麼不一樣嗎？」\n\n蘇孟達立刻笑出了聲。\n\n梁副官沉默了片刻，決定不再解釋。\n\n程小楓繼續說道：\n\n「我讓司機去商會找人幫忙，自己開車跟了過來。後來聽見城東有槍聲，便猜到你們大概往貨棧那一帶去了。」\n\n魏戌俞皺起眉頭。\n\n「妳一個人過來的？」\n\n「嗯。」\n\n「胡鬧。」\n\n程小楓愣了一下。\n\n魏戌俞的神情已經認真了起來。\n\n「那些人持槍行兇，根本不在乎旁人的性命。妳若是出了什麼事，妳父親怎麼辦？」\n\n她抿了抿嘴。\n\n「可是，我剛才若不過去，你們不就被困在那兒了嗎？」\n\n魏戌俞一時沒有說話。\n\n「我知道危險呀。」\n\n程小楓放輕了聲音。\n\n「所以我也沒傻到下車跟他們打架。我只是想，既然我比你們熟悉維安城，說不定能幫上一點忙。」\n\n她頓了頓，又偷偷瞥了他一眼。\n\n「再說了，我才剛認識你，總不能第一天就跟你永別吧？」\n\n魏戌俞望著她的側臉。\n\n這姑娘雖然有些任性，膽子也大得出奇，方才的行動卻並非全無考量。\n\n若非她及時出現，他們想從那條巷道裡全身而退，確實要費上一番工夫。\n\n過了片刻，他的語氣緩和了些。\n\n「今日多虧了妳。」\n\n程小楓的眼睛立刻亮了起來。\n\n「真的？」\n\n「嗯。」\n\n「那我是不是幫了你一個很大的忙？」\n\n「是。」\n\n「那你是不是欠我一個人情？」\n\n魏戌俞看向她。\n\n姑娘方才還有些委屈的神情早已消失，此刻眉眼間全是藏不住的笑意。\n\n他忽然有種自己走進了圈套的感覺。\n\n「妳想要什麼？」\n\n程小楓想也沒想。\n\n「以身相許呀！」\n\n後座傳來一陣劇烈的咳嗽聲。\n\n蘇孟達咳得滿臉通紅，梁副官連忙伸手拍了拍他的背。\n\n魏戌俞沉默了好一會兒。\n\n「換一個。」\n\n「為什麼？」\n\n「沒有這種謝法。」\n\n「怎麼沒有？戲文裡都是這麼寫的！」\n\n「少看些戲文。」\n\n程小楓鼓了鼓臉頰。\n\n「小氣。」\n\n魏戌俞無奈地搖了搖頭。\n\n這姑娘究竟知不知道，方才他們差點連性命都丟了？\n\n然而不知怎的，經她這麼一鬧，原先籠罩在車內的緊張氣氛，倒也消散了不少。\n\n一張不該出現的臉\n汽車距離車站已經不遠。\n\n魏戌俞想起三人的行李還留在飯店，便請程小楓先將他們送回飯店一趟。\n\n程小楓自然一口答應。\n\n經過一處路口時，汽車恰好停在一盞昏黃的路燈下。\n\n蘇孟達將懷中的木匣放在膝上。\n\n從方才奪回鏡子之後，他始終沒能靜下心來仔細檢查。如今總算脫離危險，便又忍不住解開了銅扣。\n\n「魏長官，我再瞧瞧這寶貝。方才那一通折騰，可別把裡頭的機關給震壞了。」\n\n魏戌俞轉過身。\n\n「小心些。」\n\n蘇孟達掀開匣蓋，借著車窗外的燈光，仔細觀察鏡背的紋路。\n\n七顆星辰依舊嵌在凹槽之中，兩側白玉亦無裂痕。\n\n他滿意地點了點頭。\n\n「好東西就是好東西，折騰成這樣，居然連道刮痕都沒有。」\n\n梁副官也低頭望了一眼。\n\n「蘇爺，您看這兒。」\n\n他指向其中一枚水滴形的白玉。\n\n玉石內部原先只有幾縷極淡的青色紋路，此刻其中一縷卻顯得格外深沉，宛如一絲凝固於玉中的墨跡。\n\n蘇孟達皺起眉頭。\n\n「奇怪。」\n\n他將古鏡稍稍抬高。\n\n那縷墨色竟然在白玉之中緩慢移動。\n\n像是一條細小的活物。\n\n梁副官也看見了。\n\n「上校，玉裡的東西在動。」\n\n魏戌俞伸手接過古鏡。\n\n他仔細查看了片刻，又將鏡面轉向車窗。\n\n鏡中映出了汽車的座椅、破碎的玻璃，以及街道兩旁的燈火。\n\n依舊沒有任何活人的倒影。\n\n然而就在汽車重新開動的一瞬間，鏡面深處忽然掠過一張人臉。\n\n魏戌俞猛地將鏡子轉了回去。\n\n那張臉又出現了。\n\n一個男人。\n\n他坐在另一輛汽車的後座，身上穿著灰色長衫，額頭上有一道極深的傷口。\n\n雙眼緊閉。\n\n嘴唇發紫。\n\n頭部隨著車身顛簸無力地晃動著。\n\n魏戌俞抬起頭。\n\n他們身後的街道空無一車。\n\n那人卻確確實實出現在古鏡之中。\n\n「蘇爺，你看看。」\n\n蘇孟達湊了過來。\n\n待看清鏡中的景象，他的神情也變得凝重。\n\n「這人……怕是已經死了。」\n\n梁副官問道：\n\n「是方才追咱們的人嗎？」\n\n「不像。」\n\n魏戌俞緩緩移動鏡身。\n\n男人的身旁還坐著另一個人。\n\n只不過那人的面孔被黑暗遮去，僅能看見一隻搭在膝上的手。\n\n而在兩人腳邊，似乎還放著一件方方正正的東西。\n\n一只黑色皮箱。\n\n魏戌俞的目光頓時停住。\n\n「副官，方才錢世豪進入拍賣會時，他的手下是不是也提著一只黑色皮箱？」\n\n梁副官想了想。\n\n「是。大小與這只相近。」\n\n蘇孟達低聲道：\n\n「莫非是同一件東西？」\n\n就在三人凝神觀察之際，鏡中的死者忽然睜開了眼睛。\n\n那雙眼睛裡沒有瞳仁。\n\n只有一片渾濁的灰白。\n\n他慢慢轉過頭。\n\n隔著鏡面，直勾勾地望向魏戌俞。\n\n嘴角緩緩向兩側拉開。\n\n魏戌俞立即將古鏡扣回木匣。\n\n喀。\n\n銅扣合上了。\n\n蘇孟達半晌沒有說話。\n\n梁副官則望向身後的道路，確認並無其他汽車跟隨。\n\n「你們在做什麼呀？」\n\n程小楓忽然問道。\n\n三人同時抬起頭。\n\n她正透過後視鏡好奇地望著他們。\n\n魏戌俞將木匣交還給蘇孟達。\n\n「沒什麼，確認鏡子有沒有損壞。」\n\n「沒有吧？」\n\n「沒有。」\n\n「那就好！」\n\n程小楓重新望向前方。\n\n蘇孟達將木匣緊緊抱在懷裡，向魏戌俞使了個眼色。\n\n魏戌俞微微搖頭。\n\n此事還不宜在程小楓面前談論。\n\n不過他心中已經多了一個疑問。\n\n倘若方才鏡中所見的並非幻象，那個與黑色皮箱待在一起的死人，究竟身在何處？\n\n我早就知道了\n汽車在飯店門前停了下來。\n\n梁副官與蘇孟達先行下車，迅速取回三人的行李，又留下聯絡資料，請飯店掌櫃代為尋找方才被徵用汽車的車主，安排後續賠償。\n\n等兩人重新回到車上，距離北上的末班列車已不足一個鐘頭。\n\n程小楓將三人送往車站。\n\n此時的維安城車站依舊亮著燈，幾名提著行李的旅客匆匆穿過大門，售票處前還排著一列短短的隊伍。\n\n汽車終於穩穩停住。\n\n蘇孟達迫不及待地推開車門。\n\n雙腳踩上地面的一瞬間，他幾乎感動得熱淚盈眶。\n\n「總算到了！」\n\n程小楓從駕駛座探出頭。\n\n「蘇先生，我開得還可以吧？」\n\n蘇孟達望著那輛傷痕累累的汽車，又摸了摸自己的額頭。\n\n「程小姐，您救命之恩，蘇某銘記於心。」\n\n「那下次我再開車載你！」\n\n蘇孟達的笑容頓時僵住了。\n\n「下次……咱們還是坐火車吧。」\n\n梁副官提起行李。\n\n「蘇爺，走了。」\n\n兩人先行進入候車室。\n\n魏戌俞則留在汽車旁，等程小楓從駕駛座下來。\n\n她整理了一下有些凌亂的頭髮，又拍了拍旗袍上的灰塵，這才走到他面前。\n\n「好了，送到啦！」\n\n魏戌俞望著她。\n\n經過方才那番折騰，她的珍珠髮飾已經歪到了一旁，原本整齊的披肩也皺成一團。\n\n與拍賣會上那位衣著精緻的程家小姐相比，多少有些狼狽。\n\n可她看上去依舊十分高興。\n\n「程小姐。」\n\n「嗯？」\n\n「今日多謝妳相助。」\n\n「你又來了。」\n\n她笑著數起手指。\n\n「庫房謝一次，拍賣會謝一次，拿到鏡子謝一次，方才又謝一次。你今晚究竟要跟我說多少次謝謝呀？」\n\n魏戌俞也笑了一下。\n\n「有件事情，我應當向妳說清楚。」\n\n「什麼事？」\n\n他收起笑意，神情認真。\n\n「我並非錢世豪。」\n\n程小楓望著他，沒有立即開口。\n\n魏戌俞繼續道：\n\n「那張請帖，是我在南下的火車上從真正的錢世豪手中贏來的。我冒用他的身分，只是為了取得七星鎏金鏡，事前並不知道錢家與程家另有相親的安排。」\n\n「今日讓妳與令尊產生誤會，是我的過失。待北城的事情處理妥當，我必定親自登府道歉。」\n\n他原本以為，程小楓聽完這番話，即便不生氣，也難免會有所失望。\n\n誰知眼前的姑娘只眨了眨眼睛。\n\n「說完啦？」\n\n魏戌俞有些意外。\n\n「嗯。」\n\n「我早就知道了呀！」\n\n「……」\n\n魏戌俞望著她。\n\n「妳知道？」\n\n「當然！」\n\n程小楓雙手背在身後，繞著他走了半圈。\n\n「我從前便聽人說，錢世豪長得粗獷，脾氣也不好，整日跟碼頭上的那些人混在一起。」\n\n她停在他面前，伸手指了指他那張臉。\n\n「你長成這樣，哪裡像了？」\n\n魏戌俞忍不住問道：\n\n「那妳在庫房為何還相信我？」\n\n「我又沒說我完全相信。」\n\n程小楓理直氣壯地說道：\n\n「你拿著真的請帖，又一本正經地說自己是錢世豪，我自然得看看你究竟想做什麼。」\n\n「後來那個真正的錢世豪闖進來，一開口便大吵大鬧，倒跟我聽說的一模一樣。」\n\n魏戌俞若有所思。\n\n「所以妳早就猜到了。」\n\n「嗯！」\n\n「那妳還當著那麼多人的面，稱他為冒牌貨？」\n\n程小楓皺了皺鼻子。\n\n「誰讓他打你？」\n\n魏戌俞一怔。\n\n她接著說道：\n\n「再說，他差點砸壞我們家的古物。就算他真是錢世豪，我也照樣把他轟出去。」\n\n說到這兒，她又露出了笑容。\n\n「我爹是讓我找夫君，又不是讓我找個回家受氣的人。難不成他姓錢，我便非得嫁給他不可？」\n\n魏戌俞聽完，倒也覺得有幾分道理。\n\n「程小姐能這麼想，自然是好事。」\n\n「是吧！」\n\n程小楓十分得意。\n\n「所以你根本不必向我道歉。」\n\n她往前走了一步，抬起頭。\n\n「不過，你得告訴我一件事。」\n\n「請說。」\n\n「你到底叫什麼名字？」\n\n這回魏戌俞沒有再隱瞞。\n\n「魏戌俞。」\n\n「哪三個字？」\n\n「魏國的魏，十二地支的戌，俞允的俞。」\n\n程小楓伸出手指，在自己的掌心慢慢寫了一遍。\n\n「魏、戌、俞。」\n\n她念了兩遍，又仰起臉來。\n\n「真好聽。」\n\n魏戌俞失笑。\n\n「名字也有好不好聽之分？」\n\n「當然有！」\n\n她一本正經地說道：\n\n「你的名字就比錢世豪好聽多了。」\n\n魏戌俞搖了搖頭。\n\n這姑娘挑人的標準，還真是毫不含糊。\n\n「那你是做什麼的？」\n\n「軍人。」\n\n「軍人？」\n\n程小楓想起方才梁副官與蘇孟達對他的稱呼。\n\n「難怪他們一直叫你上校、魏長官！」\n\n她忽然興奮起來。\n\n「所以你真的是軍官？」\n\n「嗯。」\n\n「那你穿軍裝一定更好看！」\n\n「……」\n\n魏戌俞原以為她會好奇自己在軍中擔任何種職務。\n\n沒想到她最先想到的竟是這個。\n\n他看了一眼車站上方的掛鐘。\n\n「時候不早了，妳也該回去了。」\n\n程小楓卻沒有立即離開。\n\n「那我們什麼時候還能見面？」\n\n「有機會的話，自然會再見。」\n\n「什麼叫有機會？」\n\n「便是有空的時候。」\n\n「那你什麼時候有空？」\n\n魏戌俞望著她。\n\n這姑娘似乎總能從他用來結束話題的句子中，再找出一個新的問題。\n\n「程小姐。」\n\n「嗯？」\n\n「妳我才相識一日。」\n\n「我知道呀。」\n\n「妳不必把心思放在我身上。」\n\n程小楓微微一愣。\n\n隨後，她揚起下巴。\n\n「那可不行。」\n\n魏戌俞皺眉。\n\n「為何？」\n\n她笑得十分坦蕩。\n\n「因為我喜歡你啊。」\n\n車站前的喧鬧聲彷彿在這一瞬間遠去了些。\n\n魏戌俞望著面前這位毫不掩飾心意的姑娘，竟一時間不知該如何回答。\n\n她沒有害羞地低下頭，也沒有故作矜持。\n\n就這麼大大方方地望著他。\n\n彷彿喜歡一個人，本來就是一件值得高興的事情。\n\n過了片刻，魏戌俞才無奈地開口。\n\n「妳倒是直率。」\n\n「那當然！」\n\n程小楓笑了起來。\n\n「我若不說，你怎麼會知道呢？」\n\n魏戌俞沉默良久。\n\n最終，他只是輕輕搖了搖頭。\n\n「早些回家吧，路上小心。」\n\n出乎意料的是，程小楓這回竟沒有再繼續追問。\n\n「好呀。」\n\n她答應得十分爽快，還主動往後退了兩步。\n\n「那你也要保重喔！」\n\n魏戌俞微微頷首。\n\n「告辭。」\n\n「再見！」\n\n程小楓笑著朝他揮了揮手。\n\n魏戌俞轉身走進車站。\n\n直到他的身影消失在人群之中，程小楓才慢慢放下手。\n\n臉上的笑容卻絲毫未減。\n\n「魏戌俞……」\n\n她又念了一遍這個名字。\n\n隨即轉頭望向車站上方的時刻表。\n\n距離北上的列車發車，還有二十多分鐘。\n\n足夠了。\n\n程家的催債人\n程家商會向來有不少貨物經由鐵路運送，因此在維安城車站附近，也設有一處專門負責聯絡運輸事宜的小辦事處。\n\n程小楓快步走了進去。\n\n值夜的管事一見是她，連忙站起身。\n\n「小姐？這麼晚了，您怎麼過來了？」\n\n「正好，你幫我辦幾件事。」\n\n她從皮包中取出錢，又向管事借了紙筆。\n\n「替我買一張北上的頭等車票，再找個人把我的汽車開回家。車子有些地方撞壞了，記得讓人修一修。」\n\n管事愣住了。\n\n「北上的車票？」\n\n「對，今晚這一班。」\n\n「小姐，您要去北城？」\n\n「嗯，辦點生意上的事。」\n\n程小楓低下頭，飛快地寫起信來。\n\n管事望著她，有些不知所措。\n\n「老爺知道嗎？」\n\n「等他看完這封信就知道了。」\n\n「這……」\n\n程小楓將信紙折好，塞進信封。\n\n「商會今晚有筆二十三萬大洋的款項尚未收回，對方人在北城。我親自過去查驗抵押品，順便看看咱們在北邊的生意有沒有發展的機會，有什麼問題嗎？」\n\n管事張了張嘴。\n\n這番話聽起來倒是無懈可擊。\n\n可他總覺得，大小姐這副興高采烈的模樣，實在不像是要出遠門討債。\n\n「那您的行李呢？」\n\n程小楓想了想。\n\n方才出來得匆忙，除了身上的皮包，確實沒帶什麼東西。\n\n不過這有什麼要緊的？\n\n到了北城再買便是。\n\n「先替我找只小皮箱，裝些路上用得到的東西。其他的不用管。」\n\n「是……」\n\n管事終究拗不過她，只得依言去辦。\n\n不一會兒，車站內便響起了催促旅客登車的鈴聲。\n\n程小楓接過車票與小皮箱，滿意地點了點頭。\n\n「信記得交給我爹！」\n\n「小姐，您預計什麼時候回來？」\n\n她已經走到了門口。\n\n聽見這話，又回頭想了一下。\n\n「等生意辦妥了再說吧！」\n\n管事眼睜睜看著她提著皮箱跑進車站。\n\n低頭望向桌上那封信。\n\n他忽然有些不敢想像，老爺明早看見這封信時會是什麼表情。\n\n多了一位乘客\n深夜，北上的列車緩緩駛離維安城車站。\n\n車輪碾過鐵軌，發出有節奏的聲響。\n\n頭等客車的包廂內，蘇孟達整個人癱倒在柔軟的座椅上，閉著眼睛，長長地舒了一口氣。\n\n「舒服。」\n\n梁副官將行李放妥，又確認包廂的門窗皆已關好。\n\n七星鎏金鏡被單獨安置在桌旁，外頭另外裹了一層厚實的布料。\n\n魏戌俞靠著椅背，閉目養神。\n\n忙碌了整整一晚，他的左肩仍隱隱作痛，手臂上的傷口也因方才的打鬥重新滲了些血。\n\n梁副官將藥箱放到桌上。\n\n「上校，回到北城後，還是請軍醫替您仔細看看肩膀。」\n\n魏戌俞微微頷首。\n\n「好。」\n\n蘇孟達睜開一隻眼睛。\n\n「魏長官。」\n\n「嗯？」\n\n「咱們此番南下，算不算滿載而歸？」\n\n魏戌俞看向他。\n\n「你想說什麼？」\n\n蘇孟達掰著手指。\n\n「一面三十一萬大洋的鏡子，一輛撞壞的汽車，滿街的橘子、木箱、竹籃……」\n\n他轉頭望向梁副官。\n\n「還有程小姐那輛車，您說得修多少錢？」\n\n梁副官平靜地回答：\n\n「蘇爺，您若有空，不妨回北城慢慢算。」\n\n「我這不是替咱們魏長官心疼嗎？」\n\n蘇孟達嘆了口氣。\n\n「好在鏡子總算拿到了，程小姐也平安回家了。今晚最大的兩件麻煩，總算都解決了。」\n\n魏戌俞睜開眼睛。\n\n「兩件？」\n\n蘇孟達笑了笑。\n\n「一面鏡子，一門親事嘛！」\n\n魏戌俞懶得理他，重新閉上眼睛。\n\n說來也奇怪。\n\n與程小楓分別時，他原本已經做好了被她再纏上好一會兒的準備。\n\n可那姑娘最後竟答應得如此乾脆。\n\n倒不像她今晚一貫的作風。\n\n不過既然人已經送回去了，他也無須再操心。\n\n就在此時。\n\n叩、叩。\n\n包廂門被人輕輕敲了兩下。\n\n梁副官立即站起身。\n\n「哪位？」\n\n門外沒有回答。\n\n又響了兩聲。\n\n叩、叩。\n\n蘇孟達猛然睜開眼睛，下意識望向那只裝著古鏡的木匣。\n\n「不會吧？」\n\n魏戌俞也坐直了身子。\n\n這幾日遇上的怪事實在太多，三人如今一聽見來歷不明的敲門聲，多少都有些警覺。\n\n梁副官將手伸向腰間，另一隻手慢慢拉開包廂門。\n\n然而門一打開。\n\n他整個人便愣住了。\n\n「……程小姐？」\n\n魏戌俞猛然抬頭。\n\n蘇孟達從座椅上彈了起來。\n\n「誰？」\n\n只見程小楓提著一只小皮箱，站在包廂外，笑盈盈地朝三人揮手。\n\n「晚上好！」\n\n包廂內安靜得出奇。\n\n魏戌俞望著她，半晌沒有說話。\n\n他甚至轉頭看了一眼窗外，確認火車確實已經開動。\n\n「妳怎麼在這裡？」\n\n「坐火車呀！」\n\n程小楓將手中的車票晃了晃。\n\n隨後，她十分自然地走進包廂，將小皮箱放在一旁，又在魏戌俞身旁的空位坐了下來。\n\n「還好我趕上了！」\n\n她拍了拍胸口。\n\n「方才差點來不及買票呢。」\n\n魏戌俞盯著她。\n\n「妳要去哪裡？」\n\n「北城。」\n\n「去北城做什麼？」\n\n程小楓立即坐直身子。\n\n她從皮包裡取出一份單據，仔細攤平，又將紙張擺得端端正正。\n\n「魏先生，您是不是忘了一件事情？」\n\n魏戌俞低頭望去。\n\n正是今晚拍賣會的成交單據副本。\n\n上頭清楚地記載著總價三十一萬大洋、已付八萬，以及剩餘的二十三萬款項。\n\n「按照今晚商定的條件，我們程家有權派人前往北城，清點您的古物及產業，核實抵押品，並負責催收餘款。」\n\n她笑著指了指自己。\n\n「而我，便是程家負責這筆生意的人。」\n\n蘇孟達張大了嘴巴。\n\n梁副官望著桌上的單據，一時間也不知該說什麼。\n\n魏戌俞揉了揉眉心。\n\n「程家沒有其他管事了？」\n\n「有啊。」\n\n「那為何偏偏是妳？」\n\n「二十三萬大洋可不是小數目。」\n\n程小楓一本正經地說道：\n\n「我親自去，才放心。」\n\n蘇孟達立即低頭喝茶。\n\n這姑娘說起話來，倒是比他這個做了多年古物買賣的人還有道理。\n\n魏戌俞繼續問道：\n\n「妳父親知道嗎？」\n\n「我留了信給他。」\n\n「他答應妳去了？」\n\n「信寫得很清楚，他看完就會明白的。」\n\n魏戌俞望著她。\n\n「也就是說，他現在還不知道。」\n\n程小楓心虛地移開了目光。\n\n「反正明早就知道了嘛。」\n\n「……」\n\n魏戌俞沉默片刻。\n\n他望向梁副官。\n\n「副官，下一站還有返回維安城的車嗎？」\n\n程小楓立即轉過頭。\n\n「你要做什麼？」\n\n「送妳回去。」\n\n「我不要！」\n\n她猛地抱住自己的皮箱。\n\n「我是去談生意的，又不是偷偷跑出去玩！」\n\n魏戌俞皺眉。\n\n「北城不是維安城，妳人生地不熟的。」\n\n「不是還有你嗎？」\n\n「我平日軍務繁忙，沒有工夫照顧妳。」\n\n「我可以自己照顧自己呀。」\n\n「我住的地方也不方便接待妳。」\n\n「那我住飯店。」\n\n「……」\n\n魏戌俞忽然發現，自己似乎說不過她。\n\n梁副官適時開口。\n\n「上校，下一站是個小站，夜間應當沒有南下的列車。若讓程小姐獨自留在那裡，恐怕也不妥當。」\n\n魏戌俞長長吐出一口氣。\n\n事已至此，總不能真將這姑娘丟在半路。\n\n他重新望向程小楓。\n\n「妳打算在北城待多久？」\n\n程小楓故作認真地想了想。\n\n「那要看你什麼時候能把錢還清了。」\n\n魏戌俞神情一頓。\n\n「這筆錢，我會盡快籌齊。」\n\n「不用急！」\n\n她連忙擺手。\n\n話說出口，似乎又覺得自己身為催債人，這般態度有些不妥，於是趕緊補了一句。\n\n「我們程家做生意向來很有信用，也很體諒客人。你慢慢還便是。」\n\n蘇孟達終於忍不住轉過身去。\n\n肩膀不住顫抖。\n\n魏戌俞看了他一眼。\n\n「蘇爺。」\n\n「在。」\n\n「有話就說。」\n\n蘇孟達努力忍住笑意。\n\n「沒有，我就是頭一回見到這麼不希望人家還錢的債主。」\n\n程小楓也忍不住笑了起來。\n\n魏戌俞伸手抵住額頭。\n\n他原以為將自己的身分說清楚，那門荒唐的親事自然便會作罷。\n\n現在看來，事情非但沒有解決，反倒變得更加麻煩了。\n\n列車繼續向北行駛。\n\n程小楓心滿意足地坐在魏戌俞身旁，望著窗外不斷向後退去的燈火。\n\n過了一會兒，她忽然想起方才在汽車上的事情。\n\n「對了！」\n\n魏戌俞睜開眼睛。\n\n「又怎麼了？」\n\n「你剛才是不是叫我小楓了？」\n\n「什麼？」\n\n「就是開車的時候呀！你讓我低頭，叫的是小楓！」\n\n魏戌俞回想了一下。\n\n當時情形緊急，他哪裡還記得自己叫了她什麼？\n\n「順口罷了。」\n\n「那你再叫一次！」\n\n「不叫。」\n\n「為什麼？」\n\n「沒有為什麼。」\n\n程小楓往他身旁挪了一點。\n\n「叫嘛！」\n\n魏戌俞看著她。\n\n「程小姐，坐好。」\n\n她有些失望地靠回椅背。\n\n不過沒過多久，又重新笑了起來。\n\n「好吧，反正往後有的是機會。」\n\n她打開小皮箱，取出管事替她準備的桂花糕。\n\n先分給蘇孟達與梁副官，又將最大的一塊遞到魏戌俞面前。\n\n「夫君，吃糕。」\n\n魏戌俞的眼皮猛然跳了一下。\n\n「別這麼叫我。」\n\n「那你叫我小楓。」\n\n「不叫。」\n\n「那我就叫你夫君。」\n\n「……」\n\n蘇孟達終於笑出了聲。\n\n「魏長官，您還是從了吧！」\n\n魏戌俞轉過頭。\n\n「蘇爺。」\n\n「哎！」\n\n「吃你的糕。」\n\n蘇孟達立即將桂花糕塞進嘴裡。\n\n梁副官則端起茶杯，默默望向窗外。\n\n他跟隨魏戌俞多年，見過無數人在上校面前戰戰兢兢，唯恐自己哪句話說錯了。\n\n可像程小姐這般不但半點不怕他，還能讓他屢屢無話可說的人……\n\n倒確實是頭一個。\n\n最後一節車廂\n夜色愈深。\n\n列車上的大部分旅客已經入睡。\n\n走廊裡只剩下幾盞昏黃的電燈，隨著車身微微晃動。\n\n距離魏戌俞等人的包廂數節車廂之外，一名列車侍者正提著熱水壺，沿走廊緩緩向前。\n\n經過其中一間包廂時，他忽然聽見裡頭傳來一聲怒罵。\n\n「連一面鏡子都拿不到！我要你們有什麼用？」\n\n侍者停了一下。\n\n包廂內又傳來一陣低聲的勸說。\n\n「少爺，您消消氣。咱們不是已經打聽到那幾個人要回北城了嗎？」\n\n「哼！等到了北城，我非讓他知道得罪錢家的下場不可！」\n\n侍者搖了搖頭，繼續往前走。\n\n包廂內。\n\n錢世豪陰沉著臉坐在椅子上。\n\n他的衣裳尚未來得及更換，嘴角還留著在拍賣會上受傷的痕跡。\n\n幾名隨從坐在對面，個個噤若寒蟬。\n\n今晚他們在程家商會丟盡了臉，又未能完成那位先生交代的事情，哪裡還敢多說半句。\n\n「那只箱子呢？」\n\n錢世豪忽然問道。\n\n其中一名隨從指了指座椅下方。\n\n「少爺，在這兒。」\n\n那只黑色皮箱靜靜地擱在地上。\n\n自從阿福失蹤以後，箱子便再也沒有發出過奇怪的聲音。\n\n錢世豪原本還以為，先前那些動靜不過是自己旅途勞累，聽錯了罷了。\n\n然而就在他準備閉目休息之時。\n\n喀。\n\n座椅下方忽然響了一聲。\n\n錢世豪猛地睜開眼睛。\n\n幾名隨從也不約而同地低下頭。\n\n喀、喀。\n\n黑色皮箱微微震動起來。\n\n「少爺……」\n\n一名隨從的臉色漸漸發白。\n\n「這箱子怎麼又響了？」\n\n「閉嘴！」\n\n錢世豪死死盯著那只箱子。\n\n他想起那位先生的叮囑。\n\n在取得七星鎏金鏡以前，無論箱中傳出什麼聲音，都不准將它打開。\n\n可這一次，從皮箱內傳出的，卻不再是指甲撥弄銅鎖的響動。\n\n而是一陣低低的哭聲。\n\n「少爺……」\n\n錢世豪渾身一僵。\n\n那聲音，他再熟悉不過。\n\n對面的幾名隨從也變了臉色。\n\n其中一人顫抖著嘴唇。\n\n「這、這不是阿福的聲音嗎？」\n\n皮箱內的哭聲逐漸清晰。\n\n「少爺……」\n\n「裡頭好冷……」\n\n「您讓我出去吧……」\n\n錢世豪嚇得連連往後縮去。\n\n然而下一刻，哭聲忽然停了。\n\n取而代之的，是一聲極為清脆的金屬碰撞聲。\n\n喀嚓。\n\n皮箱左側的銅扣，自行彈開了。\n\n（第十回完）"}, {"n": 11, "title": "夜半鬼箱", "body": "喀嚓。\n\n黑色皮箱左側的銅扣，自行彈開了。\n\n錢世豪猛然從座椅上站了起來。\n\n「誰？！」\n\n包廂內的幾名隨從面面相覷，誰也不敢答話。\n\n那只黑色皮箱依舊靜靜地擱在座椅下方。\n\n另一側的銅扣尚未鬆脫，箱蓋卻已經微微向上鼓起，彷彿有什麼東西正從裡頭用力推擠。\n\n「少爺……」\n\n微弱的哭聲再次傳來。\n\n「您讓我出去吧……」\n\n錢世豪的臉色變得極為難看。\n\n那確確實實是阿福的聲音。\n\n他跟了自己整整七年，平日說話時總帶著一點南方口音，錢世豪絕不可能認錯。\n\n可阿福分明早就失蹤了。\n\n更何況，這皮箱不過兩尺來長，怎麼可能裝得下一個成年男人？\n\n「少爺，要不咱們把箱子扔下火車吧？」\n\n其中一名隨從顫聲說道。\n\n「扔了？」\n\n錢世豪一瞪眼。\n\n「那位先生交代的東西，你敢扔？」\n\n隨從立即閉上了嘴。\n\n就在此時，箱中的哭聲忽然變得急促起來。\n\n「少爺！快開門！」\n\n「他們來了！」\n\n「少爺！救我！」\n\n砰！\n\n箱蓋猛然向上一震。\n\n幾人嚇得同時向後退去。\n\n緊接著，從箱蓋的縫隙中，緩緩滲出了一股漆黑的液體。\n\n那液體黏稠得如同墨汁，沿著皮箱的邊緣滴落在地毯上，散發出一股極為濃烈的腐臭味。\n\n錢世豪捂住鼻子。\n\n「怎麼這麼臭？」\n\n一名隨從低頭望去。\n\n只見那股黑色液體之中，似乎還混著幾根細長的頭髮。\n\n他頓時打了個寒顫。\n\n「少爺，這裡頭到底裝了什麼？」\n\n錢世豪沒有回答。\n\n那位先生將皮箱交給他時，確實曾讓他看過裡頭的東西。\n\n不過是一塊從古墓裡取出的石板，外加幾件古怪的銅器罷了。\n\n當時的箱子雖然有些沉重，卻也沒有其他異常。\n\n怎麼如今竟變成了這副模樣？\n\n錢世豪愈想愈覺得不對。\n\n他伸手指向其中一名隨從。\n\n「你，去把箱子打開。」\n\n「我？」\n\n那人嚇得連連搖頭。\n\n「少爺，先生不是說過，不許咱們擅自開箱嗎？」\n\n「讓你開就開！哪來那麼多廢話？」\n\n隨從無可奈何，只得從座椅旁取來手電筒，戰戰兢兢地蹲到了皮箱前。\n\n他伸出手，慢慢解開了另一側的銅扣。\n\n喀嚓。\n\n箱中的哭聲戛然而止。\n\n整間包廂陷入一片死寂。\n\n隨從吞了口唾沫。\n\n隨即，緩緩掀起箱蓋。\n\n***\n\n## 箱中石階\n\n箱子裡什麼也沒有。\n\n不。\n\n並非什麼也沒有。\n\n而是黑得根本看不見底。\n\n隨從舉起手電筒，朝箱中照了進去。\n\n光束落下。\n\n他整個人忽然僵住了。\n\n「少、少爺……」\n\n錢世豪有些不耐煩。\n\n「又怎麼了？」\n\n隨從沒有回頭。\n\n只是慢慢將手電筒往前伸了些。\n\n「這裡頭……有條路。」\n\n錢世豪皺起眉頭。\n\n「什麼路？」\n\n他走上前，一把奪過手電筒，朝箱中照去。\n\n下一刻，他也愣住了。\n\n皮箱內原本應當鋪著深色絨布的底部，此刻竟變成了一道向下延伸的石階。\n\n石階由青灰色的石磚砌成，兩側石壁濕漉漉的，長滿了深綠色的苔蘚。\n\n每隔數級台階，石壁上便會出現一盞早已熄滅的青銅油燈。\n\n手電筒的光芒一路向下。\n\n照出了十幾級台階。\n\n再往深處，便是一片無法看透的黑暗。\n\n錢世豪下意識將手電筒收了回來。\n\n他望向皮箱的外側。\n\n從外頭看去，那依然是一只再尋常不過的皮箱，高度甚至還不到自己的膝蓋。\n\n然而再往裡看，那些石階卻足足延伸了數丈之遠。\n\n「這……」\n\n錢世豪只覺得後背一陣發涼。\n\n「這是什麼鬼東西？」\n\n幾名隨從誰也沒有出聲。\n\n就在此時，石階深處忽然傳來一聲輕響。\n\n啪嗒。\n\n像是有人赤著腳，踩在潮濕的石磚上。\n\n啪嗒。\n\n又是一聲。\n\n錢世豪屏住呼吸。\n\n那聲音正從石階深處逐漸靠近。\n\n一下。\n\n又一下。\n\n不過片刻，手電筒的光芒盡頭，便出現了一隻手。\n\n那隻手搭在石階邊緣。\n\n手背上沾滿黑泥，五根手指瘦得幾乎只剩下骨頭。\n\n緊接著，又是一隻手。\n\n第三隻。\n\n第四隻。\n\n錢世豪的瞳孔猛然收縮。\n\n那東西並不是走上來的。\n\n它正沿著兩側石壁，一點一點地爬上來。\n\n「阿福？」\n\n一名隨從忽然失聲叫道。\n\n石階深處，一張熟悉的臉緩緩抬了起來。\n\n正是阿福。\n\n他的面色慘白，雙眼浮腫，額頭上還有一道極深的傷口，臉頰上沾著些許黑色泥水。\n\n見到上方的幾人，那張臉竟露出了喜悅的神情。\n\n「少爺！」\n\n「總算找到您了！」\n\n錢世豪向後退了一步。\n\n「你……你怎麼在裡頭？」\n\n「少爺，拉我一把！」\n\n阿福朝上方伸出手。\n\n然而當他的肩膀逐漸暴露在光線下時，幾名隨從的臉色瞬間變了。\n\n那根本不是人的身體。\n\n阿福的頭顱下方，連接著一具細長而扭曲的軀幹。\n\n他的四肢像是被強行折斷後重新拼接，數條蒼白的手臂從軀幹兩側伸出，死死扣住石壁。\n\n更深處，似乎還拖著半截其他人的身體。\n\n那些手臂不停交替攀爬。\n\n阿福的臉卻始終仰著，笑容愈來愈大。\n\n「少爺！」\n\n「我上來啦！」\n\n錢世豪終於忍不住了。\n\n「關上！快給我關上！」\n\n蹲在箱前的隨從慌忙伸手去拉箱蓋。\n\n然而就在箱蓋即將合上的一瞬間，一隻蒼白的手猛然從裡頭伸出，死死扣住了箱沿。\n\n砰！\n\n箱蓋被重重頂開。\n\n隨從嚇得跌坐在地。\n\n「鬼啊！」\n\n更多的手臂從箱中伸了出來。\n\n它們抓住地毯、桌腳與座椅，彷彿要將那具龐大的身體從狹小的箱口硬生生拖出來。\n\n錢世豪抄起桌上的茶壺，狠狠砸了過去。\n\n「滾開！」\n\n茶壺摔得粉碎。\n\n箱中的東西卻忽然停止了動作。\n\n阿福的頭顱慢慢從箱口升起。\n\n那雙眼睛直勾勾地望著錢世豪。\n\n「少爺……」\n\n他的笑容消失了。\n\n「您為什麼要把我丟下？」\n\n錢世豪渾身一顫。\n\n下一刻，那東西猛然撲了出來。\n\n「跑！」\n\n錢世豪連自己的行李都顧不上了，一把拉開包廂門，跌跌撞撞地衝進走廊。\n\n幾名隨從爭先恐後地跟了出去。\n\n最後一人剛踏出包廂，身後便傳來一聲令人毛骨悚然的尖叫。\n\n「少爺！」\n\n他不敢回頭。\n\n也不敢停下腳步。\n\n直到幾人的身影消失在車廂另一端，那間包廂的門才緩緩晃動了一下。\n\n一隻沾滿黑水的手，從門後伸了出來。\n\n扣住門框。\n\n緊接著，是第二隻。\n\n第三隻。\n\n***\n\n## 深夜的尖叫\n\n此時，魏戌俞等人的包廂內。\n\n程小楓正興致勃勃地向蘇孟達打聽北城的事情。\n\n「那北城有沒有賣桂花糖的地方？」\n\n「有啊。」\n\n「有沒有漂亮的戲院？」\n\n「也有。」\n\n「那魏府離戲院遠不遠？」\n\n蘇孟達聞言，忍不住望向魏戌俞。\n\n「這個嘛，程小姐恐怕得親自問府上的主人了。」\n\n程小楓立即轉過頭。\n\n「夫君！」\n\n魏戌俞原本正閉目養神，聞言睜開了眼睛。\n\n「又怎麼了？」\n\n「你家離戲院遠不遠？」\n\n「不知道。」\n\n「你平日不看戲嗎？」\n\n「不看。」\n\n「那你平日做什麼？」\n\n「辦公。」\n\n「放假的時候呢？」\n\n「休息。」\n\n程小楓眨了眨眼睛。\n\n「你平日的生活也太無趣了吧！」\n\n蘇孟達深表贊同地點了點頭。\n\n「程小姐，您這話可算是說到我心坎裡了。」\n\n魏戌俞抬眼望向他。\n\n蘇孟達立即低頭喝茶。\n\n程小楓卻笑了起來。\n\n「沒關係，等到了北城，我帶你出去玩！」\n\n「不必。」\n\n「不要這麼快拒絕嘛！我還沒想好要去哪兒呢！」\n\n魏戌俞無奈地望著她。\n\n這姑娘從上車到現在，嘴巴幾乎沒停過。\n\n偏偏精神還好得很。\n\n「程小姐。」\n\n「嗯？」\n\n「現在已經很晚了。」\n\n「我知道。」\n\n「妳不睏？」\n\n「不睏呀！」\n\n話音才剛落下，她便忍不住打了個小小的呵欠。\n\n魏戌俞挑了挑眉。\n\n程小楓有些不好意思地笑了笑。\n\n「好像……有一點點睏。」\n\n她重新靠回座椅，將披肩拉到胸前。\n\n「那我睡一會兒好了。到了北城，你要記得叫我喔。」\n\n魏戌俞微微頷首。\n\n不消片刻，程小楓便安靜了下來。\n\n列車輕微晃動著。\n\n她的腦袋慢慢向一側偏去，最後輕輕靠在了魏戌俞未受傷的右肩上。\n\n魏戌俞低頭看了她一眼。\n\n正欲將她叫醒，卻見她已經睡得十分安穩。\n\n想起今晚這姑娘又是處理拍賣會，又是開車來救他們，直到此刻才真正得了休息，便也沒有再打擾她。\n\n蘇孟達見狀，臉上頓時露出了笑容。\n\n「魏長官……」\n\n魏戌俞抬起一根手指。\n\n「安靜。」\n\n蘇孟達只得將到了嘴邊的話重新吞回去。\n\n梁副官則替程小楓取來一條薄毯。\n\n包廂內總算恢復了寧靜。\n\n然而這份寧靜並未維持多久。\n\n砰！\n\n遠處突然傳來一聲巨響。\n\n魏戌俞猛然睜開眼睛。\n\n梁副官也立即站起身。\n\n緊接著，走廊另一端響起了一陣急促而凌亂的腳步聲。\n\n「救命啊！」\n\n「有鬼！車上有鬼啊！」\n\n一聲尖銳的女子叫聲劃破了深夜。\n\n程小楓嚇得從睡夢中驚醒。\n\n「怎麼了？！」\n\n魏戌俞已經站起身，伸手取出腰間的手槍。\n\n「副官，出去看看。」\n\n「是！」\n\n梁副官拉開包廂門。\n\n幾乎就在同一瞬間，一個男人從門前跌跌撞撞地跑了過去，臉上滿是驚恐。\n\n蘇孟達探頭一瞧。\n\n「咦？那不是錢家的人嗎？」\n\n魏戌俞走到門旁。\n\n那男人的身影很快消失在車廂盡頭。\n\n然而在他跑過的地毯上，竟留下了一連串漆黑的腳印。\n\n魏戌俞低頭望去。\n\n那並非尋常的泥水。\n\n而是混著細碎頭髮、散發出腐臭味的黑色液體。\n\n他的神情瞬間凝重起來。\n\n「蘇爺。」\n\n「在。」\n\n「把鏡子帶上。」\n\n程小楓也匆匆站了起來。\n\n「我跟你們一起去！」\n\n魏戌俞看了她一眼。\n\n原本想讓她留在包廂內，可再望向地毯上那些詭異的黑色腳印，他很快便改變了主意。\n\n倘若真是北山那一類的東西，區區一扇包廂門，根本不可能擋得住。\n\n將她獨自留在此處，反而更加危險。\n\n「跟緊我。」\n\n程小楓立即點頭。\n\n「好！」\n\n四人先後走出包廂。\n\n然而誰也沒有想到，方才那一陣尖叫，竟是這節車廂裡最後一次聽見尋常旅客的聲音。\n\n***\n\n## 空無一人的車廂\n\n走廊上的電燈仍然亮著。\n\n列車也依舊在向前行駛。\n\n車窗外偶爾閃過一棵棵枯樹，車輪碾過鐵軌的聲音清晰可聞。\n\n表面上看去，似乎並無太大異常。\n\n然而魏戌俞才走出幾步，便察覺到了不對。\n\n太安靜了。\n\n方才那一陣巨響與尖叫，足以驚醒附近所有的旅客。\n\n可此刻，走廊兩側的包廂門卻全都敞開著。\n\n沒有任何人出來查看。\n\n也沒有任何人說話。\n\n梁副官率先走到一間包廂門前。\n\n「上校，您來看看。」\n\n魏戌俞走了過去。\n\n包廂內的桌上擺著兩杯尚在冒著熱氣的茶，一本翻到一半的書籍倒扣在座椅上，旁邊還放著一副眼鏡。\n\n座椅上甚至還留有被褥壓出的痕跡。\n\n唯獨不見旅客。\n\n蘇孟達抱著木匣，走到對面的包廂查看。\n\n「這間也是。」\n\n裡頭有一只打開的行李箱，幾件衣裳散落在床鋪上。\n\n人卻不見了。\n\n梁副官伸手摸了一下桌上的茶壺。\n\n「還是熱的。人應該才離開不久。」\n\n魏戌俞望向車廂兩端。\n\n「可咱們方才出來，只瞧見一個人。」\n\n蘇孟達也收起了平日嬉笑的神情。\n\n「好端端一整節車廂的人，總不至於全跑去上茅房了吧？」\n\n程小楓站在魏戌俞身旁，忍不住往空蕩蕩的包廂裡看了幾眼。\n\n「會不會是前面的車廂出了事情，大家都跑過去看熱鬧了？」\n\n魏戌俞沒有立即回答。\n\n他蹲下身子，仔細觀察地毯上的黑色腳印。\n\n腳印共有兩種。\n\n一種是方才跑過去的男人留下的鞋印。\n\n另一種卻極為奇怪。\n\n那是一個個赤足留下的印記，腳掌狹長，五根腳趾之間的距離比尋常人寬了許多。\n\n而且越往前，腳印便越淺。\n\n到了走廊中央，竟完全消失了。\n\n魏戌俞順著最後一個腳印的位置抬起頭。\n\n車廂頂部，一盞電燈旁邊，赫然留著幾道黑色的手印。\n\n梁副官也注意到了。\n\n「上校，東西上了車頂。」\n\n蘇孟達抬頭看了一眼。\n\n「又是個不愛在地上走路的。」\n\n程小楓聽得一頭霧水。\n\n「什麼東西上了車頂？」\n\n蘇孟達轉過頭，正想說些什麼，卻被魏戌俞一個眼神制止了。\n\n「先別多問。」\n\n魏戌俞站起身。\n\n「副官，去前面的車廂看看。」\n\n「明白。」\n\n四人繼續向前。\n\n然而才走出不到十步，程小楓忽然伸手拉住了魏戌俞的衣袖。\n\n「等等。」\n\n魏戌俞停下腳步。\n\n「怎麼了？」\n\n程小楓伸手指向走廊盡頭。\n\n「那裡不是有人嗎？」\n\n三人同時望去。\n\n距離他們約莫十餘步遠的地方，站著一個穿著列車制服的男人。\n\n男人背對著他們，頭上戴著一頂深色帽子，手中還提著一只熱水壺。\n\n「先生！」\n\n程小楓喊了一聲。\n\n那男人沒有回應。\n\n「先生？請問前面發生什麼事了？」\n\n魏戌俞忽然抬手，示意她不要再說話。\n\n程小楓愣了一下。\n\n她重新望向那名列車侍者。\n\n這才發現，對方站立的姿勢似乎有些奇怪。\n\n他的身體正在隨著列車微微晃動，手中的熱水壺也跟著輕輕搖擺。\n\n可從始至終，兩條腿都沒有半點動作。\n\n程小楓慢慢將目光移向他的腳下。\n\n下一刻，她的臉色變了。\n\n「夫君……」\n\n魏戌俞低聲問道：\n\n「怎麼了？」\n\n程小楓緊緊攥著他的衣袖。\n\n「那個人……他的腳怎麼沒有碰到地上？」\n\n***\n\n男人的鞋底，距離地毯足足有三寸之高。\n\n他根本不是站在那裡。\n\n而是被什麼東西吊在了半空中。\n\n魏戌俞抬起眼睛。\n\n昏黃的電燈上方，道道極細的黑色影子沿著車廂頂部延伸，最終沒入男人制服的後領。\n\n那似乎是一束頭髮。\n\n梁副官緩緩拔出手槍。\n\n蘇孟達則向後退了一步。\n\n「魏長官，這位怕是已經不在了。」\n\n程小楓睜大眼睛。\n\n「不、不在了是什麼意思？」\n\n就在這時，走廊盡頭的男人忽然動了一下。\n\n他手中的熱水壺掉落在地。\n\n咣噹！\n\n清脆的金屬聲嚇得程小楓猛地一顫。\n\n男人的頭顱慢慢向後仰起。\n\n帽子掉了下來。\n\n露出的頭頂上，竟然垂著一隻蒼白的手。\n\n那隻手的五根手指深深扣在男人肩頸之間。\n\n緊接著，一張臉從他頭頂上方探了出來。\n\n那張臉倒掛著，鼻尖幾乎碰到了男人的額頭。\n\n黑色的長髮垂落兩側。\n\n一雙毫無血色的眼睛，正好與程小楓對上。\n\n程小楓整個人僵住了。\n\n她甚至忘了尖叫。\n\n那張臉緩緩張開嘴巴。\n\n「先生……」\n\n聲音竟與程小楓方才呼喚列車侍者時一模一樣。\n\n「請問前面發生什麼事了？」\n\n魏戌俞立即伸手，將她擋在身後。\n\n「到我後面來。」\n\n程小楓這回沒有多說半句話，立刻躲了過去。\n\n那張倒掛著的臉突然笑了起來。\n\n一具細長的身體從車廂頂部垂落，數條蒼白的手臂沿著牆壁緩緩伸展。\n\n它鬆開了手中的列車侍者。\n\n男人重重摔落在地。\n\n一動不動。\n\n程小楓這才看清，那東西的身體幾乎佔滿了整個車廂的寬度。\n\n它的關節以極為怪異的角度彎折，手臂有長有短，皮膚上遍布黑色泥水，頭顱卻仍舊維持著一張尋常人的面孔。\n\n「哎喲我的祖宗！」\n\n蘇孟達倒吸一口涼氣。\n\n「這是從哪座墓裡爬出來的玩意兒？」\n\n那東西猛然向前一撲。\n\n魏戌俞立即開槍。\n\n砰！砰！\n\n子彈擊中怪物的胸腹。\n\n它的身體向後震了兩下，卻沒有倒下。\n\n反而像是被激怒一般，發出一聲尖銳刺耳的嘶鳴。\n\n幾條手臂同時扣住走廊兩側的門框。\n\n整具身體猛然向前竄來。\n\n「跑！」\n\n***\n\n## 車廂裡的鬼怪\n\n魏戌俞扶住程小楓的手臂，將她往前一送。\n\n「跟著蘇爺！」\n\n梁副官緊隨其後，不時回頭開槍。\n\n蘇孟達則抱著木匣，跑在最前頭。\n\n「我就知道！三十一萬買回來的東西，哪有這麼容易消受！」\n\n車廂內的電燈開始劇烈閃爍。\n\n一明一暗之間，那怪物在牆壁與車頂上飛快爬行。\n\n每當電燈亮起，它便比先前又近了幾步。\n\n程小楓從未見過如此恐怖的景象。\n\n她甚至不敢相信，自己此刻竟是在一列火車上，被一具不知從何處冒出來的怪物追趕。\n\n身後不斷傳來槍聲。\n\n每響一聲，她的心便跟著猛跳一下。\n\n可即便再害怕，她也知道此刻絕不能停下腳步。\n\n她回頭看了一眼。\n\n恰好瞧見一條蒼白的手臂從車頂垂下，抓住了梁副官身後的門框。\n\n她嚇得失聲喊道：\n\n「梁先生！上面！」\n\n梁副官猛然轉身。\n\n砰！\n\n那隻手應聲縮了回去。\n\n魏戌俞護著程小楓衝過兩間包廂，眼看就要抵達車廂連接處，前方的蘇孟達卻突然停了下來。\n\n「不對啊！」\n\n魏戌俞問道：\n\n「怎麼了？」\n\n蘇孟達指向前方。\n\n原本應當通往下一節車廂的玻璃門，此刻竟變成了一扇厚重的石門。\n\n石門呈青灰色。\n\n上頭雕刻著兩尊面容猙獰的鎮墓獸。\n\n門縫之中，正緩緩滲出黑水。\n\n蘇孟達愣了片刻。\n\n「這可是火車啊！」\n\n梁副官也趕了過來。\n\n「上校，這道門上的紋路，與北山見過的石門極為相似。」\n\n魏戌俞伸手摸了一下石門。\n\n冰冷。\n\n潮濕。\n\n並非幻象。\n\n他立即轉頭望向身後。\n\n怪物已經爬到了走廊中央。\n\n距離他們愈來愈近。\n\n「找別的出口！」\n\n梁副官迅速拉開旁邊一扇包廂門。\n\n然而門後的景象，卻讓他整個人愣住了。\n\n原本應當擺放床鋪與座椅的包廂，此刻竟出現了一段向地下延伸的石階。\n\n石壁兩側點著青色的油燈。\n\n階梯深處隱約傳來流水聲。\n\n魏戌俞走近一看。\n\n那些石階上，留著數道尚未乾涸的黑色拖痕。\n\n彷彿有什麼東西才剛從底下爬了出來。\n\n蘇孟達忍不住道：\n\n「魏長官，咱們該不會真要從火車上下墓吧？」\n\n魏戌俞沉聲道：\n\n「別進去。」\n\n他拉上房門。\n\n「裡頭的路不知通往何處，貿然進去，未必回得來。」\n\n程小楓站在一旁，臉色已經白得沒有半點血色。\n\n她方才親眼看見了那段石階。\n\n更親眼看見了那個沒有腳踏在地上的人，以及從車頂爬下來的怪物。\n\n倘若說一開始，她還能告訴自己是燈光太暗、看錯了東西。\n\n那麼眼前的一切，已經完全超出了她所能理解的範圍。\n\n她慢慢抬起頭。\n\n「這些……到底是什麼？」\n\n蘇孟達看了她一眼。\n\n「程小姐，您以前可曾聽過鬼打牆？」\n\n「聽過……」\n\n「眼下恐怕比鬼打牆還麻煩一些。」\n\n程小楓瞪大眼睛。\n\n「那你們怎麼都不害怕？」\n\n蘇孟達低頭望了一眼自己微微發抖的雙腿。\n\n「誰跟您說我不害怕了？」\n\n話音未落，身後忽然傳來一陣猛烈的撞擊聲。\n\n砰！\n\n整節車廂劇烈一震。\n\n怪物的頭顱已經從走廊轉角伸了出來。\n\n一隻手猛然抓向蘇孟達。\n\n「蘇爺！」\n\n魏戌俞抬腿將旁邊一只沉重的行李箱踢倒，擋住怪物伸來的手臂。\n\n梁副官隨即開槍。\n\n怪物吃痛，向後縮了一下。\n\n魏戌俞迅速掃視四周。\n\n「這邊！」\n\n他拉開另一扇包廂門。\n\n這一次，門後總算是一間正常的包廂。\n\n四人迅速躲了進去。\n\n梁副官將門關上。\n\n蘇孟達與魏戌俞立即搬來桌椅，抵住門板。\n\n砰！\n\n外頭傳來一聲巨響。\n\n桌椅向後挪動了數寸。\n\n程小楓嚇得一把抓住魏戌俞的胳膊。\n\n砰！\n\n又是一聲。\n\n門板上逐漸浮現出一道裂痕。\n\n「這樣擋不了多久。」\n\n梁副官望向包廂的窗戶。\n\n窗外依然是急速向後退去的田野。\n\n列車的速度絲毫沒有減緩。\n\n蘇孟達低頭望向懷中的木匣。\n\n就在此時，他忽然察覺到一件事。\n\n「魏長官，鏡子在響！」\n\n***\n\n## 鏡中的出路\n\n魏戌俞立即轉過頭。\n\n蘇孟達將木匣放在座椅上，解開銅扣。\n\n匣蓋掀起的一瞬間，一陣極為細微的聲響從古鏡內部傳了出來。\n\n喀、喀、喀。\n\n像是有數枚齒輪正在緩慢轉動。\n\n原先嵌在鏡身兩側的白玉，此刻已有一枚近乎完全變成了灰黑色。\n\n另一枚白玉內部，也出現了幾條細小的黑色紋路。\n\n梁副官低頭查看。\n\n「上校，與方才在汽車上相比，黑色的部分又多了。」\n\n魏戌俞將古鏡拿起。\n\n他把鏡面轉向包廂四周。\n\n鏡中的桌椅、行李與燈光逐一顯現。\n\n唯獨窗戶的位置，竟然多出了一道門。\n\n魏戌俞抬起頭。\n\n眼前的牆面上，明明只有一扇窗戶。\n\n他又低頭看向鏡面。\n\n那道門的上方掛著一塊銅牌。\n\n三等客車。\n\n門外甚至還有一名提著行李的旅客走了過去。\n\n魏戌俞頓時明白了什麼。\n\n「副官，過來。」\n\n梁副官走到他身旁。\n\n魏戌俞指著鏡面。\n\n「看這兒。」\n\n梁副官仔細看了片刻。\n\n「那是正常的車廂？」\n\n「應該是。」\n\n魏戌俞重新望向窗戶。\n\n「這節車廂的格局已經被改變了，但真正的火車未必消失。古鏡或許能照出兩者交疊的地方。」\n\n蘇孟達若有所思。\n\n「如此說來，眼前這些牆壁、石門，不見得都是咱們原本所在的地方。」\n\n「不錯。」\n\n魏戌俞伸手摸向窗旁的木板。\n\n手指觸碰到的，
