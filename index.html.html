確實是木頭。\n\n可鏡中所顯現的，卻是一扇真正的車廂門。\n\n他稍稍移動鏡身。\n\n鏡面中的門框與眼前的窗框逐漸重疊。\n\n就在兩者完全重合的一瞬間，木板內部忽然傳出一聲輕響。\n\n喀。\n\n梁副官立即望向魏戌俞。\n\n「上校，有聲音。」\n\n魏戌俞伸手向前一推。\n\n眼前原本堅實的木板，竟緩緩向另一側移開。\n\n一道狹窄的縫隙出現在眾人眼前。\n\n縫隙之外，是一條燈光明亮的走廊。\n\n甚至能聽見遠處旅客談話的聲音。\n\n蘇孟達頓時大喜。\n\n「有救了！」\n\n然而就在這時。\n\n砰！\n\n包廂的門板猛然破裂。\n\n一隻蒼白的手臂從裂縫中伸了進來，五指瘋狂抓撓著抵住門板的桌椅。\n\n程小楓驚叫一聲。\n\n魏戌俞立即將古鏡交給蘇孟達。\n\n「蘇爺，拿穩鏡子！先出去！」\n\n梁副官站在門旁，抬槍朝那隻手臂開了一槍。\n\n怪物發出嘶鳴。\n\n蘇孟達迅速從縫隙穿了過去。\n\n魏戌俞正要讓程小楓跟上，車廂卻突然劇烈一晃。\n\n啪！\n\n頭頂的電燈全部熄滅。\n\n四周瞬間陷入黑暗。\n\n程小楓只覺得腳下一空，整個人向旁跌去。\n\n「啊！」\n\n魏戌俞立即伸手。\n\n「程小姐！」\n\n他的指尖擦過她的手腕，卻沒能抓住。\n\n緊接著，一道沉重的隔板從兩人之間猛然落下。\n\n轟！\n\n魏戌俞被迫向後退開。\n\n待他重新站穩身子，伸手摸向前方時，才發現眼前已經不是原本的包廂。\n\n而是一面冰冷的石牆。\n\n「程小姐！」\n\n他重重拍了兩下牆壁。\n\n「聽得見嗎？」\n\n沒有回答。\n\n魏戌俞臉色一沉。\n\n另一側傳來梁副官的聲音。\n\n「上校！」\n\n一束手電筒的光芒亮起。\n\n梁副官站在數步之外，身後的蘇孟達仍抱著古鏡。\n\n三人此刻正站在一節陌生的客車之中。\n\n原本的包廂早已消失。\n\n程小楓也不見了。\n\n魏戌俞轉身望向蘇孟達。\n\n「鏡子給我。」\n\n他接過古鏡，迅速照向石牆四周。\n\n可無論如何移動鏡身，鏡中都沒有再出現方才那間包廂。\n\n梁副官沿著牆壁仔細查看了一遍。\n\n「上校，沒有門縫，也沒有其他出口。」\n\n魏戌俞沉著臉，收起古鏡。\n\n「分頭找。」\n\n蘇孟達有些擔憂。\n\n「可這地方的格局一直在變，萬一咱們也走散了……」\n\n「副官，你與蘇爺一起，別離得太遠。」\n\n魏戌俞望向前方幽暗的走廊。\n\n「找到人就喊一聲。」\n\n說完，他便大步朝車廂另一端走去。\n\n方才程小楓驚慌的叫聲仍在他耳邊。\n\n她從未接觸過這些東西，又沒有任何武器。\n\n若是獨自碰上那具怪物，後果不堪設想。\n\n他必須盡快找到她。\n\n***\n\n## 落單\n\n程小楓重重跌坐在地上。\n\n四周漆黑一片。\n\n她慌忙伸手摸索，指尖觸碰到的竟是一片柔軟的地毯。\n\n「夫君？」\n\n她小聲喊道。\n\n沒有回應。\n\n「魏戌俞？」\n\n依舊沒有回應。\n\n程小楓的心跳愈來愈快。\n\n她扶著旁邊的牆壁站起來，努力睜大眼睛。\n\n過了好一會兒，前方才亮起一盞昏暗的電燈。\n\n她發現自己站在另一節車廂的走廊中央。\n\n這裡的座椅十分老舊，車窗上布滿灰塵，牆壁甚至有幾處已經剝落。\n\n與方才乘坐的頭等客車截然不同。\n\n程小楓下意識想往回走。\n\n然而身後的車廂門早已消失。\n\n只剩下一扇緊閉的窗戶。\n\n她伸手拍了拍玻璃。\n\n「有人嗎？」\n\n窗外一片漆黑。\n\n遠處，忽然響起了幾聲沉重的腳步聲。\n\n程小楓猛然轉過頭。\n\n腳步聲從走廊另一端傳來。\n\n一步。\n\n又一步。\n\n她想起方才那個從車頂爬下來的怪物，不由自主地向後退去。\n\n「誰……誰在那兒？」\n\n沒有回答。\n\n腳步聲仍在靠近。\n\n程小楓環顧四周，很快發現旁邊有一間供列車人員放置茶具的小房間。\n\n她立即躲了進去，將門輕輕掩上。\n\n屋內擺著幾只水桶、一張小桌，以及數個裝著茶杯的木櫃。\n\n程小楓蹲在木櫃旁，緊緊捂住自己的嘴巴。\n\n她從小到大，從來沒有這麼害怕過。\n\n即便今晚在維安城開車救人，身後有那麼多人拿著槍追趕，她至少還知道自己面對的是什麼。\n\n可那些長著人臉、身體卻完全不像人的東西……\n\n她只要稍稍回想，便覺得全身發冷。\n\n她努力告訴自己不要哭。\n\n魏戌俞一定會來找她。\n\n梁先生和蘇先生也一定會來找她。\n\n在那之前，自己絕不能亂跑，更不能發出聲音。\n\n腳步聲停在了門外。\n\n程小楓屏住呼吸。\n\n片刻後，一個男人推開了房門。\n\n「這鬼地方到底怎麼回事……」\n\n程小楓愣了一下。\n\n是人的聲音。\n\n她小心翼翼地從木櫃旁探出頭。\n\n只見一個衣衫凌亂的男人站在門口，正氣喘吁吁地擦著額頭上的汗。\n\n身後還跟著另一名身材魁梧的男子。\n\n待看清前面那人的面孔，程小楓的心頓時沉了下去。\n\n錢世豪。\n\n錢世豪也看見了她。\n\n兩人對視片刻。\n\n「程小姐？」\n\n程小楓慢慢站起身子。\n\n「怎麼是你？」\n\n錢世豪先是一愣，隨後向她身後望去。\n\n「那個姓魏的呢？」\n\n程小楓心中一驚。\n\n他竟然也知道魏戌俞的姓氏。\n\n不過她並未表現出來。\n\n「他就在附近。」\n\n錢世豪盯著她看了半晌。\n\n忽然笑了起來。\n\n「附近？」\n\n他走進小房間，朝身旁的隨從使了個眼色。\n\n隨從立即將房門關上，守在門旁。\n\n「若真在附近，妳怎麼會一個人躲在這兒？」\n\n程小楓向後退了一步。\n\n「關你什麼事？」\n\n錢世豪臉上的笑意逐漸消失。\n\n「關我什麼事？」\n\n「我今日在程家商會受了那麼大的羞辱，妳倒還有臉問我關什麼事？」\n\n程小楓皺起眉頭。\n\n「你自己闖進會場鬧事，還差點砸壞拍品，難道要怪我？」\n\n「若不是那個姓魏的搶了我的請帖，事情會變成這樣嗎？」\n\n「願賭服輸，你自己沒本事，怨得了誰？」\n\n錢世豪聞言，臉色頓時變得鐵青。\n\n連站在門旁的隨從，都忍不住看了自家少爺一眼。\n\n錢世豪本就因為今晚接二連三的變故憋了一肚子火，如今又被程小楓幾句話戳中了痛處，哪裡還忍得住。\n\n他忽然向前一步。\n\n程小楓立即警覺起來。\n\n「你做什麼？」\n\n「我做什麼？」\n\n錢世豪冷笑一聲。\n\n「妳本來就該是我錢世豪的女人。今日妳不但當眾讓我丟盡顏面，還跟著那個男人跑了。」\n\n「誰是你的女人？」\n\n程小楓氣得瞪大眼睛。\n\n「你少在這兒胡說八道！本小姐要嫁給誰，還輪不到你來決定！」\n\n「還嘴硬？」\n\n錢世豪猛然伸手，一把扣住她的手腕。\n\n程小楓大驚。\n\n「放手！」\n\n她立即向後掙扎，另一隻手抓起桌上的茶杯，狠狠朝他砸去。\n\n錢世豪側頭避開。\n\n茶杯在牆上摔得粉碎。\n\n「妳還敢打我？」\n\n程小楓趁他分神，轉身便要往門口跑。\n\n然而守在門前的隨從立即伸手，將她擋了回去。\n\n錢世豪一把抓住她的披肩。\n\n「想跑？」\n\n程小楓被他硬生生拽了回來，撞上旁邊的木桌，疼得倒吸一口氣。\n\n她來不及站穩，錢世豪已經逼近。\n\n「我看那個姓魏的現在還能不能來救妳！」\n\n程小楓終於明白了他的意圖。\n\n「你敢！」\n\n她抬腳狠狠踢向錢世豪的小腿，又拼命推開他的手。\n\n「放開我！」\n\n錢世豪吃痛，惱羞成怒地將她按向桌旁。\n\n拉扯之間，程小楓的披肩被扯落，旗袍上方的衣襟也被撕開了一道口子。\n\n布料撕裂的聲音，在狹小的房間內格外清晰。\n\n程小楓驚慌地護住衣襟。\n\n她從未想過，竟會有人如此對待自己。\n\n「你滾開！」\n\n她用盡全身力氣抵抗，抓住桌上的水壺砸向錢世豪的手臂。\n\n錢世豪怒罵一聲。\n\n「還不過來幫忙！」\n\n那名隨從聞言，立即朝程小楓走去。\n\n程小楓退到牆邊。\n\n身後已無路可退。\n\n她緊緊握著手中僅剩半截的瓷壺，咬著牙，死死瞪著眼前兩人。\n\n即便害怕得渾身發抖，她也絕不肯讓他們得逞。\n\n就在錢世豪再次伸出手的那一刻。\n\n砰！\n\n房門突然被人從外頭一腳踹開。\n\n整扇木門重重撞上牆壁。\n\n屋內三人同時回過頭。\n\n***\n\n## 魏家斷骨術\n\n一個高大的身影站在門口。\n\n走廊上昏暗的燈光從他身後照入，映出男人棱角分明的側臉。\n\n魏戌俞。\n\n程小楓怔怔地望著他。\n\n方才無論多麼害怕，她都咬著牙沒有哭出來。\n\n然而真正看見魏戌俞的這一瞬間，那股強撐著的倔強，卻忽然有些維持不住了。\n\n「夫君……」\n\n她的聲音很輕。\n\n魏戌俞的目光落在她身上。\n\n凌亂的頭髮。\n\n被扯落在地的披肩。\n\n撕裂的衣襟。\n\n以及她手中那半截用來保護自己的瓷壺。\n\n他的腳步停頓了一瞬。\n\n原本就不甚和緩的神情，頃刻間變得冰冷。\n\n錢世豪見到他，先是一驚。\n\n隨後竟露出一抹冷笑。\n\n「姓魏的，你來得正好！」\n\n魏戌俞沒有理會他。\n\n只是望著程小楓。\n\n「到我這兒來。」\n\n程小楓正要往前走，錢世豪卻一把抓住了她的胳膊。\n\n「誰准妳走了？」\n\n魏戌俞的眼神驟然一沉。\n\n「放手。」\n\n錢世豪非但沒有鬆手，反而將程小楓往身旁一拽。\n\n「怎麼？心疼了？」\n\n他朝隨從揚了揚下巴。\n\n「給我上！」\n\n那名身材魁梧的隨從立即撲向魏戌俞。\n\n此人常年跟著錢家在碼頭上做事，仗著身強力壯，平日沒少替錢世豪打架。\n\n眼見魏戌俞左臂還帶著傷，他心中更是多了幾分把握。\n\n然而他才剛揮出拳頭。\n\n魏戌俞便已經避開了他的攻擊。\n\n下一瞬，一記沉重的拳擊迎面而來。\n\n砰！\n\n隨從甚至來不及看清對方是如何出手的，整個人便被打得向後倒去，撞翻身後的木櫃，重重摔在地上。\n\n數只茶杯接連掉落。\n\n碎瓷散了一地。\n\n那人雙眼緊閉，當場昏死過去。\n\n從出手到倒下，不過眨眼之間。\n\n錢世豪臉上的笑容僵住了。\n\n他原以為兩個人聯手，即便不能打贏魏戌俞，至少也能讓對方吃些苦頭。\n\n沒想到自己最能打的手下，竟連一招都沒能接住。\n\n魏戌俞抬起眼睛。\n\n「我再說一次。」\n\n「放手。」\n\n錢世豪咬緊牙關。\n\n他在碼頭上橫行多年，何曾受過這等屈辱？\n\n如今又當著程小楓的面，更是不肯低頭。\n\n「你算個什麼東西！」\n\n他猛然將程小楓推向一旁，揮拳朝魏戌俞衝了過去。\n\n魏戌俞側身避開。\n\n兩人錯身而過的一瞬間，魏戌俞的手已經扣住了錢世豪的右臂。\n\n錢世豪正要掙脫。\n\n喀嚓！\n\n一聲清脆的骨裂聲驟然響起。\n\n「啊——！」\n\n錢世豪發出一聲慘叫。\n\n他的右臂無力地垂了下去。\n\n魏戌俞面色絲毫未變。\n\n錢世豪踉蹌著向後退了幾步，難以置信地望著自己的手臂。\n\n「你……你竟敢……」\n\n魏戌俞緩緩向前走去。\n\n他方才所使的，並非尋常軍中習得的擒拿之法。\n\n而是魏家世代相傳的一門武術。\n\n斷骨術。\n\n魏家先祖長年出入禁地，所面對的從來不只是尋常活人。這門武術因此以剛猛凌厲著稱，與一般講究制服對手的拳腳截然不同。\n\n魏家子弟自幼便須修習。\n\n魏戌俞更是從小由父親親自教導。\n\n只是此術出手極重，尋常情況下，他鮮少使用。\n\n今日卻是例外。\n\n錢世豪望著一步步走近的魏戌俞，心中終於升起了恐懼。\n\n「你別過來！」\n\n魏戌俞冷冷地望著他。\n\n「方才哪隻手碰的她？」\n\n錢世豪沒有回答。\n\n他慌亂地向後退去，忽然抓起桌上的一把水果刀，朝魏戌俞猛刺過來。\n\n程小楓臉色一變。\n\n「小心！」\n\n魏戌俞眼神未動。\n\n又是一聲骨裂。\n\n喀嚓！\n\n水果刀掉落在地。\n\n錢世豪的左臂也無力垂下。\n\n他疼得雙膝一軟，險些跪倒在地。\n\n「我的手……我的手！」\n\n魏戌俞站在他面前，神情冷峻。\n\n「兩隻。」\n\n錢世豪抬起頭，滿臉怨毒地望著他。\n\n「姓魏的！我爹絕不會放過你！」\n\n「還有那個女人！我早晚要讓她——」\n\n話音未落。\n\n魏戌俞眼底最後一絲耐性徹底消失。\n\n錢世豪竟仍不肯罷休，突然用盡全身力氣，低頭朝魏戌俞猛撞過去。\n\n魏戌俞迎面一拳。\n\n砰！\n\n這一拳沉重得令人心驚。\n\n錢世豪的身體猛然一震，整個人向後倒去。\n\n隨著一聲沉悶的撞擊，他重重摔在地板上，再也沒有站起來。\n\n屋內安靜了。\n\n只剩下列車行駛的聲音。\n\n魏戌俞低頭望去。\n\n錢世豪的顱骨已然碎裂，雙目失去神采，胸口也不再起伏。\n\n死了。\n\n從兩人聯手圍攻魏戌俞，到一人昏迷、一人斃命，前後不過片刻。\n\n而魏戌俞甚至連腰間的手槍都不曾拔出。\n\n程小楓怔怔地站在原處。\n\n她在拍賣會上便見過魏戌俞的身手。\n\n那時的他應付錢世豪，始終留有餘地。\n\n她直到此刻才真正明白，方才在拍賣會上，這個男人究竟收了多少力道。\n\n眼前的魏戌俞，與先前那個被她逗得無話可說、偶爾還會無奈失笑的男人，簡直判若兩人。\n\n他的神情冷得可怕。\n\n可當他重新轉身望向她時，那份令人不寒而慄的戾氣，卻逐漸收斂了下去。\n\n他朝她走了過來。\n\n***\n\n## 身後的溫度\n\n「有沒有受傷？」\n\n魏戌俞的聲音放緩了許多。\n\n程小楓搖了搖頭。\n\n她正想回答，卻忽然察覺到自己的衣裳已經被扯得不成樣子。\n\n臉頰一下子紅了起來。\n\n她慌忙轉過身，雙手掩住胸前撕裂的衣襟。\n\n「你……你先不要看我。」\n\n魏戌俞微微一怔。\n\n隨即明白了她的意思。\n\n他沒有多問，也沒有讓她轉過身來。\n\n只是伸手解開自己西裝外套的鈕扣，將外套脫了下來。\n\n程小楓仍背對著他，緊緊攥著衣襟。\n\n下一刻，一件帶著暖意的外套輕輕落在了她的肩上。\n\n「穿著。」\n\n身後傳來魏戌俞低沉的聲音。\n\n程小楓愣了一下。\n\n那件外套十分寬大，幾乎將她整個上半身都遮住了。\n\n衣料上還留著他的體溫。\n\n她小心翼翼地將雙手伸進袖子裡，卻因為袖口太長，一時找不著自己的手。\n\n魏戌俞望著她的背影。\n\n「別動，我替妳扣好。」\n\n程小楓紅著臉，輕輕點了點頭。\n\n魏戌俞向前走了半步。\n\n他沒有要求她轉身，而是站在她身後，雙臂從她身體兩側伸向前方，將外套的衣襟輕輕攏在一起。\n\n程小楓的身子一下子僵住了。\n\n她低下頭。\n\n魏戌俞的雙手就在自己面前。\n\n他微微低著頭，從她右側肩膀上方望向那些鈕扣，動作仔細地替她將衣襟整理好。\n\n第一顆。\n\n第二顆。\n\n程小楓一動也不敢動。\n\n她能清楚地感覺到身後那個人的存在。\n\n他的胸膛並未真正貼上她的後背，雙臂也沒有將她抱住，然而那樣的姿勢，卻讓她有種彷彿被他從身後擁在懷中的錯覺。\n\n隔著些許距離，依然能感受到他身上的暖意。\n\n尤其當他為了看清前方的鈕扣而稍稍俯身時，溫熱的氣息輕輕掠過她的右耳。\n\n程小楓的耳根瞬間紅透了。\n\n她下意識屏住呼吸。\n\n那股曾在庫房裡聞見的淡淡木質香氣，此刻比任何一次都更加清晰。\n\n衣料上有。\n\n身後有。\n\n就連她周圍的空氣裡，彷彿也全都是他的氣味。\n\n程小楓的心跳得很快。\n\n可奇怪的是，方才那份讓她幾乎喘不過氣來的恐懼，竟在這片刻的安靜之中逐漸消散。\n\n魏戌俞明明才經歷了一場激烈的打鬥。\n\n方才出手時那般凌厲，甚至連眼睛都不曾眨一下。\n\n如今替她扣起鈕扣來，卻又如此小心。\n\n他沒有取笑她的狼狽。\n\n沒有催促她。\n\n甚至連讓她轉過身這樣簡單的要求都沒有提出。\n\n只是用一種不讓她感到難堪的方式，安安靜靜地替她整理好衣裳。\n\n程小楓低頭望著他的手。\n\n忽然覺得，自己好像從未見過一個人，能同時有著如此強悍與溫柔的兩面。\n\n「好了。」\n\n魏戌俞扣上最後一顆鈕扣。\n\n又替她將外套的領口整理平整。\n\n隨後收回雙手，往後退了半步。\n\n程小楓低下頭。\n\n胸前被撕裂的衣襟已經完全遮住。\n\n外套的下襬垂至她的大腿，兩隻袖子更是長了一大截。\n\n她輕輕攥住衣袖。\n\n方才還籠罩在身後的暖意，隨著魏戌俞退開而淡去了一些。\n\n她心中竟有些捨不得。\n\n片刻之後。\n\n她慢慢轉過身。\n\n魏戌俞正低頭望著她。\n\n「手臂呢？有沒有受傷？」\n\n程小楓搖了搖頭。\n\n原本想像平日那樣，笑著對他說一句自己沒事。\n\n可話還沒說出口，鼻尖便忽然一酸。\n\n眼眶也跟著紅了起來。\n\n她望著魏戌俞。\n\n方才獨自躲在黑暗裡的恐懼、被錢世豪抓住時的驚慌，以及怎麼呼喊都得不到回應的無助，在此刻一股腦地湧了上來。\n\n「我喊了你好多次，可是你都沒有回答我。」\n\n她的眼眶帶著淚水，聲音微微顫抖。\n\n說著，還抬起手，輕輕捶了魏戌俞的胸口一下。\n\n那一下沒有多少力氣。\n\n與其說是責怪，倒更像是終於找到可以依靠的人之後，忍不住流露出來的一點委屈。\n\n魏戌俞低頭看著她。\n\n沒有閃躲。\n\n也沒有出言責備。\n\n「對不起。」\n\n他停頓了一下。\n\n「剛才被隔開了，沒聽見。」\n\n程小楓怔住了。\n\n她原本以為，他或許會告訴自己，方才的情況有多危險，或者責怪她為什麼沒有跟緊。\n\n沒想到他只是認認真真地向她道歉。\n\n她用力吸了吸鼻子。\n\n「我剛才真的好害怕……」\n\n魏戌俞望著她。\n\n「我知道。」\n\n「我從來沒有見過那些東西。我也不知道自己跑到哪裡去了……」\n\n她說著說著，眼淚終於掉了下來。\n\n魏戌俞沒有催她。\n\n只是靜靜站在面前，讓她將話說完。\n\n過了片刻，他朝她伸出右手。\n\n掌心向上。\n\n「抓緊我，不要離開我的身邊。」\n\n程小楓低頭望著那隻手。\n\n一時間，連眼淚都忘了擦。\n\n從認識魏戌俞到現在，她曾被他握住手腕，也曾偷偷拉過他的衣袖。\n\n可這還是第一次，他主動將手伸到她面前，讓她握住。\n\n她小心翼翼地將自己的手放進他的掌心。\n\n他的手比她大了許多。\n\n掌中帶著長年習武與持槍留下的薄繭，並不像那些富家少爺的手那般細緻。\n\n卻十分溫暖。\n\n魏戌俞收攏手指，穩穩握住了她。\n\n程小楓也緊緊握了回去。\n\n她仰起臉。\n\n眼角還帶著淚水，嘴角卻已經悄悄揚了起來。\n\n「嗯！」\n\n她今日原本只是覺得，這個男人長得好看，性子也十分有趣。\n\n可現在，她忽然覺得，即便世上還有比他更好看的男人，自己恐怕也不會再多看一眼了。\n\n***\n\n「上校！」\n\n走廊另一端忽然傳來梁副官的聲音。\n\n「魏長官！找到程小姐了沒有？」\n\n魏戌俞轉頭應道：\n\n「在這兒。」\n\n不消片刻，梁副官與蘇孟達便匆匆趕了過來。\n\n蘇孟達一見程小楓，頓時鬆了口氣。\n\n「哎喲，程小姐！可算找著您了！」\n\n然而話才說完，他便注意到她身上披著魏戌俞的外套，眼睛也紅紅的。\n\n再往屋內一瞧。\n\n錢世豪倒在地上，一動不動。\n\n另一名隨從則昏倒在碎裂的木櫃旁。\n\n蘇孟達臉上的笑容立刻消失了。\n\n他沒有多問方才發生了什麼，只是放輕了聲音。\n\n「程小姐，您沒事吧？」\n\n程小楓連忙用空著的那隻手擦掉眼淚。\n\n她努力挺直身子，故作鎮定地說道：\n\n「沒事。」\n\n蘇孟達點了點頭。\n\n「沒事就好。」\n\n梁副官進屋查看兩人的情況。\n\n片刻後，他站起身。\n\n「上校，錢世豪已經死了。另外一人還有氣息，應當只是昏過去了。」\n\n魏戌俞微微頷首。\n\n「先把他移到牆邊。」\n\n梁副官依言將昏迷的隨從安置妥當。\n\n就在此時，走廊深處忽然傳來一陣怪異的摩擦聲。\n\n沙——\n\n沙——\n\n像是有什麼沉重的東西，正在沿著車廂頂部緩慢拖行。\n\n魏戌俞立即轉過頭。\n\n他望向梁副官，神情重新變得凝重。\n\n「副官。」\n\n「在。」\n\n「此地非同小可，子彈上膛。」\n\n「是！」\n\n梁副官立即檢查手槍，換上新的彈匣。\n\n魏戌俞也拔出了腰間的手槍。\n\n程小楓望著他手中的槍，下意識又將他的右手握緊了些。\n\n魏戌俞低頭看了她一眼。\n\n將手槍換至另一隻手，讓她能繼續抓著自己。\n\n「別怕。」\n\n程小楓輕輕點了點頭。\n\n然而就在四人準備離開時，走廊盡頭的電燈忽然一盞接著一盞熄滅了。\n\n那陣摩擦聲也隨之停下。\n\n四周頓時陷入一片令人窒息的寂靜。\n\n梁副官舉起手電筒。\n\n光束沿著走廊緩緩向前。\n\n黑暗之中。\n\n一張慘白的臉，正倒掛在車廂頂部。\n\n直勾勾地望著他們。\n\n***\n\n## 它在找什麼？\n\n「退後！」\n\n魏戌俞一聲低喝。\n\n程小楓立即躲到他身後。\n\n梁副官舉起手槍，對準車廂上方。\n\n然而那張臉並沒有立即撲過來。\n\n它懸在半空中，緩緩轉動脖子，彷彿正在尋找什麼東西。\n\n黑色的長髮從車頂垂落。\n\n幾條蒼白的手臂慢慢攀住兩側牆壁。\n\n忽然，那東西的頭顱朝旁邊偏了偏。\n\n它似乎察覺到了屋內錢世豪的屍體。\n\n一條手臂緩緩垂下，指尖輕輕碰觸著地面。\n\n緊接著，它的面孔開始發生變化。\n\n原本陌生的五官逐漸扭曲，眉毛、鼻梁、嘴唇一點一點變得清晰。\n\n最後，竟變成了阿福的模樣。\n\n「少爺……」\n\n怪物低聲喚道。\n\n程小楓嚇得往魏戌俞身後縮了縮。\n\n那張臉望著倒在地上的錢世豪，嘴角慢慢揚起。\n\n「您也來啦……」\n\n它發出一陣極其古怪的笑聲。\n\n蘇孟達皺起眉頭。\n\n「這東西認得錢世豪？」\n\n魏戌俞望著那張臉。\n\n「恐怕不只是認得。」\n\n然而還沒等怪物靠近錢世豪的屍體，蘇孟達懷中的木匣便突然傳出一陣機關轉動的聲響。\n\n喀、喀、喀。\n\n那怪物猛然轉頭。\n\n一雙灰白色的眼睛，死死盯住了蘇孟達。\n\n蘇孟達臉色一白。\n\n「怎麼又看我？」\n\n魏戌俞立即察覺到了什麼。\n\n「蘇爺，把木匣放低。」\n\n蘇孟達依言將木匣移至腰間。\n\n怪物的頭顱也跟著向下移動。\n\n魏戌俞又讓他將木匣往旁邊挪了一些。\n\n那雙灰白色的眼睛再次轉了過去。\n\n梁副官低聲道：\n\n「上校，它盯著的是鏡子。」\n\n「不錯。」\n\n蘇孟達頓時欲哭無淚。\n\n「敢情今晚不光活人惦記這三十一萬，連死人都惦記上了！」\n\n魏戌俞皺眉望著那具怪物。\n\n它方才在走廊上追逐眾人時，動作極為凶猛。\n\n此刻卻始終停在原處。\n\n似乎想要靠近古鏡，又對它有所忌憚。\n\n「蘇爺，打開匣子。」\n\n「啊？」\n\n「照做。」\n\n蘇孟達深吸一口氣，慢慢解開銅扣。\n\n匣蓋掀起。\n\n七星鎏金鏡在昏暗的燈光下泛出一層淡淡的金色光澤。\n\n怪物突然發出一聲極為刺耳的嘶鳴。\n\n原本扣住牆壁的數條手臂同時收了回去。\n\n它的身體向後縮了半丈。\n\n梁副官見狀，立即開口。\n\n「它似乎害怕這面鏡子。」\n\n魏戌俞搖頭。\n\n「先別急著下定論。」\n\n他轉頭望向程小楓。\n\n「先鬆一下手。」\n\n程小楓雖然有些不安，卻還是乖乖鬆開了。\n\n魏戌俞接過古鏡，將鏡面朝向怪物。\n\n下一刻，鏡中出現的景象，竟讓四人同時愣住了。\n\n那裡頭根本沒有怪物。\n\n只有一群穿著古代服飾的人。\n\n那些人被粗大的黑色鐵鏈串在一起，雙膝跪地，低垂著頭。\n\n有男有女。\n\n有老有少。\n\n他們的身體彼此緊貼，手臂互相交錯，宛如一群被迫擠在狹窄空間中的囚徒。\n\n而在那些人最前方，還跪著一個穿灰色衣裳的年輕男人。\n\n他的額頭有一道傷口。\n\n面容與魏戌俞先前在汽車上透過古鏡看見的死者極為相似。\n\n魏戌俞目光一凝。\n\n「是他。」\n\n蘇孟達也認了出來。\n\n「方才鏡子裡的那個死人！」\n\n就在此時，鏡中的年輕男人慢慢抬起頭。\n\n他的嘴唇動了動。\n\n雖然沒有聲音傳出，魏戌俞卻隱約辨認出了他的口型。\n\n*救我。*\n\n程小楓站在魏戌俞身旁，也看見了這一幕。\n\n她嚇得握緊了他的衣袖。\n\n「這些人……是誰？」\n\n沒有人能回答她。\n\n鏡中的那些人忽然同時抬起頭。\n\n一張張慘白的臉齊齊望向鏡面。\n\n與此同時，現實中的怪物發出一聲撕心裂肺的嘶鳴，猛然撲向魏戌俞。\n\n「小心！」\n\n梁副官立即開槍。\n\n魏戌俞迅速收回古鏡，護著程小楓向後退去。\n\n怪物一頭撞上車廂地板。\n\n整節車廂劇烈震動。\n\n那幾條蒼白的手臂瘋狂揮舞，將附近的座椅撕扯得東倒西歪。\n\n「上校，後面的門！」\n\n梁副官指向走廊另一端。\n\n原本緊閉的車廂門，不知何時已經自行打開。\n\n魏戌俞立即將古鏡交還給蘇孟達。\n\n「走！」\n\n他伸手握住程小楓，帶著她朝另一端跑去。\n\n梁副官回頭望了一眼原本的小房間。\n\n方才錢世豪倒下的地方，此刻已經被一道突然出現的石牆遮住。\n\n連同那名昏迷的隨從，也被隔絕在了另一頭。\n\n「上校，那間屋子消失了！」\n\n魏戌俞回頭看了一眼。\n\n「先找出口！」\n\n四人加快腳步。\n\n身後再次傳來怪物的嘶鳴。\n\n蘇孟達一邊跑，一邊喊道：\n\n「魏長官！我看它不一定是怕鏡子！」\n\n「怎麼說？」\n\n「它瞧見鏡子以後，裡頭那些人全醒了！」\n\n魏戌俞也注意到了這一點。\n\n倘若那些被鐵鏈束縛的人，才是怪物真正的模樣……\n\n那麼眼前這具拼湊而成的身體，恐怕並非單純的死屍。\n\n而是許多亡魂，被某種力量強行困在了一起。\n\n至於那個穿灰衣的年輕男人，極有可能是最近才被拖進去的。\n\n魏戌俞想起先前在北山火車上見到的那具軍人屍體。\n\n當時，那具屍體也是一面求救，一面被某種看不見的力量拖回了第七節車廂。\n\n如今想來，兩者之間或許並非毫無關聯。\n\n***\n\n## 遺留在車廂裡的皮箱\n\n四人接連穿過兩節車廂。\n\n身後的嘶鳴聲逐漸遠去。\n\n直到走廊重新亮起昏黃的電燈，魏戌俞才放慢腳步。\n\n「都沒事吧？」\n\n梁副官立即應道：\n\n「沒事。」\n\n蘇孟達喘著粗氣。\n\n「我這雙腿，明早怕是連路都走不動了。」\n\n魏戌俞轉頭望向程小楓。\n\n她也跟著點了點頭。\n\n「我沒事。」\n\n她身上仍披著那件寬大的西裝外套，頭髮因方才的奔跑而有些凌亂。\n\n雖然累得氣喘吁吁，卻始終沒有鬆開魏戌俞的手。\n\n魏戌俞確認她並無大礙，這才重新觀察四周。\n\n此處的格局與他們最初乘坐的頭等客車十分相似。\n\n兩側都是獨立包廂，地上還鋪著暗紅色的地毯。\n\n然而他很快便聞到了一股熟悉的氣味。\n\n腐臭味。\n\n梁副官舉起手電筒。\n\n「上校，前面有黑水。」\n\n只見走廊中央散落著幾只行李箱，一件男人的外衣被扔在地上，牆面與門框上還留著大片漆黑的手印。\n\n其中一間包廂的房門已經被撞得歪斜。\n\n源源不絕的黑色液體，正從門縫下方緩緩流出。\n\n魏戌俞抬手示意眾人停下。\n\n「在這兒。」\n\n他走到包廂門旁，伸手推開了房門。\n\n一股刺鼻的腐臭味迎面而來。\n\n程小楓立即捂住鼻子。\n\n「好臭……」\n\n蘇孟達探頭往裡一瞧。\n\n「這地方是有人倒了一整缸臭水不成？」\n\n包廂內一片狼藉。\n\n桌椅翻倒，茶具摔碎，窗簾被撕扯得不成樣子。\n\n地毯上滿是黑水。\n\n而在座椅下方，一只黑色皮箱正敞開著。\n\n魏戌俞的目光頓時停住。\n\n「果然是它。」\n\n梁副官低頭仔細辨認。\n\n「上校，與錢世豪在拍賣會上帶的那只一樣。」\n\n蘇孟達的神情也變得凝重。\n\n「莫非整列火車的異象，都是從這只箱子開始的？」\n\n魏戌俞沒有回答。\n\n他讓程小楓暫且站在自己身旁，隨即蹲下身子，從梁副官手中接過手電筒，朝箱內照去。\n\n裡頭已經沒有石階。\n\n只有幾件散落的青銅器、一團被黑水浸透的布料，以及一塊約莫半尺寬的石板。\n\n石板表面遍布裂痕。\n\n中央有一道圓形的凹槽。\n\n周圍則刻著七顆大小不一的星辰。\n\n蘇孟達蹲下身子。\n\n「這紋路……」\n\n他轉頭望向木匣中的七星鎏金鏡。\n\n「怎麼又是七星？」\n\n魏戌俞將古鏡拿到石板旁。\n\n兩者的大小並不相同。\n\n但星辰排列的方式，卻有幾分相似。\n\n更重要的是，石板中央還刻著半個極為眼熟的圖案。\n\n一條盤繞在龜甲之上的長蛇。\n\n玄武。\n\n梁副官低聲道：\n\n「這果然也是從那座墓裡取出來的東西。」\n\n魏戌俞微微頷首。\n\n「錢世豪來維安城，恐怕從一開始便不是為了相親。」\n\n蘇孟達望著那塊石板。\n\n「有人讓他帶著這些東西，來取七星鎏金鏡？」\n\n「很有可能。」\n\n魏戌俞回想起拍賣會上那兩名來歷不明的男人。\n\n再加上怪物方才稱呼錢世豪為少爺時的模樣。\n\n這些看似毫無關聯的事情，似乎正在逐漸串連起來。\n\n梁副官蹲在皮箱另一側，伸手指向石板邊緣。\n\n「上校，您看。」\n\n石板上的幾道裂痕，內部竟然都泛著極淡的黑色光澤。\n\n其中一道裂痕延伸至石板底部，黑水正不斷從裡頭滲出。\n\n魏戌俞俯身查看。\n\n他伸手將石板稍稍抬起。\n\n下方空無一物。\n\n可那些黑水依舊源源不絕地從裂縫中流出，彷彿這塊石板的另一端，連著某個積滿黑水的地方。\n\n蘇孟達忍不住倒吸一口涼氣。\n\n「這東西怕不是什麼尋常的陪葬品。」\n\n魏戌俞將石板重新放下。\n\n「它與古鏡一樣，能夠影響周圍的空間。」\n\n梁副官思索片刻。\n\n「會不會是因為鏡子與石板同時出現在火車上，才引發了方才那些異象？」\n\n「有這個可能。」\n\n魏戌俞望著古鏡兩側已經變色的白玉。\n\n「在維安城的時候，鏡中便出現了錢世豪那只皮箱的影像。如今兩件東西距離更近，異象也愈發嚴重。」\n\n蘇孟達摸了摸下巴。\n\n「如此說來，咱們今晚算是把兩件不得了的東西湊到一塊兒了。」\n\n魏戌俞沒有接話。\n\n錢世豪已死。\n\n他們已無法從對方口中問出是誰指使他運送這些古物。\n\n不過魏戌俞並不認為，錢世豪有能力獨自策劃如此龐大的事情。\n\n從北山失蹤的軍用車廂，到維安城的古鏡爭奪，再到此刻出現在火車上的鬼怪。\n\n背後必定還有人。\n\n而那個人，顯然比他們更早掌握了這座古墓的祕密。\n\n「魏長官。」\n\n蘇孟達忽然出聲。\n\n「您看這箱蓋。」\n\n魏戌俞低下頭。\n\n皮箱內側的絨布，因先前的異變已經脫落了大半。\n\n而在絨布底下，竟還藏著一塊極薄的銅板。\n\n蘇孟達小心地將濕透的布料掀開。\n\n一幅繁複而精美的雕刻，逐漸出現在眾人眼前。\n\n***\n\n## 七道石門\n\n那是一幅地下宮殿的圖案。\n\n最外圍，群山層層環繞。\n\n山勢之間雕刻著數條通往地下的道路，這些道路最終匯聚在一座巨大的石門之前。\n\n石門之後，是數不清的殿宇、長廊與階梯。\n\n有些殿宇之間以橋梁相連。\n\n有些則懸在一片漆黑的水域之上。\n\n宮殿中央，還刻著一座形似祭壇的巨大高台。\n\n高台上擺著一口漆黑的棺槨。\n\n四周共有七道石門。\n\n每一道石門上，都刻著一顆星辰。\n\n蘇孟達越看越是心驚。\n\n「我的老天爺……」\n\n他伸出手指，沿著宮殿外圍的道路慢慢比畫。\n\n「這若真是一座地下陵墓，規模恐怕比咱們先前想的還要大得多。」\n\n梁副官指向其中一條進入山中的道路。\n\n「上校，這兒有一條通道，入口旁刻著三道石門。」\n\n魏戌俞湊近查看。\n\n那三道石門之後，赫然有一片水域。\n\n水域兩側各立著六尊人形石像。\n\n總共十二尊。\n\n三人對視一眼。\n\n「北山。」\n\n魏戌俞低聲說道。\n\n城西那位徐老石匠曾經親口描述過，二十年前，他隨著一行人深入山中，見到的正是一座擺放著十二尊跪地石像的地下水殿。\n\n眼前的雕刻，竟與他所說的情形完全吻合。\n\n蘇孟達頓時激動起來。\n\n「魏長官，這莫非就是咱們一直在找的古墓地圖？」\n\n魏戌俞仔細查看了一遍。\n\n「未必完整。」\n\n他伸手指向銅板右下角。\n\n那裡有一段長廊延伸至圖案邊緣，尚未雕刻完畢，便被銅板的邊界截斷了。\n\n「這可能只是整座地下宮殿的一部分。」\n\n蘇孟達瞪大眼睛。\n\n「這麼大一座宮殿，還只是一部分？」\n\n梁副官的神情也變得凝重起來。\n\n他又指向宮殿外圍的一處雕刻。\n\n「上校，這幾條道路的入口似乎並不在同一座山上。」\n\n魏戌俞仔細端詳。\n\n果然。\n\n圖中群山之間以河流相隔，每一處入口附近的山勢也有所不同。\n\n北山的古道，不過是其中之一。\n\n而這些從不同山脈向地下延伸的道路，最終竟全部通往同一座地下宮殿。\n\n蘇孟達望著銅板，半晌沒有說話。\n\n「究竟是什麼人，值得修這麼大一座墓？」\n\n魏戌俞搖了搖頭。\n\n「或許修建這座宮殿的人，從一開始便沒打算將自己葬在裡頭。」\n\n蘇孟達抬起頭。\n\n「您是說……」\n\n「他想活著出去。」\n\n三人同時陷入沉默。\n\n包廂之外，列車仍在黑夜中不斷前行。\n\n車輪碾過鐵軌的聲音一下又一下，彷彿在提醒著他們，這場尚未結束的異象，與圖中那座古老的地下宮殿有著千絲萬縷的聯繫。\n\n正當三人仔細研究那幾道石門的排列方式時，一直安靜站在魏戌俞身旁的程小楓，忽然歪了歪頭。\n\n「咦？」\n\n魏戌俞轉頭看她。\n\n「怎麼了？」\n\n程小楓慢慢蹲了下來。\n\n她身上仍穿著那件寬大的西裝外套，袖口遮住了大半雙手。\n\n她將袖子稍稍往上拉了些，伸手指向圖案中央。\n\n「這七道門，還有中間這口棺材……」\n\n她又仔細端詳了半晌。\n\n「好奇怪。」\n\n蘇孟達問道：\n\n「哪兒奇怪？」\n\n程小楓皺著眉頭，似乎正在努力回想一件十分久遠的事情。\n\n過了片刻，她忽然抬起頭。\n\n「這幅圖我見過。」\n\n魏戌俞的動作驟然一頓。\n\n梁副官與蘇孟達也同時轉過身來。\n\n「妳見過？」\n\n程小楓點了點頭。\n\n她伸手指向宮殿中央那七道環繞著棺槨的石門。\n\n「我記得很清楚，因為這七道門畫得一點也不對稱。我小時候還問過，為什麼不乾脆畫成八道門，那樣不是好看多了嗎？」\n\n蘇孟達張了張嘴。\n\n魏戌俞則緊緊盯著她。\n\n「妳在哪裡見過這幅圖？」\n\n程小楓認真地回想了一會兒。\n\n隨後，輕聲答道：\n\n**「我娘以前的書房裡。」**\n\n（第十一回完）"}, {"n": 12, "title": "陰門之後", "body": "「我娘以前的書房裡。」\n\n程小楓話音剛落，包廂內頓時安靜了下來。\n\n魏戌俞望著她。\n\n「妳確定？」\n\n「確定呀！」\n\n程小楓蹲在皮箱旁，將過長的西裝袖口往上折了折，又伸手指向銅板中央。\n\n「你看，這兒有七道門，可是左邊有三道，右邊有四道。我小時候就覺得很奇怪，為什麼畫得這麼不整齊？」\n\n她沿著圖案外圍慢慢比畫。\n\n「還有這座橋，明明旁邊什麼都沒有，卻偏偏多畫了一截出來。我當時還拿筆替我娘補了一條路呢！」\n\n蘇孟達一愣。\n\n「您把圖給改了？」\n\n「對啊。」\n\n「令堂沒生氣？」\n\n「生氣了呀！罰我一整日不許吃糖。」\n\n蘇孟達低頭望著銅板，忍不住感慨道：\n\n「幸好您當年拿的是筆，不是鑿子。」\n\n程小楓瞪了他一眼。\n\n魏戌俞則將手電筒移向她方才指出的那座橋。\n\n那確實是一處十分奇怪的地方。\n\n橋的一端連著一座殿宇，另一端卻直接伸向一片空白的水域，彷彿修建到一半便突然中止了。\n\n然而整幅雕刻極為精細，甚至連殿宇屋簷下懸掛的銅鈴都有所描繪。\n\n如此重要的一座橋，怎麼會無緣無故少了一半？\n\n「妳母親當時可曾向妳解釋過這幅圖？」\n\n程小楓想了想。\n\n「沒有。我娘研究古物的時候，總嫌我在旁邊吵。」\n\n她托著下巴，努力回想。\n\n「不過她有時候會拿著一面鏡子，對著那幅圖看上好久。」\n\n魏戌俞立刻抬起眼睛。\n\n「七星鎏金鏡？」\n\n「好像是。」\n\n程小楓點點頭。\n\n「那時候我還小，只覺得我娘很奇怪。明明低頭就能看見圖，為什麼還要拿鏡子照？」\n\n魏戌俞與蘇孟達對視一眼。\n\n蘇孟達立即將七星鎏金鏡從木匣中取了出來。\n\n「魏長官，咱們試試？」\n\n魏戌俞接過古鏡，將鏡面朝向銅板。\n\n梁副官則舉起手電筒，替兩人照亮圖案。\n\n鏡中很快浮現出了那座地下宮殿。\n\n然而，與銅板上所雕刻的景象不同，鏡中的宮殿竟然多出了許多原先並不存在的道路。\n\n那座只修了一半的橋，另一端連向一座隱藏於水下的殿宇。\n\n原本相互隔絕的兩條長廊，在鏡中也有了相連的階梯。\n\n就連中央那口棺槨的下方，都多出了一條向深處延伸的通道。\n\n蘇孟達瞪大了眼睛。\n\n「原來如此！」\n\n他激動地指著鏡面。\n\n「難怪圖上的道路有些地方根本走不通！原來另外一半得從鏡子裡看！」\n\n梁副官仔細端詳了片刻。\n\n「上校，這些多出來的道路，似乎都位於原本宮殿的下方。」\n\n魏戌俞微微頷首。\n\n「也許這座宮殿本身便有兩重格局。」\n\n他稍稍停頓。\n\n「一重供活人行走，另一重則是死人的路。」\n\n蘇孟達臉上的興奮逐漸收斂了些。\n\n他重新望向那座橫跨黑水的長橋。\n\n「若真是如此，這座墓的地圖便不能只看其中一面。」\n\n「不錯。」\n\n魏戌俞將古鏡移向銅板的右下角。\n\n那條原本延伸至圖案邊緣的長廊，依舊沒有顯現出盡頭。\n\n看來這塊銅板確實並不完整。\n\n他正欲繼續查看，一滴冰冷的水忽然落在了他的手背上。\n\n啪嗒。\n\n魏戌俞低頭望去。\n\n那水珠呈現出一種極淡的灰黑色，沿著他的手背緩緩滑落。\n\n緊接著，第二滴水落在了銅板上。\n\n蘇孟達伸手摸了摸自己的頭頂。\n\n「哪兒來的水？」\n\n梁副官立即將手電筒轉向上方。\n\n光束照亮天花板的一瞬間，幾人不約而同地抬起了頭。\n\n包廂頂部，不知何時已經出現了一大片黑色的水漬。\n\n而那片水漬，仍在不斷擴大。\n\n***\n\n## 正在下沉的火車\n\n起初只是巴掌大的一塊水漬，轉眼間便蔓延至整個車頂。\n\n細密的水珠從木板縫隙中滲出，接連落在地毯上。\n\n程小楓立即向魏戌俞身旁靠了靠。\n\n「這兒怎麼漏水了？」\n\n梁副官走到窗邊，用衣袖擦去玻璃上的霧氣。\n\n「上校，外面不對勁。」\n\n魏戌俞立刻起身。\n\n原本應當不斷向後退去的田野，此刻竟已消失不見。\n\n窗外一片漆黑。\n\n梁副官將手電筒貼近玻璃。\n\n光束照出去的一瞬間，眾人皆是一愣。\n\n窗外，竟然全是水。\n\n大片細小的氣泡沿著玻璃緩緩上升，幾縷深色的水草隨著水流從窗前掠過。\n\n更遠處，隱約可見一座座巨大的石像。\n\n那些石像雙膝跪地，頭顱低垂，靜靜沉在水底。\n\n列車仍然在行駛。\n\n車輪碾過鐵軌的聲音，依舊清晰可聞。\n\n可整列火車，竟彷彿正在一片深不見底的水域中穿行。\n\n蘇孟達目瞪口呆。\n\n「這火車什麼時候改成船了？」\n\n程小楓望著窗外，臉色逐漸發白。\n\n「我們……是不是沉到水底去了？」\n\n魏戌俞沒有回答。\n\n他望向窗外那些石像。\n\n石像的姿勢與北山古道中的鎮墓石像十分相似，然而每一尊都高得驚人。\n\n列車從它們面前駛過時，車頂甚至還不到石像的腰部。\n\n梁副官將手電筒向上移了些。\n\n一尊石像的面孔緩緩出現在光線之中。\n\n那是一張低垂的女子面容。\n\n雙眼緊閉。\n\n神情平靜。\n\n就在列車即將駛過石像的瞬間。\n\n那雙眼睛忽然睜開了。\n\n魏戌俞立即將梁副官往後一拉。\n\n砰！\n\n一隻巨大的手掌重重拍上車窗。\n\n整節車廂劇烈震動。\n\n程小楓嚇得叫了一聲，連忙抓住魏戌俞的手臂。\n\n玻璃上頓時浮現出數道裂痕。\n\n黑色的水沿著裂縫滲了進來。\n\n「離窗戶遠些！」\n\n魏戌俞拉著程小楓退到包廂中央。\n\n梁副官也迅速後退。\n\n窗外那尊石像已經消失在黑暗之中。\n\n然而車頂滴落的水珠，卻愈來愈密集。\n\n不過片刻，地毯便已完全浸濕。\n\n蘇孟達望向地上的黑色皮箱。\n\n「魏長官，您看！」\n\n皮箱中的石板正在微微顫動。\n\n原本從裂縫中緩慢滲出的黑水，此刻竟如同泉水一般，不斷從石板內部湧出。\n\n魏戌俞立即拿起古鏡。\n\n鏡身兩側的白玉，已有一枚完全變黑，另一枚也只剩下指甲大小的一片白色。\n\n梁副官道：\n\n「上校，這玉石變黑的速度比方才快了許多。」\n\n「嗯。」\n\n魏戌俞望著古鏡，又看了眼窗外的水域。\n\n「咱們恐怕正在逐漸離開原本那列火車。」\n\n程小楓愣住了。\n\n「什麼意思？」\n\n蘇孟達蹲下身子，望著那塊不斷湧出黑水的石板。\n\n「程小姐，這可不是一般的鬼打牆。」\n\n他伸出兩根手指，將它們交疊在一起。\n\n「咱們原本所乘的火車，與另一個地方重疊了。起初只有一兩道門、一兩間屋子被換掉，如今連窗外的景象都已經變了。」\n\n程小楓聽得頭皮發麻。\n\n「那如果整列火車都被換掉呢？」\n\n蘇孟達慢慢放下手。\n\n「那咱們恐怕就再也回不去了。」\n\n包廂內頓時一片沉寂。\n\n魏戌俞低頭看向那塊石板。\n\n「不能再耽擱了。」\n\n***\n\n## 被人拆下來的門\n\n梁副官將包廂內尚能使用的手電筒與乾布收了起來。\n\n蘇孟達則取出皮箱中的幾件青銅器，逐一放在桌上。\n\n其中有一枚銅環、兩塊形狀不規則的銅片，以及一件早已斷裂的獸首銅飾。\n\n魏戌俞拿起其中一塊銅片。\n\n銅片邊緣並不平整，表面還殘留著少許石灰與黑色泥土。\n\n「這些東西不像陪葬品。」\n\n蘇孟達點了點頭。\n\n「倒像是被人從什麼東西上頭硬生生撬下來的。」\n\n梁副官聞言，立即蹲到皮箱旁，仔細觀察那塊石板。\n\n「上校，您看石板的背面。」\n\n魏戌俞將石板翻轉過來。\n\n背面共有四處凹陷，其中兩處尚殘留著斷裂的青銅構件。\n\n梁副官拿起桌上的銅片，與其中一處凹陷比對了一番。\n\n竟恰好吻合。\n\n「果然。」\n\n蘇孟達恍然大悟。\n\n「這幾件銅器原本都是固定在石板上的！」\n\n魏戌俞將石板拿到燈光下。\n\n半尺見方的石板，正面刻有七星與玄武，背面則留有明顯的嵌合痕跡。\n\n在石板左側，還有一道向外延伸的弧形刻紋。\n\n紋路到了邊緣便突然中斷。\n\n顯然，這塊石板原本應當與某件更加龐大的東西相連。\n\n魏戌俞沉思片刻。\n\n「蘇爺，你還記不記得北山古道外頭那尊被人挪動的石像？」\n\n「自然記得。」\n\n「石像被人挪開之後，送葬的隊伍便能沿著古道出入。城西水井的鎮水石也是如此，原本被壓在井中的東西，在石蓋被移開後，便能夠從水中爬出來。」\n\n魏戌俞望著石板。\n\n「若這塊東西也是從某處用來封閉通道的機關上拆下來的呢？」\n\n梁副官立即明白了他的意思。\n\n「原本被封在另一頭的東西，便能順著它出來。」\n\n蘇孟達望向窗外漆黑的水域。\n\n神情愈發凝重。\n\n「我說呢，哪有人隨身帶著一口通往古墓的箱子。原來錢世豪帶在身上的，是那扇門的一部分！」\n\n程小楓聽了半天，忍不住問道：\n\n「那把石板放回去，不就好了嗎？」\n\n三人同時轉頭望向她。\n\n程小楓眨了眨眼睛。\n\n「我說錯了嗎？」\n\n魏戌俞搖頭。\n\n「沒有。」\n\n他望向手中的七星鎏金鏡。\n\n「問題是，咱們得先找到那扇門。」\n\n蘇孟達站起身。\n\n「那扇門怕是在墓裡吧？難不成真要走進方才的石階？」\n\n「未必。」\n\n魏戌俞將鏡面朝向石板。\n\n鏡中的石板逐漸顯現出來。\n\n然而石板四周的景象，卻並不是他們所在的包廂。\n\n它被嵌在了一道巨大的圓形石門中央。\n\n石門表面雕刻著數十道交錯的紋路，四周共有十二尊面朝中央的石像。\n\n在石門的最上方，懸著一盞青銅油燈。\n\n燈火微弱。\n\n幾條粗大的鐵鏈自門內延伸出來，消失在下方的石階之中。\n\n梁副官俯身望向鏡面。\n\n「上校，就是這道門？」\n\n「應當是。」\n\n蘇孟達伸手指向石門外側。\n\n「等等，您看看那盞燈後頭！」\n\n魏戌俞稍稍偏轉鏡身。\n\n鏡中竟出現了一截木製欄杆。\n\n欄杆旁還有一扇掛著銅製門牌的車廂門。\n\n兩種原本毫不相干的景象，此刻卻被硬生生拼接在了一起。\n\n魏戌俞站起身，望向包廂外。\n\n「它就在這列火車上。」\n\n***\n\n## 走不到盡頭的長廊\n\n四人將皮箱中的石板、銅器及銅刻圖一併收妥，重新離開包廂。\n\n外頭的走廊已積了薄薄一層黑水。\n\n腳踩上去，發出令人不舒服的黏膩聲響。\n\n魏戌俞走在最前方，右手持著手槍，左手握著古鏡。\n\n梁副官負責殿後。\n\n蘇孟達提著皮箱與木匣，走在兩人之間。\n\n程小楓則緊緊跟在魏戌俞身旁。\n\n每當走過一扇敞開的包廂門，她都忍不住往裡頭看上一眼，生怕又有什麼東西突然從黑暗中伸出手來。\n\n魏戌俞察覺到她的緊張。\n\n「不要看裡頭。」\n\n「喔……」\n\n她立即將目光收了回來。\n\n「看著腳下，跟著我走。」\n\n「好。」\n\n程小楓乖乖點頭，伸手攥住他襯衫後方的一小截衣料。\n\n四人接連走過數間包廂。\n\n魏戌俞不時舉起古鏡，觀察周圍的景象。\n\n有些地方在鏡中仍是車廂。\n\n有些地方則變成了潮濕的石壁。\n\n愈往前走，鏡中的古墓景象便愈加清晰。\n\n然而走了約莫一刻鐘，梁副官忽然停下腳步。\n\n「上校，等等。」\n\n魏戌俞回過頭。\n\n梁副官指向旁邊一扇包廂門。\n\n門板上有一道極深的裂痕。\n\n裂痕下方，還留著一個彈孔。\n\n「這是我方才開槍時留下的。」\n\n蘇孟達一愣。\n\n「咱們又走回來了？」\n\n梁副官點頭。\n\n「而且是從同一個方向回來的。」\n\n魏戌俞環顧四周。\n\n果然。\n\n地上散落的茶杯碎片、牆壁上的黑色手印，皆與先前經過時一模一樣。\n\n這條走廊看似筆直，實際上卻首尾相連。\n\n無論他們走多遠，最終都會回到原地。\n\n蘇孟達嘆了口氣。\n\n「得，又碰上老熟人了。」\n\n程小楓小聲問道：\n\n「鬼打牆？」\n\n「正是。」\n\n「那該怎麼辦？」\n\n蘇孟達看向魏戌俞。\n\n魏戌俞沒有說話，而是重新將古鏡舉起。\n\n鏡中，同樣是一條筆直的走廊。\n\n然而兩側包廂的位置，似乎與眼前所見略有差異。\n\n他試著向前走了幾步。\n\n程小楓也跟著湊了過來。\n\n她望望鏡子，又望望前方的走廊。\n\n忽然皺起了眉頭。\n\n「等等。」\n\n魏戌俞低頭看她。\n\n「怎麼？」\n\n「你看那兩盞燈。」\n\n她伸出手，指向走廊上方。\n\n兩側的電燈原本皆以相同的間隔排列，唯獨前方有兩盞燈靠得特別近。\n\n「這兩盞燈擺得好奇怪，明明其他地方都隔得一樣遠。」\n\n程小楓又指向鏡面。\n\n「可是鏡子裡，只有一盞。」\n\n魏戌俞立即順著她的手指望去。\n\n果然。\n\n鏡中那兩盞燈所在的位置，只有一盞電燈。\n\n而原本位於兩盞燈之間的牆壁，在鏡中竟是一扇半掩的門。\n\n梁副官走上前，伸手敲了敲牆壁。\n\n咚、咚。\n\n聲音空洞。\n\n「上校，後頭是空的。」\n\n魏戌俞走到牆壁前，重新端詳那兩盞電燈。\n\n仔細看去，兩盞燈之間的牆面上，甚至還有兩條極不顯眼的接縫。\n\n就連牆上的木紋，也在接縫處突然中斷。\n\n彷彿有人將兩段原本互不相連的車廂，硬生生拼在了一起。\n\n「看來這便是兩處空間交疊的位置。」\n\n魏戌俞將鏡面對準兩盞電燈之間的牆壁。\n\n隨著鏡身緩緩移動，一道極淡的門框竟逐漸浮現在木板上。\n\n梁副官伸手一推。\n\n吱呀——\n\n牆壁向內開啟。\n\n一股冰冷的氣息迎面撲來。\n\n門後並非另一節車廂。\n\n而是一條鋪滿青灰色石磚的長廊。\n\n長廊盡頭，燃著一盞青色的油燈。\n\n魏戌俞目光一凝。\n\n「找到了。」\n\n***\n\n## 鐵鏈深處的哭聲\n\n四人踏入石廊。\n\n腳下的黑水沒過鞋底，冰冷刺骨。\n\n與先前所見的石階不同，這條長廊並不向下延伸，而是筆直地通往前方。\n\n兩側的石壁上刻滿了密密麻麻的人形圖案。\n\n魏戌俞將手電筒移近。\n\n那些人皆雙膝跪地，雙手高舉，面容卻是一片空白。\n\n每個人的脖頸上都刻著一條細長的鎖鏈。\n\n數百條鎖鏈沿著石壁向前延伸，最終匯聚於長廊盡頭的圓形石門。\n\n蘇孟達望著壁刻，神情逐漸凝重起來。\n\n「魏長官，這些不就是無舌銅鈴上的引魂紋嗎？」\n\n魏戌俞點頭。\n\n「不過這兒的鎖鏈更加清楚。」\n\n他舉起手電筒，沿著鎖鏈的紋路照去。\n\n「那些人並不是自願跪在這裡的。」\n\n梁副官也走近了一些。\n\n「上校，您看這個。」\n\n石壁最下方刻著幾個體形較小的人。\n\n其中一人抱著嬰孩，另一人的雙手則抓著身旁男子的衣裳。\n\n他們的身體皆朝著石門的方向跪伏，頭顱卻用力向後扭轉，似乎正在竭力抗拒某種力量。\n\n程小楓望著那些圖案。\n\n「他們是不是不想進去？」\n\n「應該是。」\n\n蘇孟達低聲說道。\n\n「我從前見過不少古墓裡的殉葬圖。大多數都是將那些人刻成恭恭敬敬侍奉墓主的模樣，像這般把人用鐵鏈拴起來的，倒真不多見。」\n\n魏戌俞繼續向前。\n\n長廊兩側的圖案逐漸發生變化。\n\n那些被鎖鏈束縛的人，起初還能辨認出各自的身形。\n\n愈靠近石門，彼此之間的距離便愈來愈小。\n\n到了最後，數十個人竟被雕刻成了一團。\n\n手臂相互交錯。\n\n身體彼此重疊。\n\n最外圍只剩下一張仰面朝天、張嘴嘶喊的人臉。\n\n梁副官停下腳步。\n\n「上校。」\n\n魏戌俞望向那幅壁刻。\n\n幾乎在同一瞬間，兩人都想起了方才在火車上追逐他們的怪物。\n\n蘇孟達喃喃道：\n\n「原來那東西，早在這座墓修建之時便已經存在了……」\n\n魏戌俞沒有接話。\n\n他將手電筒移向壁刻下方。\n\n那裡還留著幾個已經磨損的古字。\n\n蘇孟達湊近辨認。\n\n「聚……魂……」\n\n他伸手擦去石壁上的水漬。\n\n最後兩個字逐漸顯現。\n\n「為……鎖。」\n\n聚魂為鎖。\n\n四人一時皆沒有說話。\n\n長廊深處忽然傳來一陣鐵鏈拖曳的聲音。\n\n嘩啦。\n\n嘩啦。\n\n那聲音在狹窄的石廊內迴盪，彷彿有個身披沉重鎖鏈的人，正在一步一步地朝他們走來。\n\n魏戌俞立即抬槍。\n\n梁副官也迅速轉身戒備。\n\n程小楓不由自主地屏住呼吸。\n\n然而前方並沒有任何人影。\n\n只有那道圓形石門，靜靜矗立在油燈之下。\n\n鐵鏈聲再度響起。\n\n這一回，卻是從他們身後傳來的。\n\n蘇孟達猛然回頭。\n\n「不好！」\n\n原本通往火車的門口，不知何時已被一片濃重的黑暗所吞沒。\n\n而在那片黑暗之中。\n\n一個男人正搖搖晃晃地朝他們走來。\n\n男人身穿西裝，兩條手臂無力地垂在身側。\n\n頭顱低垂。\n\n步伐極為僵硬。\n\n程小楓看清那身衣裳的一瞬間，整個人猛然一顫。\n\n「錢、錢世豪？」\n\n魏戌俞臉色一沉。\n\n他將程小楓擋在身後。\n\n「別靠近。」\n\n錢世豪明明已經死了。\n\n梁副官親自確認過他的氣息，絕不可能有錯。\n\n然而此刻，那具屍體卻實實在在地站在四人面前。\n\n「程小姐……」\n\n錢世豪慢慢抬起頭。\n\n一雙眼睛早已失去神采，嘴角卻帶著極為怪異的笑容。\n\n「妳去哪兒啦？」\n\n程小楓嚇得緊緊抓住魏戌俞的衣裳。\n\n那具屍體又往前走了一步。\n\n「不是說……咱們要成親嗎？」\n\n它的聲音忽然變了。\n\n「小姐。」\n\n這一次，竟是程父的聲音。\n\n「妳怎麼不回家呀？」\n\n程小楓臉色煞白。\n\n魏戌俞立即開口。\n\n「不要回答。」\n\n那具屍體歪了歪頭。\n\n緊接著，從它的喉嚨裡傳出了一聲極為熟悉的低語。\n\n「抓緊我，不要離開我的身邊。」\n\n程小楓渾身一冷。\n\n那竟是魏戌俞方才對她說過的話。\n\n魏戌俞眼神驟然一沉。\n\n砰！\n\n槍聲在石廊內炸響。\n\n錢世豪的屍體猛然向後一仰，卻沒有倒下。\n\n一隻蒼白的手，從它肩膀後方緩緩伸了出來。\n\n緊接著，又有數條手臂從黑暗中探出，將整具屍體向上提起。\n\n直到此刻，四人才真正看清。\n\n方才朝他們走來的，根本不是錢世豪。\n\n而是那具怪物拖著他的屍體，藏身於長廊頂部。\n\n它像操縱木偶一般，操縱著一個早已死去的人。\n\n蘇孟達倒吸一口涼氣。\n\n「連死人都不肯放過！」\n\n魏戌俞立即轉頭。\n\n「副官，掩護！」\n\n梁副官應聲開槍。\n\n「蘇爺，把石板拿出來！」\n\n***\n\n## 封門\n\n蘇孟達連忙跑到圓形石門前，將黑色皮箱放下。\n\n石門中央果然有一處空缺。\n\n四周破損的痕跡十分新鮮，碎裂的青銅構件仍然嵌在石縫裡。\n\n蘇孟達取出石板，試著將它放入凹槽。\n\n然而石板剛剛接近石門，一股無形的力量便猛地將它推了出來。\n\n「哎！」\n\n蘇孟達險些沒能拿穩。\n\n魏戌俞迅速趕了過來。\n\n「怎麼回事？」\n\n「放不進去！這東西像是有股勁兒在往外頂！」\n\n魏戌俞接過石板。\n\n石板與凹槽的大小明明完全相符。\n\n可當他靠近石門時，裂縫中的黑水便湧得更加猛烈。\n\n彷彿有什麼東西正在另一側阻止他們將門關上。\n\n身後槍聲不斷。\n\n梁副官已經退到了距離石門不遠的地方。\n\n「上校，時間不多了！」\n\n魏戌俞將古鏡舉至石門前。\n\n鏡中所見的石門，與眼前幾乎一模一樣。\n\n唯獨中央那處凹槽周圍的星辰，排列的方向完全相反。\n\n他低頭看向石板。\n\n石板上的七星紋路，與眼前石門上的七星方向相同。\n\n卻與鏡中的石門相反。\n\n蘇孟達也察覺到了。\n\n「魏長官，您記不記得咱們在北山撿到的那兩盞信號燈？」\n\n「嗯。」\n\n「兩盞燈的刻字正好相反！咱們當時便懷疑，另一頭的東西與這一頭都是相反的。」\n\n蘇孟達指著石門。\n\n「這塊石板若是從另一邊拆下來的，咱們在這兒硬往裡塞，自然放不回去！」\n\n魏戌俞望向鏡面。\n\n「所以，真正能夠放回石板的地方，在鏡子的另一頭。」\n\n他仔細觀察古鏡背面。\n\n七顆星辰靜靜嵌在凹槽之中。\n\n每顆星辰旁都有極細的刻度。\n\n而石板缺口四周，同樣刻有七道細小的標記。\n\n其中六道已與鏡背的星辰對應。\n\n唯獨最後一道，方向完全相反。\n\n魏戌俞將古鏡移近石門。\n\n那顆位於斗柄末端的星辰，竟微微震動起來。\n\n喀。\n\n鏡身內部傳出一聲輕響。\n\n「蘇爺。」\n\n「在！」\n\n「拿好石板。」\n\n魏戌俞將手指按在最後一顆星辰上，慢慢轉動。\n\n喀。\n\n喀。\n\n隨著星辰轉動，石門上的紋路竟逐漸發出極淡的光芒。\n\n梁副官回頭看了一眼。\n\n「上校，門在動！」\n\n圓形石門發出一陣沉悶的轟鳴。\n\n然而它並沒有打開。\n\n石門表面那層原本堅硬的石質，竟如同水面一般，逐漸泛起細密的波紋。\n\n蘇孟達瞪大眼睛。\n\n「這可真是活見鬼了！」\n\n魏戌俞盯著古鏡。\n\n當最後一顆星辰與鏡中石門上的刻度完全重合時，他的手猛然停住。\n\n鏡中的凹槽與眼前的凹槽，終於疊在了一起。\n\n「現在！」\n\n蘇孟達立即將石板向前推去。\n\n這一回，石板沒有受到任何阻礙。\n\n它緩緩沒入石門中央。\n\n咔嚓！\n\n四周的青銅構件同時震動。\n\n石板穩穩嵌入其中。\n\n一瞬間。\n\n整條石廊內的鐵鏈聲全部停了下來。\n\n蘇孟達大喜。\n\n「成了！」\n\n然而就在下一刻。\n\n石門後方突然傳來一陣震耳欲聾的撞擊聲。\n\n轟！\n\n石板猛然向外凸起半寸。\n\n蘇孟達臉色一變。\n\n「還沒完！」\n\n他連忙用雙手抵住石板。\n\n魏戌俞也立即上前。\n\n兩人合力將石板重新壓了回去。\n\n身後的怪物似乎察覺到了什麼，猛然發出一聲尖銳的嘶鳴。\n\n它將錢世豪的屍體重重拋到一旁，數條手臂同時攀住石壁，瘋狂朝石門撲來。\n\n梁副官接連開槍。\n\n砰！砰！\n\n怪物的身體僅僅停頓了一瞬。\n\n隨即繼續向前。\n\n「上校！」\n\n魏戌俞回頭望去。\n\n怪物已經近在咫尺。\n\n「退過來！」\n\n梁副官立即後撤。\n\n程小楓站在石門旁，慌亂地望著四周。\n\n她知道自己幫不上打鬥的忙，卻不願只是站在原地等著。\n\n她的目光忽然落在皮箱中剩餘的幾件青銅器上。\n\n那些東西原本便是從石板背面拆下來的。\n\n如今石板雖然回到了原位，卻沒有任何東西能夠將它固定住。\n\n「夫君！」\n\n她連忙將銅環與銅片取了出來。\n\n「這些東西是不是也得放回去？」\n\n魏戌俞低頭一看。\n\n「對！」\n\n他接過銅環，望向石板下方。\n\n那裡正有一道與銅環大小相符的缺口。\n\n蘇孟達也立即明白了。\n\n「難怪門關不住，鎖都還沒裝上呢！」\n\n兩人迅速將那些殘存的青銅構件放回原來的位置。\n\n最後一塊銅片嵌入石縫的一瞬間。\n\n整道石門猛然向內一沉。\n\n轟隆——\n\n石廊兩側的鎖鏈紋路同時亮起。\n\n那具怪物原本已經撲至梁副官面前，卻忽然停在了半空中。\n\n彷彿有什麼看不見的東西，猛地拉住了它。\n\n***\n\n## 不肯離去的亡魂\n\n嘩啦！\n\n鐵鏈的聲音從石門深處傳來。\n\n怪物的身體猛然向後一扯。\n\n它發出一聲淒厲的嘶鳴，數條手臂死死扣住兩側石壁，指尖在石磚上留下道道黑色痕跡。\n\n魏戌俞舉起七星鎏金鏡。\n\n鏡中，那些被鎖鏈束縛的亡魂正被一股力量重新拖向石門。\n\n他們瘋狂掙扎著。\n\n有人哭喊。\n\n有人跪地求饒。\n\n有人伸出雙手，拼命想抓住身旁的同伴。\n\n那個額頭帶傷的年輕男人，也在其中。\n\n「救命……」\n\n這一回，魏戌俞竟然清清楚楚地聽見了他的聲音。\n\n「我不想進去……」\n\n那男人伸著手，神情驚恐到了極點。\n\n在他身後，數不清的亡魂逐漸沒入石門。\n\n「蘇爺。」\n\n魏戌俞沉聲問道：\n\n「有沒有辦法將他們身上的鎖鏈解開？」\n\n蘇孟達望著鏡中那些人的模樣。\n\n半晌，搖了搖頭。\n\n「魏長官，咱們連這些鎖鏈究竟是什麼東西都不知道。貿然將門再打開，恐怕不僅救不了他們，還會放出更多東西。」\n\n魏戌俞沉默了。\n\n鏡中那個年輕男人的手，正在一點一點地消失。\n\n其餘的亡魂也逐漸退入門後的黑暗。\n\n程小楓望著這一幕。\n\n原先對那具怪物的恐懼，竟在不知不覺間淡去了些。\n\n「原來……他們也是被困在裡頭的。」\n\n她小聲說道。\n\n蘇孟達嘆了口氣。\n\n「有些人死了，尚且能入土為安。有些人卻連死了都不得安寧。」\n\n魏戌俞握緊古鏡。\n\n他想起那節失蹤的軍用車廂。\n\n倘若那些失蹤的士兵也遭遇了同樣的事情……\n\n他不敢再往下想。\n\n最後一聲鐵鏈響動過後。\n\n怪物徹底消失了。\n\n圓形石門重新恢復平靜。\n\n原本湧出黑水的裂縫也慢慢乾涸。\n\n然而蘇孟達尚未來得及鬆口氣，梁副官便突然喊道：\n\n「上校，後面的路！」\n\n眾人回頭望去。\n\n石廊正在消失。\n\n最遠處的石壁逐漸變成了木製牆板，頂部的青銅油燈也一盞接著一盞地熄滅。\n\n與此同時，列車行駛的聲音愈來愈清晰。\n\n魏戌俞迅速將古鏡收入木匣。\n\n「拿上東西，快走！」\n\n蘇孟達抓起銅刻圖與木匣。\n\n程小楓正要跟上，魏戌俞已經朝她伸出了手。\n\n「來。」\n\n她毫不猶豫地握了上去。\n\n四人朝逐漸恢復原狀的車廂跑去。\n\n身後傳來一陣接連不斷的崩裂聲。\n\n石磚、壁刻、油燈，全都在黑暗中消失。\n\n彷彿這條長廊從來就不曾存在過。\n\n眼看前方便是車廂的出口，程小楓卻突然停頓了一下。\n\n「等等！」\n\n魏戌俞回頭。\n\n她望向石門旁的陰影。\n\n「那裡好像還有一個人！」\n\n魏戌俞順著她的視線望去。\n\n黑暗中，一個穿著白衣的女子正靜靜站在石門前。\n\n長髮垂落。\n\n手腕上戴著一只玉鐲。\n\n魏戌俞的瞳孔猛然一縮。\n\n是庫房裡的那個女子！\n\n那女子沒有向四人靠近，只是微微抬起頭，朝程小楓所在的方向望來。\n\n儘管相隔數丈，程小楓心中卻忽然湧起一股難以形容的熟悉感。\n\n與方才見到那些鬼怪時不同。\n\n眼前這個女子，竟沒有讓她感到害怕。\n\n她不由自主地向前踏出半步。\n\n「妳是……」\n\n魏戌俞立即握緊她的手。\n\n「不能過去！」\n\n轟！\n\n女子身後的石門突然陷入黑暗。\n\n那道白色身影也隨之消失。\n\n程小楓愣在原地。\n\n魏戌俞沒有讓她繼續停留，拉著她迅速穿過車廂門。\n\n就在梁副官最後一個踏出石廊的瞬間。\n\n四周猛然一震。\n\n所有燈光同時熄滅。\n\n***\n\n## 回來了\n\n咣噹、咣噹。\n\n熟悉的車輪聲在耳邊響起。\n\n遠處傳來一陣咳嗽聲。\n\n緊接著，是孩童的啼哭、旅客的談話，以及列車侍者沿途詢問是否需要熱水的聲音。\n\n程小楓慢慢睜開眼睛。\n\n頭頂是一盞昏黃色的電燈。\n\n身旁是整齊排列的木製座椅。\n\n車窗外，月光灑在一片平坦的田野上。\n\n沒有黑水。\n\n沒有石像。\n\n也沒有任何鬼怪。\n\n他們回到了火車上。\n\n一名抱著孩童的婦人從旁經過，有些奇怪地看了四人一眼。\n\n「幾位先生，這是怎麼了？」\n\n蘇孟達怔怔地望著她。\n\n「您……是活人吧？」\n\n婦人的臉色頓時變得難看起來。\n\n「這位先生怎麼說話的？」\n\n她抱著孩子，立即快步走開。\n\n蘇孟達卻絲毫不在意。\n\n他望著來來往往的旅客，竟露出了一個極為燦爛的笑容。\n\n「活的！都是活的！」\n\n梁副官收起手槍。\n\n「蘇爺，您小聲些。」\n\n「梁副官，您難道不覺得這些人看著格外親切嗎？」\n\n魏戌俞則走到窗旁，仔細確認外頭的景象。\n\n片刻後，他低頭看了一眼懷錶。\n\n眉頭忽然皺了起來。\n\n「副官，現在幾點？」\n\n梁副官取出懷錶。\n\n「十二點二十七分。」\n\n蘇孟達一愣。\n\n「多少？」\n\n「十二點二十七。」\n\n蘇孟達猛然抬頭望向車廂上方的掛鐘。\n\n同樣是十二點二十七分。\n\n四人方才在那列異變的火車中奔逃、打鬥，還走過了那條不知通往何處的石廊。\n\n少說也有一個鐘頭。\n\n然而真正的火車上，距離他們最初聽見尖叫，竟然只過去了不到一刻鐘。\n\n梁副官神情凝重。\n\n「上校，與北山車站那次一樣。」\n\n「嗯。」\n\n魏戌俞重新收起懷錶。\n\n「那一頭的時間，與這裡不同。」\n\n蘇孟達忍不住道：\n\n「照這樣下去，咱們將來若真在墓裡待上幾日，回來豈不是連自己幾歲都弄不清楚了？」\n\n魏戌俞沒有理會他。\n\n他朝梁副官吩咐道：\n\n「去找列車長，確認是否有人失蹤。另外，查查錢世豪的包廂。」\n\n「是。」\n\n梁副官正欲離開，魏戌俞又補了一句。\n\n「我稍後過去。錢世豪的事情，也一併處理。」\n\n「明白。」\n\n蘇孟達則打開木匣。\n\n古鏡兩側的白玉正在逐漸恢復原本的色澤。\n\n那些如同活物般的黑色紋路，一點一點地向玉石深處退去。\n\n只是其中一枚白玉的底部，仍然留著一絲細如髮絲的黑線。\n\n蘇孟達盯著那道黑線看了許久。\n\n「魏長官，看來咱們只是把那扇門關上了。」\n\n魏戌俞微微頷首。\n\n「真正的問題，還在墓裡。」\n\n***\n\n## 劫後餘生\n\n回到原本的包廂後，程小楓終於坐了下來。\n\n桌上的桂花糕還剩著幾塊。\n\n茶壺中的水甚至尚未完全冷卻。\n\n她望著眼前這些熟悉的東西，忽然有種恍如隔世的感覺。\n\n蘇孟達將木匣與銅刻圖分別收好，又取來一杯熱茶，放到她面前。\n\n「程小姐，喝口茶，壓壓驚。」\n\n「謝謝蘇先生。」\n\n程小楓雙手捧起茶杯。\n\n直到此刻，她才發現自己的手指還在微微發抖。\n\n蘇孟達在對面的座椅上坐了下來，長長地吐出一口氣。\n\n「折騰了一整晚，總算能安安穩穩地坐一會兒了。」\n\n他低頭看了看自己沾滿泥水的長衫。\n\n「可惜了我這身新衣裳，原本還打算穿回北城給鋪子裡的人瞧瞧呢。」\n\n程小楓聞言，低頭看向自己身上那件寬大的西裝外套。\n\n經過方才的奔逃，外套下襬早已沾了不少黑水。\n\n她有些懊惱地伸手拍了拍。\n\n「糟糕，把他的衣服弄髒了。」\n\n蘇孟達笑道：\n\n「您就穿著吧。魏長官若是連件衣裳都捨不得，那才叫人笑話。」\n\n程小楓抿了抿嘴，將外套又往身上攏緊了些。\n\n倒也沒有再說什麼。\n\n***\n\n約莫半個鐘頭後，魏戌俞與梁副官一同回到了包廂。\n\n列車上的大部分旅客並不知道方才發生過什麼事情。\n\n有人聽見了尖叫，有人察覺車廂劇烈晃動，還有人聲稱自己做了一場極為可怕的夢。\n\n那名提著熱水壺的列車侍者，被發現昏倒在走廊上，尚有氣息。\n\n至於錢世豪的隨從，其中一人也被找到了。\n\n正是那個被魏戌俞一拳打暈的男人。\n\n他醒來後便神志不清，反覆喊著箱子裡有人，怎麼也不肯再回到原本的包廂。\n\n錢世豪的屍體則被發現在另一節車廂的茶水間內。\n\n列車長已派人看守，待抵達北城後，將交由當地軍警處理。\n\n「另外，蘇爺。」\n\n梁副官看向蘇孟達。\n\n「錢世豪的行李大多還在，唯獨那只黑色皮箱沒有找到。」\n\n蘇孟達點了點頭。\n\n「那箱子與石板恐怕已經留在另一頭了。」\n\n魏戌俞將手中的帽子放在桌上。\n\n「副官，回北城後，安排軍醫替那名隨從看看。等他神志清醒，再問問是誰將箱子交給錢世豪的。」\n\n「是。」\n\n「錢世豪的死因，我會親自向軍警說明。」\n\n梁副官點頭。\n\n蘇孟達則摸了摸下巴。\n\n「錢世豪雖然不是什麼好東西，可他背後的那個人，怕是比他還要歹毒得多。」\n\n魏戌俞看向他。\n\n蘇孟達繼續道：\n\n「明知那塊石板有古怪，卻還讓錢世豪帶著它四處走動。倘若咱們今晚沒能將門封住，這一整列火車上的人，恐怕都得跟著遭殃。」\n\n梁副官沉聲道：\n\n「也有可能，他原本便打算利用錢世豪試探那塊石板與古鏡的用途。」\n\n「嗯。」\n\n魏戌俞微微頷首。\n\n「此事回北城再議。今晚先休息。」\n\n蘇孟達立即往椅背上一靠。\n\n「您可算說了句我愛聽的話。」\n\n梁副官取來藥箱，重新替魏戌俞處理左臂上的傷口。\n\n原本已經包紮妥當的地方，經過接連幾場打鬥，早已被鮮血浸透。\n\n程小楓坐在一旁，望著梁副官拆下那層染血的紗布，忍不住皺起眉頭。\n\n「你的傷怎麼又流血了？」\n\n魏戌俞低頭看了一眼。\n\n「方才打鬥時牽動了傷口。」\n\n「疼不疼？」\n\n「還好。」\n\n「什麼都還好。」\n\n程小楓小聲嘀咕著。\n\n「流了這麼多血，也不知道愛惜自己一點。」\n\n魏戌俞聞言，抬頭望了她一眼。\n\n她卻正目不轉睛地看著梁副官替他上藥，眉頭皺得比他這個受傷的人還要緊。\n\n「只是皮外傷，不礙事。」\n\n程小楓沒有再反駁。\n\n只是默默將桌上那杯尚未喝過的熱茶，往他面前推了推。\n\n***\n\n## 魏家的宿命\n\n夜色漸深。\n\n包廂內的燈光被調暗了些。\n\n蘇孟達靠在座椅上，不消片刻便打起了呼嚕。\n\n梁副官將藥箱收好，也在對面的座位上閉目休息。\n\n魏戌俞則坐在窗旁，低頭翻閱那幅從黑色皮箱中取出的銅刻圖。\n\n程小楓捧著茶杯，安靜地坐在他身旁。\n\n她難得沒有像先前那樣，想到什麼便拉著他問上幾句。\n\n今晚發生的事情實在太多。\n\n那些消失的車廂、沉在水底的石像、被鐵鏈束縛的亡魂，以及最後出現在石門旁的白衣女子，仍不斷在她腦海中浮現。\n\n她轉過頭，望向魏戌俞。\n\n這個男人此刻正神情專注地研究那幅古墓圖。\n\n彷彿方才那些險些令他們喪命的事情，不過是他平日所經歷的尋常事務。\n\n過了許久，程小楓終於忍不住開口。\n\n「夫君。」\n\n魏戌俞抬起頭。\n\n「怎麼了？」\n\n「你們以前……也遇過這種事情嗎？」\n\n「嗯。」\n\n「很多次？」\n\n魏戌俞想了想。\n\n「有些比今晚還要麻煩。」\n\n程小楓睜大了眼睛。\n\n「還有比今晚更可怕的？」\n\n「有。」\n\n她低頭望著手中的茶杯。\n\n光是今晚這一遭，便已經讓她覺得自己這輩子再也不想遇見第二次。\n\n可聽魏戌俞的語氣，這種事情對他而言，似乎早已不是頭一回。\n\n「所以，你平日都在做這些事情嗎？」\n\n「軍中的事務很多，並非全是這些。」\n\n魏戌俞將銅刻圖放回桌上。\n\n「不過這些年，確實也處理過不少與此類似的事情。」\n\n程小楓沉默片刻。\n\n「你不害怕嗎？」\n\n魏戌俞望向她。\n\n這個問題，倒是許久沒有人問過他了。\n\n在軍中，他是眾人的長官。\n\n無論遇上什麼事情，所有人都在等著他拿主意。\n\n在魏家，他則是那個自幼便被父親寄予厚望的孩子。\n\n從他記事起，父親教他的第一件事情，便不是如何遠離危險，而是如何在危險之中活下來。\n\n至於害怕……\n\n那自然也是有過的。\n\n只是這些年，他早已習慣將那些情緒放在身後。\n\n「怕過。」\n\n魏戌俞平靜地答道。\n\n程小楓有些意外。\n\n「真的？」\n\n「我也是人，自然會怕。」\n\n她望著他的側臉。\n\n「那為什麼還要去做？」\n\n魏戌俞沒有立即回答。\n\n他轉頭望向窗外。\n\n遠處的山影在月色下緩緩掠過，偶爾能看見幾戶人家尚未熄滅的燈火。\n\n那些人此刻或許早已安然入睡。\n\n不必知道這世間還存在著什麼東西。\n\n也不必知道，有些本該永遠埋在地下的祕密，正在逐漸重見天日。\n\n「有些事情，總得有人去做。」\n\n魏戌俞緩緩開口。\n\n「我父親如此，魏家的先輩亦是如此。」\n\n程小楓微微一怔。\n\n「你爹以前也做這些事？」\n\n「嗯。」\n\n「所以是你爹要你做的？」\n\n魏戌俞搖了搖頭。\n\n「他已經不在了。」\n\n程小楓愣了一下。\n\n她原本還想繼續詢問，卻在看見魏戌俞的神情後，將到了嘴邊的話重新吞了回去。\n\n包廂內只剩下列車行駛的聲音。\n\n過了許久，她才輕聲問道：\n\n「那你不能選擇不做嗎？」\n\n魏戌俞聞言，忽然笑了一下。\n\n那笑容很淡。\n\n與先前被她逗得無奈時的笑容並不相同。\n\n「程小姐，不是每個人都能隨心所欲地過自己想過的日子。」\n\n他低頭望向桌上的七星鎏金鏡。\n\n想起父親。\n\n想起那些已經不在人世的族人。\n\n也想起北山那節至今仍下落不明的軍用車廂。\n\n有些責任，並不會隨著一個人的死亡而消失。\n\n它只會落到下一個人的肩上。\n\n魏戌俞沉默片刻，重新望向窗外。\n\n**「大概，這便是我的宿命吧。」**\n\n程小楓望著他的側臉，久久沒有說話。\n\n這是她第一次覺得，眼前這個彷彿什麼事情都能處理得游刃有餘的男人，身上似乎背負著許多她尚且不知道的東西。\n\n窗外夜色深沉。\n\n北上的列車依舊沿著鐵軌，駛向遠方。\n\n（第十二回完）"}, {"n": 13, "title": "魏府來了位夫人", "body": "翌日清晨，北上的列車終於抵達北城。\n\n魏戌俞將靠在自己肩上熟睡的程小楓叫醒，待眾人收拾妥當後，一同下了火車。\n\n軍部早已派人在月台等候。魏戌俞簡單交代了昨夜列車上發生的事情，命人將錢世豪的遺體交由軍警處理，倖存的隨從則送往軍醫院，嚴加看守。\n\n原本，他打算先替程小楓安排一間飯店，誰知這位大小姐執意要以清點抵押品為由跟著他回府。\n\n考慮到她昨夜受了驚嚇，身上的衣裳又尚未更換，魏戌俞也不願在車站與她多作爭論，便暫且答應了。\n\n四人隨即乘車返回魏府。\n\n***\n\n## 初入魏府\n\n黑色的鐵門緩緩向兩側敞開。\n\n汽車沿著石板道路駛入庭院，最終停在一座兩層高的宅邸前。\n\n主屋採中西合璧的樣式，灰白色的外牆搭配深色木窗，屋頂保留著中式建築的飛簷。庭院兩側栽著幾株松柏，中央是一座造型古樸的石雕水池。\n\n整座宅邸氣派而沉穩，卻少了幾分尋常富貴人家的熱鬧。\n\n程小楓一下車，便饒有興致地打量起四周。\n\n「這就是你家？」\n\n「嗯。」\n\n「比我想像中還要漂亮。」\n\n她望向庭院兩側。\n\n「不過花好像少了些。那邊若種上一排山茶花，應該會很好看。」\n\n魏戌俞看了她一眼。\n\n「妳倒是連庭院都開始打算了。」\n\n「我只是給你一點建議嘛！」\n\n程小楓笑著說道。\n\n「你不覺得這兒太素了嗎？」\n\n蘇孟達也跟著望了一眼。\n\n「程小姐說得有理。魏長官，您這院子一年四季瞧著都差不多，我來了這麼多年，連朵像樣的花都沒見過。」\n\n魏戌俞淡淡回道：\n\n「你若喜歡，大可每日帶幾盆花過來。」\n\n「那還是算了，我鋪子裡的東西都快顧不過來了。」\n\n此時，一名身穿深色長衫、頭髮已有些花白的老人，帶著幾名家僕從主屋走了出來。\n\n老人是魏府的管家，府中上下皆稱他為輝叔。\n\n他在魏家服侍已有三十餘年，自魏戌俞年幼時起，便一直負責府中的大小事務。\n\n站在他身旁的，則是一名梳著辮子的年輕女傭，名叫幸之。\n\n「先生，您回來了。」\n\n輝叔迎上前來，一眼便注意到魏戌俞左臂上的傷勢。\n\n「您又受傷了？」\n\n「小傷，不礙事。」\n\n「我稍後讓人請大夫過來。」\n\n「好。」\n\n魏戌俞並未推辭。\n\n輝叔又向梁副官與蘇孟達問候了幾句，這才注意到站在汽車旁的程小楓。\n\n他微微一怔。\n\n眼前的姑娘容貌出眾，衣著卻有些奇怪。\n\n一件寬大的男式西裝外套罩在旗袍之外，袖口長了一大截，下襬還沾著些許泥水。\n\n輝叔仔細一瞧。\n\n那不正是先生前些日子南下時帶走的衣裳嗎？\n\n「先生，這位是？」\n\n「維安城程家商會的千金，程小楓。此番古鏡便是從程家購得的。」\n\n程小楓立即笑著打招呼。\n\n「輝叔您好！」\n\n「程小姐，您好。」\n\n輝叔連忙欠身。\n\n魏戌俞繼續吩咐道：\n\n「她昨夜在火車上遇了些麻煩，衣裳也弄壞了。先替她準備一間客房，再找些合適的衣裳過來。」\n\n「是。」\n\n輝叔轉頭望向幸之。\n\n「幸之，妳去將二樓東側的客房收拾一下，備些熱水，讓程小姐好好梳洗。」\n\n「好的。」\n\n幸之正要接過程小楓手中的小皮箱，程小楓卻忽然轉過頭。\n\n「等等。」\n\n魏戌俞望向她。\n\n「怎麼了？」\n\n「你不跟我睡一間啊？」\n\n***\n\n庭院裡驟然安靜了下來。\n\n魏戌俞愣住了。\n\n輝叔也愣住了。\n\n幸之伸出去接行李的手，就這麼停在半空中。\n\n梁副官不動聲色地移開了視線。\n\n至於蘇孟達，原本正在打量院中的石雕水池，聞言猛然轉過頭來。\n\n魏戌俞望著程小楓，半晌才開口。\n\n「妳說什麼？」\n\n程小楓一臉坦然。\n\n「昨晚不是還睡在同一間包廂裡嗎？」\n\n輝叔猛然抬頭，望向自家先生。\n\n魏戌俞的眉頭頓時皺了起來。\n\n「那是火車上的包廂。蘇爺與副官也都在。」\n\n「我知道呀。」\n\n「況且妳我並未成親，怎麼能住在同一間房裡？」\n\n「那倒也是。」\n\n程小楓想了想，竟頗為認同地點了點頭。\n\n「好吧，那就先分開住。」\n\n魏戌俞的眼皮跳了一下。\n\n什麼叫作先分開住？\n\n蘇孟達已經忍不住背過身去，肩膀微微顫抖。\n\n輝叔站在原地，一時間竟不知道該將目光放在哪裡。\n\n先生不過是出了一趟遠門，怎麼回來之後，連婚事都似乎有了著落？\n\n魏戌俞深吸一口氣。\n\n「輝叔，照原先說的安排。」\n\n「是、是！」\n\n程小楓將皮箱交給幸之，倒也沒有繼續糾纏。\n\n「那就麻煩妳了。」\n\n幸之趕忙接過。\n\n「程小姐客氣了。」\n\n程小楓聞言，忽然笑了起來。\n\n「妳不用叫我程小姐。」\n\n幸之有些疑惑。\n\n「那應當怎麼稱呼您？」\n\n「叫我夫人就好！」\n\n魏戌俞猛然轉頭。\n\n「程小楓。」\n\n「嗯？」\n\n「別胡鬧。」\n\n程小楓理直氣壯地說道：\n\n「反正將來都是要這麼叫的，提前習慣一下也沒什麼不好呀。」\n\n輝叔張了張嘴。\n\n「先生，這……」\n\n「叫程小姐。」\n\n「夫人。」\n\n「程小姐。」\n\n「夫人！」\n\n輝叔望望魏戌俞，又望望程小楓，額頭上竟逐漸冒出了汗。\n\n他在魏家服侍了三十餘年，大小風浪也算見過不少。\n\n這等場面，倒真是頭一回碰上。\n\n蘇孟達終於笑出了聲。\n\n「輝叔，您今日可遇上難題了！」\n\n魏戌俞冷冷看了他一眼。\n\n「蘇爺。」\n\n「哎！」\n\n「你笑夠了沒有？」\n\n「差不多了，差不多了！」\n\n蘇孟達連忙擺手。\n\n魏戌俞轉身朝主屋走去。\n\n「輝叔，先讓人準備房間。」\n\n「是！」\n\n輝叔如蒙大赦，立即帶著幸之離開。\n\n程小楓笑盈盈地跟上魏戌俞。\n\n「你家的人還挺有意思的。」\n\n魏戌俞瞥了她一眼。\n\n「他們平日可沒這麼多麻煩。」\n\n***\n\n## 跟著我，不會有好日子\n\n主屋內的布置，與宅邸外觀頗為相似。\n\n深色木製家具、古樸的瓷器，以及幾幅排列整齊的字畫。客廳中央掛著一幅氣勢磅礴的山水畫，窗邊的花瓶卻空無一物。\n\n梁副官將行李交給家僕，隨即向魏戌俞請示。\n\n「上校，我先回軍部一趟。」\n\n「嗯。將這幾日的調查結果帶回來，尤其是北山以西的山區勘察資料。」\n\n「是。」\n\n待梁副官離去，魏戌俞將懷錶放在桌上。\n\n「程小姐，坐下。」\n\n程小楓原本正在欣賞牆上的字畫，聞言轉過身，在他對面的沙發上坐了下來。\n\n「什麼事？」\n\n「咱們談談妳回維安城的事情。」\n\n她臉上的笑容頓時淡了下去。\n\n「我才剛到，你又要我回去？」\n\n魏戌俞沒有迴避她的目光。\n\n「妳昨夜擅自離開維安城，令尊此刻想必十分著急。即便留了封信，也不能算是妥善交代。」\n\n「我待會兒發封電報回去就是了。」\n\n「那也只能告訴他妳平安抵達，不能改變妳一個人出遠門的事實。」\n\n程小楓皺起眉頭。\n\n「我以前也跟著商會的人出過遠門，又不是什麼都不懂。」\n\n「跟著商會出門，與跟著我，是兩回事。」\n\n魏戌俞的神情逐漸嚴肅起來。\n\n「昨晚在火車上發生的事情，妳都忘了嗎？」\n\n程小楓安靜了片刻。\n\n「沒忘。」\n\n「那些東西從何而來，還會不會再出現，至今尚未查清。維安城那幾個搶奪古鏡的人，也仍然下落不明。」\n\n魏戌俞頓了頓。\n\n「此事遠沒有結束。妳繼續留在我身邊，未必比在火車上安全多少。」\n\n「那我不跟你出去就是了。」\n\n「妳以為只要待在府中，便一定不會遇上危險？」\n\n程小楓一時答不上來。\n\n魏戌俞望著她。\n\n「妳有疼愛妳的父親，有家業，也有自己想過的日子。沒有必要因為認識了我，便將這些事情全都拋在一旁。」\n\n「我又沒有要拋下那些事情！」\n\n「那就更應該回去。」\n\n程小楓有些急了。\n\n「可是我想留在北城呀！」\n\n「為了什麼？」\n\n「為了你啊！」\n\n她回答得毫不猶豫。\n\n魏戌俞沉默了片刻。\n\n「程小姐，妳我相識不過一日。妳所見到的，只是我的一小部分。」\n\n他端起茶杯，卻沒有喝。\n\n「我平日軍務繁忙，時常數日不在府中。有些事情，即便是家裡人，也無法事先知道我何時能回來。」\n\n「妳若當真想找一個能陪妳過日子的人，我並不合適。」\n\n程小楓看著他。\n\n「你又沒跟我過過日子，怎麼知道不合適？」\n\n魏戌俞將茶杯放回桌上。\n\n「跟我在一起，註定不會有什麼好日子。」\n\n他的語氣十分平靜。\n\n不像是故意說些重話來嚇唬她。\n\n倒像是在陳述一件早已認定的事實。\n\n「昨晚妳差點丟了性命，也差點遭了錢世豪的毒手。那樣的事情，我不能保證往後不會再發生。」\n\n程小楓下意識攥緊了外套的袖口。\n\n她自然沒有忘記昨夜獨自被困在黑暗中的恐懼。\n\n可過了片刻，她仍然抬起頭來。\n\n「可是你來救我了。」\n\n「那是我應當做的。」\n\n「我知道。」\n\n她的聲音也認真了幾分。\n\n「昨晚的事情確實很可怕。我也沒有勇敢到覺得那些東西沒什麼大不了的。」\n\n「但我害怕的是那些鬼怪，又不是你。」\n\n魏戌俞微微一怔。\n\n程小楓繼續說道：\n\n「我沒有因為昨天晚上發生的事情，就不想認識你了。你為什麼一定要覺得，我回維安城才是最好的選擇？」\n\n「因為那是目前對妳而言最妥當的安排。」\n\n「那是你覺得妥當！」\n\n程小楓忍不住提高了聲音。\n\n魏戌俞並沒有因此改變主意。\n\n「妳今日先在府中休息。我會請人替妳訂好返回維安城的火車票，安排人一路護送妳回去。」\n\n「我不要！」\n\n「至於令尊那邊，我會另尋日子親自登門道歉。古鏡的款項，也會依照約定儘快清償。」\n\n「我說了我不回去！」\n\n「這件事情沒有商量的餘地。」\n\n魏戌俞的語氣極為堅決。\n\n程小楓望著他，胸口因氣憤而微微起伏。\n\n「你憑什麼替我決定？」\n\n「為了妳的安全。」\n\n「可我又不是你的部下！」\n\n這句話讓魏戌俞怔了一下。\n\n程小楓立即從皮包裡取出成交單據，重重放在桌上。\n\n「我是代表程家來北城辦事的。你還欠我們家二十三萬大洋，在事情處理好以前，我有理由留在這兒！」\n\n「妳可以讓程家派其他人過來。」\n\n「我不願意！」\n\n「程小姐。」\n\n「反正我就是不走！」\n\n恰在此時，輝叔與幸之從樓梯走了下來。\n\n「先生，客房已經準備妥當了。」\n\n程小楓猛然轉過頭。\n\n「輝叔，我的房間在哪裡？」\n\n輝叔一愣。\n\n「二樓東側，走廊第三間……」\n\n「謝謝！」\n\n她立即起身，氣呼呼地朝樓梯走去。\n\n幸之見狀，連忙跟了上去。\n\n魏戌俞站在原地。\n\n「程小姐，我的話還沒有說完。」\n\n程小楓頭也不回。\n\n「可是我的話已經說完了！」\n\n她走上幾級台階，又轉過身來。\n\n「我現在很生氣，不想跟你說話！」\n\n說完，便繼續往樓上走。\n\n沒過多久。\n\n砰！\n\n二樓傳來一聲關門的聲響。\n\n客廳頓時安靜下來。\n\n魏戌俞站在沙發旁，望著空蕩蕩的樓梯，半晌沒有動作。\n\n輝叔小心翼翼地開口。\n\n「先生，那位程小姐……」\n\n「先讓她休息。」\n\n「是。」\n\n輝叔猶豫片刻。\n\n「那返回維安城的火車票，需要現在派人去訂嗎？」\n\n魏戌俞抬手按住眉心。\n\n「晚些再說。」\n\n「明白。」\n\n***\n\n## 一物降一物\n\n輝叔前腳才離開，客廳裡便響起了蘇孟達的笑聲。\n\n「哎喲，魏長官！」\n\n他靠在沙發上，笑得幾乎直不起腰。\n\n「我跟您認識這麼多年，還是頭一回瞧見有人敢在您自個兒家裡，當著您的面摔門！」\n\n魏戌俞冷冷看向他。\n\n「很好笑？」\n\n「不好笑。」\n\n蘇孟達努力繃住臉。\n\n不過片刻，又笑了起來。\n\n「實在忍不住啊！」\n\n魏戌俞懶得理他，重新坐回沙發上。\n\n蘇孟達好不容易止住笑，這才朝樓梯的方向望了一眼。\n\n「不過話說回來，程小姐的膽子倒是不小。昨夜都親眼見過那些東西了，今日還敢這般堅持留在北城。」\n\n「她尚且不知道事情的嚴重性。」\n\n「我看她也不是什麼都不懂。」\n\n蘇孟達拿起桌上的茶杯。\n\n「昨晚在火車上，她雖然害怕，卻也沒給咱們添什麼麻煩。要不是她瞧出那兩盞燈的位置不對，咱們還不知道得在走廊裡繞上多少圈。」\n\n魏戌俞微微頷首。\n\n「她確實有些機靈。」\n\n蘇孟達頓時來了精神。\n\n「既然如此，您何不留她在府上住些日子？」\n\n魏戌俞看了他一眼。\n\n「這與她是否機靈，有何關係？」\n\n「沒關係，沒關係。」\n\n蘇孟達笑了笑。\n\n「我只是覺得，您在軍中習慣了下命令。這程小姐又不是您手底下的兵，您一開口便說不許、不行、沒有商量的餘地，人家自然不高興。」\n\n魏戌俞沒有回答。\n\n蘇孟達又道：\n\n「況且那姑娘連維安城都敢一個人跑出來，您就算替她買好了火車票，她若不肯上車，難道您還能讓梁副官把她綁回去不成？」\n\n魏戌俞皺起眉頭。\n\n這倒確實是個問題。\n\n他總不能真的動用軍中的手段，將一個並未犯事的姑娘強行送回家。\n\n蘇孟達見他沉默，便知道自己說中了。\n\n「依我看，您還是找個時候，心平氣和地與她談談吧。」\n\n他拿起一塊糕點。\n\n「畢竟您欠了人家二十三萬大洋，對債主客氣一些，也是應該的。」\n\n魏戌俞抬起眼睛。\n\n「蘇爺。」\n\n「哎？」\n\n「吃你的糕。」\n\n蘇孟達立即將糕點塞進嘴裡。\n\n***\n\n## 魏府書房\n\n近午時分，梁副官回到了魏府。\n\n他手中提著一只公文皮箱，身後還跟著兩名抱有地圖與資料的士兵。\n\n魏戌俞已經換上一身乾淨的衣裳，正在書房內查看父親留下的古鏡圖紙。\n\n大夫方才替他重新檢查過左肩與手臂。\n\n所幸並未傷及筋骨，只需休養幾日，便不會有太大妨礙。\n\n蘇孟達坐在書桌另一側，拿著放大鏡仔細查看七星鎏金鏡的鏡背。\n\n「報告上校。」\n\n梁副官將公文皮箱放在桌上。\n\n「列車上的事情已經交接妥當。錢世豪的遺體送往軍警處，那名隨從也已安排住進軍醫院。」\n\n魏戌俞抬起頭。\n\n「情況如何？」\n\n「軍醫說，他受了極大的驚嚇，暫時還無法正常問話。不過性命無礙。」\n\n「派人看好他。在弄清楚錢世豪背後的人是誰以前，不許外人接觸。」\n\n「是。」\n\n梁副官從皮箱中取出幾份資料。\n\n「另外，咱們南下的這幾日，北山方面並未再出現大規模異象。老周與先前受傷的士兵也正在休養。」\n\n「那節車廂呢？」\n\n梁副官搖了搖頭。\n\n「仍然沒有下落。」\n\n魏戌俞將手中的圖紙放下。\n\n「把地圖拿過來。」\n\n梁副官立即將一張北城周邊的地形圖攤開在書桌中央。\n\n圖中標記著北山、城西舊水渠，以及附近大大小小的山脈與河道。\n\n蘇孟達也將古鏡放回木匣，拉著椅子湊了過來。\n\n魏戌俞拿起紅筆，在北山隧道的位置畫了一個圓圈。\n\n「咱們從頭理一理。」\n\n他指向地圖上的圓圈。\n\n「最初出事的是北山。一列軍用火車經過隧道，第七節車廂憑空消失，隨後隧道與車站陸續出現異象。」\n\n梁副官將那份帶有偽造簽名的軍用貨運憑證放在地圖旁。\n\n「有人冒用上校的簽名，安排了一批從古道中取出的東西，經由軍用列車運送。」\n\n蘇孟達補充道：\n\n「其中很可能包括那口原本安置在古道石室中的棺材。」\n\n魏戌俞點頭。\n\n「那口棺材被移走，北山的封鎖便出現了缺口。」\n\n他又在城西舊水渠附近畫下第二個圓圈。\n\n「接著是徐老石匠遇襲。他的井蓋也被人故意移開了。」\n\n蘇孟達低頭看著地圖，忽然皺起眉頭。\n\n「若將昨夜那塊石板也算進去，咱們已經碰見了好幾件被人動過手腳的封禁之物。」\n\n「鎮墓石像、鎮水石，以及那道圓形石門上的構件。」\n\n梁副官望向魏戌俞。\n\n「上校，對方似乎不是單純為了盜取古物，而是在有意破壞那些用來封住古墓的東西。」\n\n魏戌俞微微頷首。\n\n這正是他一直以來所擔心的事情。\n\n若只是尋常盜墓賊，拿走值錢的陪葬品也就罷了。\n\n可無論北山那尊石像、城西的井蓋，還是錢世豪皮箱裡的石板，都不像是能在古玩市場上賣出高價的東西。\n\n對方卻偏偏知道，該動哪一件。\n\n「而且這些地方相隔甚遠，卻能引出極為相似的異象。」\n\n蘇孟達摸著下巴。\n\n「這就有意思了。」\n\n魏戌俞從桌旁取來昨夜所得的銅刻圖。\n\n銅板上的群山、殿宇、石門與水域，在日光下顯得格外清晰。\n\n「這幅圖，印證了我父親當年留下的那句話。」\n\n梁副官望向銅板。\n\n「北山為道，非墓所在。」\n\n「不錯。」\n\n魏戌俞將古鏡置於銅板上方。\n\n鏡中的地下宮殿，頓時浮現出許多原本不存在的道路。\n\n蘇孟達即便已經見過一次，仍忍不住湊近了些。\n\n「無論看幾次，這東西都叫人覺得不可思議。」\n\n魏戌俞指向那十二尊跪地石像所在的水殿。\n\n「北山古道，應當只是整座地下宮殿的一處入口。城西水井之下的水脈，很可能也與其中某一部分相通。」\n\n梁副官沿著銅板外圍的幾條道路仔細查看。\n\n「那麼，這幅圖上其餘的入口，是否也存在於北城附近？」\n\n「很有可能。」\n\n魏戌俞將銅板移至地形圖旁。\n\n「咱們得把它們找出來。」\n\n***\n\n## 死人所走的路\n\n蘇孟達重新拿起七星鎏金鏡。\n\n「魏長官，我倒是覺得，在找古墓以前，咱們還得先弄清楚一件事。」\n\n「什麼？」\n\n「那座墓究竟是怎麼回事？」\n\n他將古鏡翻轉過來。\n\n「我走南闖北這麼多年，陰氣重的墓見過，鬧鬼的宅子也見過。可一座墓能把數十里之外的地方連在一起，還能將一整節火車吞進去，這可不是尋常的邪門。」\n\n梁副官點頭。\n\n「尤其昨夜，咱們明明在火車上待了一個多鐘頭，回到原本的車廂時，外頭卻只過了不到一刻鐘。」\n\n魏戌俞起身，走到書房後方的木櫃前。\n\n他從櫃中取出一只舊木盒。\n\n木盒裡放著幾頁父親生前留下的手稿。\n\n其中一張紙上，畫有兩座上下相對的宮殿。\n\n上方宮殿立於山中，下方宮殿卻完全倒轉，兩者之間以一面圓形古鏡相隔。\n\n魏戌俞將那張紙攤開。\n\n「我父親曾提過，世間有些地方，不能單純以尋常的山川地理來理解。」\n\n他伸手指向圖中的兩座宮殿。\n\n「兩處本不相連的地方，可能因某種原因在另一頭相通。」\n\n蘇孟達若有所思。\n\n「就像咱們昨夜所見的石階，一頭是火車，一頭卻是古墓？」\n\n「不錯。」\n\n魏戌俞繼續道：\n\n「北山車站的倒影、兩盞刻字相反的信號燈，以及昨夜古鏡中顯現的另一重道路，皆是如此。」\n\n梁副官望向圖紙。\n\n「若是這樣，咱們在北山尋找第七節車廂，未必找對了地方。」\n\n魏戌俞點頭。\n\n「車廂是在北山消失的，卻不代表它一定還在北山。」\n\n蘇孟達沉思片刻。\n\n「它可能沿著死人的路，到了那座古墓的某個地方。」\n\n書房內安靜了下來。\n\n這番推測聽上去荒唐至極。\n\n可在經歷了昨夜的事情之後，三人已經無法再將它視為單純的臆想。\n\n魏戌俞又將一張空白紙放在桌上，寫下了昨夜石廊中的四個字。\n\n聚魂為鎖。\n\n蘇孟達望著那四個字，臉上的神情逐漸凝重。\n\n「那具怪物，恐怕也與這四個字有關。」\n\n他伸手指向古鏡外圍的十二道人形紋路。\n\n「從無舌銅鈴上的引魂紋，到昨夜石廊裡那些被鎖鏈綁住的人，我總覺得，墓主人需要的並不只是殉葬者的屍體。」\n\n梁副官道：\n\n「而是他們的魂魄。」\n\n「正是。」\n\n蘇孟達慢慢點頭。\n\n「那些亡魂被困在同一具怪物之中，無法離開。可它們又似乎被用來守住某些東西。」\n\n魏戌俞望著紙上的字跡。\n\n「聚魂為鎖，未必是要鎖住那些亡魂。」\n\n梁副官抬起頭。\n\n「上校的意思是……」\n\n「或許那些亡魂本身，就是用來鎖住另一件東西的。」\n\n蘇孟達愣了一下。\n\n他低頭望向銅刻圖中央那口巨大的黑色棺槨。\n\n忽然覺得有些不寒而慄。\n\n倘若連數不清的亡魂都只能充當這座墓的鎖。\n\n那麼，被鎖在最深處的……\n\n究竟是什麼？\n\n***\n\n## 幕後之人\n\n梁副官將徐老石匠先前交給他們的炭筆畫取了出來。\n\n畫中是一名年約三四十歲的男子，鼻梁高挺，左側眉骨上方有一道明顯的傷疤。\n\n「上校，還有這個人。」\n\n魏戌俞接過畫像。\n\n蘇孟達摸了摸下巴。\n\n「徐老石匠說，二十年前曾見過他。二十年後再見，他的容貌竟絲毫沒有改變。」\n\n「嗯。」\n\n魏戌俞望著畫像中的男人。\n\n「而且他很清楚徐老石匠手中藏有當年留下的拓片。」\n\n梁副官道：\n\n「維安城那兩名搶奪古鏡的男人，也認得上校。這些人恐怕早就知道咱們正在調查此事。」\n\n蘇孟達將幾件事情在腦中串了一遍。\n\n「這麼說來，北山的軍用火車、城西的水井、程家的古鏡，以及錢世豪那只皮箱，背後很可能都是同一批人？」\n\n「目前還不能確定。」\n\n魏戌俞將畫像放下。\n\n「不過他們的目的，應當十分接近。」\n\n他望向桌上的七星鎏金鏡。\n\n蘇孟達忽然想起，在維安城拍賣會以前，古董商曾向他透露，有人打聽過這面古鏡能否使死人復活。\n\n「難道真有人相信，那座墓裡藏著令人起死回生的法子？」\n\n魏戌俞沉聲道：\n\n「徐老石匠所見的那個男人，或許便是其中的關鍵。」\n\n梁副官望著畫像。\n\n「倘若他當真二十年都不曾衰老，那麼對方不惜破壞古墓的封禁，也要取得古鏡，便有了說得通的理由。」\n\n蘇孟達卻搖了搖頭。\n\n「不過，容貌沒有改變，可不代表他就真的長生不老。」\n\n他指了指畫像。\n\n「魏長官，您別忘了，咱們在北山還碰見過能夠借用旁人面孔的東西。」\n\n魏戌俞微微頷首。\n\n這也是他始終沒有妄下結論的原因。\n\n倘若一個人能夠二十年不老，自然匪夷所思。\n\n可倘若那個二十年不老的男人，早已不是原本的那個人呢？\n\n「副官。」\n\n「在。」\n\n「將畫像多摹幾份，交由各處暗中查訪。不要大張旗鼓，以免驚動對方。」\n\n「是。」\n\n「等軍醫院那名隨從清醒，再問清楚錢世豪受何人指使。」\n\n梁副官將畫像收好。\n\n蘇孟達則忽然轉頭，望向書房門口。\n\n「魏長官，還有一件事情。」\n\n「說。」\n\n「程小姐的母親。」\n\n書房內的氣氛頓時有了些變化。\n\n蘇孟達繼續道：\n\n「七星鎏金鏡原本由她母親保管，程小姐又親口說過，在她母親的書房裡見過這幅古墓圖。」\n\n「加上昨夜那位戴玉鐲的白衣女子……」\n\n他稍稍停頓。\n\n「程家與這座墓的淵源，恐怕比咱們想的還要深。」\n\n魏戌俞望著銅板，沉默片刻。\n\n「她對當年的事情知道得不多。」\n\n「那咱們是否要讓她寫封信回去，問問程老爺？」\n\n魏戌俞思索了一會兒。\n\n「暫時不必。」\n\n「為何？」\n\n「程家對她母親失蹤一事似乎有所避諱。若這時候貿然追問，未必能得到實話。」\n\n魏戌俞將古鏡收入木匣。\n\n「先查當年與古墓有關的人。若能找到其他線索，再與程家的事情相互印證。」\n\n梁副官點了點頭。\n\n蘇孟達若有所思。\n\n「不過，程小姐既然與這些古物有所淵源，那位白衣女子又先後兩次出現在她附近，咱們是不是也得留意一下她的情況？」\n\n「嗯。」\n\n魏戌俞看了一眼書房外。\n\n「此事先不要告訴她。在沒有弄清楚那女子的身分以前，咱們所說的都只是推測。」\n\n蘇孟達點了點頭。\n\n「也是。若讓她知道那白衣女子可能與自己的母親有關，恐怕又得多出一個想往墓裡跑的人。」\n\n魏戌俞皺起眉頭。\n\n「絕不能讓她涉險。」\n\n***\n\n## 山底下的汽笛聲\n\n就在三人準備繼續研究地圖時，書房外忽然傳來敲門聲。\n\n叩、叩。\n\n「進來。」\n\n一名軍官推門而入，立正敬禮。\n\n「報告上校，西山勘察隊今晨已經返回。」\n\n魏戌俞立即抬頭。\n\n「有何發現？」\n\n軍官走上前，將一張新繪製的山區地形圖放到桌上。\n\n「依照您南下以前的指示，咱們分別調查了北山以西的幾處山區。其中一支隊伍，在西山深處發現了一條荒廢多年的古道。」\n\n梁副官立即將北城地圖向旁移開。\n\n「什麼位置？」\n\n軍官伸手指向西山南側的一處山谷。\n\n「這兒。」\n\n「那條道路藏在山谷之間，附近樹木茂密，若不是有當地採藥的老人指引，極難發現。」\n\n他又從懷中取出幾張照片。\n\n照片中，一條布滿青苔與雜草的石階，沿著山坡向深處延伸。\n\n石階兩側立著數尊殘缺的石像。\n\n有些已經傾倒，有些則只剩下半截身軀。\n\n其中一尊石像仍保持著雙膝跪地、右掌向外的姿勢。\n\n魏戌俞拿起照片。\n\n這與北山隧道旁發現的那尊石像極為相似。\n\n蘇孟達湊了過來。\n\n「果然又是一條古道。」\n\n軍官繼續報告。\n\n「當地山民說，那一帶從前被稱為禁山，老一輩的人不許後人隨意進入。即便是打獵，也會刻意避開那條石階。」\n\n魏戌俞問道：\n\n「古道盡頭是什麼？」\n\n「勘察隊發現了一道石門。不過石門附近曾發生坍塌，暫時無法確認內部情況。」\n\n「有人進去過？」\n\n「從現場看來，近些年應當有人活動過。石門旁的雜草有被清除的痕跡，還發現了幾段腐朽的繩索。」\n\n魏戌俞與梁副官對視一眼。\n\n軍官卻忽然有些遲疑。\n\n「另外，還有一件事情……」\n\n「說。」\n\n「昨夜，西山附近幾戶山民都聽見了極為奇怪的聲音。」\n\n魏戌俞皺起眉頭。\n\n「什麼聲音？」\n\n「火車的汽笛聲。」\n\n蘇孟達原本正拿著照片，聞言猛然抬頭。\n\n「火車？」\n\n「是。」\n\n梁副官立即望向地形圖。\n\n「西山附近並沒有鐵路。」\n\n「正是如此。」\n\n軍官點了點頭。\n\n「距離西山最近的一段鐵路，也在二十餘里之外。起初村民們還以為是遠處的聲音傳了過來，直到有人發現，村中的幾口老井都在同一時間發生震動。」\n\n「井中的水不斷往上冒，連井邊的水桶都被震倒了。」\n\n軍官稍稍壓低聲音。\n\n「幾名村民沿著聲音找了一陣，最後發現，那汽笛聲根本不是從山外傳來的。」\n\n「而是從山底下傳出來的。」\n\n書房內忽然安靜了。\n\n魏戌俞慢慢低下頭，望向那張古墓銅刻圖。\n\n他將西山的地形圖與銅板並排放在一起。\n\n銅板左側，有一條道路從兩座相鄰的山峰之間向下延伸。\n\n附近還有一條呈半月形彎曲的河流。\n\n梁副官立即注意到了這一點。\n\n「上校，西山南側也有一條形狀相近的河流。」\n\n魏戌俞拿起紅筆，沿著地形圖上的河道畫了一條線。\n\n再望向銅板。\n\n山勢雖然不盡相同，河流的走向卻出奇地相似。\n\n而那條古道的入口，恰好位於河流彎折之處。\n\n「魏長官……」\n\n蘇孟達慢慢站起身。\n\n「您說，咱們一直在找的那節車廂，會不會就在那底下？」\n\n魏戌俞沒有立即回答。\n\n一節軍用車廂，連同其中的古物與士兵，消失在北山隧道之中。\n\n而距離北山數十里之外，一座沒有鐵路的山脈，竟傳出了火車的汽笛聲。\n\n若是在幾日前，他或許也會認為兩者毫無關聯。\n\n可昨夜，他才親眼見識過兩處截然不同的地方，是如何在古鏡的映照之下連接在一起。\n\n「未必就是那節車廂。」\n\n魏戌俞望著地圖，緩緩開口。\n\n「不過西山這條古道，很值得咱們親自走一趟。」\n\n***\n\n## 進山的決定\n\n魏戌俞讓那名軍官退下，隨即轉頭望向梁副官。\n\n「副官，從現在起，將西山列為重點調查區域。」\n\n「是。」\n\n「先安排一支勘察隊，確認山區道路及石門外圍的情況。沒有我的命令，任何人不准擅自進入石門，也不要觸碰附近的石像。」\n\n「明白。」\n\n魏戌俞繼續吩咐。\n\n「另外，挑選一批身手可靠、經驗豐富的弟兄，準備入山所需的裝備、照明器材、醫療用品及糧食。」\n\n梁副官立即拿出筆記本。\n\n「上校，您打算親自進去？」\n\n「嗯。」\n\n蘇孟達站在書桌旁，伸手拿起七星鎏金鏡。\n\n「那可少不了我。」\n\n魏戌俞看了他一眼。\n\n「你可想清楚了？」\n\n「自然。」\n\n蘇孟達拍了拍木匣。\n\n「三十一萬大洋的東西都買來了，總不能放在您府上當擺設吧！」\n\n魏戌俞笑了一下。\n\n「好。」\n\n蘇孟達又低頭望向銅刻圖。\n\n「不過在出發以前，咱們最好先將這幅圖的兩重道路完整描摹下來。萬一墓中出了什麼變故，總不能事事都等著拿鏡子照。」\n\n梁副官點頭。\n\n「我會準備數份圖紙，分別交由不同的人保管。」\n\n魏戌俞將紅筆放下。\n\n「此番入山，有三件事情要做。」\n\n「第一，確認那座古墓的所在，以及它究竟有多大的規模。」\n\n「第二，找到失蹤的第七節車廂，查清那些士兵的下落。」\n\n他的目光落在銅板中央的黑色棺槨上。\n\n「第三，弄清楚究竟是誰在破壞古墓的封禁，又是為了什麼。」\n\n蘇孟達緩緩點頭。\n\n「若是有機會，也得看看能不能找到那些被困住的亡魂。」\n\n魏戌俞想起昨夜那名額頭帶傷的年輕男人。\n\n那人伸著手，哭喊著自己不想回去。\n\n「嗯。」\n\n他重新望向地圖。\n\n「咱們不是去尋寶的。」\n\n「任何古物，若非調查所需，不得擅自取走。遇上無法應付的情況，以人員安全為先。」\n\n梁副官立正應道：\n\n「是！」\n\n魏戌俞將銅刻圖與父親的手稿收在一處。\n\n窗外陽光正好。\n\n可三人都很清楚，這一次，他們即將面對的東西，恐怕與先前那些零星出現的鬼怪截然不同。\n\n那些東西，不過是從古墓的缺口中逃出來的一小部分。\n\n而這一回。\n\n他們要親自走進那個地方。\n\n***\n\n## 不肯下樓的大小姐\n\n待三人商議完畢，已是午後。\n\n梁副官帶著地圖與命令返回軍部，蘇孟達也準備先回自己的古董鋪一趟，取些往後入山可能用得上的東西。\n\n臨走以前，他忽然想起什麼。\n\n「對了，魏長官。」\n\n「怎麼？」\n\n蘇孟達指了指樓上。\n\n「您那位債主，怕是還在生氣呢。」\n\n魏戌俞抬頭看了他一眼。\n\n「我知道。」\n\n「那您可得好好跟人家談。否則等您從山裡回來，這宅子說不準都改姓程了。」\n\n「蘇爺。」\n\n「告辭！」\n\n蘇孟達提起自己的布袋，笑呵呵地走出了書房。\n\n魏戌俞搖了搖頭。\n\n他回到客廳時，輝叔恰好正在吩咐幸之收拾茶具。\n\n「輝叔，程小姐呢？」\n\n「先生，程小姐已經梳洗過了。幸之也替她送了幾件乾淨衣裳，只是午飯送上去時，她說自己不餓。」\n\n魏戌俞看向幸之。\n\n「沒吃？」\n\n幸之點頭。\n\n「我方才又去問了一次，程小姐還是不肯吃。」\n\n魏戌俞皺了皺眉頭。\n\n從昨夜到現在，那姑娘除了幾塊桂花糕，幾乎沒吃過什麼東西。\n\n「讓廚房準備一碗熱麵，再拿些糕點過來。」\n\n幸之立即應道：\n\n「好的，我待會兒替程小姐送上去。」\n\n「不必，我去。」\n\n輝叔微微一怔。\n\n「先生，您親自送？」\n\n「嗯。上午的事情還沒談完，總得與她說清楚。」\n\n「是。」\n\n***\n\n二樓客房內。\n\n程小楓已經換上一件淺色上衣與深藍色長裙，原本凌亂的頭髮也重新梳理整齊。\n\n她坐在窗旁的書桌前，正低頭寫著家書。\n\n雖然上午與魏戌俞吵了一架，但她並沒有真的打算整日將自己關在房裡。\n\n她已經請輝叔代為發了電報，向父親報平安，又將此次北上需要處理的商會事務一一寫了下來。\n\n至於古鏡的餘款、抵押品的清點，以及程家在北城的生意，她也確實有自己的打算。\n\n叩、叩。\n\n房門忽然被人敲響。\n\n「誰呀？」\n\n「我。」\n\n程小楓手中的筆停了一下。\n\n她自然認得那個聲音。\n\n「你來做什麼？」\n\n「給妳送飯。」\n\n「我不餓。」\n\n門外安靜了片刻。\n\n「上午的事情，咱們再談談。」\n\n程小楓抿了抿嘴。\n\n「你是不是又要送我回去？」\n\n「先開門。」\n\n「你先回答我。」\n\n魏戌俞站在門外，低頭望了眼手中冒著熱氣的雞湯麵。\n\n「我若是來送妳回去的，手上拿的便是火車票，不是午飯了。」\n\n房內沉默了一會兒。\n\n終於，門被打開了。\n\n程小楓站在門後，神情依舊有些不高興。\n\n她看了看魏戌俞，又看了看他手中的托盤。\n\n「你還真是來送飯的啊？」\n\n「不然呢？」\n\n魏戌俞走進客房，將托盤放在桌上。\n\n一碗雞湯麵、兩碟小菜，旁邊還放著幾塊紅豆糕。\n\n程小楓望著那碟紅豆糕，不自覺地多看了兩眼。\n\n魏戌俞拉開一旁的椅子。\n\n「坐下，邊吃邊說。」\n\n她猶豫片刻，終究還是在桌旁坐了下來。\n\n「我先說好，我沒有答應要回去。」\n\n「知道了。」\n\n魏戌俞替自己倒了杯茶。\n\n「妳若真有那麼容易答應，上午也不會摔門上樓。」\n\n程小楓有些心虛地低下頭。\n\n「誰讓你那麼不講道理。」\n\n魏戌俞聞言，倒也沒有反駁。\n\n他喝了口茶，才緩緩開口。\n\n「上午我的語氣確實重了些。」\n\n程小楓抬起頭。\n\n她倒沒想到，他會主動提起這件事情。\n\n「我平日習慣了安排手底下的人做事，說話有時也不大注意。妳不是軍中的人，我不該用同樣的方式與妳說話。」\n\n他望著她。\n\n「不過，我想讓妳回維安城的理由，並沒有改變。」\n\n程小楓剛剛緩和的神情又沉了下來。\n\n「那不還是一樣嗎？」\n\n「不一樣。」\n\n魏戌俞放下茶杯。\n\n「上午我沒有讓妳好好把話說完。既然妳不願意回去，現在便說說妳的打算。」\n\n程小楓望了他片刻。\n\n「真的讓我說？」\n\n「嗯。」\n\n「那你不許說到一半又不讓我講了。」\n\n「好。」\n\n她這才放下筷子，認真地坐直了身子。\n\n「我來北城，當然是因為喜歡你。這件事情我從一開始就沒有瞞著你。」\n\n魏戌俞神情平靜，並未打斷。\n\n「可是我也不只是來找你玩的。那二十三萬大洋確實需要處理，我們程家也有打算在北城拓展生意。我留在這兒，並不是完全沒有事情可做。」\n\n她伸手指向書桌上的信紙。\n\n「我已經想過了，等過幾日，我便去看看北城的商行與店鋪。若有適合合作的人，也可以替我爹打聽打聽。」\n\n「你有你的事情要忙，我也有我的事情要做。我沒有要你整日陪著我。」\n\n魏戌俞順著她的手指望去。\n\n書桌上擺著數頁寫得密密麻麻的紙張。\n\n其中除了尚未寫完的家書，還有一些商會貨物與生意往來的紀錄。\n\n看來這姑娘倒確實不是毫無打算。\n\n他收回目光。\n\n「報過平安了嗎？」\n\n「報過啦。上午就請輝叔替我發了電報。」\n\n「有沒有告訴令尊，妳如今住在何處？」\n\n「有。」\n\n「那就好。」\n\n魏戌俞微微頷首。\n\n「既然妳打算留在北城辦事，至少得讓令尊知道妳的安排。妳突然離家，他在維安城難免擔心。這封信寫完後，讓輝叔儘快替妳寄出去。」\n\n「我知道。」\n\n程小楓重新拿起筷子，吃了幾口麵。\n\n過了片刻，她忽然問道：\n\n「所以，你還是覺得我應該回去？」\n\n「若是問我的意思，自然是回去比較好。」\n\n魏戌俞沒有故意說些好聽的話。\n\n「不過妳既然已經到了北城，又有商會的事情需要處理，我也不能真的讓人將妳押上火車。」\n\n程小楓的眼睛微微亮了起來。\n\n「那你的意思是……」\n\n「返程的車票暫且不訂。妳先在這兒住幾日，等令尊回信，再作打算。」\n\n她立即露出了笑容。\n\n魏戌俞卻抬起手，示意她先別高興得太早。\n\n「我還有幾句話。」\n\n「你說。」\n\n「府中有些地方存放著軍中的資料與來歷不明的古物，沒有我的允許，不要擅自進去。若要出門，也告訴輝叔一聲。北城妳不熟悉，有什麼事情，讓府中的人陪妳去辦。」\n\n程小楓想了想。\n\n「可以。」\n\n「還有，妳留在府上，是以程家客人的身分。上午那些關於成親的話，不代表我已經答應了妳什麼。」\n\n程小楓看了他一眼。\n\n「這個我知道。」\n\n魏戌俞略感意外。\n\n她低頭夾起一塊紅豆糕。\n\n「你現在又不喜歡我，我總不能逼你娶我吧。」\n\n說得倒是明白。\n\n魏戌俞微微頷首。\n\n「妳能明白便好。」\n\n誰知程小楓又補了一句。\n\n「不過你現在不喜歡我，也不代表往後不會喜歡我呀。」\n\n魏戌俞端茶的手頓了一下。\n\n程小楓已經若無其事地吃起了紅豆糕。\n\n他望著她，終究沒有再與她爭辯。\n\n***\n\n## 那些不得不做的事情\n\n吃了大半碗麵後，程小楓的心情總算平復了不少。\n\n她忽然想起魏戌俞左肩上的傷。\n\n「大夫來過了嗎？」\n\n「來過了。」\n\n「怎麼說？」\n\n「沒傷到筋骨，休養幾日便好。」\n\n「那你這幾日應該不用出門了吧？」\n\n魏戌俞搖了搖頭。\n\n「軍中的事情尚未處理完，還有些地方得親自去看看。」\n\n程小楓若有所思地望著他。\n\n「你們上午是不是一直在書房裡商量昨晚的事情？」\n\n「嗯。」\n\n「那件事情還沒結束？」\n\n「昨夜的異象已經解除了，不過引發那些異象的原因，尚未完全查清。」\n\n程小楓放下筷子。\n\n「其實，我有件事情一直很好奇。」\n\n魏戌俞抬起頭。\n\n「什麼？」\n\n「你昨天在火車上說，那些事情是你的宿命。」\n\n他微微一怔。\n\n程小楓繼續說道：\n\n「我原本以為你只是個軍官。可你們不但研究古物，還知道怎麼對付那些鬼怪，甚至連古墓裡的機關都懂。」\n\n「梁先生和蘇先生看起來也不是第一次遇到這些事情。」\n\n她皺起眉頭。\n\n「所以你到底是在做什麼呀？」\n\n魏戌俞思索片刻，倒也沒有再以軍務繁忙為由敷衍她。\n\n「前些日子，北城附近有一列軍用火車出了意外。其中一節車廂，連同裡頭的貨物與士兵，在經過隧道後憑空失蹤。」\n\n程小楓愣了一下。\n\n「一整節車廂？」\n\n「不錯。」\n\n魏戌俞慢慢說道：\n\n「起初我們以為是有人劫走了軍中的貨物，可隧道裡沒有火車脫軌的痕跡，也沒有找到那節車廂。」\n\n「後來在附近查到一些來歷不明的古物，又接連發生了幾件與昨夜極為相似的事情。我們才發現，這樁案子恐怕並不是尋常的人為事故。」\n\n程小楓恍然大悟。\n\n「所以你才特地來維安城買那面鏡子？」\n\n「嗯。七星鎏金鏡與那些異象有關，對查明車廂的下落十分重要。」\n\n「難怪……」\n\n她想起拍賣會上那盞高高掛起的天燈。\n\n原本只覺得他買東西時格外有魄力，如今才知道，這三十一萬大洋背後竟還有這麼多事情。\n\n「那些士兵還沒找到嗎？」\n\n「沒有。」\n\n魏戌俞望著茶杯中的水面。\n\n「只要尚未查明他們的下落，我便不能將此事擱在一旁。」\n\n程小楓點了點頭。\n\n「這個我能理解。」\n\n她安靜了一會兒，又問道：\n\n「可是，這是你在軍中的責任，為什麼又會跟你的宿命有關？」\n\n魏戌俞轉頭望向窗外。\n\n午後的陽光落在庭院裡的松柏之間，樹影隨著微風輕輕晃動。\n\n「有些事情，即便我沒有從軍，也得去做。」\n\n程小楓沒有說話。\n\n魏戌俞繼續道：\n\n「魏家有些規矩，已經延續了許多代。我父親在世時，便時常處理與此類似的事情。」\n\n「我小時候，他有時一出門就是數月。每次回來，輝叔總得讓人提前備好熱水與藥箱。」\n\n「他也經常受傷？」\n\n「嗯。」\n\n魏戌俞淡淡笑了一下。\n\n「我年幼時曾問過他，既然每次出門都要弄得一身傷，何必還要出去。」\n\n「他怎麼說？」\n\n「他說，有些門，總得有人守著。」\n\n程小楓怔了怔。\n\n她並不明白這句話的真正含義。\n\n魏戌俞也沒有繼續解釋那些門究竟是什麼。\n\n「父親離世以後，魏家有許多事情需要我接手。那時我年紀尚輕，有些事甚至連自己都還沒弄明白，便已經不得不去處理。」\n\n「所以昨夜我所說的宿命，並不是指這一樁案子。」\n\n他將茶杯放回桌上。\n\n「即便這樁案子結束，往後也還會有其他事情。」\n\n程小楓低下頭，認真地想了一會兒。\n\n「那你有沒有想過，自己不做這些事情的話，會想過什麼樣的日子？」\n\n魏戌俞微微一怔。\n\n這個問題，他倒確實不曾認真想過。\n\n從父親過世至今，他的生活幾乎總是被軍務與魏家的事情填滿。\n\n偶爾得了幾日空閒，也不過是在府上看書、習武，或者整理父親留下的東西。\n\n至於往後想過什麼樣的日子……\n\n「沒有。」\n\n他如實答道。\n\n程小楓有些意外。\n\n「一次也沒有？」\n\n「沒有什麼必要去想。」\n\n魏戌俞望著她，語氣平靜。\n\n「眼下的事情都還未處理妥當，想那些又有何用？」\n\n程小楓皺了皺鼻子。\n\n「你這個人，還真是一點都不會替自己打算。」\n\n魏戌俞聞言失笑。\n\n「我倒是覺得，我打算得很清楚。」\n\n「你那都是替別人打算！」\n\n她立即反駁。\n\n「替軍中的士兵打算，替魏家的事情打算，現在還替我打算要不要回維安城。」\n\n「可你自己的事情呢？」\n\n魏戌俞望著她。\n\n一時竟沒能給出回答。\n\n程小楓也沒有再追問，只是低頭喝了口雞湯。\n\n過了一會兒，魏戌俞才重新開口。\n\n「程小姐，這也是我上午想讓妳回去的原因。」\n\n「我如今的生活並不適合成家，也沒有多餘的心思去考慮婚事。若是答應了一個人，卻無法給她相應的陪伴與安穩，那便是不負責任。」\n\n他看向程小楓。\n\n「何況魏家的事情尚未了結。我自己都不知道往後會遇上什麼，更不願讓一個原本與此無關的人，因為我而被牽扯進來。」\n\n這一次，他的語氣並不強硬。\n\n也沒有再試圖說服她一定要離開。\n\n只是將自己的想法坦白地說了出來。\n\n程小楓聽完，沉默了片刻。\n\n「所以你不是特別討厭我？」\n\n魏戌俞眉頭微微一挑。\n\n「我何時說過討厭妳？」\n\n「你從維安城開始，就一直想把我送回家。我還以為自己哪裡惹你不高興了。」\n\n「妳有時候確實挺讓人頭疼的。」\n\n程小楓立即瞪了他一眼。\n\n魏戌俞嘴角微微揚起。\n\n「不過，這是兩回事。」\n\n他稍稍停頓。\n\n「即便今日沒有妳，我也不會有成親的打算。這並不是因為妳做錯了什麼。」\n\n程小楓若有所思地點了點頭。\n\n她似乎終於明白，魏戌俞為何每次提到婚事，總是毫不猶豫地拒絕。\n\n並非自己不夠漂亮，也不是自己做得不夠好。\n\n而是這個男人從一開始，就沒有將婚姻放進自己的人生之中。\n\n「好吧。」\n\n她重新拿起筷子。\n\n「那就先不談成親的事情。」\n\n魏戌俞有些意外。\n\n「妳想通了？」\n\n「我只是說先不談，又沒說不喜歡你了。」\n\n她瞥了他一眼。\n\n「你可不要高興得太早。」\n\n魏戌俞忍不住笑了一聲。\n\n「好。」\n\n程小楓吃完最後一口麵，將碗筷整齊地擺回托盤上。\n\n「不過，往後我若是有不明白的事情，還可以問你嗎？」\n\n「只要不是涉及軍中機密，能告訴妳的，自然會告訴妳。」\n\n「那就行了。」\n\n她滿意地點了點頭。\n\n魏戌俞看了一眼懷錶。\n\n原本只是上樓送一頓飯，不知不覺竟已在這兒坐了將近半個鐘頭。\n\n他起身道：\n\n「好好休息。這幾日若要清點古物，讓輝叔替妳安排，我也會讓人將名下的產業資料準備妥當。」\n\n程小楓立即說道：\n\n「那個倒不用太著急。」\n\n魏戌俞挑眉。\n\n「妳不是來催債的？」\n\n「生意嘛，總得慢慢談。」\n\n他望著她那副若無其事的模樣，無奈地搖了搖頭。\n\n「往後別再因為生氣而不吃飯。妳若對我的安排有意見，直接說便是。」\n\n程小楓有些不好意思。\n\n「知道了。」\n\n魏戌俞端起托盤，轉身離開客房。\n\n房門關上後，程小楓重新坐回窗前的書桌旁。\n\n她望著尚未寫完的家書，提起筆，又在信末多添了幾句。\n\n這一趟北城之行，她原先只是想多認識那個在拍賣會上令她一見傾心的男人。\n\n如今卻發現，他身上有許多她從未接觸過的事情。\n\n那些事情或許很危險，也或許遠比他今日所說的更加複雜。\n\n不過沒關係。\n\n反正才認識第二日。\n\n她有的是時間慢慢了解。\n\n***\n\n## 魏府的夫人\n\n傍晚過後，魏府逐漸亮起了燈。\n\n程小楓在客房裡休息了一會兒，又讓幸之陪著自己熟悉府中的環境。\n\n幸之年紀與她相近，起初還有些拘謹，可相處了大半日，發現這位程家大小姐並不像自己想像中那般難伺候，也漸漸放鬆了下來。\n\n「幸之，這棵樹是什麼樹？」\n\n「是老先生從前種下的桂花樹。到了秋天，整個院子都能聞見花香。」\n\n「那可以拿來做桂花糕嗎？」\n\n「自然可以。」\n\n「這倒不錯。」\n\n程小楓又望向庭院另一側。\n\n「你們先生平日都不打理花草嗎？」\n\n幸之笑著搖頭。\n\n「先生平日很少在府上，院子一直都是輝叔在照料的。」\n\n「難怪。」\n\n程小楓望著那幾株修剪得方方正正的松柏。\n\n「這院子跟他本人還真像。」\n\n幸之有些好奇。\n\n「哪裡像？」\n\n「好看是好看，就是太嚴肅了些。」\n\n幸之噗哧一聲笑了出來，又連忙捂住嘴巴。\n\n程小楓見狀，也跟著笑了起來。\n\n***\n\n兩人回到主屋時，輝叔正站在樓梯旁，吩咐家僕將書房裡的茶具收走。\n\n「輝叔！」\n\n「程小姐，您逛完院子了？」\n\n「嗯，幸之已經帶我看過了。」\n\n程小楓將寫好的家書交給他。\n\n「這封信麻煩您替我寄回維安城。」\n\n輝叔雙手接過。\n\n「程小姐放心，明早便讓人送出去。」\n\n「謝謝您。」\n\n她正欲上樓，卻忽然想起一件事情。\n\n「對了，輝叔。」\n\n「程小姐還有什麼吩咐？」\n\n「您怎麼還叫我程小姐？」\n\n輝叔臉上的笑容頓時僵住了。\n\n他原以為經過上午那場爭執，這件事情應當已經過去了。\n\n沒想到大小姐竟還記得。\n\n「這個……先生有交代。」\n\n程小楓雙手背在身後。\n\n「叫夫人不是挺好的嗎？」\n\n恰在此時，魏戌俞從書房走了出來。\n\n「什麼挺好的？」\n\n輝叔猛然轉過頭。\n\n「先生！」\n\n程小楓則笑著望向他。\n\n「夫君，我正在與輝叔商量往後的稱呼。」\n\n魏戌俞腳步一頓。\n\n「又來了？」\n\n「上午還沒商量好嘛。」\n\n輝叔苦笑著望向魏戌俞。\n\n「先生，您看這……」\n\n「叫程小姐。」\n\n程小楓立即接道：\n\n「叫夫人。」\n\n「程小姐。」\n\n「夫人。」\n\n輝叔站在兩人之間，默默低下了頭。\n\n幸之則在旁邊努力忍住笑意。\n\n魏戌俞望向程小楓。\n\n「下午不是才跟妳說過，咱們尚未成親？」\n\n「我記得。」\n\n「那妳現在又在做什麼？」\n\n程小楓想了想。\n\n「先習慣一下。」\n\n魏戌俞沉默了。\n\n這姑娘下午與他談論正事時，分明還算通情達理。\n\n怎麼一碰上這件事情，又變回了上午那副模樣？\n\n輝叔小聲問道：\n\n「先生，那究竟該……」\n\n魏戌俞看了看一臉為難的輝叔，又看了看神情坦然的程小楓。\n\n他實在不想在這個稱呼上，再耗費一個下午的工夫。\n\n終於，他嘆了口氣。\n\n「罷了，輝叔，隨她吧。」\n\n說完，便轉身往樓上走去。\n\n程小楓愣了片刻。\n\n隨即猛然轉頭。\n\n「輝叔！您聽見了沒有？」\n\n輝叔望著魏戌俞的背影，又望向眼前滿臉期待的姑娘。\n\n猶豫了許久，終於試探著喚了一聲。\n\n「……夫人。」\n\n「哎！」\n\n程小楓笑得格外燦爛。\n\n一旁的幸之也忍不住笑了，微微欠身。\n\n「夫人。」\n\n「太好了！」\n\n程小楓立即提起裙襬，快步追上了樓。\n\n魏戌俞聽見身後輕快的腳步聲，回頭望了一眼。\n\n那姑娘上午才氣呼呼地摔了房門，下午又一本正經地與他談論商會的事情，如今不過是得了個稱呼，竟又高興成這副模樣。\n\n他站在樓梯上，半晌沒有說話。\n\n終於無奈地搖了搖頭，笑了出來。\n\n「真是被妳打敗了。」\n\n（第十三回完）"}, {"n": 14, "title": "此去何時歸", "body": "天色初曉，晨霧尚未完全散去。\n\n魏府庭院裡的松柏沾著露水，主屋的窗戶才剛被家僕推開，廚房便已飄來了蒸籠裡的米香。\n\n程小楓昨夜睡得格外安穩。\n\n梳洗過後，她換上一件淺青色旗袍，將長髮以同色的髮帶鬆鬆束起，沿著主屋西側的迴廊往後院走去。\n\n尚未走到迴廊盡頭，一陣短促而凌厲的破風聲便傳入耳中。\n\n她放輕腳步，從廊柱後探出頭去。\n\n庭院深處是一片以青石鋪成的空地，兩側擺著兵器架，角落還立著幾根經年使用的木樁。\n\n魏戌俞正立於空地中央。\n\n他赤著上身，僅著一條深色長褲，腰間束著黑色布帶。左肩近上臂處仍纏著白色紗布，在晨光下格外顯眼。\n\n只見他沉肩落肘，身形微轉，原本收於腰側的拳頭驟然擊出。\n\n拳風掠過，腳下的落葉隨之翻動。\n\n一招收盡，下一式已然接上。步伐沉穩，身形俐落，動靜之間自有一股不容侵犯的氣勢。\n\n程小楓原本還想走近些，見了這番景象，腳步卻不自覺地停了下來。\n\n與平日衣冠整齊、從容議事的模樣相比，此刻的魏戌俞，少了幾分內斂，多了一種近乎本能的鋒芒。\n\n晨光穿過松柏的枝葉，斑駁地落在他的肩背上。\n\n寬闊的肩膀隨著動作舒展，胸膛至腰腹之間的線條流暢而分明。每當他沉腰發力，背部的肌肉便隨之收緊，精實的身軀在一招一式之間，展現出經年習武所磨練而成的力量。\n\n汗水沿著頸側滑落，經過鎖骨，沒入腰間深色的布帶。\n\n程小楓望著望著，竟忘了自己原先是來做什麼的。\n\n直到魏戌俞一個轉身，她才下意識往廊柱後縮了縮。\n\n奇怪。\n\n明明在他面前喊夫君時，也不曾覺得有什麼不好意思，怎麼今日隔著這麼遠的距離，反倒連光明正大地走出去都有些困難了？\n\n她伸手碰了碰自己的臉頰。\n\n有些燙。\n\n可唇邊那抹笑意，卻怎麼也壓不下去。\n\n幸好那日在拍賣會上，自己沒有就這麼讓他走了。\n\n想到這裡，她又悄悄探出了半張臉。\n\n恰在此時，魏戌俞背對著她收勢。\n\n程小楓的目光忽然一頓。\n\n他的背上，竟有一幅極為繁複的刺紋。\n\n墨青色的線條沿著肩胛與脊背舒展開來，其間可見盤繞的長蛇、層疊的龜甲，以及數顆散布於各處的星辰。\n\n那幅圖紋與他背部的肌肉輪廓相互契合，古樸而威嚴。隨著他的一舉一動，盤繞其間的長蛇彷彿也有了生命。\n\n程小楓微微睜大眼睛。\n\n她正想換個位置再瞧仔細些，身後忽然傳來一道清脆的聲音。\n\n「夫人！您在這兒做什麼呢？」\n\n程小楓嚇得險些撞上廊柱。\n\n回頭一看，幸之正端著一只盛有早點的托盤，滿臉疑惑地望著她。\n\n「噓！噓——」\n\n她慌忙將食指抵在唇前。\n\n然而已經來不及了。\n\n庭院中的拳腳聲停了下來。\n\n魏戌俞收勢站定，轉過身來。\n\n目光越過幸之，落在那個還來不及將腦袋縮回廊柱後的姑娘身上。\n\n他挑了挑眉。\n\n「好看嗎？」\n\n程小楓頓時愣住了。\n\n原本準備好的一肚子解釋，竟被這突如其來的三個字堵得乾乾淨淨。\n\n她下意識又望了眼魏戌俞赤裸的上身，這才支支吾吾地答道：\n\n「你……身材挺好的。」\n\n魏戌俞忍不住笑了一聲。\n\n他拿起搭在兵器架上的毛巾，不疾不徐地擦去額上的汗水。\n\n「程大小姐，該戒男色了。」\n\n「你……！」\n\n程小楓猛然抬起頭，整張臉漲得通紅。\n\n幸之連忙低下頭，嘴角卻已經忍不住揚了起來。\n\n「我才沒有特地來看你！我只是出來散步，恰好經過這裡罷了！」\n\n魏戌俞望了眼她身後的迴廊。\n\n「哦？這後院倒是難得有客人來散步。」\n\n幸之在旁聽著，忽然想起什麼。\n\n「可是夫人，您方才不是還特地向輝叔打聽先生在哪兒嗎？」\n\n「幸之！」\n\n程小楓猛然轉頭。\n\n幸之愣了一下，這才意識到自己似乎說了不該說的話。\n\n魏戌俞低頭笑了起來。\n\n「原來如此。」\n\n「我、我只是好奇你這麼早起床做什麼！」\n\n「嗯，我明白。」\n\n他答得十分爽快，偏偏那副帶著笑意的神情，怎麼瞧都不像是真的相信了她。\n\n程小楓氣鼓鼓地瞪著他。\n\n魏戌俞倒也沒有繼續取笑，伸手取下掛在木架上的白色衣衫，從容地披在身上。\n\n「吃過早飯了嗎？」\n\n「還沒。」\n\n「幸之，再備一份早點過來。」\n\n「是，先生。」\n\n魏戌俞一面扣著衣襟，一面朝庭院旁的石桌走去。\n\n「過來吧，既然都特地走到這兒了，就一起吃。」\n\n程小楓張了張嘴。\n\n這人怎麼還記著那句話！\n\n她沒好氣地瞧了幸之一眼，這才跟了上去。\n\n***\n\n## 晨間閒談\n\n庭院一側的石桌旁，晨霧已經漸漸散去。\n\n魏戌俞提起茶壺，往兩只瓷杯中分別倒了熱茶。\n\n程小楓在他對面坐下。\n\n「你每天都這麼早起來練武？」\n\n「只要人在府上，便會練上一會兒。若在軍中，起得還要早些。」\n\n「冬天也一樣？」\n\n「自然。魏家子弟自幼習武，從前即便下雪，我父親也不許耽擱。」\n\n程小楓望了眼他的左肩。\n\n「可是你的傷還沒好。」\n\n「方才只是活動筋骨，沒動用左臂太多力氣。這些傷我自己心裡有數，不至於逞強。」\n\n魏戌俞將茶杯推到她面前。\n\n「倒是妳，前夜受了那麼大的驚嚇，昨晚睡得可好？」\n\n「挺好的。幸之還特地替我換了個軟一些的枕頭。」\n\n「那便好。客房平日少有人住，若有什麼缺的，讓輝叔安排就是。」\n\n幸之很快送來了另一份早點。\n\n清粥、小包子、醃菜，以及幾塊尚冒著熱氣的桂花糕。\n\n程小楓吃了幾口，終究還是忍不住問道：\n\n「對了，你背上的刺青是什麼？」\n\n魏戌俞抬起眼睛。\n\n「瞧得倒是仔細。」\n\n「那麼大一幅圖案，我想不看見也難呀！」\n\n魏戌俞輕笑一聲，這才解釋道：\n\n「那是魏家祖上傳下來的家族印記，以玄武為主，配合北方星宿的排列。並非所有魏家子弟都有，只有承襲家中特定職責的人，才會將它刺於背上。」\n\n「所以你父親背上也有？」\n\n「有，我祖父亦是如此。」\n\n「為什麼非得刺在身上？」\n\n魏戌俞略作思索。\n\n「我父親曾說，紙張會遺失，書冊也會被人毀去。可有些東西，魏家的後人無論身在何處，都不能忘記。」\n\n「除此之外，刺紋所用的顏料也頗為特殊，是祖上留下來的配方。」\n\n他拿起茶杯，繼續道：\n\n「平日體溫較低時，紋路的顏色很淡。待到習武、出汗，或者身體發熱時，才會逐漸顯現。等體溫降下來，顏色又會慢慢淡去。」\n\n程小楓驚訝地望著他。\n\n「世上竟還有這種刺青？」\n\n「魏家的東西，有不少是尋常人家不曾見過的。」\n\n她認真回想方才所見的圖案。\n\n「不過挺好看的。尤其是那些星星，與七星鎏金鏡上的圖案好像有些相似。」\n\n魏戌俞微微頷首。\n\n「兩者確實有些淵源。」\n\n他並未再往下解釋。\n\n程小楓雖然好奇，倒也沒有繼續追問。\n\n不多時，魏戌俞取出懷錶，看了眼時間。\n\n「時候不早了。我得準備去司令部，西山的勘察應當有了新的結果，還有幾件事情得與副官、蘇爺商議。」\n\n他起身整理衣袖，又向幸之交代道：\n\n「稍後讓輝叔帶程小姐去收藏室，昨日交代過的那些東西，可以先讓她清點。」\n\n「是，先生。」\n\n程小楓笑道：\n\n「你倒還記得欠我們家的錢。」\n\n「二十三萬大洋，想忘也不容易。」\n\n魏戌俞看了她一眼。\n\n「還請程大小姐手下留情。」\n\n「那就得看看你有多少值錢的東西了。」\n\n魏戌俞笑著搖了搖頭，轉身回主屋更衣。\n\n***\n\n不多時，梁副官乘車抵達魏府。\n\n魏戌俞已換上一身整齊的軍裝，正站在客廳裡聽梁副官簡要報告今晨送來的消息。\n\n方才在石桌旁閒談時的幾分隨意，此刻已然收斂。\n\n程小楓站在門旁，看著兩人朝外走去。\n\n「夫君！」\n\n魏戌俞回過頭。\n\n「怎麼了？」\n\n「你的傷還沒好，今日也要小心些。」\n\n「今日只是去司令部議事，不必擔心。」\n\n他微微頷首，隨即戴上軍帽，與梁副官一同離開魏府。\n\n***\n\n## 西山深處的石門\n\n北城警備司令部。\n\n會議室內，幾張新繪製的山區地形圖已經攤在長桌上。\n\n蘇孟達比魏戌俞早到了半個鐘頭，此刻正坐在桌旁，翻閱一本紙頁泛黃的地方山誌。\n\n見魏戌俞進門，他立即將手中的書冊舉了起來。\n\n「魏長官，您來得正好。我昨夜翻了大半宿的書，倒真找著了一些有意思的東西。」\n\n魏戌俞摘下軍帽，在桌旁坐下。\n\n「與西山有關？」\n\n「正是。」\n\n蘇孟達將山誌推到他面前。\n\n書中記載著北城一帶的山川地勢，成書已有百餘年。其中有關西山的篇幅並不多，卻特別提到，西山南側曾有一條古道，沿著兩山之間的深谷，通往一處不知何人修築的地下建築。\n\n當地百姓稱其為送死人進山的路。\n\n每逢大雨過後，谷中便會傳來若有似無的鐘聲，有時甚至能聽見許多人一同哭泣的聲音。\n\n久而久之，連採藥人與獵戶也不敢靠近那條道路。\n\n魏戌俞翻過一頁。\n\n山誌末尾還留著一行極小的文字。\n\n**山無鐘，谷有聲；生人入，亡人迎。**\n\n梁副官俯身望去。\n\n「如此說來，西山的異象至少在百餘年前便已經存在了。」\n\n「恐怕還不止。」\n\n蘇孟達伸手敲了敲書冊。\n\n「寫這本書的人，已經是從當地老人嘴裡聽來的。至於那些老人又是從哪一輩聽來的，可就說不準了。」\n\n魏戌俞將書冊合上。\n\n「古道的位置，與咱們昨日確認的是同一處？」\n\n「依山勢來看，應當不會錯。」\n\n梁副官隨即取出最新送回的勘察照片。\n\n「上校，今晨返回的勘察隊還帶回了幾樣東西。」\n\n第一張照片中，是西山古道盡頭那道被山石掩埋的石門。\n\n石門高約一丈，露在外頭的部分雕有層層疊疊的雲紋，兩側岩壁已被藤蔓與苔蘚覆蓋。門前堆積著大小不一的碎石，只剩下右下方一道極為狹窄的縫隙。\n\n魏戌俞拿起照片。\n\n與北山古道的石門相比，這道石門顯然更加高大，雕刻也更加精細。\n\n然而真正引起他注意的，卻是石門右側的一大片黑色痕跡。\n\n「這是什麼？」\n\n「勘察隊起初以為是焚燒留下的痕跡，但附近並沒有樹木遭到焚燒。他們在石門底下還撿到了這個。」\n\n梁副官將一只布袋放在桌上。\n\n袋口解開，幾塊漆黑的碎石滾了出來。\n\n魏戌俞拿起其中一塊，以指腹輕輕摩擦。\n\n一層黑灰立即沾上了他的指尖。\n\n「煤？」\n\n「是。附近的岩層並不產煤，山民也說，平日極少有人將煤運進那一帶。」\n\n蘇孟達立即湊了過來。\n\n「山底下傳出汽笛聲，石門外頭又發現了煤。魏長官，咱們一直找不到的那節車廂，莫不是真跑進山裡去了？」\n\n魏戌俞沒有立即回答，而是重新拿起照片。\n\n「副官，這些煤是從什麼位置撿到的？」\n\n梁副官伸手指向石門下方。\n\n「大多集中在這道縫隙附近，有幾塊甚至卡在門縫裡。」\n\n魏戌俞仔細端詳了片刻。\n\n「你們看看岩壁上煤灰的分布。」\n\n兩人順著他所指的方向望去。\n\n那片煤灰自石門縫隙向外擴散，愈靠近縫隙，顏色便愈深。\n\n「若是有人在門外生火，不至於留下這樣的痕跡。」\n\n魏戌俞將照片放平。\n\n「看起來倒像是曾有一股濃煙，從石門裡頭湧了出來。」\n\n蘇孟達摸了摸下巴。\n\n「難不成裡頭還真有一輛正在燒煤的火車？」\n\n「失蹤的是第七節貨運車廂，並非火車頭。單憑那節車廂，本身不可能產生這些煤煙。」\n\n魏戌俞沉思片刻。\n\n「北山車站那次，咱們曾經見過一列完整的火車。前夜在北上的列車中，也曾有古墓裡的黑水滲入車廂。」\n\n「倘若兩處空間能夠彼此交疊，那麼煤煙出現在西山，也並非全無可能。」\n\n梁副官微微頷首。\n\n「所以這些煤未必來自失蹤的車廂，但至少能夠證明，西山與火車上的異象存在某種關聯。」\n\n「不錯。」\n\n魏戌俞將碎煤重新放回布袋。\n\n「而且這道石門的縫隙，或許不只是尋常的裂縫。」\n\n梁副官聞言，又取出了另一張照片。\n\n「上校，勘察隊在石門外圍還發現了這個。」\n\n照片中是一尊跪地石像。\n\n石像右掌向外，頭顱低垂，姿態與北山那尊鎮墓石像幾乎完全相同。\n\n只是石像底座旁的泥土已被翻開，附近還散落著幾塊新近斷裂的石片。\n\n「石像近期遭人挪動過，底座旁留有明顯的撬痕。勘察隊沿著古道查看時，也發現了一些人為活動的痕跡。」\n\n魏戌俞的目光沉了下來。\n\n蘇孟達臉上的笑意也漸漸消失。\n\n「又有人動了鎮墓石像。」\n\n北山的石像、城西的鎮水石、錢世豪皮箱中的石板。\n\n如今，又多了西山這一處。\n\n魏戌俞將兩張照片並排放在桌上。\n\n「對方比咱們更早知道這條古道的存在。」\n\n「而且他們知道，哪些東西是用來封住古墓的。」\n\n蘇孟達皺起眉頭。\n\n「若真是這樣，那些人對這座墓的了解，恐怕比咱們深得多。」\n\n魏戌俞沒有否認。\n\n自北山的事情發生以來，他們一直循著異象留下的痕跡尋找答案。\n\n可對方不同。\n\n對方似乎從一開始，便知道自己要找什麼。\n\n***\n\n## 地下宮殿究竟在何處\n\n魏戌俞讓梁副官將北城周邊的地形圖重新攤開，又取出前夜從錢世豪皮箱中得到的銅刻圖。\n\n銅板表面經過清理，原先被泥土遮掩的部分已經清晰許多。\n\n群山環繞，數條古道自不同方向向內延伸。宮殿、石橋、水域與長廊彼此相連，中央則安置著一口巨大的棺槨。\n\n魏戌俞站在桌旁，目光在兩幅圖之間來回移動。\n\n「昨日咱們是憑著河流的走向，初步確認了西山古道的位置。」\n\n他伸手指向銅板左側那條呈半月形彎曲的河流。\n\n「不過，若這幅圖確實描繪的是北城周邊的山川，那麼除了這條河，應當還能找到其他相符之處。」\n\n梁副官將西山的地形圖移近了些。\n\n「西山南側共有三座主要的山峰，其中兩座相鄰，中間形成一道深谷。這與銅板左側的山勢確實相似。」\n\n他拿起鉛筆，在圖上圈出了古道所在的位置。\n\n「不過有一處，我始終覺得不太對勁。」\n\n魏戌俞抬起眼睛。\n\n「說。」\n\n「按照銅刻圖所示，古道應當靠近河流的彎折處。但今日勘察隊送回的地形圖上，古道與河岸之間尚有相當一段距離。」\n\n蘇孟達低頭比對了一番。\n\n「這差得可不算少。」\n\n魏戌俞思索片刻，忽然問道：\n\n「副官，軍部有沒有北城早年的山川圖？」\n\n「有。修築鐵路以前，曾經對附近幾處山區進行過勘測。」\n\n「拿過來。越早的越好。」\n\n「是。」\n\n不多時，梁副官便帶回了一卷早年的山區勘測圖。\n\n那幅圖繪製於鐵路修建之前，紙張已經泛黃，邊角也磨損得相當厲害。\n\n魏戌俞將舊圖攤開，與眼前的地形圖並列。\n\n兩人仔細比對了片刻，梁副官忽然指向西山南側。\n\n「上校，您看這裡。」\n\n在早年的地形圖上，西山南側的河流並非如今所走的路線。\n\n它原先沿著山谷向東，經過一處極為明顯的彎折後，才繼續流向北城外圍。\n\n而那處彎折的位置，恰好便是如今發現古道的山谷。\n\n魏戌俞拿起銅刻圖。\n\n三幅圖並排放在一起。\n\n古圖上的河道，竟與銅板上那道半月形的水紋極為相似。\n\n蘇孟達恍然大悟。\n\n「原來不是這幅銅圖畫錯了，而是這些年河流改了道！」\n\n梁副官繼續查閱舊圖旁的文字。\n\n「此處曾經發生過山體坍塌，河道因碎石阻塞而改變流向。後來修築鐵路時，又重新疏通了附近的水渠。」\n\n魏戌俞沿著古河道的方向慢慢移動手指。\n\n「若西山這一處能夠對得上，那麼北山的位置，或許也能找出來。」\n\n他將銅刻圖稍稍轉動。\n\n銅板右上方，刻著一道較為低矮的山脈。山脈之間有一條極細的道路，穿過兩處山峰後，向地下宮殿的方向延伸。\n\n梁副官拿起鉛筆。\n\n「這裡很像北山隧道附近的山勢。」\n\n「嗯。」\n\n魏戌俞指向那條道路的起點。\n\n「北山古道的入口，便是在鐵路隧道旁發現的。鐵路修建以前，那裡應當也有一條穿越山脈的舊路。」\n\n蘇孟達望著兩處逐漸確定的位置。\n\n「如此一來，咱們是不是就能知道，那座古墓的大致所在了？」\n\n魏戌俞沒有立即回答。\n\n他將一張空白紙覆在地形圖上，分別描出北山、西山，以及兩處古道的相對位置。\n\n又依照銅刻圖中所見，將兩條道路向內延伸。\n\n然而畫到一半，他的筆忽然停了下來。\n\n梁副官察覺異樣。\n\n「上校？」\n\n魏戌俞望著筆下的線條。\n\n「若依照銅圖上的道路走向推算，這兩條古道最終應當通往同一片山區。」\n\n他將紙張移開。\n\n地形圖上，北山與西山之間，赫然還有一座連綿而高聳的山脈。\n\n那座山脈南北綿延，北面陡峭，西南側則被數條深谷環繞。由於山勢險峻，軍方早年的勘測圖上，也只有外圍的地形記載，並無更詳細的情況。\n\n蘇孟達低頭看了許久。\n\n「這地方……」\n\n魏戌俞拿起紅筆，沿著那座山脈畫了一個大圈。\n\n「我懷疑，古墓真正的主體，應當就在這片山脈之下。」\n\n***\n\n蘇孟達將銅刻圖拿了起來，又低頭望了望那片被紅筆圈出的區域。\n\n「魏長官，這可不是一座小山。」\n\n「我知道。」\n\n「若整片山腹底下都是古墓，那得耗費多少人力才能修得出來？」\n\n魏戌俞望著銅板上的宮殿。\n\n「未必全是人力開鑿的。」\n\n他伸手指向地形圖中數道向山腹延伸的山谷。\n\n「這一帶山勢起伏甚大，地下又有水脈經過，或許原本便存在天然的洞窟與地下水道。」\n\n「修墓之人若能利用原有的山洞，再以人力打通彼此之間的阻隔，便能在山腹之中修築出遠比尋常墓穴更加龐大的建築。」\n\n梁副官望向銅板上的水殿。\n\n「如此一來，徐老石匠當年所見的黑水，以及城西水井中的異象，或許也能解釋得通。」\n\n魏戌俞微微頷首。\n\n「城西舊水渠原本便引山中之水入城。若地下水脈與那座宮殿相通，城西的水井也有可能受到影響。」\n\n「當然，這只能解釋水從何而來。至於井中那些東西，又是如何沿著水道出現在城中，便不是尋常的山川地勢所能解釋的了。」\n\n蘇孟達望著桌上的三張圖。\n\n「這麼說來，北山、西山，甚至城西的那口井，咱們一直以為是三處不同的地方，實際上可能都只是同一座古墓向外延伸的部分？」\n\n「至少目前的線索，都指向這個方向。」\n\n魏戌俞將父親生前留下的手稿取了出來。\n\n其中一頁，仍保留著那行熟悉的文字。\n\n——北山為道，非墓所在。\n\n他望著那行字，久久沒有移開目光。\n\n父親當年既然已經知道北山並非古墓真正的所在，是否也曾經尋找過其他入口？\n\n又或者，他早已知道這座地下宮殿的規模，卻因某種原因，始終沒有將完整的情況記錄下來？\n\n梁副官忽然道：\n\n「上校，若古墓主體確實位於兩山之間，那麼西山的石門，或許比北山古道更接近主墓。」\n\n魏戌俞收回思緒。\n\n「這也是我在考慮的事情。」\n\n他重新拿起銅刻圖。\n\n「北山那條路通往的是安置棺木的石室，沿途所見，多半是送葬與鎮守之物。西山這條道路卻不同。」\n\n「你們看，從西側古道進入以後，最先抵達的，是一座有十二尊石像的殿宇。」\n\n梁副官仔細看了看。\n\n「與徐老石匠曾經提過的水殿相似。」\n\n「嗯。倘若他當年所到的地方，確實就是這座殿宇，那麼咱們便有了一個可以用來確認方位的地方。」\n\n蘇孟達忽然想起什麼。\n\n「等等。徐老石匠說過，當年他們是從北山進去的。若如今從西山也能抵達同一座水殿，這兩條古道之間，豈不是另有相通的道路？」\n\n「有這個可能。」\n\n魏戌俞將紅筆放下。\n\n「不過，在親眼見到那十二尊石像以前，這些都仍只是推測。」\n\n蘇孟達嘆了一聲。\n\n「看來咱們不親自下去一趟，是不可能弄明白了。」\n\n魏戌俞點頭。\n\n「正是如此。」\n\n***\n\n## 一幅不能全信的地圖\n\n梁副官又從公文皮箱中取出兩幅描摹好的圖紙。\n\n第一幅是肉眼所能看見的地下宮殿。\n\n第二幅，則是透過七星鎏金鏡才會顯現的道路。\n\n「上校，昨夜我將兩幅圖疊在一起，發現了一些奇怪的地方。」\n\n他將其中一幅圖紙覆在另一幅之上，舉至窗前。\n\n日光透過紙張，兩座地下宮殿的輪廓漸漸重合。\n\n「您看，雖然兩幅圖上的道路並不相同，卻有幾座殿宇的位置完全一致。」\n\n魏戌俞走了過去。\n\n梁副官伸手指向其中一道石門。\n\n在肉眼所見的圖紙上，石門後方是一條向北延伸的長廊。\n\n可在另一幅圖上，同樣的位置，卻是一座橫跨水域的石橋。\n\n兩條道路形態迥異，經過的地方也不相同，最終卻通往同一座殿宇。\n\n蘇孟達望著兩幅圖紙，忍不住皺起眉頭。\n\n「倘若咱們站在這道門前，打開門之後，究竟會走進長廊，還是踏上這座石橋？」\n\n「得看當時身處的是哪一頭。」\n\n魏戌俞接過兩幅圖紙。\n\n「前夜在火車上，咱們曾經從一條正常的走廊，直接踏進古墓的石廊。原本相連的車廂，也能在極短的時間內被另一處地方取代。」\n\n「若墓中也是如此，即便咱們循著圖上的道路行走，前一刻經過的地方，下一刻也未必還在原處。」\n\n梁副官神情凝重。\n\n「那麼，最麻煩的便不是找不到入口，而是進去以後找不到原路。」\n\n「不錯。」\n\n魏戌俞將兩幅圖重新分開。\n\n「所以我反倒更加在意這幾座位置不變的殿宇。」\n\n他指著圖上那些彼此重合的地方。\n\n「若這兩重宮殿有各自的道路，卻仍然存在幾處共同的位置，那麼這些殿宇，或許就是兩處空間相互連接的地方。」\n\n蘇孟達俯身看了半晌。\n\n「您的意思是，假使咱們不慎走到了死人的路上，只要找到這幾座殿宇，便有機會回到原本的地方？」\n\n「有這個可能。」\n\n魏戌俞拿起鉛筆，在幾處重合的位置畫上記號。\n\n「前夜咱們便是藉由七星鎏金鏡，找到車廂與石廊交疊的位置。這座墓既然需要以古鏡才能看清完整的道路，想必當初修墓之人，對這些變化也有所了解。」\n\n梁副官道：\n\n「不過，這幅銅刻圖並不完整。若要進入更加深處的地方，恐怕還得另想辦法。」\n\n魏戌俞望向銅板右下角。\n\n那裡有一條長廊延伸至斷裂的邊緣。\n\n無論以肉眼觀看，還是透過古鏡，都無法知道那條長廊最終通往何處。\n\n除此之外，銅板中央的七道石門，也仍然是個未解之謎。\n\n七道門分布於不同的殿宇之間，每道門上各有一顆星辰。\n\n然而它們與古鏡背面的七星究竟存在什麼關係，目前尚且無法確定。\n\n「這一次不必急著進入最深處。」\n\n魏戌俞開口道：\n\n「先沿著已經確認的道路，找到能夠辨認方位的地方。若能找到失蹤的車廂，便優先查明人員的下落。」\n\n「至於中央那口棺槨，以及尚未弄清用途的石門，沒有足夠的把握以前，不得隨意碰觸。」\n\n蘇孟達點了點頭。\n\n說著，他從布袋中取出一只小巧的羅盤，正打算比對銅板上的方位，卻在將羅盤放至古鏡附近時，忽然咦了一聲。\n\n「等等。」\n\n魏戌俞望了過來。\n\n「怎麼？」\n\n蘇孟達沒有回答，只是將羅盤往古鏡旁移近了些。\n\n原本靜止的磁針突然顫動起來。\n\n緊接著，竟緩緩偏離原來的方向，轉向七星鎏金鏡所在的位置。\n\n三人同時低下頭。\n\n蘇孟達將羅盤挪遠。\n\n磁針逐漸恢復正常。\n\n待他再次靠近古鏡，磁針又發生了相同的變化。\n\n「這倒奇了。」\n\n蘇孟達喃喃道：\n\n「我這羅盤跟了我十幾年，還是頭一回遇上這般不講道理的東西。」\n\n魏戌俞接過羅盤，從不同方向靠近古鏡。\n\n結果皆是如此。\n\n他又將古鏡翻轉過來。\n\n鏡身兩側的白玉早已恢復原本的色澤，唯獨其中一枚玉石深處，仍留著那條細如髮絲的黑線。\n\n魏戌俞望著那道黑線。\n\n「古鏡的作用，恐怕遠不只是映照出另一重景象。」\n\n梁副官道：\n\n「前夜在火車上，白玉愈黑，周圍的異象便愈加嚴重。待咱們將石門封住，玉石才逐漸恢復。」\n\n「嗯。玉石的變化，或許能讓咱們察覺身旁的空間是否正在發生異變。」\n\n魏戌俞將古鏡重新收入木匣。\n\n「進去以後，羅盤與地圖可以用，卻不能全信。若發現古鏡上的白玉開始變色，便立即停下來確認周圍的情況。」\n\n蘇孟達收起羅盤，長長吐出一口氣。\n\n「別人下墓，提防的是死人與機關。咱們倒好，連腳底下踩的是哪個地方，都得時時留意。」\n\n魏戌俞淡淡一笑。\n\n「現在知道這些，總比進去以後才知道的好。」\n\n***\n\n## 石門裡的人聲\n\n三人正商議著入山後的路線，會議室外忽然傳來一陣敲門聲。\n\n「報告！」\n\n「進來。」\n\n一名軍官推門而入，向魏戌俞敬禮。\n\n「報告上校，西山勘察隊又有消息送回來了。」\n\n魏戌俞抬起頭。\n\n「什麼事？」\n\n軍官將一張紙交給梁副官。\n\n「昨日留守古道的弟兄，今晨撤回山外時，帶回了一樣東西。另外，他們昨夜在石門附近，還聽見了些奇怪的聲音。」\n\n梁副官看完紙上的記錄，神情微微一變。\n\n「上校，您看看。」\n\n魏戌俞接過那張紙。\n\n依照勘察隊的記錄，昨夜山中並未下雨，古道附近也沒有發生坍塌。\n\n然而接近午夜時，兩名留守的士兵忽然聽見石門後方傳來一陣敲擊聲。\n\n起初，他們以為是山腹中的碎石掉落，便舉著提燈走近查看。\n\n那聲音很快便停了下來。\n\n過了一會兒，石門裡卻傳出了一個男人的聲音。\n\n那人似乎十分疲憊，一面喘氣，一面反覆詢問外頭有沒有人。\n\n兩名士兵不敢擅自移開山石，只隔著石門詢問對方的身分。\n\n裡頭的人沉默了許久。\n\n隨後說了一句話。\n\n——我們是運軍貨的，火車停在這兒好多天了。\n\n會議室內霎時安靜下來。\n\n蘇孟達放下手中的羅盤。\n\n「還說了什麼？」\n\n軍官搖了搖頭。\n\n「弟兄們追問他是哪一支隊伍的人，裡頭卻沒有再回答。後來石門內傳來一陣很大的聲響，像是有許多人同時跑過去，便再也聽不見那人的聲音了。」\n\n魏戌俞問道：\n\n「當時有人試圖進去？」\n\n「沒有。弟兄們記得上校的命令，始終沒有觸碰石門。」\n\n魏戌俞微微頷首。\n\n「帶回來的東西呢？」\n\n軍官從皮包中取出一小塊灰色布料。\n\n布料已經濕透，邊緣撕裂，上頭沾著些許黑色污漬。\n\n梁副官接了過來。\n\n僅僅看了一眼，眉頭便皺了起來。\n\n「是軍服上的布料。」\n\n他將布料展開。\n\n其中一角還保留著一小截縫線，針腳與北城軍中配發的冬季軍服十分相似。\n\n「是在何處發現的？」\n\n「石門下方。弟兄們說，昨夜查看時還沒有這個東西，今晨天亮之後，才發現它掛在門縫外頭。」\n\n蘇孟達望著那塊布料。\n\n「這下可真是……」\n\n他原本想說些什麼，最後卻沒有說出口。\n\n魏戌俞低頭看著那一小塊濕透的布料，神情愈發凝重。\n\n倘若昨夜石門後方的人當真是失蹤的士兵，那麼第七節車廂消失至今，或許仍有人活著。\n\n可他也沒有忘記，北山車站裡那些能夠模仿活人聲音的東西。\n\n它們會喊出熟悉的名字。\n\n會穿著死去士兵的衣裳。\n\n甚至會用他的聲音，命令梁副官打開一口根本不該打開的棺材。\n\n梁副官顯然也想到了這一層。\n\n「上校，裡頭的人未必可信。前夜那具怪物，同樣能夠模仿咱們的聲音。」\n\n「我知道。」\n\n魏戌俞將那塊布料放在桌上。\n\n「不過，既然出現了與失蹤弟兄有關的線索，咱們便不能當作沒有聽見。」\n\n他轉向那名軍官。\n\n「傳令下去，西山古道附近的人員全部撤至山外。沒有我的命令，不許任何人進入石門。」\n\n「倘若再聽見有人呼救，也只需記錄情況，不得擅自靠近。」\n\n「是！」\n\n軍官立正敬禮，隨即轉身離去。\n\n蘇孟達望向魏戌俞。\n\n「您說，會不會真有人在裡頭等著咱們？」\n\n魏戌俞沉默片刻。\n\n「但願如此。」\n\n他重新望向桌上的西山地形圖。\n\n那片被紅筆圈起的山脈，忽然變得比方才更加沉重。\n\n***\n\n## 入山的決定\n\n午後，梁副官將初步安排妥當的人員名單送至會議室。\n\n「上校，共挑選了二十四名弟兄。六人留守山外，其餘隨隊進入古道。醫護與通訊人員也已安排妥當。」\n\n魏戌俞接過名單，逐一查看。\n\n「曾經隨咱們進過北山隧道的，有幾人？」\n\n「其中七人曾經參與北山的任務，其餘大多有山地行動的經驗。」\n\n「弟兄們知道此番要面對什麼嗎？」\n\n「目前只知道是調查失蹤的軍用車廂。」\n\n魏戌俞將名單放回桌上。\n\n「出發以前，把北山發生過的事情告訴他們。」\n\n梁副官微微一怔。\n\n「包括那些異象？」\n\n「嗯。」\n\n魏戌俞望著他。\n\n「咱們在北山已經吃過一次虧了。有些東西並非憑著手中的槍便能應付，弟兄們若事先毫不知情，到了裡頭只會更加慌亂。」\n\n「此番任務與尋常軍務不同。若有人不願進入古道，便調往山外留守，不必為難。」\n\n梁副官立正應道：\n\n「明白。」\n\n蘇孟達坐在一旁，將手中的舊書一本本收進布袋。\n\n「魏長官，咱們這一次打算在裡頭待多久？」\n\n「原定三日。」\n\n「三日能將那麼大的地方走完？」\n\n「不能。」\n\n魏戌俞回答得十分乾脆。\n\n「所以咱們此番並不是為了查清整座墓的所有祕密。」\n\n他指向銅刻圖的西側。\n\n「從西山古道進入，先確認墓穴的位置與格局，沿著車廂留下的線索尋找失蹤的人。倘若遇上無法應付的情況，便立即撤出來。」\n\n「至於那些破壞封禁的人究竟想做什麼，也只能一邊調查，一邊尋找答案。」\n\n蘇孟達點了點頭。\n\n「不過話說回來，對方既然已經知道西山的入口，又為何非要搶咱們這面鏡子不可？」\n\n魏戌俞看向七星鎏金鏡。\n\n這個問題，他同樣思索了許久。\n\n那些人能夠取得墓中的石板、移動古道的石像，甚至知道徐老石匠手中藏有當年的拓片。\n\n照理而言，他們對古墓的了解，遠勝於目前的自己。\n\n可即便如此，他們仍然不惜花費重金爭奪古鏡。拍賣失敗後，又派人在維安城一路追殺。\n\n顯然，有一件事情，是他們無論如何也無法繞開七星鎏金鏡去做的。\n\n「或許進入古墓並不難。」\n\n魏戌俞緩緩開口。\n\n「真正困難的，是進入他們想去的那個地方。」\n\n蘇孟達順著他的目光，望向銅刻圖中央的黑色棺槨。\n\n「您是說……這座墓的最深處？」\n\n「有這個可能。」\n\n魏戌俞想起昨日三人在魏府書房中寫下的那四個字。\n\n聚魂為鎖。\n\n倘若整座地下宮殿的封禁、那些被困住的亡魂，以及七道尚未弄清用途的石門，都是為了守住中央的某件東西……\n\n那麼對方費盡心思所要取得的，恐怕就不是尋常的陪葬之物。\n\n蘇孟達低聲道：\n\n「古董商先前說過，有人特地打聽這面鏡子，究竟能不能讓死人活過來。」\n\n「難不成那座墓的主人，當真留下了什麼長生不老的法子？」\n\n魏戌俞望著銅刻圖。\n\n「若真能長生不死，又何必留下那麼多被囚禁的亡魂？」\n\n蘇孟達一怔。\n\n「這……」\n\n魏戌俞繼續道：\n\n「咱們在火車上親眼見過那些東西。它們有的還保留著生前的意識，有的早已不成人形，卻始終無法離開。」\n\n「假使這便是墓主人所追求的長生，那未免也太過可怕。」\n\n會議室內沉默了片刻。\n\n蘇孟達望著桌上的古鏡，忽然覺得這件價值三十一萬大洋的寶物，也沒有先前看起來那般討人喜歡了。\n\n「魏長官。」\n\n「嗯？」\n\n「我現在若說不想去了，還來得及嗎？」\n\n魏戌俞抬眼看他。\n\n「來得及。」\n\n蘇孟達一愣。\n\n「您就不挽留一下？」\n\n「你若不去，我倒能少操一份心。」\n\n蘇孟達立即將布袋背了起來。\n\n「那可不成！這麼大一座墓，若是沒有我，您進去以後連壁刻上的古字都未必認得全。」\n\n魏戌俞忍不住笑了一聲。\n\n梁副官站在一旁，也微微揚起嘴角。\n\n片刻後，魏戌俞重新拿起西山地形圖，神情恢復了原有的嚴肅。\n\n「副官，將兩幅古墓圖分別描摹數份，交由隨隊人員保管。山外的接應與醫療安排，今日之內確認妥當。」\n\n「是。」\n\n「兩日後，正式進山。」\n\n***\n\n傍晚時分，魏戌俞與梁副官一同走出了會議室。\n\n軍部大院內，士兵們正在操練。\n\n幾名年輕士兵見到魏戌俞，立即立正敬禮。\n\n其中一人猶豫片刻，忽然跑上前來。\n\n「報告上校！」\n\n魏戌俞停下腳步。\n\n「什麼事？」\n\n「卑職聽說西山的任務已經開始挑選人員，想請求隨隊前往！」\n\n魏戌俞打量了他一眼。\n\n「你是哪一隊的？」\n\n士兵立即報上自己的隊伍與姓名。\n\n梁副官在旁認出了他。\n\n「上校，他是先前曾參與北山外圍搜查的弟兄。」\n\n魏戌俞望向那名士兵。\n\n「為何想去西山？」\n\n士兵低下頭，握緊垂在身側的雙手。\n\n「第七節車廂裡失蹤的人，有一位是卑職的同鄉。」\n\n「我們是一起來北城當兵的。他家裡還有個妹妹，出事以前，他才說過等這趟任務結束，便要告假回去看看。」\n\n說到這裡，他的聲音逐漸低了下去。\n\n「這幾日，他妹妹寄了兩封信來，問我知不知道她哥哥什麼時候回家。」\n\n「卑職實在不知道該怎麼回答她……」\n\n魏戌俞望著他，沉默片刻。\n\n「我知道了。」\n\n「不過，入山的人員已經有了安排，並非你想去便一定能去。」\n\n士兵有些失望。\n\n「是……」\n\n魏戌俞繼續說道：\n\n「你既然是他的同鄉，便先替他照看好家裡的事情。若他家中有什麼困難，讓軍部的人從旁協助。」\n\n「至於找人的事，交給我。」\n\n士兵猛然抬起頭。\n\n魏戌俞的語氣依舊平靜。\n\n「在查明他們的下落以前，軍中不會放棄尋找。」\n\n那士兵眼眶微微發紅，隨即挺直身子，向魏戌俞敬了一個軍禮。\n\n「多謝上校！」\n\n魏戌俞回禮，轉身朝停在院中的汽車走去。\n\n梁副官跟在他身旁。\n\n夕陽將兩人的影子拉得很長。\n\n對於那節失蹤的車廂，他們心中其實都沒有多少把握。\n\n然而那些人並不只是名冊上幾個等待確認的名字。\n\n他們有自己的家人，有未能完成的事情。\n\n在北城之外的某個地方，也有人正等著他們回去。\n\n***\n\n## 輝叔眼中的魏家\n\n魏府主屋後方，收藏室的木門自早晨開啟後，便一直沒有關上。\n\n窗旁的小桌上，已經堆了好幾本冊子。\n\n程小楓坐在桌前，低頭記錄一只青花瓷瓶的底款。幸之則依照她的吩咐，將清點完畢的物件分別標上記號。\n\n輝叔從木架上取下一只紫檀木盒，小心地放到桌上。\n\n「夫人，您再看看這件。」\n\n程小楓打開木盒。\n\n裡頭是一方白玉鎮紙，玉身雕成山峰的模樣，山間還刻有松樹與溪流。底部有一個極小的魏字，想來應當是特地請人雕刻的。\n\n「這件玉質不錯，雕工也很細。輝叔知道它的來歷嗎？」\n\n輝叔望著那方玉鎮紙，眼中浮現出幾分笑意。\n\n「這是先生初入軍中時，老先生特地請人做了送給他的。」\n\n「那時候先生年輕，頭一回帶兵回來，興沖沖地跑進書房，與老先生說了整整一個晚上。老先生嘴上嫌他吵，第二日卻特意讓廚房做了一桌他愛吃的菜。」\n\n程小楓忍不住笑了。\n\n「魏戌俞從前也有這麼多話呀？」\n\n「何止呢。」\n\n輝叔笑著搖了搖頭。\n\n「先生小時候可頑皮得很。院裡那棵桂花樹，他爬過不知多少回。有一回從樹上摔下來，還將老先生最喜歡的花盆給砸了。」\n\n「後來挨了罰，又偷偷讓我拿些糕點給他。那副模樣，我至今都還記得。」\n\n程小楓聽得眉眼彎彎。\n\n她實在無法將輝叔口中那個闖禍後偷偷討糕點吃的孩子，與今晨在庭院中練武的男人聯繫在一起。\n\n「真想看看魏戌俞小時候的模樣。」\n\n輝叔聞言，從另一排木架上取下一只存放舊相片的木盒。\n\n「夫人瞧瞧這個。」\n\n那是一張已經泛黃的全家福。\n\n照片是在魏府庭院裡拍攝的，前排坐著數名年長的男女，後方站著幾位身穿長衫與軍裝的男子。孩子們則被安排在兩側，整張照片足足有二十餘人。\n\n輝叔伸手指向其中一名男孩。\n\n「這便是先生。」\n\n程小楓立即湊了過去。\n\n照片中的男孩約莫七八歲，穿著一件深色小長衫，眉眼間已有幾分如今的模樣，嘴角卻帶著毫不掩飾的笑意。\n\n「好可愛……」\n\n她忍不住笑了起來。\n\n「這真的是魏戌俞？」\n\n「千真萬確。」\n\n輝叔也笑了。\n\n然而笑過之後，程小楓的目光逐漸移向照片中的其他人。\n\n「這些都是魏家的人嗎？」\n\n「是。」\n\n「那他們如今都住在別處？」\n\n輝叔臉上的笑容漸漸淡了下來。\n\n他低頭望著那張照片，許久才開口。\n\n「有些搬離了北城，有些已經過世。」\n\n「還有些人，出了遠門，便再也沒有回來。」\n\n程小楓微微一怔。\n\n輝叔伸手撫過照片泛黃的邊緣。\n\n「從前每逢年節，魏家的人都會回到這座宅子。光是前院便得擺上好幾桌酒席，孩子們在院子裡跑，大人們在廳中喝酒談天，時常鬧到深夜。」\n\n「那時候先生最喜歡過年。既有堂兄弟陪著玩，老先生也會准他少練幾日的功夫。」\n\n他停頓片刻。\n\n「可後來，能回來吃年夜飯的人，一年比一年少。」\n\n程小楓望著照片中那些面孔，忽然明白，為何偌大一座魏府，如今竟只有魏戌俞一個主人。\n\n輝叔將照片放回木盒，目光落在桌上的白玉鎮紙。\n\n「老先生過世時，先生也不過是個二十出頭的年輕人。」\n\n「那時魏家有許多事情尚未處理妥當，軍中又正是需要他的時候。他白日去司令部，夜裡回府，還得整理老先生留下的東西。」\n\n「有好幾回，我半夜起來查看門窗，見書房的燈還亮著。進去一瞧，人已經趴在桌上睡著了，手裡卻還握著筆。」\n\n「我勸他早些休息，他總說有些事情拖不得，弄明白了再睡。」\n\n程小楓安靜地聽著。\n\n輝叔從木架上取下一幅畫軸，慢慢展開。\n\n畫上是一座村落，遠處有山林與鐵路，近處則有幾間青瓦屋舍。幾名身穿軍裝的人站在村口，身旁圍著一群笑容滿面的百姓。\n\n畫工略顯稚拙，裝裱卻格外精細。\n\n左下方寫著一行字。\n\n——南山鄉民敬贈魏上校。\n\n「前年南山鬧山匪，先生親自帶兵將被扣的百姓與鐵路工人救了回來。當地百姓原想送份厚禮，他不肯收，後來便有人帶著孩子們畫了這幅畫。」\n\n「先生將畫帶回府時，還特地交代我，要找個好手藝的人裝裱起來。」\n\n輝叔望著那幅畫，輕輕嘆了口氣。\n\n「如今在北城，提起魏上校，人人都知道他有本事。」\n\n「可我有時看著他穿著軍裝出門，還是會想起他小時候在院子裡爬樹的模樣。」\n\n「那時他犯了錯，有老先生教訓他；遇上了難事，也有家中的長輩替他拿主意。」\n\n「誰能想到，短短這些年，那個跟在父親身後的孩子，竟已成了整個魏家，乃至北城許多人所仰仗的人。」\n\n輝叔慢慢將畫軸收起。\n\n「只是從前那些能陪著他說話、問問他過得好不好的人，如今也不剩幾個了。」\n\n收藏室內安靜下來。\n\n窗外的日光已經漸漸偏西。\n\n程小楓低頭望著那方白玉鎮紙，伸手將它小心地放回木盒。\n\n「幸之，這件不用記了。」\n\n幸之抬起頭。\n\n「夫人？」\n\n「還有那幅畫，也不列入抵押品。」\n\n她將木盒蓋好。\n\n「這些東西留在魏府，比賣出去更有意義。」\n\n輝叔望著她，神情多了幾分柔和。\n\n「多謝夫人。」\n\n「沒什麼好謝的。做生意歸做生意，有些東西本來就不能只用價錢衡量。」\n\n程小楓將冊子合了起來。\n\n忙了大半日，幸之替兩人換上熱茶，便先出去準備晚飯了。\n\n輝叔在窗旁坐下，望著面前這位來到魏府不過兩日的姑娘，似乎有話想說，卻又有些遲疑。\n\n「夫人，有幾句話，我也不知該不該說。」\n\n程小楓抬起頭。\n\n「輝叔儘管說便是。」\n\n輝叔沉吟片刻。\n\n「自從您來了以後，府上確實熱鬧了許多。」\n\n「從前先生回府，用過晚飯，便往書房裡一坐。有時一整個晚上，除了交代事情，連幾句閒話也不曾與人說過。」\n\n「這兩日倒是不同。偶爾經過客廳，還能聽見先生與您說笑幾句。」\n\n輝叔露出淡淡的笑容。\n\n「雖說有時是被您弄得不知該說什麼，可那副神情，我也有許多年不曾見過了。」\n\n程小楓有些不好意思地笑了笑。\n\n輝叔望向窗外的庭院，繼續說道：\n\n「府上吃穿用度皆不缺，先生若是受了傷，我們也能請大夫過來照料。可有些事情，終究不是我們這些做下人的能夠替代的。」\n\n「從前老先生還在的時候，先生在外頭遇上什麼事情，回來總有個人能說上幾句。如今即便有了什麼難處，他也很少再向旁人提起。」\n\n「有時候，我瞧他獨自坐在書房裡，也想進去陪他說說話。可到了門前，又不知自己能說些什麼。」\n\n輝叔苦笑了一聲。\n\n「總不能每回都只問他，先生，茶還要不要再添一杯吧？」\n\n程小楓低頭望著手中的茶杯。\n\n輝叔重新看向她，語氣誠懇了幾分。\n\n「所以，若夫人願意留在魏府，我心裡其實是很高興的。」\n\n「我倒不奢望您能替先生解決什麼難事。只是希望往後他回到府上，能有個人陪他吃頓飯，說說尋常日子裡的話。偶爾遇上些高興的事情，也有人能與他一同高興。」\n\n「如此，這座宅子對他而言，或許也不只是個夜裡回來歇息的地方了。」\n\n程小楓微微一怔。\n\n她沒有想到，輝叔竟會對自己說這番話。\n\n輝叔沉默了片刻，輕輕嘆了口氣。\n\n「只是先生這些年，肩上承載的東西實在太多了。不只是魏家幾代人留下的責任，還有軍中那些弟兄的性命，以及北城百姓的安危。」\n\n「旁人到了他這個年紀，早已有了妻兒，閒暇之餘也能享享天倫之樂。可先生他……這些年來，大概連成家這件事，都不曾敢好好想過。」\n\n輝叔垂下眼睛，聲音裡多了幾分感慨。\n\n「並非他不願意過那樣的日子，只是許多事情，他有自己的顧慮。」\n\n「若先生一時半會兒還不能接受小姐的心意，又或者有些話說得不夠周全，我便倚老賣老，代先生向小姐說一聲，還請您多多見諒。」\n\n說完，他竟微微欠了欠身。\n\n程小楓連忙放下茶杯。\n\n「輝叔，您別這樣。」\n\n她望著面前這位年邁的老人，心中忽然有些說不出的滋味。\n\n從維安城初見魏戌俞開始，她便認定自己喜歡他。\n\n她曾想過，若有朝一日真能與他成親，要在魏府的院子裡種上自己喜歡的花，要與他一同去看戲，還要讓他陪自己走遍北城那些有意思的地方。\n\n那些想像裡，總少不了自己的笑聲。\n\n可她似乎從未仔細想過，在那些日子裡，魏戌俞會是什麼模樣。\n\n他會喜歡院子裡的花嗎？\n\n會不會也有想吃的東西、想去的地方？\n\n忙碌了一整日之後，又是否希望有人留一盞燈，等他回來吃飯？\n\n這些原本再尋常不過的事情，於她而言，從小便不曾缺少。\n\n即便父親在商會忙得再晚，回到家中，總也會問問她今日做了些什麼。她若遇上了有趣的事情，也會迫不及待地跑去告訴父親。\n\n她一直以為，家本來就是如此。\n\n然而方才那張泛黃的全家福，卻讓她看見了魏府曾經有過的模樣。\n\n原來這座安靜得近乎冷清的宅邸，也曾有過滿院的笑聲。\n\n原來魏戌俞也曾是那個回到家中，便興沖沖地跑去找父親說話的人。\n\n程小楓忽然很想知道，倘若往後的某一日，魏戌俞從司令部回來，會不會也願意主動坐到自己身旁，說起白日遇上的趣事。\n\n不必是軍務，也不必是那些古怪而危險的事情。\n\n哪怕只是今日的天氣不錯，或者路上見著了一件有意思的東西。\n\n她也願意聽。\n\n想到這裡，程小楓低頭笑了笑。\n\n她原先只是想走進魏戌俞的生活。\n\n如今，她卻也希望魏戌俞能在自己的生活裡，多幾分自在與快活。\n\n「輝叔。」\n\n她重新抬起頭。\n\n「您放心吧。」\n\n「我既然決定留在這兒，自然會做好自己該做的事情。魏戌俞有他的事情要忙，我也不會給他添不必要的麻煩。」\n\n她望著輝叔，神情認真了幾分。\n\n「至於照顧他的事情，您也可以分一些給我。」\n\n輝叔微微一怔。\n\n程小楓笑著說道：\n\n「雖然我現在還不知道他喜歡吃什麼、喝什麼，也不知道他平日有哪些習慣。不過這些事情，我可以慢慢學呀。」\n\n「您看著他長大，知道的肯定比我多。往後還得請您多教教我呢。」\n\n輝叔望著她，眼中漸漸浮現出笑意。\n\n「夫人有這份心，便已經很好了。」\n\n程小楓搖了搖頭。\n\n「光有心可不夠，總得做些什麼才是。」\n\n她稍稍坐直身子，鄭重地向輝叔保證道：\n\n「我答應您，往後我一定會好好照顧他的。」\n\n輝叔怔了片刻。\n\n隨即低下頭，連連點了幾下。\n\n「好……好。」\n\n他端起桌上的茶杯，藉著喝茶的動作掩去眼中的濕意。\n\n程小楓沒有多說什麼，只是重新拿起桌上的冊子，將方才那幾件物品的記錄仔細劃去。\n\n她忽然想起輝叔望著全家福時的神情。\n\n那是一個長輩望著自己孩子的目光。\n\n有驕傲，有欣慰，也有許多未曾說出口的心疼。\n\n那並非不希望魏戌俞有所成就。\n\n而是一路看著他長大的人，比起那些旁人引以為傲的軍功與聲望，更在乎他是否能平平安安地回家。\n\n***\n\n## 入山之日\n\n兩日後，清晨。\n\n魏府門外停著數輛軍用汽車。\n\n士兵們已將糧食、照明器材與醫療物資裝載妥當，整支隊伍列於庭院外，等候出發的命令。\n\n魏戌俞身穿軍裝，正與蘇孟達站在車旁。\n\n梁副官快步上前，立正敬禮。\n\n「報告上校，人員及裝備均已到齊。」\n\n「留守人員都安排好了？」\n\n「是。」\n\n魏戌俞微微頷首。\n\n「出發。」\n\n「是！」\n\n梁副官轉身傳達命令，士兵們隨即依序登車。\n\n程小楓與輝叔站在主屋前的石階上，望著眼前整裝待發的隊伍。\n\n她沒有上前打擾。\n\n直到魏戌俞即將登車時，她才忽然開口。\n\n「夫君！」\n\n魏戌俞停下腳步，轉過身來。\n\n晨風吹動著程小楓的裙襬。\n\n她站在石階上，認真地望著他。\n\n**「要平安回來。」**\n\n魏戌俞望了她片刻，輕輕點了點頭。\n\n隨即轉身登上汽車。\n\n伴隨著低沉的引擎聲，車隊緩緩駛出魏府，沿著街道朝西方而去。\n\n***\n\n而此時，西山深處。\n\n那道被山石掩埋多年的石門後方，一片漆黑的地下長廊中，忽然傳來了一聲微弱的銅鈴聲。\n\n叮——\n\n緊接著，又是一聲。\n\n長廊深處，有什麼沉重的東西正在緩慢移動。\n\n積在地上不知多少年的塵土微微震動，懸掛於石壁上的銅燈也隨之搖晃。\n\n喀噠。\n\n喀噠。\n\n喀噠。\n\n那聲音愈來愈近。\n\n竟像是火車行駛時，車輪碾過鐵軌接縫的聲音。\n\n然而那條長廊之中，根本沒有鐵軌。\n\n黑暗深處，忽然亮起了一盞昏黃色的燈。\n\n燈光搖曳間，隱約照出一排斑駁的車窗。\n\n玻璃內側布滿了密密麻麻的手印。\n\n有些已經乾涸，有些卻像是剛剛印上去的，仍沿著玻璃緩緩向下淌水。\n\n叮——\n\n一枚鏽跡斑斑的銅鈴懸掛在車廂門旁。\n\n鈴身輕輕晃動。\n\n可那枚銅鈴的內部，分明沒有鈴舌。\n\n隨著鈴聲響起，車廂裡傳來一個男人疲憊而沙啞的聲音。\n\n「副官……」\n\n「上校什麼時候來接咱們？」\n\n四周一片死寂。\n\n過了許久，另一個男人的聲音，竟從長廊更深處傳了出來。\n\n「上校？」\n\n那聲音停頓了一下，隨即發出一陣極其古怪的笑聲。\n\n「上校不是早就來了嗎？」\n\n車廂內忽然傳來一陣急促的騷動。\n\n有人拍打著車窗，有人低聲哭泣，還有人不斷拖動著沉重的鎖鏈。\n\n然而那個男人的笑聲，卻始終沒有停下。\n\n「他呀……」\n\n「到現在都還沒出去呢。」\n\n叮——\n\n銅鈴再次響起。\n\n車廂內的燈光驟然熄滅。\n\n整條地下長廊，重新陷入死一般的寂靜。\n\n（第十四回完）"}, {"n": 15, "title": "西山古道", "body": "車隊離開北城時，天邊才剛泛起一層魚肚白。\n\n入秋之後，山間的寒意來得格外早。越往西行，道路兩旁的屋舍便愈少，原本平坦的石板路也逐漸變成了崎嶇不平的山道。\n\n遠處群山連綿，山腰間纏繞著大片灰白色的霧氣，幾座高聳的山峰隱沒於雲霧之中，只露出些許漆黑的輪廓。\n\n魏戌俞坐在汽車後座，膝上攤著西山的地形圖。\n\n梁副官不時對照窗外的山勢，在圖上標記車隊經過的位置。\n\n蘇孟達則抱著自己的布袋，望著遠處的群山，難得沒有說話。\n\n直到車隊沿著一條乾涸的河道駛入山谷，他才忽然坐直了身子。\n\n「魏長官，您瞧那兩座山。」\n\n魏戌俞抬起頭。\n\n道路盡頭，兩座陡峭的山峰相對而立，中間夾著一道極為狹窄的深谷。\n\n左側山峰形似伏臥的巨龜，右側則有一道蜿蜒而下的山脊，猶如一條自山頂盤繞而下的長蛇。\n\n蘇孟達將車窗搖了下來，探頭望了好一會兒。\n\n「龜蛇相會，兩山抱谷……」\n\n魏戌俞順著他的目光望去。\n\n「玄武？」\n\n「不錯。」\n\n蘇孟達收回身子，神情若有所思。\n\n「古人修築陵墓，極為講究山川形勢。若當年修墓的人是有意挑選這個地方，那七星鎏金鏡上的玄武圖案，恐怕不只是用來鎮守墓穴的。」\n\n梁副官低頭望向地形圖。\n\n「也有可能，那幅圖案本身便與這裡的地勢有關。」\n\n魏戌俞沒有立即開口。\n\n他想起父親生前曾讓自己反覆臨摹的那些紋路。\n\n龜甲、長蛇，以及分布於其中的星辰。\n\n倘若龜與蛇分別代表兩座山脈，那麼那些星辰所代表的，又會是什麼？\n\n他拿起鉛筆，在地形圖上圈出了兩座山峰。\n\n「先記下來。等進去以後，再看看能否找到相符的東西。」\n\n梁副官點頭。\n\n車隊又向前行駛了約莫半個鐘頭，終於抵達西山勘察隊設於山外的營地。\n\n幾頂軍用帳篷立於溪谷旁，負責留守的士兵早已接到消息，整齊地列隊等候。\n\n汽車尚未完全停穩，一名軍官便快步迎了上來。\n\n「報告上校！」\n\n魏戌俞推開車門，踏上地面。\n\n「山裡的情況如何？」\n\n「依照您的命令，弟兄們已全部撤出古道。這兩日無人進入石門，不過……」\n\n軍官的神情略有些遲疑。\n\n魏戌俞望向他。\n\n「說。」\n\n「昨日夜裡，山中又傳出了汽笛聲。」\n\n「這一次，不只是留守的弟兄聽見了，連附近村落的百姓也都聽見了。」\n\n蘇孟達皺起眉頭。\n\n「聲音很大？」\n\n「是。當時山谷裡的鳥全被驚了起來，附近幾戶人家養的狗也叫了整整一夜。」\n\n軍官停頓片刻。\n\n「還有一件事。」\n\n「今晨有弟兄在溪邊發現了幾條死魚。」\n\n魏戌俞微微抬眼。\n\n「帶我去看看。」\n\n***\n\n## 逆流而上的東西\n\n營地後方有一條自山中流出的溪水。\n\n溪流並不深，水質清澈，甚至能夠看見底下大小不一的鵝卵石。\n\n幾條魚的屍體被放在岸邊的石頭上。\n\n魏戌俞蹲下身，仔細查看。\n\n魚身並沒有受到明顯的外傷，魚嘴卻大張著，腹部異常鼓脹，鱗片之間還滲出些許黑色的液體。\n\n蘇孟達從布袋中取出一根細長的竹籤，輕輕挑開其中一條魚的嘴。\n\n一小團黑色的東西，竟從魚嘴裡滑了出來。\n\n那東西濕漉漉的，彼此纏繞，乍看之下像是水中的藻類。\n\n蘇孟達將它挑了起來。\n\n臉色頓時變了。\n\n「頭髮？」\n\n梁副官俯身望去。\n\n那竟是一團極細的人髮。\n\n蘇孟達又查看了另外幾條死魚，結果幾乎一模一樣。\n\n每一條魚的腹中，都塞滿了長短不一的黑色頭髮。\n\n「這魚平日吃些水草、小蟲倒也罷了，怎麼還吃起人的頭髮來了？」\n\n魏戌俞望著那些從魚腹中取出的東西，忽然想起城西水井裡，那些曾經纏住徐老石匠雙腿的黑髮。\n\n他站起身，沿著溪流向上游望去。\n\n「這條溪從哪兒流出來的？」\n\n軍官指向遠處的山谷。\n\n「上游便是西山古道所在的地方。」\n\n梁副官立即取出地形圖。\n\n「上校，這條溪應當就是當年改道後留下的支流。若咱們先前的推測沒錯，它或許與山中的地下水道相通。」\n\n魏戌俞點了點頭。\n\n「讓弟兄們另外尋找水源。此地的溪水，不得飲用。」\n\n「是！」\n\n正說著，蘇孟達忽然伸手拉住了梁副官的衣袖。\n\n「等等，你們看看水裡。」\n\n幾人同時低下頭。\n\n清澈的溪水中，一縷極細的黑髮正隨著水流飄動。\n\n起初並無任何異常。\n\n可很快，梁副官便察覺到了不對勁。\n\n溪水明明是由山中流向營地，那縷頭髮卻正緩緩朝著相反的方向移動。\n\n它掠過一塊又一塊石頭，毫不受水流影響，彷彿有什麼東西在上游拖著它。\n\n蘇孟達沿著那縷頭髮望去。\n\n水底深處，隱約還能看見更多黑色的細絲。\n\n它們彼此纏繞，貼著溪底的石頭，無聲無息地朝山谷深處移動。\n\n忽然，一張蒼白的人臉從水面下掠了過去。\n\n「退後！」\n\n魏戌俞一把拉住離溪岸最近的蘇孟達。\n\n下一刻，溪水猛然濺起。\n\n一隻枯瘦的手從水中伸出，五指緊緊扣住岸邊的石頭。\n\n然而還未等眾人看清那究竟是什麼，水中便傳來一股極大的拉力。\n\n那隻手的指甲在石頭上刮出一道刺耳的聲響，隨即被硬生生拖入溪底。\n\n水面重新恢復平靜。\n\n站在一旁的幾名士兵面色慘白。\n\n蘇孟達愣了好一會兒，才低聲開口。\n\n「方才那東西……似乎不是自己想往山裡去的。」\n\n梁副官望著溪底那些仍在逆流而上的黑髮。\n\n「像是被什麼東西拖走了。」\n\n魏戌俞沒有回答。\n\n他望向西山深處，神情逐漸凝重。\n\n那些本該隨著溪水流出山外的東西，此刻竟全都在朝山中聚集。\n\n彷彿在這座山的深處，有什麼東西正在召喚它們。\n\n***\n\n## 送死人進山的路\n\n休整過後，魏戌俞將六名士兵留於山外營地，其餘十八名弟兄則攜帶裝備，隨三人一同進山。\n\n帶路的是先前參與勘察的一名士兵。\n\n起初山路尚算寬敞，越往深處行走，兩側的岩壁便愈發高聳。茂密的樹冠遮蔽了大半日光，腳下的泥土也逐漸變得潮濕。\n\n行至一處山腰時，帶路的士兵忽然停了下來。\n\n「上校，前面便是那條古道。」\n\n魏戌俞抬眼望去。\n\n前方的樹木之間，隱約露出一截灰白色的石階。\n\n石階寬約兩丈，自山腰一路向下延伸，兩側立著數根雕有雲紋的石柱。柱身大半已被藤蔓覆蓋，有些甚至從中間斷裂，斜斜地倒在泥土之中。\n\n若非親眼所見，實在很難想像，這片荒無人煙的山林裡，竟會藏著如此規整的一條道路。\n\n蘇孟達走到其中一根石柱前，伸手撥開上頭的藤蔓。\n\n石柱中央刻著一名身穿長袍的人物。\n\n那人雙手捧著一盞油燈，低垂著頭，身後還跟著數名姿態相似的人。\n\n然而奇怪的是，這些人物全都沒有雕刻五官。\n\n蘇孟達又走到另一根石柱前。\n\n上頭雕刻的，則是數名肩扛棺木的男子。\n\n同樣沒有五官。\n\n「引魂人、抬棺人……」\n\n他沿著石階向下望去。\n\n「魏長官，這條路，還真是用來送葬的。」\n\n魏戌俞走近石柱，伸手拂去雕刻上的泥土。\n\n「你們看這些人的腳。」\n\n梁副官低下頭。\n\n浮雕中的送葬隊伍皆朝山谷深處行進，然而每個人的腳尖，卻無一例外地朝著相反的方向。\n\n「身子朝前，雙腳朝後？」\n\n蘇孟達也湊了過來。\n\n「這雕石頭的人，總不至於連人的腳該朝哪兒都不知道吧？」\n\n魏戌俞又查看了後方幾根尚且完整的石柱。\n\n所有的人物，皆是如此。\n\n他取出七星鎏金鏡，將鏡面對準石柱。\n\n鏡中的雕刻逐漸清晰。\n\n蘇孟達原本還伸長脖子想看看究竟有何不同，然而下一刻，他便猛然向後退了一步。\n\n「哎喲！」\n\n梁副官立即望了過去。\n\n鏡中的送葬隊伍，竟全都轉過了身。\n\n原本沒有五官的面孔，此刻正一張接著一張地望向他們。\n\n有老人，有婦人，甚至還有尚未長大的孩童。\n\n每張面孔皆呈現出一種極為痛苦的神情。\n\n他們的嘴大張著，眼角垂下兩道黑色的淚痕，手中的油燈則泛著幽幽的青光。\n\n其中一名捧燈的老人，忽然抬起了頭。\n\n他的嘴唇動了動。\n\n魏戌俞立即將古鏡移開。\n\n蘇孟達倒吸一口涼氣。\n\n「這些雕像……難不成裡頭也困著亡魂？」\n\n「未必是雕像本身。」\n\n魏戌俞望著石柱上的人物。\n\n「咱們先前便見過，古鏡能映照出另一重空間的景象。這些雕刻或許只是恰好對應了那一頭的東西。」\n\n梁副官若有所思。\n\n「所以，這些石柱有可能是在標示另一條道路上的送葬隊伍？」\n\n「嗯。」\n\n魏戌俞將古鏡收了起來。\n\n「腳尖與身體的方向相反，或許便是在提醒後來的人，這條古道不能單憑眼睛所見來辨認方向。」\n\n蘇孟達看著那些無面的雕刻，不由得往道路中央挪了挪。\n\n「得，咱們這才剛到門口，便已經有人來迎接了。」\n\n魏戌俞轉頭吩咐道：\n\n「所有人跟緊隊伍，不要碰觸兩側的石柱。」\n\n「是！」\n\n眾人沿著石階繼續向下。\n\n山谷愈來愈深，四周也愈來愈安靜。\n\n原本偶爾還能聽見的鳥鳴，不知從何時起，竟已完全消失。\n\n只剩下二十一人的腳步聲，在古老的石道上此起彼落。\n\n***\n\n## 石門前的腳印\n\n約莫半個時辰後，一道巨大的石門終於出現在眾人面前。\n\n與勘察照片上所見相比，親眼見到的石門更加雄偉。\n\n整道石門嵌於岩壁之中，門楣上雕刻著層層雲紋與形態各異的瑞獸。門前原本應有兩尊鎮墓石像，如今左側那尊已經倒塌，右側的底座亦遭到破壞。\n\n大片山石自上方崩落，將門前的道路堵得嚴嚴實實。\n\n右下方那道狹窄的縫隙，甚至不足以讓一個孩子鑽過去。\n\n魏戌俞站在石門前，抬頭望向門楣。\n\n「蘇爺，看得出是哪個朝代的東西嗎？」\n\n蘇孟達走近岩壁，仔細觀察了片刻。\n\n「這門上的雲紋、瑞獸，倒有幾分唐宋年間的風格。不過有些地方又不太相似。」\n\n他伸手指向門楣中央。\n\n那裡刻著兩隻造型奇特的鳥。\n\n鳥身修長，尾羽垂落，頭頂卻並非尋常的鳥冠，而是一張小小的人臉。\n\n「人面鳥身，常見於古人引魂升天的圖案。可您看看，這兩隻鳥的頭朝著哪兒？」\n\n魏戌俞循著他的手指望去。\n\n兩隻鳥頭朝下，尾羽朝上，呈現出一種倒飛的姿態。\n\n「不是升天。」\n\n「正是。」\n\n蘇孟達點了點頭。\n\n「修墓之人恐怕壓根就沒想讓這些亡魂上天，而是要將它們全部引入地下。」\n\n魏戌俞沿著門楣上的浮雕一路望去。\n\n所有雲紋的走向，最終皆匯聚於石門中央。\n\n又是引魂。\n\n自北山那枚無舌銅鈴開始，他們便不斷見到相似的圖案。\n\n只不過眼前這座石門，比先前任何一處地方都更加完整。\n\n梁副官此時正帶著幾名士兵查看周圍的情況。\n\n不多時，他便從石門左側走了回來。\n\n「上校，您來看看這裡。」\n\n石門左側的泥地上，留著幾行尚未被雨水完全沖刷乾淨的腳印。\n\n其中大部分都是鞋印。\n\n有人穿著布鞋，也有人穿著靴子。\n\n這些腳印從山道一路延伸至石門前，顯然曾有一群人在此地停留過。\n\n然而在那些腳印之中，還混雜著另一種痕跡。\n\n赤足。\n\n魏戌俞蹲下身。\n\n那些赤足印比尋常人的腳印更長，腳趾細得近乎畸形，有幾個甚至拖出了長長的泥痕。\n\n梁副官伸手指向腳印的方向。\n\n「穿鞋的腳印是從外頭進來的。赤足印卻是從石門旁邊延伸出去，最後消失在那片草叢裡。」\n\n蘇孟達聞言，立即朝草叢望了一眼。\n\n「所以先前進山的人，不僅動過鎮墓石像，還把裡頭的東西放了出來？」\n\n魏戌俞沒有回答。\n\n他沿著那些穿鞋的腳印，慢慢走向岩壁。\n\n隨後停下腳步。\n\n梁副官跟了上來。\n\n「上校？」\n\n魏戌俞指向腳下。\n\n「這些人是從哪兒進去的？」\n\n梁副官低頭望去。\n\n鞋印一路延伸至石門左側，卻在距離岩壁不到半步的位置，突然消失了。\n\n前方是一整片堅硬的岩石。\n\n既無洞口，也沒有任何可供人攀爬的地方。\n\n魏戌俞伸手敲了敲岩壁。\n\n聲音沉悶，並不像是空心的。\n\n蘇孟達走了過來，左右查看了一番。\n\n「莫非這兒還藏著另一道門？」\n\n「找找看。」\n\n三人沿著岩壁仔細搜尋。\n\n幾名士兵也將附近的藤蔓與雜草清理乾淨。\n\n然而除了大片冰冷的岩石，什麼也沒有發現。\n\n魏戌俞站在原地，思索片刻。\n\n忽然，他轉頭望向那尊已經遭人挪動的鎮墓石像。\n\n石像原本面向山外，如今卻向左側歪斜了些許。\n\n而它那隻向外伸出的手掌，恰好指向腳印消失的位置。\n\n魏戌俞目光微動。\n\n「副官，把方才的照片拿出來。」\n\n梁副官立即從皮包中取出勘察照片。\n\n魏戌俞將照片與眼前的石像進行比對。\n\n「石像底座的撬痕，並不是朝著石門的方向。」\n\n他指向底座下方的一道弧形痕跡。\n\n「他們當時不是想將石像搬走，而是想讓它轉向另一個位置。」\n\n蘇孟達恍然道：\n\n「這石像莫非還有指路的作用？」\n\n魏戌俞取出七星鎏金鏡。\n\n「試試便知道了。」\n\n他站到石像旁，依照石像手掌所指的方向，緩緩轉動古鏡。\n\n起初鏡中所見，仍是一片尋常的岩壁。\n\n可當鏡面稍稍向左傾斜時，鏡中的岩石竟開始發生變化。\n\n原本粗糙不平的石壁上，逐漸浮現出一道狹長的門框。\n\n門框兩側還雕刻著兩排捧燈的侍者。\n\n在侍者腳下，赫然有一道向下延伸的石階。\n\n梁副官不由得抬起頭。\n\n眼前依舊是一片完整的岩壁。\n\n蘇孟達看看古鏡，又看看岩石。\n\n「好傢伙，正門不走，原來還有一道偏門。」\n\n魏戌俞將鏡面移開，再重新對準岩壁。\n\n那道石門再次出現。\n\n然而就在這時，他忽然注意到，鏡中的石階上似乎放著什麼東西。\n\n「副官，燈。」\n\n梁副官立即取來一盞提燈，舉至古鏡旁。\n\n昏黃的光線映入鏡面。\n\n三人這才看清。\n\n石階上躺著一隻沾滿泥土的布鞋。\n\n鞋子旁邊，還有一行暗紅色的拖痕。\n\n一直延伸至石階深處。\n\n***\n\n## 不能走的門\n\n蘇孟達盯著那隻布鞋，半晌才開口。\n\n「看來先前那些人，確實是從這兒進去的。」\n\n梁副官望向魏戌俞。\n\n「上校，咱們也從這道門走？」\n\n「先別急。」\n\n魏戌俞將古鏡交給梁副官，自己走到岩壁前。\n\n他伸出手，掌心貼上石壁。\n\n觸感冰冷而堅硬。\n\n然而當梁副官將古鏡稍稍轉動，讓鏡中的石門與眼前的岩壁重合時，魏戌俞掌下的岩石竟逐漸失去了原有的觸感。\n\n一股刺骨的寒意，從他的指尖傳了上來。\n\n緊接著，他的手竟穿過了岩壁。\n\n身後的幾名士兵見狀，不約而同地倒吸了一口涼氣。\n\n魏戌俞立即將手收了回來。\n\n指尖上，竟沾著一層細密的水珠。\n\n「果然如此。」\n\n他低頭望著自己的手。\n\n「這道門並不在咱們所處的地方。」\n\n蘇孟達有些不解。\n\n「可既然能進去，不就省了清理那些山石的工夫？」\n\n魏戌俞搖了搖頭。\n\n「若咱們從這裡進去，便等於尚未抵達古墓，就先踏上了死人的路。」\n\n「況且，先前那些人留下的只有進去的腳印，你可曾見過他們出來的痕跡？」\n\n蘇孟達聞言，臉上的神情頓時一僵。\n\n「這倒沒有……」\n\n魏戌俞望向石門前那些堆積的山石。\n\n「他們選擇走這道門，或許是因為正門遭到阻塞，又或許另有目的。可咱們不必跟著他們走。」\n\n梁副官微微頷首。\n\n「先確保有一條真正能夠返回山外的道路。」\n\n「正是。」\n\n魏戌俞正欲從梁副官手中接回古鏡，梁副官卻忽然開口。\n\n「上校，等等。」\n\n鏡面之中，那條向下延伸的石階上，不知何時多出了一道人影。\n\n那人身穿灰色衣裳，背對著他們，雙手垂在身側。\n\n一動不動地站在石階中央。\n\n蘇孟達壓低聲音。\n\n「剛才有這個人嗎？」\n\n梁副官搖頭。\n\n魏戌俞接過古鏡，仔細望去。\n\n那人腳上只穿著一隻布鞋。\n\n另一隻腳赤裸著，腳踝處還纏著幾縷黑色的頭髮。\n\n石階上的那隻鞋，顯然便是他的。\n\n「喂！」\n\n蘇孟達試探著喊了一聲。\n\n那人的肩膀微微顫動了一下。\n\n緊接著，他慢慢轉過頭。\n\n先是脖子。\n\n再是下巴。\n\n然而他的身體始終沒有轉動。\n\n隨著頭顱愈轉愈多，頸部的皮肉竟像擰緊的布條一般，逐漸出現了一道道深深的褶皺。\n\n蘇孟達臉上的血色霎時褪去。\n\n那人終於將整張臉轉了過來。\n\n他雙眼圓睜，眼珠幾乎凸出眼眶，嘴裡塞滿了濕漉漉的黑髮。\n\n卻仍然努力朝三人露出一個笑容。\n\n「走……」\n\n一道含糊不清的聲音，竟從眼前的岩壁中傳了出來。\n\n「走這邊……」\n\n魏戌俞立即將古鏡翻了過來。\n\n鏡中的景象消失了。\n\n可那聲音仍在繼續。\n\n「這邊……好走……」\n\n咚。\n\n咚。\n\n咚。\n\n岩壁內側，傳來了沉重的敲擊聲。\n\n彷彿有人正用自己的額頭，一下一下撞擊著石壁。\n\n魏戌俞向後退了兩步。\n\n「所有人遠離岩壁。」\n\n士兵們立即撤至石道中央。\n\n蘇孟達緊緊抱著自己的布袋。\n\n「魏長官，我方才什麼也沒答應他吧？」\n\n魏戌俞看了他一眼。\n\n「你若有興趣，倒可以再與他談談。」\n\n「不了不了！」\n\n蘇孟達連忙擺手。\n\n「咱們還是老老實實走正門吧。」\n\n梁副官在旁忍不住笑了一聲，隨即帶著弟兄們前去清理石門前的山石。\n\n身後的岩壁漸漸安靜下來。\n\n然而直到眾人走遠，石階深處仍有一道模糊的聲音在反覆呢喃。\n\n「怎麼……不進來了呢……」\n\n***\n\n## 被封在門後的東西\n\n石門前的山石比想像中更加沉重。\n\n士兵們忙了將近一個時辰，才將門前大部分碎石清理乾淨。\n\n隨著最後一塊巨石被移開，完整的石門終於顯露於眾人眼前。\n\n這是一道向內開啟的雙扇石門。\n\n兩扇門上分別雕刻著一尊身穿甲冑的武將。武將雙目緊閉，手中持劍，劍尖朝下，正抵著各自腳下的一條長蛇。\n\n門縫中央，有一道以青銅製成的圓形門鎖。\n\n那門鎖並非尋常的鎖孔，而是由內外兩層彼此套合的銅環組成。\n\n外環刻著二十八星宿，內環則只有七顆大小不一的星辰。\n\n魏戌俞走上前，仔細觀察銅環。\n\n其中幾顆星辰旁，留有新近遭到刮擦的痕跡。\n\n「有人試過開門。」\n\n梁副官伸手指向銅環下方。\n\n「上校，這兒也有撬過的痕跡。不過青銅並沒有斷裂，看來他們並未成功。」\n\n蘇孟達蹲在門鎖前，研究了好一會兒。\n\n「難怪那些人會去動旁邊的石像。這道門打不開，便只能另尋入口了。」\n\n魏戌俞伸手轉動外側銅環。\n\n銅環雖然年代久遠，轉動時卻並沒有想像中那般艱難。\n\n隨著外環移動，門內傳來一陣低沉的機括聲。\n\n喀。\n\n喀。\n\n他立即停下動作。\n\n「蘇爺，把燈拿近些。」\n\n蘇孟達舉起提燈。\n\n魏戌俞的目光沿著外環上的星宿一一移動。\n\n角、亢、氐、房、心、尾、箕。\n\n斗、牛、女、虛、危、室、壁。\n\n二十八宿依照各自方位排列，並無異常。\n\n然而內環上的七顆星辰，卻並非依照北斗七星尋常的形態排列。\n\n其中末端的一顆星，被刻在一個極為特殊的位置。\n\n魏戌俞望著那顆星辰，忽然想起了什麼。\n\n他幼時在父親書房裡臨摹玄武圖時，曾有無數回畫錯那顆星的位置。\n\n每當如此，父親便會將他畫好的紙重新抽走，讓他從頭再畫一遍。\n\n直到後來，他甚至不必睜開眼睛，也能在紙上準確地畫出整幅圖紋。\n\n「原來是這樣……」\n\n梁副官望向他。\n\n「上校認得這個排列？」\n\n「與魏家的印記相同。」\n\n魏戌俞伸手轉動外側銅環，將北方七宿移至內環七星附近。\n\n蘇孟達立即湊了過來。\n\n「魏長官，這是要讓兩組星辰彼此對應？」\n\n「未必。」\n\n魏戌俞停下動作。\n\n「北方七宿是玄武之象，可這門上除了星辰，還有其他東西。」\n\n他抬頭望向兩扇石門上雕刻的武將。\n\n梁副官順著他的目光望去。\n\n兩尊武將的劍尖皆抵著長蛇。\n\n然而左側那條長蛇的頭顱朝上，右側那條長蛇的頭顱卻朝下。\n\n兩條蛇身彼此交錯，形態恰好相反。\n\n梁副官若有所思。\n\n「又是兩個相反的方向。」\n\n「嗯。」\n\n魏戌俞取出古鏡，映照門上的銅環。\n\n鏡中的內環星辰果然發生了變化。\n\n原本位於末端的那顆星，竟在鏡中移至另一側，恰好落於外環的北方七宿之間。\n\n蘇孟達仔細比對了片刻，忽然指向其中一顆星。\n\n「您看！若按照鏡中所見的排列，這顆星正好與斗宿相合。」\n\n魏戌俞點了點頭。\n\n「父親從前教我的排列，是將玄武圖翻轉之後，才能與正常的星宿相合。」\n\n「當時我始終不明白，為何要記下一幅與尋常星圖不同的圖案。」\n\n他望著眼前這道沉寂多年的石門。\n\n如今，似乎終於有了答案。\n\n魏戌俞一手持鏡，另一隻手緩緩轉動內環。\n\n隨著七顆星辰依序移至對應的位置，門內的機括聲愈發清晰。\n\n最後一顆星辰落定。\n\n喀噠。\n\n石門深處傳來一聲輕響。\n\n緊接著，兩扇沉重的石門微微向內移動了半寸。\n\n蘇孟達眼睛一亮。\n\n「成了！」\n\n然而魏戌俞並未露出喜色。\n\n門鎖已經鬆開，石門卻仍然停在原處。\n\n門後似乎有什麼東西，正死死抵著它。\n\n梁副官讓幾名士兵上前協助。\n\n眾人合力推動石門。\n\n伴隨著一陣沉重的摩擦聲，門縫逐漸擴大。\n\n一股難以形容的腐朽氣味，立即自門後湧出。\n\n魏戌俞舉起提燈，朝門縫內照去。\n\n「停！」\n\n士兵們立即收住力氣。\n\n透過那道半人寬的縫隙，眾人終於看清了抵在石門後方的東西。\n\n那是一具屍體。\n\n一具身穿長袍、早已乾枯的屍體。\n\n它跪在地上，背部抵著石門，雙手則死死抓住兩側的門框。\n\n十根手指幾乎全都折斷了。\n\n那具屍體的頭顱低垂著，長髮披散，衣衫上還留著早已乾涸的大片血跡。\n\n蘇孟達舉著提燈，神情逐漸凝重。\n\n「這衣裳……不像是墓裡原先的人。」\n\n梁副官仔細看了看。\n\n「應當是近幾十年間進來的。」\n\n魏戌俞的目光落在屍體的姿勢上。\n\n「他不是想出去。」\n\n蘇孟達微微一怔。\n\n魏戌俞指向屍體緊扣門框的雙手。\n\n「你們看，他是背對著石門，雙手向後抓住門框。若是想逃出去，不會是這樣的姿勢。」\n\n梁副官的神情一變。\n\n「他是在阻止這道門被打開？」\n\n魏戌俞沒有回答。\n\n他將提燈再往內伸了些。\n\n昏黃的燈光照向屍體面前的石階。\n\n那裡密密麻麻，全是指甲刮過石頭所留下的痕跡。\n\n有些痕跡甚至一直延伸至屍體的腳邊。\n\n彷彿曾有無數雙手，自石階深處爬了上來，想要將這具屍體拖回去。\n\n蘇孟達低聲喃喃。\n\n「這人究竟在裡頭遇見了什麼……」\n\n就在此時。\n\n一陣極為微弱的聲音，忽然從屍體的口中傳了出來。\n\n「別……」\n\n眾人瞬間僵住。\n\n魏戌俞手中的提燈停在半空。\n\n那具早已乾枯的屍體，竟緩緩抬起了頭。\n\n空洞的眼眶望向門外。\n\n下顎輕輕顫動。\n\n「別……應……」\n\n蘇孟達下意識問道：\n\n「別應什麼？」\n\n屍體張開嘴，喉嚨裡發出一陣乾澀的摩擦聲。\n\n似乎還想再說些什麼。\n\n然而下一刻，它緊扣門框的雙手忽然鬆開，整具身軀猛然向後倒去。\n\n魏戌俞伸手想要抓住它。\n\n一條漆黑的鎖鏈卻自石階下方驟然繃緊，將那具屍體迅速拖入了黑暗之中。\n\n嘩啦啦——\n\n鎖鏈拖過石階，發出刺耳的聲響。\n\n梁副官立即拔槍。\n\n「戒備！」\n\n士兵們紛紛舉起武器。\n\n所有人的目光都集中於那條漆黑的石階。\n\n可等了許久，裡頭再也沒有任何動靜。\n\n只有方才那具屍體留下的幾根斷裂的指骨，靜靜地躺在門框旁。\n\n***\n\n## 地下的第一盞燈\n\n石門終於完全打開了。\n\n一條極為寬闊的石階，自門後一路向山腹深處延伸。\n\n兩側的岩壁上，鑿有一個又一個半人高的石龕，每個石龕內都跪坐著一尊捧燈的陶俑。\n\n那些陶俑身穿長袍，雙目緊閉，神情安詳，與外頭石柱上那些沒有面孔的送葬人截然不同。\n\n只是它們手中所捧的油燈，早已乾涸了不知多少年。\n\n魏戌俞站在入口處，將七星鎏金鏡重新取了出來。\n\n兩枚白玉的色澤並
