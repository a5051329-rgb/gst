未發生明顯變化。\n\n那條細如髮絲的黑線，也仍維持著原本的模樣。\n\n他這才稍稍放下心來。\n\n「副官，確認時間。」\n\n梁副官取出懷錶。\n\n「上午十一時四十分。」\n\n魏戌俞點了點頭，讓人記錄下進入古墓的時間，又命兩名士兵在石門附近留下記號。\n\n蘇孟達則蹲在門邊，撿起了方才那具屍體遺留下來的一小塊衣料。\n\n「魏長官，您看看這個。」\n\n那塊布料內側，竟縫著一枚小小的銅牌。\n\n銅牌表面已經氧化發黑，仍隱約可見兩個刻得極深的文字。\n\n魏戌俞接了過來。\n\n待看清那兩個字時，他的眉頭忽然皺了起來。\n\n——丙七。\n\n梁副官望向他。\n\n「上校認得？」\n\n魏戌俞將銅牌翻了過來。\n\n背面空無一物。\n\n「我父親留下的箱子裡，也有幾枚樣式相近的銅牌。只是上頭刻著不同的文字。」\n\n「那是魏家的東西？」\n\n「現在還不能確定。」\n\n魏戌俞將銅牌收入軍服口袋，重新望向地下石階。\n\n方才那具屍體，或許與父親當年進山的事情有所關聯。\n\n但那人究竟是誰，又為何會死在這道門後，仍無從得知。\n\n「走吧。」\n\n魏戌俞率先踏入石門。\n\n梁副官與蘇孟達緊隨其後，十八名士兵依序進入古道。\n\n隨著眾人逐漸深入，身後的日光愈來愈微弱。\n\n四周的寒意也與山外截然不同。\n\n那是一種彷彿能夠穿透衣衫，直接滲入骨髓的陰冷。\n\n石階比想像中更長。\n\n眾人向下走了許久，始終未能望見盡頭。\n\n然而就在經過第三十六尊陶俑時，蘇孟達忽然停住了腳步。\n\n「魏長官。」\n\n魏戌俞回過頭。\n\n蘇孟達指著前方的石龕。\n\n「您看那盞燈。」\n\n在距離眾人十餘步的地方，一尊陶俑手中的油燈，竟燃著微弱的青色火焰。\n\n那火焰極小，在漆黑的石廊中輕輕搖曳。\n\n梁副官舉起提燈，照向油燈周圍。\n\n燈盞之中並沒有燈油。\n\n甚至連燈芯也沒有。\n\n蘇孟達的臉色逐漸變得難看。\n\n「這燈是自己亮的？」\n\n話音剛落。\n\n第二盞油燈亮了起來。\n\n緊接著，是第三盞、第四盞。\n\n幽青色的火焰沿著石階兩側一路向下，直至黑暗深處。\n\n原本沉寂無聲的地下長廊，頃刻間被數十盞青燈照亮。\n\n而那些陶俑原本緊閉的雙目，竟也隨著燈火亮起，一尊接著一尊地睜開了。\n\n所有陶俑皆低垂著頭。\n\n眼珠卻斜斜向上，望著正在石階上行走的眾人。\n\n魏戌俞立即抬起右手。\n\n整支隊伍停了下來。\n\n四周一片死寂。\n\n就在這時，石階盡頭傳來了一聲熟悉的銅鈴聲。\n\n叮——\n\n魏戌俞的神情猛然一變。\n\n那聲音，他絕不會認錯。\n\n正是北山隧道裡，那枚沒有鈴舌的引魂銅鈴所發出的聲響。\n\n緊接著，黑暗中傳來了一道男人的聲音。\n\n「梁副官。」\n\n梁子敬猛然抬頭。\n\n那聲音沉穩、低沉，帶著他極為熟悉的語氣。\n\n**竟是魏戌俞的聲音。**\n\n「清點人數。」\n\n梁副官尚未開口，站在他身旁的魏戌俞便一把按住了他的肩膀。\n\n「別應。」\n\n方才那具乾屍未能說完的話，霎時浮現在三人腦海之中。\n\n叮——\n\n銅鈴再次響起。\n\n石階深處的聲音停頓了片刻。\n\n似乎正在等待回答。\n\n見始終無人應答，那聲音又一次響了起來。\n\n只是這一回，語氣中多了幾分疑惑。\n\n「副官？」\n\n「你們怎麼還在上頭？」\n\n魏戌俞握緊了手中的古鏡。\n\n鏡身左側的白玉之中，那條原本細如髮絲的黑線，正在以肉眼可見的速度向外蔓延。\n\n黑暗深處，那個與他聲音一模一樣的男人，緩緩說出了下一句話。\n\n**「我已經在這裡等了你們三日了。」**\n\n---\n\n（第十五回完）"}, {"n": 16, "title": "十二跪像", "body": "「我已經在這裡等了你們三日了。」\n\n那道聲音自石階深處傳來，沿著兩側的岩壁反覆迴盪。\n\n梁副官的手仍按在槍套上。\n\n他跟隨魏戌俞多年，對他的聲音再熟悉不過。無論是下達命令時的語氣，還是說話間極為細微的停頓，都與眼前這位上校毫無分別。\n\n倘若魏戌俞此刻並未站在自己身旁，他恐怕當真會以為，上校已經先一步抵達了石階盡頭。\n\n蘇孟達壓低聲音。\n\n「魏長官，這東西怎麼連您平日說話的腔調都學得一模一樣？」\n\n魏戌俞沒有回答。\n\n他低頭望向七星鎏金鏡。\n\n鏡身左側的白玉已有小半染上黑色，而右側那枚玉石，依舊保持著原本的色澤。\n\n石階兩旁，數十尊陶俑手中的青燈靜靜燃燒著。\n\n它們的身體並未移動，眼珠卻始終隨著眾人的身影緩緩轉動。\n\n魏戌俞將古鏡稍稍傾斜，照向前方的石階。\n\n鏡中並無青燈。\n\n原本跪坐在石龕裡的陶俑，竟變成了一個個身穿灰白衣裳的人。他們雙手被鐵鏈束縛，低垂著頭，頸後插著一根細長的銅釘。\n\n那些青色的火焰，正是從他們捧於掌中的燈盞裡燃起的。\n\n「蘇爺，你看看他們頸後的東西。」\n\n蘇孟達湊近古鏡。\n\n待看清那些銅釘的位置後，臉色頓時沉了下來。\n\n「鎖魂釘。」\n\n梁副官問道：\n\n「何謂鎖魂釘？」\n\n「我從前在一本記載古代邪術的書裡見過。據說將刻有符文的銅釘打入死者頸後，便能將魂魄拘在原處，使其不得離去。」\n\n蘇孟達望著鏡中那些被束縛的人。\n\n「不過我也是頭一回親眼見到，沒想到還真有人用這種陰損的法子。」\n\n魏戌俞沿著石階向下望去。\n\n「這麼長的一條路，每隔數尺便有一尊陶俑。若每尊陶俑裡都拘著一道亡魂，那當年修墓之人，究竟用了多少人來修這座墓？」\n\n蘇孟達沒有接話。\n\n光是眼前這條尚未走完的石階，便足以令人不寒而慄。\n\n叮——\n\n銅鈴再次響起。\n\n石階盡頭，那個男人似乎已經等得有些不耐煩了。\n\n「梁副官，聽見沒有？」\n\n梁副官神情一凜。\n\n魏戌俞將古鏡收入懷中，轉身面向身後的士兵。\n\n「傳令下去。無論聽見什麼人的聲音，都不要擅自答話。即便聽見自己的名字，也是一樣。」\n\n梁副官立即將命令傳至隊伍後方。\n\n就在這時，前方的聲音忽然停了。\n\n片刻後，石階深處傳來一陣緩慢的腳步聲。\n\n一步。\n\n兩步。\n\n三步。\n\n似乎有人正沿著石階向上走來。\n\n士兵們紛紛舉起槍，提燈的光芒交錯落在前方。\n\n然而那腳步聲走了許久，始終不見人影。\n\n魏戌俞凝神聽了片刻，忽然察覺了什麼。\n\n「副官。」\n\n梁副官望向他。\n\n魏戌俞伸出手指，指向身後。\n\n腳步聲並不是從前方傳來的。\n\n而是從隊伍最後面。\n\n***\n\n## 少了一個人\n\n魏戌俞猛然轉身。\n\n隊伍後方，數名士兵也察覺到了異樣，紛紛將提燈舉高。\n\n石階上空空蕩蕩。\n\n除了他們自己，並無其他人影。\n\n梁副官立即走向隊伍末端。\n\n「方才誰在最後？」\n\n一名年紀稍長的士兵回答道：\n\n「報告副官，是小何。他替弟兄們拿著備用的提燈。」\n\n梁副官望向他身後。\n\n「人呢？」\n\n那士兵愣了一下，猛然回過頭。\n\n原本應當跟在他身後的人，竟已不見蹤影。\n\n「小何？」\n\n他下意識喊了一聲。\n\n魏戌俞立即喝道：\n\n「不要喊！」\n\n士兵頓時噤聲。\n\n梁副官讓所有人停在原地，迅速清點了一遍人數。\n\n片刻後，他回到魏戌俞身旁。\n\n「上校，少了一名弟兄。」\n\n「何時不見的？」\n\n「方才還在。後頭的弟兄說，青燈亮起以前，小何還曾替他拿過東西。」\n\n魏戌俞抬起提燈，照向來時的石階。\n\n青色的燈火一路延伸至上方。\n\n然而除了那些低垂著頭的陶俑，什麼也沒有。\n\n「副官，與我去看看。蘇爺，你留在這裡，照看其餘弟兄。」\n\n蘇孟達點頭。\n\n魏戌俞與梁副官沿著石階往回走了十餘步，仔細查看兩側的石龕。\n\n不多時，梁副官便在其中一座石龕下方發現了一盞提燈。\n\n「上校！」\n\n魏戌俞走近。\n\n提燈並未摔壞，裡頭的火苗仍在燃燒。提柄上還掛著一小截軍綠色的布帶。\n\n正是小何方才攜帶的東西。\n\n「燈還在，人卻不見了。」\n\n梁副官舉起提燈，照向石龕。\n\n那尊陶俑與其他陶俑並無太大分別，同樣雙手捧燈，跪坐於石座上。\n\n只不過，它身下的石座旁，竟多出了一行尚未乾透的水跡。\n\n水跡自石階延伸至陶俑背後，最後消失在石壁之中。\n\n魏戌俞伸手觸碰石壁。\n\n冰冷而堅硬。\n\n他取出古鏡，對準石龕。\n\n鏡中的陶俑逐漸消失。\n\n取而代之的，是一間極為狹窄的石室。\n\n石室深處，一名身穿軍裝的士兵正背對著他們，坐在地上。\n\n「小何！」\n\n梁副官幾乎脫口而出，卻在最後一刻壓住了聲音。\n\n鏡中的士兵彷彿察覺到了什麼，猛然回過頭來。\n\n他的臉上滿是驚恐。\n\n嘴唇不停開合，似乎正在大聲呼救，可魏戌俞與梁副官卻聽不見半點聲音。\n\n魏戌俞將古鏡稍稍移動，試圖看清石室周圍的情況。\n\n就在這時，小何身後的黑暗中，緩緩伸出了一隻手。\n\n那隻手搭在了他的肩膀上。\n\n緊接著，又是一隻。\n\n第三隻。\n\n第四隻。\n\n小何驚恐地掙扎起來。\n\n梁副官立即上前，試圖伸手穿過石壁。\n\n然而這一次，他的手卻被堅硬的岩石擋了回來。\n\n「上校，過不去！」\n\n魏戌俞迅速調整古鏡的角度。\n\n鏡中的石室開始晃動，彷彿隔著一層不斷泛起波紋的水面。\n\n小何拚命朝他們伸出手。\n\n那些手臂卻從黑暗中愈伸愈多，一點一點將他拖向石室深處。\n\n「小何！」\n\n梁副官終究忍不住喊出了聲。\n\n就在這一瞬間，鏡中所有手臂忽然停了下來。\n\n小何也不再掙扎。\n\n他望著梁副官，眼睛睜得極大。\n\n一張陌生的面孔，從他肩膀後方慢慢探了出來。\n\n那是一名面色慘白的婦人。\n\n她的嘴角微微揚起。\n\n「在。」\n\n梁副官渾身一僵。\n\n魏戌俞立即將他拉離石龕。\n\n轟！\n\n原本跪坐在石座上的陶俑，竟猛然向前傾倒，摔碎在兩人方才站立的位置。\n\n碎裂的陶片之中，滾出了一顆乾枯的人頭。\n\n那顆人頭在石階上滾了幾圈，停在梁副官腳旁。\n\n它的嘴仍一張一合。\n\n「在……」\n\n「在……」\n\n魏戌俞一腳將其踢離。\n\n人頭順著石階滾入黑暗，聲音這才漸漸消失。\n\n梁副官望向古鏡。\n\n鏡中的石室已經不見了。\n\n小何也不知被拖往了何處。\n\n「上校……」\n\n魏戌俞望著那座空蕩蕩的石龕。\n\n「他被帶到了另一條路上。」\n\n梁副官握緊拳頭。\n\n「方才我若沒有出聲……」\n\n「先別急著下結論。」\n\n魏戌俞重新檢查古鏡上的白玉。\n\n「方才他尚且能夠掙扎，說明他至少還有意識。只要能找到兩處道路相通的地方，便仍有機會將他帶回來。」\n\n他拍了拍梁副官的肩膀。\n\n「記住這間石室的模樣。咱們往下找。」\n\n梁副官深吸了一口氣。\n\n「是。」\n\n兩人重新返回隊伍。\n\n魏戌俞將方才所見簡要告知蘇孟達，隨後命所有人兩兩照應，不得再有任何一人獨自行動。\n\n而這一次，隊伍只剩下二十人。\n\n***\n\n## 水底的宮殿\n\n石階盡頭，終於出現了一道寬闊的拱門。\n\n魏戌俞舉起提燈，率先走了出去。\n\n眼前的景象，卻讓所有人不約而同地停下了腳步。\n\n石階之外，竟是一座足有數丈之高的地下殿宇。\n\n四根巨大的石柱自地面拔起，支撐著上方雕刻繁複的穹頂。柱身刻滿了交錯的雲紋與龍獸，頂端則雕成四張面容威嚴的人臉，俯瞰著整座殿堂。\n\n殿宇中央是一方巨大的水池。\n\n池水漆黑，深不見底。\n\n兩側各有六尊跪地石像，自入口一路排列至水池盡頭。石像皆有真人大小，身上雕刻著層層衣袍，雙手平舉，掌心朝外。\n\n它們面容各異，有男有女，甚至還有幾個孩童。\n\n然而無一例外，每尊石像的額頭上，都刻著一道細長的凹槽。\n\n蘇孟達望了許久，忽然開口。\n\n「十二尊跪像，中央一方黑水……魏長官，咱們找著了。」\n\n魏戌俞取出銅刻圖。\n\n圖中西側古道的盡頭，果然便是這座殿宇。\n\n十二尊跪像分列兩旁，中央水池呈長方形，就連四根石柱的位置，也與眼前所見相差無幾。\n\n梁副官環顧四周。\n\n「徐老石匠二十年前到過的地方，應當就是這裡。」\n\n魏戌俞點頭。\n\n「當年他從北山進來，咱們如今從西山進來，卻抵達了同一座水殿。先前對墓穴位置的推測，至少有一部分是對的。」\n\n他將提燈舉高，望向殿宇上方。\n\n穹頂並非尋常的半圓形，而是被雕刻成一幅極為壯觀的星圖。\n\n無數星辰以大小不一的銅珠鑲嵌於石頂之中，彼此之間以細密的刻線相連。星圖中央，則是一輪缺了一角的圓月。\n\n燈光掠過那些銅珠，彷彿整片夜空都被封進了這座地下宮殿。\n\n蘇孟達仰著頭，忍不住感嘆道：\n\n「單是這一座殿，便不知得耗費多少工匠、多少年月才能修得出來。」\n\n魏戌俞望向兩側那些跪地石像。\n\n「可惜修成這座宮殿的人，未必有機會活著出去。」\n\n他走到最近的一尊石像前。\n\n石像的衣袖下方，隱約露出幾個極小的文字。\n\n魏戌俞伸手拂去灰塵。\n\n——生者無名，死者歸位。\n\n他目光一沉。\n\n梁副官走了過來。\n\n「上校，這與先前軍用車廂裡那尊陶俑上的文字相同。」\n\n「嗯。」\n\n魏戌俞又查看了另外幾尊石像。\n\n其中有些刻著相同的文字，有些則在手腕處刻著形態各異的符號。\n\n那些符號並不似姓名，反倒像是用來區分不同物件的記號。\n\n蘇孟達蹲下身子，研究了片刻。\n\n「這些跪像恐怕並不是為了紀念什麼人。」\n\n他指向石像額頭上的凹槽。\n\n「若我沒猜錯，這些地方原先應當鑲有某種東西。或許是玉石，或許是刻有名字的銅片。」\n\n魏戌俞望著那些空蕩蕩的凹槽。\n\n「若這些石像各自代表一名亡魂，那麼將名字取走，又會如何？」\n\n蘇孟達抬起頭。\n\n「沒有名字，便無從辨認其生前的身分。」\n\n兩人對視一眼。\n\n魏戌俞再次望向那行石刻。\n\n生者無名，死者歸位。\n\n那些在北山出現過的無面亡魂，或許並非天生便沒有面孔。\n\n而是有人故意奪走了它們原有的身分。\n\n***\n\n梁副官沿著水池外圍走了一圈，很快便發現了另一處異樣。\n\n「上校，這裡有人來過。」\n\n殿宇左側的一根石柱旁，散落著幾截早已腐朽的木材。\n\n木材下方壓著一只生鏽的鐵盒，裡頭還留有幾根受潮的火柴，以及一張幾乎爛成碎片的紙。\n\n蘇孟達仔細辨認了一會兒。\n\n「都是近幾十年間的東西。」\n\n魏戌俞則注意到，石柱底部有人以尖銳物件刻下了幾道痕跡。\n\n其中一道箭頭，指向水池對岸。\n\n旁邊還有兩個極小的文字。\n\n——丙七。\n\n魏戌俞從軍服口袋中取出方才在石門前得到的銅牌。\n\n兩者上的文字完全相同。\n\n梁副官神情一變。\n\n「那具屍體生前到過這裡？」\n\n「很有可能。」\n\n魏戌俞以指腹撫過石柱上的刻痕。\n\n「他既然留下了記號，便表示當年進來的並非只有他一人。」\n\n蘇孟達望向水池對岸。\n\n「不過，這箭頭所指的地方，怎麼是堵牆？」\n\n魏戌俞順著他的目光望去。\n\n水池盡頭，共有兩道石門。\n\n左側石門雕有一輪烈日，右側則雕著一彎殘月。\n\n兩道石門之間，卻只是一片完整的石壁。\n\n丙七留下的箭頭，恰恰指向那片石壁。\n\n梁副官取出描摹好的圖紙。\n\n「上校，徐老石匠當年提到過，這座水殿裡應當有三道石門。可第三道門，不知為何會突然消失。」\n\n魏戌俞望著那片石壁。\n\n「咱們找找那第三道門。」\n\n***\n\n## 水中的第三道門\n\n魏戌俞與蘇孟達沿著水池邊緣走至殿宇盡頭。\n\n梁副官則帶著幾名士兵查看兩側石門。\n\n左側刻有烈日的石門已被一道沉重的石閂封死，石門下方有些許水跡。\n\n右側刻著殘月的石門則微微敞開了一條縫隙。\n\n然而從縫隙中望去，裡頭並非道路，而是一片深不見底的黑暗。\n\n蘇孟達拿起一小塊碎石，朝門縫裡丟了進去。\n\n等了許久，才聽見極其微弱的落水聲。\n\n「這底下怕是個大坑。」\n\n魏戌俞沒有貿然靠近。\n\n他站在兩道石門中央，將七星鎏金鏡對準前方的石壁。\n\n鏡中仍然只有一片石壁。\n\n他換了幾個角度，結果皆是如此。\n\n蘇孟達有些疑惑。\n\n「這回連古鏡也照不出來？」\n\n魏戌俞低頭思索片刻，忽然想起徐老石匠曾經說過的一件事。\n\n當年他們在水殿裡反覆繞行，始終找不到第三道石門，最後是父親發現了穹頂上的星圖，才帶著眾人從石像後方尋到出路。\n\n魏戌俞抬頭望向穹頂。\n\n「副官，把燈舉高些。」\n\n數盞提燈一同照向上方。\n\n穹頂上的星辰逐漸清晰起來。\n\n魏戌俞沿著那些刻線仔細觀察，忽然發現，星圖中的大部分星辰皆由圓形銅珠構成。\n\n唯獨其中七顆，以形狀不同的青玉鑲嵌。\n\n那七顆星辰的位置，竟與他背上的家族印記極為相似。\n\n他沿著七顆星辰的走向慢慢移動視線。\n\n最後一顆星，恰好位於水池上方。\n\n「原來如此。」\n\n魏戌俞忽然低下頭，望向水面。\n\n幽黑的池水中，倒映著穹頂上那輪缺了一角的圓月，以及數顆被提燈照亮的星辰。\n\n他退後幾步，站到最後一顆青玉星辰所對應的位置。\n\n水中的星圖隨著他的視線逐漸重合。\n\n緊接著，在那片原本空蕩蕩的石壁倒影中，竟出現了一道門。\n\n那是一道極為細長的石門，門上並非烈日或殘月，而是一顆孤零零的星辰。\n\n門前還有一尊雙手合十的跪像。\n\n魏戌俞轉頭望向岸上。\n\n相同的位置，什麼也沒有。\n\n「蘇爺，副官，過來。」\n\n兩人循著他的目光向水中望去。\n\n蘇孟達愣了半晌。\n\n「第三道門……竟然藏在水裡？」\n\n梁副官望著水中的倒影，又望向前方的石壁。\n\n「若是尋常倒影，岸上有什麼，水中便應當有什麼。這道門卻只存在於水中。」\n\n魏戌俞微微頷首。\n\n「徐老石匠曾說，那第三道門會消失。恐怕不是門本身在移動，而是水中的景象發生了變化。」\n\n他指向穹頂。\n\n「那七顆青玉星辰的最後一顆，便是用來指出觀察第三道門的位置。站錯了地方，即便盯著水池看上一整日，也未必能夠發現。」\n\n蘇孟達仰頭望著星圖。\n\n「這麼說，魏家祖傳的那幅圖紋，還真能在這座墓裡派上用場。」\n\n魏戌俞沒有回答。\n\n他忽然想起父親當年教自己臨摹星圖時，曾經說過一句話。\n\n——記住最後一顆星。前頭的路若是走錯了，這顆星或許還能帶你回來。\n\n那時的他，只當是父親在教自己辨認方位。\n\n如今站在這座地下宮殿之中，才漸漸明白父親究竟希望他記住什麼。\n\n然而第三道門雖然已經找到，新的問題卻又擺在了眼前。\n\n如何才能讓那道只存在於水中的門，真正出現在岸上？\n\n***\n\n魏戌俞沿著水池慢慢走了一圈。\n\n池岸皆由整塊青石鋪成，每隔數尺，便有一道細長的水槽自石像底座延伸至池中。\n\n水槽並非裝飾。\n\n其中幾道仍有細細的水流，正源源不絕地向水池內匯聚。\n\n梁副官在池岸左側發現了一處青銅構件。\n\n「上校，您看。」\n\n那是一個雕成魚首模樣的出水口。\n\n魚嘴大張，裡頭不斷流出細小的水流。魚身則隱沒於石壁之內，只露出半截尾部。\n\n在水池對面，另有一個相同的魚首。\n\n不同的是，對面那隻魚的嘴朝下，緊貼水面，且並無水流從中流出。\n\n魏戌俞仔細觀察了片刻。\n\n「一進一出。」\n\n他伸手敲了敲魚首下方的石壁。\n\n「這座水殿有自己的水道。古人既然需要利用水面映照星圖，便必須有辦法控制水池中的水位。」\n\n蘇孟達望向那兩隻銅魚。\n\n「難不成第三道門，得等到水退下去才會出現？」\n\n「試試看。」\n\n三人沿著兩隻銅魚之間的石壁尋找。\n\n不多時，梁副官便在其中一尊石像的底座旁，發現了一塊可以轉動的圓形石盤。\n\n石盤上刻著三種不同的水紋。\n\n一道波紋朝內匯聚，一道向兩側散開，最後一道則逐漸向下收束，最終消失於一個圓形的小孔之中。\n\n魏戌俞蹲下身。\n\n「這應當便是控制水道的機關。」\n\n蘇孟達指著最後一道水紋。\n\n「這個是排水？」\n\n「嗯。中間這一道，或許是讓水流分向兩側，維持池中的水位。」\n\n梁副官伸手擦去石盤中央的泥垢。\n\n「上校，石盤旁有舊刻痕。」\n\n魏戌俞低頭望去。\n\n最後一道水紋附近，有數道深淺不一的刮痕。\n\n顯然，過去曾有人將石盤轉到這個位置。\n\n他再次想起父親與徐老石匠當年的經歷。\n\n或許他們曾使用過同一處機關。\n\n「所有人退至石柱旁，不要靠近水池。」\n\n待士兵們撤離池岸後，魏戌俞與梁副官合力轉動石盤。\n\n石盤沉重異常。\n\n轉動之際，底下傳來一陣低沉的機括聲，彷彿有數道沉重的鐵閘正於地底緩緩移動。\n\n喀。\n\n喀。\n\n喀噠。\n\n最後一道水紋終於對準了石盤上的記號。\n\n一陣沉悶的水聲自池底傳來。\n\n原先平靜的水面開始泛起波紋，靠近另一隻銅魚的位置，漸漸形成一道旋渦。\n\n池中的水位果然開始下降。\n\n蘇孟達露出喜色。\n\n「成了！」\n\n魏戌俞卻仍盯著水面。\n\n隨著池水逐漸退去，水池四周原先被淹沒的石壁慢慢顯露出來。\n\n一道石階自池岸向下延伸。\n\n石階盡頭，竟當真有一扇雕著星辰的石門。\n\n那第三道門，不在兩道石門之間。\n\n而是在它們下方。\n\n「原來如此。」\n\n梁副官望著逐漸露出的石門。\n\n「水中的那幅倒影，只是用來告訴咱們，真正的入口在池底。」\n\n魏戌俞微微頷首。\n\n然而蘇孟達臉上的喜色，卻在看清池底的情況後，一點一點消失了。\n\n「魏長官……」\n\n他抬起提燈。\n\n「底下那些東西，是什麼？」\n\n***\n\n## 水下的死人\n\n池水仍在不斷下降。\n\n最先顯露出來的，是幾縷散落於石階上的黑髮。\n\n緊接著，是一雙蒼白的腳。\n\n蘇孟達屏住呼吸，將提燈往前伸了些。\n\n隨著燈光逐漸照亮池底，眾人終於看清了水下的景象。\n\n那裡並非一片平坦的青石地面。\n\n而是密密麻麻地跪著許多人。\n\n那些人身上穿著不同年代的衣裳，有的披著古老的長袍，有的穿著粗布短褂，還有幾個竟穿著近代的軍服。\n\n他們全都面朝池底那道石門，雙膝跪地，頭顱低垂，雙手被鐵鏈束縛於身後。\n\n每一具屍體的頸後，都插著一根細長的銅釘。\n\n與方才古鏡中所見的那些亡魂一模一樣。\n\n一名年輕士兵忍不住向後退了半步。\n\n「這、這麼多人……」\n\n魏戌俞沿著池底望去。\n\n幾十具屍體分成數列，排列得極為整齊，彷彿正在朝拜著石門後方的某個東西。\n\n然而他們身上衣物的年代卻截然不同。\n\n顯然並非同一時期死在這裡的人。\n\n「蘇爺。」\n\n魏戌俞指向其中幾具穿著近代衣裳的屍體。\n\n「倘若這些人是後來才進入古墓的，那麼又是誰替他們打上了鎖魂釘？」\n\n蘇孟達的嘴唇動了動。\n\n卻答不上來。\n\n這座古墓已經存在了不知多少年。\n\n照理而言，當年主持那些祭祀儀式的人，早就應該死了。\n\n可眼前這些屍體，卻像是直到近年，仍不斷有人被送入其中，成為那場祭祀的一部分。\n\n梁副官忽然指向池底一處角落。\n\n「上校，那是軍中的東西。」\n\n一具身穿軍裝的屍體旁，躺著一塊半人長的木板。\n\n木板已經被水浸得發黑，邊緣還連著一截斷裂的鐵片。\n\n上頭以白漆寫著的文字雖已脫落大半，卻仍能辨認出一個極為熟悉的標記。\n\n——軍運。\n\n梁副官神情凝重。\n\n「這是軍用貨運車廂上的木板。」\n\n魏戌俞凝視著那塊木板。\n\n自北山隧道出事以來，他們終於在古墓之中，親眼見到了原本只應存在於鐵路上的東西。\n\n汽笛聲、煤灰、軍服碎片。\n\n如今又有了車廂的殘骸。\n\n第七節車廂，恐怕當真就在這座地下宮殿的某個地方。\n\n魏戌俞正欲讓梁副官仔細記下木板所在的位置，身旁的蘇孟達卻忽然抓住了他的手臂。\n\n「魏長官。」\n\n他的聲音壓得極低。\n\n「您瞧最前面那個。」\n\n魏戌俞循著他的視線望去。\n\n距離石門最近的一具屍體，原本低垂著頭顱。\n\n此刻，它的頭卻正在極為緩慢地抬起來。\n\n頸部發出一陣細微的骨骼摩擦聲。\n\n喀。\n\n喀。\n\n一雙被池水浸得灰白的眼睛，逐漸望向了岸上的眾人。\n\n緊接著，它身後的另一具屍體也抬起了頭。\n\n第三具。\n\n第四具。\n\n池底那些原本一動不動的死人，竟一排接著一排，慢慢挺直了身軀。\n\n嘩啦——\n\n鐵鏈開始晃動。\n\n魏戌俞立即取出七星鎏金鏡。\n\n鏡中的水池，卻與眼前所見完全不同。\n\n那些屍體仍然低垂著頭。\n\n真正站起來的，是從屍體背後浮現出的一道道黑色人影。\n\n每一道黑影的雙手，都緊緊抓著屍體的肩膀。\n\n彷彿正在操縱它們。\n\n「副官，讓所有人往後退！」\n\n話音剛落，一具屍體猛然從池底竄了上來。\n\n它四肢著地，以一種極不自然的姿勢攀上石階。身後的鐵鏈拖得筆直，發出震耳欲聾的聲響。\n\n最靠近池岸的一名士兵猝不及防，腳踝頓時被它抓住。\n\n「啊！」\n\n那士兵被一股巨大的力量拖倒在地，整個人朝池中滑去。\n\n梁副官立即撲上前，抓住他的手臂。\n\n魏戌俞疾步上前，一腳踩住那具屍體的手腕。\n\n隨著一聲沉悶的骨裂聲，屍體的手臂猛然扭曲。\n\n然而它竟絲毫沒有鬆手的意思，反而張開嘴，朝士兵的小腿咬去。\n\n魏戌俞拔槍。\n\n砰！\n\n子彈擊中屍體頸後的銅釘附近。\n\n那具屍體猛然一震。\n\n原本抓著士兵的手指驟然鬆開，整具身軀如同失去了支撐一般，重重摔在石階上。\n\n梁副官立即將士兵拖離池岸。\n\n然而下一刻，更多的屍體開始朝石階攀爬。\n\n蘇孟達望著池底，臉色大變。\n\n「魏長官，它們頸後的銅釘在動！」\n\n那些深深插入屍體頸後的銅釘，竟一寸一寸地向外退出。\n\n隨著銅釘逐漸鬆脫，原本僵硬的死人，動作也愈發迅速。\n\n魏戌俞立即轉頭望向方才的圓形石盤。\n\n水位仍在下降。\n\n一道原本被水淹沒的青銅長桿，已經從池壁上顯露出來。\n\n長桿下方連著數條鐵鏈，一直延伸至那些屍體身後。\n\n「原來是這麼回事。」\n\n魏戌俞終於明白了。\n\n水位下降的同時，底下的機括也正在拉動那根長桿。\n\n而那些鐵鏈，竟與拘束亡魂的機關相連。\n\n打開第三道門，並不單純是將池水排出去。\n\n它還會將池底的死人一併釋放出來。\n\n「蘇爺，方才那處石盤能不能轉回去？」\n\n蘇孟達立即跑向石像底座。\n\n他用力轉動石盤，然而石盤竟紋絲不動。\n\n「卡住了！」\n\n梁副官帶著兩名士兵上前協助。\n\n幾人合力，石盤卻仍舊沒有移動半分。\n\n魏戌俞望向池底那扇石門。\n\n此刻，門前的最後一段石階也已露出水面。\n\n「不用再轉了。」\n\n他迅速取出銅刻圖。\n\n「第三道門既然已經打開，咱們便先離開這座殿。那些屍體身上還有鐵鏈，未必能夠離開水池太遠。」\n\n蘇孟達望了眼那群正在往外爬的死人。\n\n「那咱們得走快些了！」\n\n***\n\n## 石門後的兩條路\n\n魏戌俞率先踏上通往池底的石階。\n\n梁副官帶著弟兄們緊隨其後，數盞提燈將原本漆黑的池底照得通明。\n\n那些屍體仍在石階兩側不斷掙扎。\n\n鐵鏈彼此碰撞，聲音愈來愈大。\n\n魏戌俞快步走至第三道石門前。\n\n門上的星辰中央，有一個極小的凹陷。\n\n他伸手按了下去。\n\n石門內傳來一陣機括聲，隨即向兩側緩緩移開。\n\n門後竟是一條狹長的石橋。\n\n橋下黑漆漆的，望不見底。石橋盡頭則有一道拱門，門楣上雕著一排捧燈的侍者。\n\n梁副官展開圖紙。\n\n「上校，穿過這條石橋，前方便是兩幅圖上共同存在的那座殿宇。」\n\n魏戌俞點頭。\n\n「先過去。到了那座殿，咱們再想辦法找小何。」\n\n士兵們依序踏上石橋。\n\n蘇孟達走在隊伍中間，不時回頭望向水池中的那些屍體。\n\n其中一具屍體已經掙脫了頸後的銅釘。\n\n它抬起頭，似乎聞到了什麼，猛然朝石門所在的方向爬來。\n\n蘇孟達嚇了一跳。\n\n「快！那東西追上來了！」\n\n魏戌俞留在隊伍後方，與梁副官一同戒備。\n\n待最後幾名士兵通過石門後，魏戌俞正欲踏上石橋，腳下卻忽然傳來一陣極為猛烈的震動。\n\n轟隆——\n\n整座水殿彷彿搖晃了一下。\n\n原先不斷流走的池水，竟從那隻銅魚口中反向噴湧而出。\n\n「不好！」\n\n蘇孟達猛然回頭。\n\n水池正以極快的速度重新蓄水。\n\n那些已經站起來的屍體也被突如其來的水流沖得東倒西歪，鐵鏈拉扯之間，發出陣陣刺耳的聲響。\n\n魏戌俞立即踏上石橋。\n\n「走！」\n\n眾人加快腳步。\n\n然而石橋上方忽然落下大量碎石。\n\n兩側的石壁也隨著機括轉動的聲音，開始緩緩向內移動。\n\n梁副官回頭望去。\n\n「上校，橋在動！」\n\n魏戌俞低頭一看。\n\n腳下的石橋竟正以中央為界，逐漸分成兩截。\n\n兩截橋身分別朝不同方向移動。\n\n原本正對著橋頭的拱門，也正在慢慢偏離眾人所行走的方向。\n\n魏戌俞立即取出古鏡。\n\n左側的白玉已經幾乎完全染黑。\n\n右側那枚原本潔白的玉石，也開始出現細密的黑色紋路。\n\n「不只是機關。」\n\n魏戌俞沉聲道：\n\n「兩條路正在交替！」\n\n透過鏡面，他看見了一個截然不同的景象。\n\n眼前根本沒有石橋。\n\n而是一條兩側皆掛滿鐵鏈的長廊。\n\n那些已經走到橋頭的士兵，正站在長廊另一端的石門前。\n\n至於自己與梁副官腳下的位置，則是兩條長廊相互交會之處。\n\n隨著白玉逐漸變黑，兩條長廊正在慢慢分離。\n\n「副官，快過去！」\n\n魏戌俞猛然將梁副官推向前方。\n\n梁副官腳下一踉蹌，剛踏上另一截石橋，兩人之間便裂開了一道半尺寬的縫隙。\n\n「上校！」\n\n梁副官立即伸手。\n\n魏戌俞正欲跨過去，一條沉重的鐵鏈卻突然從橋下竄出，狠狠撞在橋身上。\n\n整截石橋猛然向旁一沉。\n\n魏戌俞腳下失去平衡，身體向下一墜。\n\n他立即抓住石橋邊緣。\n\n梁副官毫不猶豫地趴下身子，伸手抓向他的手腕。\n\n「上校！抓住我！」\n\n魏戌俞抬起右手。\n\n然而就在兩人的手即將碰觸的瞬間，一道原本根本不存在的石壁，竟從兩人之間緩緩浮現。\n\n梁副官的手撞上了石壁。\n\n「上校！」\n\n魏戌俞望著眼前逐漸凝實的岩石。\n\n他知道，已經來不及了。\n\n「副官！」\n\n隔著尚未完全閉合的縫隙，他沉聲喊道：\n\n「帶弟兄們先走！照圖上的路，去下一座兩幅圖都能看見的殿宇！」\n\n「可是上校——」\n\n「執行命令！」\n\n梁副官咬緊牙關。\n\n「是！」\n\n石壁轟然合攏。\n\n梁副官的聲音戛然而止。\n\n魏戌俞眼前陷入一片黑暗。\n\n腳下的石橋徹底傾斜。\n\n他鬆開手，順著石壁向下墜落。\n\n***\n\n## 第三日\n\n砰！\n\n魏戌俞重重落在一片堅硬的石地上。\n\n左肩猛然傳來一陣劇痛。\n\n他悶哼一聲，右手撐住地面，好一會兒才重新站起來。\n\n四周伸手不見五指。\n\n他從腰間取出手電筒，按下開關。\n\n昏黃的光束照亮了眼前的景象。\n\n這是一條極為狹窄的地下長廊。\n\n兩側石壁上並無繁複的雕刻，只有一排排深深嵌入岩石中的鐵環。\n\n其中幾個鐵環上，還掛著早已斷裂的鎖鏈。\n\n魏戌俞抬頭望去。\n\n方才落下來的地方，竟是一片完整的穹頂。\n\n沒有石橋，也沒有任何可以攀爬上去的洞口。\n\n他取出七星鎏金鏡。\n\n兩枚白玉皆呈現出不同程度的黑色。\n\n然而古鏡所映照的景象，卻與眼前的長廊完全相同。\n\n魏戌俞皺起眉頭。\n\n既然古鏡沒有映照出另一條道路，那麼他目前所處的地方，恐怕並非單憑古鏡就能離開。\n\n他低頭查看懷錶。\n\n指針停在下午一時十五分。\n\n無論如何轉動錶冠，秒針皆不再移動。\n\n魏戌俞將懷錶收起，重新檢查左肩的傷勢。\n\n紗布已經滲出了血。\n\n所幸雙腿並未受傷，仍能繼續行走。\n\n他沿著長廊慢慢向前。\n\n走了約莫數十步，前方出現了一間半掩著石門的小室。\n\n室內擺著幾張石凳，角落還有一座早已熄滅的銅爐。\n\n魏戌俞推門而入。\n\n手電筒的光芒掃過地面。\n\n突然，他的腳步停了下來。\n\n石凳旁，竟擺著一只軍用水壺。\n\n水壺旁還放著幾截燃盡的蠟燭，以及一塊染有血跡的白色紗布。\n\n那些東西都很新。\n\n甚至連紗布上的血跡，都尚未完全乾透。\n\n有人不久前曾在這裡休息。\n\n魏戌俞蹲下身，拾起那只水壺。\n\n是北城軍中配發的樣式。\n\n他將光束移向石凳後方的牆壁。\n\n牆上似乎寫著幾行字。\n\n他走近了些。\n\n那些文字是以鉛筆寫上去的，筆跡有些凌亂，部分地方甚至因牆壁潮濕而變得模糊不清。\n\n——入墓第三日。\n\n——仍未尋得副官及蘇爺下落。\n\n——此處不可久留。\n\n魏戌俞的神情驟然凝固。\n\n他將手電筒緩緩往下移。\n\n最後一行，赫然寫著三個字。\n\n**魏戌俞。**\n\n那個「戌」字的最後一筆，微微向上挑起。\n\n自幼習字時，他便有這個習慣。父親曾為此糾正過他許多回，卻始終沒能讓他改掉。\n\n魏戌俞望著牆上的文字，久久沒有動作。\n\n那是他的筆跡。\n\n甚至連落款的習慣，都與他平日一模一樣。\n\n然而他明明才剛進入古墓不過半日。\n\n就在這時，石室外忽然傳來一聲輕響。\n\n叮——\n\n魏戌俞立即轉身，拔出腰間的槍。\n\n漆黑的長廊中，有人正拖著沉重的腳步，慢慢朝石室走來。\n\n一步。\n\n兩步。\n\n三步。\n\n那人停在了石門之外。\n\n隨後，一個與魏戌俞一模一樣的聲音，隔著石門低低地響了起來。\n\n「你終於來了。」\n\n---\n\n（第十六回完）"}]</script>
<script>
'use strict';
const $=id=>document.getElementById(id), key='wei-cheng-reader-v1';
let chapters=JSON.parse($('bookData').textContent), active=null, state={font:19,dark:false,last:null,pos:{},notes:[]};
try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s)state={...state,...s,pos:s.pos||{}}}catch(e){}
const embeddedNotes=JSON.parse($('noteData').textContent);state.notes=Array.isArray(state.notes)?state.notes:[];for(const note of embeddedNotes){if(!state.notes.some(x=>x.id===note.id))state.notes.push(note)}
state.font=state.font<=17?16:state.font>=22?23:19;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('storageWarning').hidden=false}}
function apply(){document.body.classList.toggle('dark',!!state.dark);document.documentElement.style.setProperty('--font',state.font+'px');document.querySelectorAll('.font-choice').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.size)===state.font)));$('themeBtn').textContent=state.dark?'切換淺色':'切換深色'}
function available(){return chapters.filter(c=>c.body.trim()).sort((a,b)=>a.n-b.n)}
function renderTOC(){const ok=available(), missing=chapters.filter(c=>!c.body.trim());$('count').textContent=`已收錄 ${ok.length} 回完整正文 · 目錄共 ${chapters.length} 回`; $('missingNotice').hidden=!missing.length;$('missingNotice').textContent=missing.length?'尚缺完整定稿：'+missing.map(c=>'第'+c.n+'回').join('、')+'。未用摘要或舊稿代替。':'所有目錄章節均已收錄。';$('toc').replaceChildren();chapters.sort((a,b)=>a.n-b.n).forEach(c=>{const btn=document.createElement('button');btn.className='chapter'+(c.body.trim()?' available':'');const num=document.createElement('span');num.className='num';num.textContent=String(c.n).padStart(2,'0');const title=document.createElement('span');title.className='ct';title.textContent=c.title||('第'+c.n+'回');const st=document.createElement('span');st.className='status';const count=state.notes.filter(x=>x.n===c.n).length;st.textContent=count?count+' 則備註 ›':c.body.trim()?'閱讀 ›':'待補原文';if(count)st.classList.add('note-count');btn.append(num,title,st);btn.onclick=()=>openChapter(c.n);$('toc').append(btn)});const last=chapters.find(c=>c.n===state.last&&c.body.trim());$('continueBtn').hidden=!last;if(last)$('continueBtn').textContent='繼續閱讀 · 第'+last.n+'回 '+last.title;renderNotes();}
function inline(node,t){const parts=t.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);for(const s of parts){if(s.startsWith('**')&&s.endsWith('**')){const b=document.createElement('strong');b.textContent=s.slice(2,-2);node.append(b)}else if(s.startsWith('*')&&s.endsWith('*')){const em=document.createElement('em');em.textContent=s.slice(1,-1);node.append(em)}else node.append(document.createTextNode(s))}}
let restoring=false;
function openChapter(n,restore=false){if(active!==null)remember();const c=chapters.find(x=>x.n===n);if(!c)return;active=n;restoring=true;$('home').hidden=true;$('reading').hidden=false;$('nav').hidden=false;$('chapterLabel').textContent='第 '+n+' 回';$('chapterTitle').textContent=c.title||'原文待補';$('article').replaceChildren();if(!c.body.trim()){const el=document.createElement('p');el.className='notice';el.textContent='尚未取得本回最後修訂的完整原文。此處保留空位，不以摘要或重寫稿替代。';$('article').append(el)}else{for(const [line,raw] of c.body.split(/\n\s*\n/).entries()){const t=raw.trim();if(!t)continue;let el;if(t==='***'||t==='---'){el=document.createElement('div');el.className='scene';el.textContent='◆ · ◆'}else if(t.startsWith('## ')){el=document.createElement('h2');inline(el,t.slice(3))}else{el=document.createElement('p');if(/^（第.+回完）$/.test(t))el.className='end';inline(el,t)}$('article').append(el);if(el.tagName==='P'||el.tagName==='H2')attachNote(el,n,line,t)}state.last=n;save()}const ix=chapters.findIndex(x=>x.n===n);$('prev').disabled=ix<=0;$('next').disabled=ix>=chapters.length-1;window.scrollTo(0,0);requestAnimationFrame(()=>{if(restore)window.scrollTo(0,Number(state.pos[n])||0);restoring=false;progress()})}
function remember(){if(active===null||restoring)return;const c=chapters.find(x=>x.n===active);if(c&&c.body.trim()){state.pos[active]=window.scrollY;state.last=active;save()}}
function progress(){const total=document.documentElement.scrollHeight-window.innerHeight;const value=active===null?0:(total>0?Math.round(window.scrollY/total*100):100);$('bar').style.width=value+'%';$('percent').textContent=value+'%'}
let timer;window.addEventListener('scroll',()=>{progress();clearTimeout(timer);timer=setTimeout(remember,180)},{passive:true});window.addEventListener('pagehide',remember);
function home(){remember();active=null;$('reading').hidden=true;$('nav').hidden=true;$('home').hidden=false;renderTOC();window.scrollTo(0,0);progress()}
$('homeBtn').onclick=home;$('continueBtn').onclick=()=>openChapter(state.last,true);$('prev').onclick=()=>{const i=chapters.findIndex(c=>c.n===active);if(i>0)openChapter(chapters[i-1].n)};$('next').onclick=()=>{const i=chapters.findIndex(c=>c.n===active);if(i<chapters.length-1)openChapter(chapters[i+1].n)};$('settingsBtn').onclick=()=>{$('settings').showModal()};$('closeSettings').onclick=()=>$('settings').close();document.querySelectorAll('.font-choice').forEach(b=>b.onclick=()=>{state.font=Number(b.dataset.size);apply();save();progress()});$('themeBtn').onclick=()=>{state.dark=!state.dark;apply();save()};
$('addBtn').onclick=()=>{const n=Number($('numInput').value),title=$('titleInput').value.trim(),body=$('bodyInput').value.trim();if(!Number.isInteger(n)||n<1||n>999||!title||!body){$('importMsg').textContent='請輸入有效的章節編號、名稱及完整正文。';return}const old=chapters.find(c=>c.n===n);if(old&&old.body.trim()&&!confirm('確定要替換第'+n+'回已收錄正文？'))return;const item={n,title,body};if(old)chapters[chapters.indexOf(old)]=item;else chapters.push(item);renderTOC();$('importMsg').textContent='第'+n+'回已加入目前頁面，請匯出新版 HTML 保存。';$('bodyInput').value='';$('titleInput').value='';$('numInput').value=n+1};
$('exportBtn').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#noteData').textContent=JSON.stringify(state.notes).replace(/</g,'\\u003c');clone.querySelector('#noteDialog').removeAttribute('open');clone.querySelector('#noteList').replaceChildren();clone.querySelector('#bookData').textContent=JSON.stringify(chapters).replace(/</g,'\\u003c');clone.querySelector('#home').hidden=false;clone.querySelector('#reading').hidden=true;clone.querySelector('#nav').hidden=true;clone.querySelector('#article').replaceChildren();clone.querySelector('#toc').replaceChildren();clone.querySelector('#settings').removeAttribute('open');clone.querySelector('#importMsg').textContent='';clone.querySelector('#bodyInput').textContent='';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='小說閱讀器_更新版.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let editing=null;
const lineCache=new Map();function findLine(note){const c=chapters.find(c=>c.n===note.n);if(!c)return -1;if(!lineCache.has(c))lineCache.set(c,c.body.split(/\n\s*\n/).map(x=>x.trim()));const lines=lineCache.get(c);if(lines[note.line]===note.quote)return note.line;const matches=lines.map((x,i)=>x===note.quote?i:-1).filter(i=>i>=0);return matches.length===1?matches[0]:-1}
function attachNote(el,n,line,quote){el.dataset.line=line;el.id='line-'+line;const note=state.notes.find(x=>x.n===n&&findLine(x)===line);const mark=document.createElement('button');mark.className='note-mark'+(note?' has':'');mark.textContent=note?'✎':'＋';mark.setAttribute('aria-label',note?'編輯本段備註':'新增本段備註');if(note)el.classList.add('annotated');mark.onclick=e=>{e.stopPropagation();editNote(n,line,quote,note)};el.onclick=()=>{if(!window.getSelection()?.toString())editNote(n,line,quote,note)};el.append(mark)}
function editNote(n,line,quote,note){editing={n,line,quote,id:note?.id||('note-'+Date.now()+'-'+Math.random().toString(36).slice(2)),old:note};$('noteLocation').textContent='第 '+n+' 回 · 第 '+(line+1)+' 段';$('noteQuote').textContent=quote;$('noteText').value=note?.text||'';$('noteDelete').hidden=!note;$('noteDialog').showModal()}
function refreshNotes(){save();if(active!==null){const y=window.scrollY;openChapter(active);requestAnimationFrame(()=>window.scrollTo(0,y))}else renderTOC()}
$('noteSave').onclick=()=>{const text=$('noteText').value.trim();if(!text){$('noteText').focus();return}const {n,line,quote,id}=editing;state.notes=state.notes.filter(x=>x.id!==id);state.notes.push({n,line,quote,id,text});$('noteDialog').close();refreshNotes()};$('noteCancel').onclick=()=>$('noteDialog').close();$('noteDelete').onclick=()=>{if(confirm('刪除這則修改意見？')){state.notes=state.notes.filter(x=>x.id!==editing.id);$('noteDialog').close();refreshNotes()}};
function renderNotes(){$('noteTotal').textContent='（'+state.notes.length+'）';const list=$('noteList');list.replaceChildren();if(!state.notes.length){const p=document.createElement('p');p.className='small';p.textContent='目前沒有修改意見。';list.append(p);return}for(const n of [...new Set(state.notes.map(x=>x.n))].sort((a,b)=>a-b)){const group=document.createElement('details');group.className='note-group';group.open=true;const notes=state.notes.filter(x=>x.n===n).sort((a,b)=>a.line-b.line);const summary=document.createElement('summary');summary.textContent='第 '+n+' 回 '+(chapters.find(c=>c.n===n)?.title||'')+' · '+notes.length+' 則';group.append(summary);for(const note of notes){const item=document.createElement('div');item.className='note-item';const q=document.createElement('div');q.className='quote';q.textContent=note.quote;const p=document.createElement('p');p.textContent=note.text;const b=document.createElement('button');b.className='note-link';b.textContent=findLine(note)>=0?'跳至原文 ›':'原文已變更 · 檢視備註';b.onclick=()=>{const line=findLine(note);if(line<0){editNote(note.n,note.line,note.quote,note);return}openChapter(note.n);requestAnimationFrame(()=>{const el=$('line-'+line);if(el){el.classList.add('target');el.scrollIntoView({block:'center'});}})};item.append(q,p,b);group.append(item)}list.append(group)}}
$('exportNotes').onclick=()=>{const txt=state.notes.slice().sort((a,b)=>a.n-b.n||a.line-b.line).map(x=>`第 ${x.n} 回 ${chapters.find(c=>c.n===x.n)?.title||''}\n原文：${x.quote}\n修改意見：${x.text}\n${findLine(x)<0?'（原文已變更，需重新定位）\n':''}`).join('\n----------------\n\n');const url=URL.createObjectURL(new Blob(['\ufeff'+(txt||'目前沒有修改意見。')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='小說修改意見.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('backupNotes').onclick=()=>$('exportBtn').click();
apply();renderTOC();
</script></body></html>
